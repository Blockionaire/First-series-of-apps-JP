<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps — overzicht</title>
  <style>
    :root { --paper: #f7f2e9; --ink: #40342a; --soft: #74644f; --accent: #82684a; --card: #fdfaf4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--paper); color: var(--ink);
      min-height: 100vh; padding: 60px 24px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: 32px; margin-bottom: 6px; }
    p.sub { color: var(--soft); margin-bottom: 34px; font-size: 15px; }
    a.app {
      display: block; background: var(--card); text-decoration: none; color: var(--ink);
      border: 1px solid rgba(61,49,37,0.10); border-radius: 12px;
      padding: 16px 20px; margin-bottom: 12px; font-size: 15.5px; font-weight: 500;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    a.app:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -16px rgba(61,49,37,0.4); }
    a.app small { display: block; font-weight: 400; color: var(--soft); font-size: 13px; margin-top: 2px; }
  </style>
</head>
