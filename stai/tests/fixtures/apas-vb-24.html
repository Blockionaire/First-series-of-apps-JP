<!--

  A third date notation, because these templates are not consistent across a
  series published over several years. This one carries a machine-readable
  <time datetime="…">, which is the value to prefer wherever it exists: no
  locale, no ambiguity between day and month.

  It also has no PDF. A Verlautbarung whose whole text is on the page is still
  a publication, so `documentUrl` is simply absent rather than the item being
  dropped for want of an attachment.
-->

</head>

  <p>
    Die Abschlussprüferaufsichtsstelle regelt mit dieser Verlautbarung Form und Frist
    der Anzeige von Auftragsannahmen bei Unternehmen von öffentlichem Interesse.
