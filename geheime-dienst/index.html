<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Geheime Dienst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17171a; --bg2:#202024; --bg3:#2a2a2f; --bg4:#333339;
    --text:#f4f4f5; --muted:#9b9ba3;
    --green:#62c554; --green-dark:#3f8f35;
    --red:#ff3b30; --red-dark:#c22a22;
    --gold:#e8b23a;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Poppins',system-ui,sans-serif; font-size:15px;
    overscroll-behavior:none;
  }
  h1,h2,h3,.title-font{font-family:'Lilita One',cursive; letter-spacing:.5px; font-weight:400}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea,select{
    font-family:inherit; font-size:15px; color:var(--text);
    background:var(--bg3); border:1.5px solid #3d3d44; border-radius:12px;
    padding:12px 14px; width:100%; outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--green)}
  ::placeholder{color:#6d6d75}
  .app{max-width:540px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative}
  .hidden{display:none !important}

  /* ---------- knoppen ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; border-radius:999px; font-weight:600; font-size:15px;
    background:var(--bg3); color:var(--text); transition:transform .06s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-green{background:var(--green); color:#0d1f0a}
  .btn-red{background:var(--red); color:#fff}
  .btn-ghost{background:transparent; border:1.5px solid #45454d}
  .btn-block{width:100%}
  .btn-sm{padding:8px 14px; font-size:13px}

  .pill{
    display:inline-block; padding:4px 12px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
  }
  .pill-green{background:var(--green); color:#0d1f0a}
  .pill-red{background:var(--red); color:#fff}
  .pill-gray{background:#55555c; color:#fff}
  .pill-gold{background:var(--gold); color:#2b1f04}
  .pill-outline{border:1.5px solid #55555c; color:var(--muted)}

  /* ---------- join screen ---------- */
  .join{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:32px 24px 48px; text-align:center;
    background:linear-gradient(135deg,#1b1b1f 0%,#1b1b1f 49.9%,#232327 50%,#232327 100%);
    min-height:100dvh;
  }
  .join h1{font-size:52px; line-height:1.02; text-transform:uppercase}
  .join .sub{font-style:italic; color:var(--muted); margin:10px 0 6px}
  .join .vs{display:flex; justify-content:center; gap:14px; margin:26px 0 34px; align-items:center}
  .join .vs .of{
    width:44px;height:44px;border-radius:50%;background:#6d6d75;color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:15px
  }
  .join form{display:flex; flex-direction:column; gap:12px; text-align:left}
  .join label{font-size:13px; color:var(--muted); font-weight:600; margin-left:4px}
  .link-btn{color:var(--muted); font-size:13px; text-decoration:underline; margin-top:18px}
  .demo-banner{
    background:var(--gold); color:#2b1f04; font-size:12px; font-weight:600;
    text-align:center; padding:7px 12px;
  }
  .err{color:var(--red); font-size:13px; font-weight:600; min-height:18px}

  /* ---------- app frame ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
    position:sticky; top:0; background:var(--bg); z-index:20;
  }
  .topbar h2{font-size:22px; text-transform:uppercase; flex:1}
  .topbar .me-chip{font-size:12px; color:var(--muted); text-align:right; line-height:1.3}
  .content{flex:1; overflow-y:auto; padding:4px 16px 90px}
  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:540px; display:flex;
    background:#111114; border-top:1px solid #2c2c31; z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1; padding:10px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:#7a7a82; font-size:11px; font-weight:600; position:relative;
  }
  .tabbar button.active{color:var(--green)}
  .tabbar .ticon{font-size:21px; line-height:1}
  .badge{
    position:absolute; top:4px; right:calc(50% - 22px);
    background:var(--red); color:#fff; font-size:10px; font-weight:700;
    min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- kaarten & lijsten ---------- */
  .card{background:var(--bg2); border-radius:var(--radius); padding:16px; margin-bottom:12px}
  .card h3{font-size:17px; margin-bottom:6px}
  .list-row{
    display:flex; align-items:center; gap:12px; background:var(--bg2);
    border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;
  }
  .avatar{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:var(--bg4); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-family:'Lilita One'; font-size:18px;
  }
  .avatar.green{background:var(--green-dark)} .avatar.red{background:var(--red-dark)}
  .row-main{flex:1; min-width:0}
  .row-title{font-weight:600; display:flex; align-items:center; gap:8px}
  .row-sub{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row-side{text-align:right; font-size:11px; color:var(--muted); flex:none}
  .unread-dot{
    background:var(--green); color:#0d1f0a; font-size:11px; font-weight:700;
    min-width:20px; height:20px; border-radius:10px;
    display:inline-flex; align-items:center; justify-content:center; padding:0 6px; margin-top:4px;
  }
  .section-label{
    font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--muted); margin:18px 4px 10px;
  }

  /* ---------- spelers (leider) ---------- */
  .player-row{display:flex; flex-direction:column; gap:10px; background:var(--bg2); border-radius:var(--radius); padding:14px; margin-bottom:10px}
  .player-row .top{display:flex; align-items:center; gap:12px}
  .player-row .selects{display:flex; gap:8px}
  .player-row select{padding:8px 10px; font-size:13px; border-radius:10px; flex:1}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; background:var(--bg3);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:none;
  }
  .stat-strip{display:flex; gap:8px; margin-bottom:14px}
  .stat{flex:1; background:var(--bg2); border-radius:14px; padding:10px 8px; text-align:center}
  .stat .num{font-family:'Lilita One'; font-size:22px}
  .stat .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:600}
  .switch-row{display:flex; align-items:center; gap:12px; background:var(--bg2); border-radius:var(--radius); padding:14px; margin-bottom:12px}
  .switch{position:relative; width:48px; height:28px; flex:none}
  .switch input{opacity:0; width:0; height:0}
  .slider{position:absolute; inset:0; background:#45454d; border-radius:14px; transition:.2s}
  .slider:before{content:""; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s}
  .switch input:checked + .slider{background:var(--green)}
  .switch input:checked + .slider:before{transform:translateX(20px)}

  /* ---------- chat ---------- */
  .chat-screen{position:fixed; inset:0; margin:0 auto; max-width:540px; background:var(--bg); z-index:40; display:flex; flex-direction:column}
  .chat-head{display:flex; align-items:center; gap:10px; padding:12px 14px; background:#111114; border-bottom:1px solid #2c2c31}
  .chat-head .back{font-size:22px; padding:4px 8px}
  .chat-head .info{flex:1; min-width:0}
  .chat-head .cname{font-weight:700; font-size:16px}
  .chat-head .csub{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .msgs{flex:1; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:4px}
  .msg{max-width:80%; padding:9px 13px; border-radius:16px; background:var(--bg3); align-self:flex-start; word-wrap:break-word}
  .msg.mine{background:var(--green-dark); align-self:flex-end}
  .msg .sender{font-size:11.5px; font-weight:700; color:var(--gold); margin-bottom:2px}
  .msg.mine .sender{display:none}
  .msg .mtime{font-size:10px; color:rgba(255,255,255,.45); text-align:right; margin-top:3px}
  .msg img{max-width:100%; border-radius:10px; display:block; margin-top:4px; cursor:pointer}
  .msg.sys{
    align-self:center; background:transparent; color:var(--muted);
    font-size:12px; text-align:center; max-width:92%; padding:4px 8px;
  }
  .msg.gap{margin-top:10px}
  .mission-card{
    align-self:stretch; max-width:100%; background:var(--bg2);
    border:1.5px solid var(--red); border-radius:var(--radius); padding:14px; margin:8px 0;
  }
  .mission-card.done{border-color:var(--green)}
  .mission-card.sub{border-color:var(--gold)}
  .mission-card .mc-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px}
  .mission-card h4{font-family:'Lilita One'; font-size:16px; letter-spacing:.4px}
  .mission-card p{font-size:13.5px; color:#cfcfd6; margin-bottom:10px; white-space:pre-wrap}
  .mission-card .mc-meta{font-size:12px; color:var(--muted); margin-bottom:10px}
  .composer{
    display:flex; align-items:flex-end; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:#111114; border-top:1px solid #2c2c31;
  }
  .composer textarea{
    flex:1; resize:none; max-height:110px; min-height:44px; border-radius:22px; padding:11px 16px; line-height:1.4;
  }
  .composer .icon-btn{width:44px; height:44px; font-size:20px}
  .composer .send{background:var(--green); color:#0d1f0a}

  /* ---------- rolkaart ---------- */
  .rolecard{
    border-radius:22px; padding:28px 22px; text-align:center; margin-bottom:14px;
    background:linear-gradient(160deg,#26262b, #1b1b1f);
    border:2px solid #3a3a41;
  }
  .rolecard.team-red{border-color:var(--red); background:linear-gradient(160deg,#2d1b1a,#1c1416)}
  .rolecard.team-green{border-color:var(--green); background:linear-gradient(160deg,#1c2b18,#141a12)}
  .rolecard .remoji{font-size:56px; line-height:1; margin-bottom:10px}
  .rolecard h2{font-size:34px; text-transform:uppercase; margin-bottom:8px}
  .rolecard .rteam{margin-bottom:16px}
  .roleblock{text-align:left; background:rgba(0,0,0,.25); border-radius:14px; padding:12px 14px; margin-top:10px}
  .roleblock b{display:block; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin-bottom:4px}
  .roleblock div{font-size:13.5px; color:#e4e4ea; line-height:1.5}
  .mystery{text-align:center; padding:48px 20px}
  .mystery .q{font-size:64px}

  /* ---------- deadlines ---------- */
  .deadline-card{display:flex; align-items:center; gap:14px; background:var(--bg2); border-radius:var(--radius); padding:14px; margin-bottom:10px}
  .deadline-card .cd{
    font-family:'Lilita One'; font-size:15px; background:var(--bg3);
    border-radius:12px; padding:8px 10px; min-width:86px; text-align:center; flex:none;
  }
  .deadline-card.soon .cd{background:var(--red); color:#fff}
  .deadline-card.past{opacity:.5}
  .deadline-card.past .cd{background:#45454d}

  /* ---------- info ---------- */
  details{background:var(--bg2); border-radius:var(--radius); margin-bottom:10px; overflow:hidden}
  details summary{
    list-style:none; cursor:pointer; padding:15px 16px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
  }
  details summary::-webkit-details-marker{display:none}
  details summary:after{content:"▾"; color:var(--muted); transition:.2s}
  details[open] summary:after{transform:rotate(180deg)}
  details .dbody{padding:0 16px 16px; font-size:13.5px; color:#d6d6dc; line-height:1.55}
  details .dbody ol,details .dbody ul{padding-left:18px; display:flex; flex-direction:column; gap:6px}
  details table{width:100%; border-collapse:collapse; font-size:13px}
  details td,details th{padding:6px 4px; border-bottom:1px solid #333338; text-align:center}
  details th{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px}

  /* ---------- modals ---------- */
  .modal-wrap{
    position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg2); width:100%; max-width:540px; border-radius:22px 22px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:88dvh; overflow-y:auto; animation:up .18s ease;
  }
  @keyframes up{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
  .modal h3{font-size:20px; margin-bottom:14px; text-transform:uppercase}
  .modal .field{margin-bottom:12px}
  .modal .field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; margin-left:2px}
  .check-list{display:flex; flex-direction:column; gap:6px; max-height:38dvh; overflow-y:auto; margin-bottom:12px}
  .check-list label{
    display:flex; align-items:center; gap:10px; background:var(--bg3);
    border-radius:12px; padding:10px 12px; font-size:14px; font-weight:500;
  }
  .check-list input{width:18px; height:18px; accent-color:var(--green); flex:none}
  .quick-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
  .photo-grid .ph{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--bg3)}
  .photo-grid img{width:100%; height:100%; object-fit:cover; cursor:pointer}
  .photo-grid .who{
    position:absolute; bottom:0; left:0; right:0; font-size:10px; padding:3px 6px;
    background:rgba(0,0,0,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .img-viewer{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:80; display:flex; align-items:center; justify-content:center}
  .img-viewer img{max-width:96%; max-height:92%; border-radius:8px}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:#f4f4f5; color:#141416; font-size:13.5px; font-weight:600;
    padding:10px 18px; border-radius:999px; z-index:90; box-shadow:0 4px 18px rgba(0,0,0,.5);
    animation:up .18s ease;
  }
  .empty{color:var(--muted); text-align:center; padding:44px 20px; font-size:14px}
  .empty .big{font-size:44px; margin-bottom:10px}
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner hidden">⚠️ DEMO-MODUS — alleen op dit apparaat. Koppel Firebase om samen te spelen (zie README).</div>
<div class="app" id="root"></div>

<script src="firebase-config.js"></script>
<script type="module">
/* =====================================================================
   GEHEIME DIENST — camping app
   ===================================================================== */
const CFG = window.GD_CONFIG || {};
const PIN = String(CFG.spelleiderPin || "1107");

/* ---------------- rollen (uit de flyer) ---------------- */
const ROLES = {
  infiltrant: { naam:"Infiltrant", emoji:"🕵️", team:"infiltrant",
    missie:"Kies dagelijks één missie uit de lijst, geef deze vóór 11:00 door aan de spelleider en voer de missie gedurende de dag ongezien uit. Door het voltooien van de missie mogen infiltranten één extra gelovige gevangennemen.",
    strategie:"Voer de missie uit zonder betrapt te worden om te voorkomen dat dit in de avondbijeenkomst nadelig uitpakt.",
    actie:"Overleg mag via de chat. Tijdens de avondbijeenkomst stemmen de infiltranten direct één of meerdere gelovigen weg." },
  gelovige: { naam:"Gelovige", emoji:"✝️", team:"gelovige",
    missie:"Ontmasker de infiltranten door observatie overdag en tijdens de avondbijeenkomsten.",
    strategie:"Let op verdacht gedrag en bespreek verdenkingen in kleine groepjes om niet door de infiltranten gevangengenomen te worden.",
    actie:"Deel je verdenkingen tijdens de avondbijeenkomsten en ontmasker infiltranten." },
  veldwerker: { naam:"Veldwerker", emoji:"🔭", team:"gelovige",
    missie:"Ontvang elke ochtend drie missies van de spelleider, waarvan één de echte infiltrantenmissie van die dag is (tussen 11:00 - 12:00).",
    strategie:"Observeer overdag welke missie wordt uitgevoerd en door wie, om de infiltranten te ontmaskeren.",
    actie:"Deel subtiele hints tijdens de avondbijeenkomst zonder je rol expliciet te onthullen." },
  hacker: { naam:"Hacker", emoji:"💻", team:"gelovige",
    missie:"Stel dagelijks twee ja/nee-vragen aan de spelleider (tussen 11:00 - 19:00).",
    strategie:"Gebruik de verkregen informatie om de infiltranten te ontmaskeren.",
    actie:"Deel subtiele hints tijdens de avondbijeenkomst zonder je rol expliciet te onthullen." },
  held: { naam:"Held", emoji:"🦸", team:"gelovige",
    missie:"Red twee keer een gelovige die door de infiltranten is weggestemd.",
    strategie:"Kies het juiste moment om je reddingsactie in te zetten.",
    actie:"Geef tijdens de avondbijeenkomst met je duim aan of je de gevangene wilt redden (duim omhoog) of niet (duim omlaag)." },
  bijbelsmokkelaar: { naam:"Bijbelsmokkelaar", emoji:"📖", team:"gelovige",
    missie:"Wijs elke nacht één extra stem toe aan een speler. De stem van deze speler telt in de gezamenlijke stemming dubbel.",
    strategie:"Wijs deze extra stem strategisch toe om het spel te beïnvloeden.",
    actie:"Wijs tijdens de avondbijeenkomst een medespeler aan die de extra stem krijgt. Iedere speler mag maar 1x aangewezen worden tijdens het spel, waaronder jezelf." },
  verrader: { naam:"Verrader", emoji:"🐍", team:"gelovige",
    missie:"Verraad een andere speler wanneer je gevangen wordt genomen.",
    strategie:"Zorg ervoor dat je actie een grote impact heeft.",
    actie:"Neem een andere speler mee wanneer je gevangengenomen wordt door de infiltranten tijdens een avondbijeenkomst." },
  twijfelaar: { naam:"Twijfelaar", emoji:"🎲", team:"gelovige",
    missie:"Wissel in de eerste avondbijeenkomst van rol als je dit wilt (kiezen ná het zien van de rol).",
    strategie:"Bedenk goed of jouw rol bij je past — je mag maar één keer wisselen.",
    actie:"Geef je keuze door aan de spelleider tijdens de eerste avondbijeenkomst." }
};
const ROLE_ORDER = ["infiltrant","gelovige","veldwerker","hacker","held","bijbelsmokkelaar","verrader","twijfelaar"];
const STATUSES = { actief:"Actief", gevangen:"Gevangen", uit:"Uit het spel" };
const VERHOUDING = {8:[2,6],9:[2,7],10:[3,7],11:[3,8],12:[3,9],13:[3,10],14:[4,10],15:[4,11],16:[4,12],17:[5,12],18:[5,13],19:[5,14],20:[6,14],21:[6,15],22:[6,16],23:[7,16],24:[7,17],25:[7,18]};

/* =====================================================================
   DATABASE-LAAG  (Firebase óf lokale demo-modus)
   ===================================================================== */
let DB;
const DEMO = !CFG.firebase || !CFG.firebase.apiKey || String(CFG.firebase.apiKey).startsWith("PLAK");

function makeDemoDB(){
  const KEY = "gd_demo_db_v1";
  let store = {};
  try{ store = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ store = {}; }
  const listeners = []; // {path, isDoc, cb}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ toast("Opslag vol — verwijder wat foto's (demo-modus)"); } };
  const colOf = p => { const seg = p.split("/"); return seg.slice(0, seg.length-1).join("/"); };
  const notify = colPath => {
    listeners.forEach(l => {
      if(l.isDoc && colOf(l.path) === colPath){
        const seg = l.path.split("/"); const id = seg.pop(); const col = seg.join("/");
        l.cb(store[col] && store[col][id] ? {id, ...store[col][id]} : null);
      } else if(!l.isDoc && l.path === colPath){
        l.cb(Object.entries(store[colPath]||{}).map(([id,d]) => ({id, ...d})));
      }
    });
  };
  window.addEventListener("storage", e => {
    if(e.key !== KEY) return;
    try{ store = JSON.parse(e.newValue || "{}"); }catch(err){ return; }
    const paths = new Set(listeners.map(l => l.isDoc ? colOf(l.path) : l.path));
    paths.forEach(notify);
  });
  const newId = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  return {
    demo:true,
    listen(colPath, cb){
      const l = {path:colPath, isDoc:false, cb}; listeners.push(l);
      cb(Object.entries(store[colPath]||{}).map(([id,d]) => ({id, ...d})));
      return () => listeners.splice(listeners.indexOf(l),1);
    },
    listenDoc(docPath, cb){
      const l = {path:docPath, isDoc:true, cb}; listeners.push(l);
      const seg = docPath.split("/"); const id = seg.pop(); const col = seg.join("/");
      cb(store[col] && store[col][id] ? {id, ...store[col][id]} : null);
      return () => listeners.splice(listeners.indexOf(l),1);
    },
    async add(colPath, data){ const id = newId(); (store[colPath] ||= {})[id] = data; save(); notify(colPath); return id; },
    async set(docPath, data){ const seg = docPath.split("/"); const id = seg.pop(); const col = seg.join("/");
      (store[col] ||= {})[id] = {...(store[col][id]||{}), ...data}; save(); notify(col); },
    async del(docPath){ const seg = docPath.split("/"); const id = seg.pop(); const col = seg.join("/");
      if(store[col]){ delete store[col][id]; save(); notify(col); } },
    async getDoc(docPath){ const seg = docPath.split("/"); const id = seg.pop(); const col = seg.join("/");
      return store[col] && store[col][id] ? {id, ...store[col][id]} : null; }
  };
}

async function makeFirebaseDB(){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(CFG.firebase);
  const db = F.getFirestore(app);
  const colRef = p => F.collection(db, ...p.split("/"));
  const docRef = p => F.doc(db, ...p.split("/"));
  return {
    demo:false,
    listen(colPath, cb){
      return F.onSnapshot(colRef(colPath),
        snap => cb(snap.docs.map(d => ({id:d.id, ...d.data()}))),
        err => console.error("listen", colPath, err));
    },
    listenDoc(docPath, cb){
      return F.onSnapshot(docRef(docPath),
        snap => cb(snap.exists() ? {id:snap.id, ...snap.data()} : null),
        err => console.error("listenDoc", docPath, err));
    },
    async add(colPath, data){ const r = await F.addDoc(colRef(colPath), data); return r.id; },
    async set(docPath, data){ await F.setDoc(docRef(docPath), data, {merge:true}); },
    async del(docPath){ await F.deleteDoc(docRef(docPath)); },
    async getDoc(docPath){ const s = await F.getDoc(docRef(docPath)); return s.exists() ? {id:s.id, ...s.data()} : null; }
  };
}

/* ---------------- foto's ---------------- */
function pickImage(){
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = () => resolve(inp.files[0] || null);
    inp.click();
  });
}
function compressImage(file, maxDim = 1280){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = 0.72, data = cv.toDataURL("image/jpeg", q);
      while(data.length > 850000 && q > 0.3){ q -= 0.12; data = cv.toDataURL("image/jpeg", q); }
      if(data.length > 950000){
        cv.width = Math.round(w*0.6); cv.height = Math.round(h*0.6);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        data = cv.toDataURL("image/jpeg", 0.5);
      }
      URL.revokeObjectURL(img.src);
      resolve(data);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function uploadImage(file){
  const data = await compressImage(file);
  return await DB.add("images", {data, at: now()});
}

}

}

function enterApp(myId){
  const sync = () => {
    const p = S.players.find(x => x.id === myId);
    if(!p){
      // speler verwijderd door spelleider
      if(S.me){ localStorage.removeItem("gd_player_id"); S.me = null; renderJoin("Je bent uit het spel verwijderd."); }
      return;
    }
    const first = !S.me;
    S.me = p;
    if(first){ S.tab = p.isLeader ? "spelers" : "chats"; render(); }
    else render();
  };
  sync();
  S.syncMe = sync;
  if(!S.clockTimer) S.clockTimer = setInterval(() => { if(S.tab === "deadlines" && !S.openChat) render(); }, 30000);
}

/* =====================================================================
   HELPERS: chats & membership
   ===================================================================== */
function canSeeChat(c){
  if(!S.me) return false;
  if(S.me.isLeader) return true;
  if(c.type === "all") return true;
  if(c.type === "dm") return c.dmFor === S.me.id;
  return (c.members || []).includes(S.me.id);
}
function chatTitle(c){
  if(c.type === "all") return "📣 Iedereen";
  if(c.type === "dm"){
    if(S.me.isLeader){ const p = S.players.find(x => x.id === c.dmFor); return "👤 " + (p ? p.name : "Onbekend"); }
    return "🎩 Spelleider";
  }
  return "👥 " + c.name;
}
function chatMembersLabel(c){
  if(c.type === "all") return `${S.players.length} deelnemers`;
  if(c.type === "dm") return "Privéchat met de spelleider";
  const names = (c.members||[]).map(id => (S.players.find(p => p.id === id)||{}).name).filter(Boolean);
  return names.join(", ") || "Geen leden";
}
async function openDM(playerId){
  const id = "dm_" + playerId;
  if(!S.chats.find(c => c.id === id)){
    await DB.set("chats/" + id, {type:"dm", dmFor:playerId, at: now()});
  }
  openChat(id);
}
function lastReadKey(chatId){ return "gd_read_" + chatId; }
function unreadCount(c){
  if(!c.lastAt) return 0;
  if(c.lastSid === S.me.id) return 0;
  const seen = Number(localStorage.getItem(lastReadKey(c.id)) || 0);
  return c.lastAt > seen ? 1 : 0;
}
async function sendMessage(chatId, data){
  const base = {sid:S.me.id, sn:S.me.name, at: now(), ...data};
  await DB.add(`chats/${chatId}/messages`, base);
  await DB.set("chats/" + chatId, {
    lastAt: base.at, lastSid: base.sid,
    lastText: data.type === "img" ? "📷 Foto" : data.type === "mission" ? "📋 Opdracht" : (data.t || "")
  });
  localStorage.setItem(lastReadKey(chatId), String(base.at + 1));
}
async function sendSystem(chatId, text){
  await DB.add(`chats/${chatId}/messages`, {type:"sys", t:text, at: now()});
  await DB.set("chats/" + chatId, {lastAt: now(), lastSid:"sys", lastText: text});
}

   ===================================================================== */
function openChat(chatId){
  S.openChat = chatId;
  localStorage.setItem(lastReadKey(chatId), String(now()));
  if(S.unsubMsgs) S.unsubMsgs();
  S.msgs = [];
  S.unsubMsgs = DB.listen(`chats/${chatId}/messages`, docs => {
    S.msgs = docs.sort((a,b) => (a.at||0)-(b.at||0));
    localStorage.setItem(lastReadKey(chatId), String(now()));
    if(S.openChat === chatId) renderChat(true);
  });
  renderChat();
}
function closeChat(){
  if(S.unsubMsgs){ S.unsubMsgs(); S.unsubMsgs = null; }
  S.openChat = null;
  render();
}

function renderChat(keepScroll){
  const c = S.chats.find(x => x.id === S.openChat);
  if(!c){ closeChat(); return; }
  const root = $("#root");
  const isL = S.me.isLeader;
  const draft = $("#composerText") ? $("#composerText").value : "";

  const msgHtml = S.msgs.map((m, i) => {
    const prev = S.msgs[i-1];
    const gap = !prev || (m.at - (prev.at||0)) > 5*60*1000 || prev.sid !== m.sid;
    if(m.type === "sys") return `<div class="msg sys">${esc(m.t)}</div>`;
    if(m.type === "mission"){
      const mi = S.missions.find(x => x.id === m.mid);
      return mi ? missionCardHtml(mi) : "";
    }
    const mine = m.sid === S.me.id;
    const showSender = c.type !== "dm" && !mine;
    return `
      <div class="msg ${mine ? "mine" : ""} ${gap ? "gap" : ""}">
        ${showSender && gap ? `<div class="sender">${esc(m.sn)}</div>` : ""}
        ${m.type === "img" ? `<img data-img="${m.imgId}" alt="foto">` : ""}
        ${m.t ? `<div>${esc(m.t)}</div>` : ""}
        <div class="mtime">${fmtTime(m.at)}</div>
      </div>`;
  }).join("");

  root.innerHTML = `
    <div class="chat-screen">
      <div class="chat-head">
        <button class="back" id="chatBack">‹</button>
        <div class="info">
          <div class="cname">${esc(chatTitle(c))}</div>
          <div class="csub">${esc(chatMembersLabel(c))}</div>
        </div>
        ${isL && c.type === "group" ? `<button class="icon-btn" id="grpEdit" title="Leden">⚙️</button>` : ""}
      </div>
      <div class="msgs" id="msgs">
        ${S.msgs.length === 0 ? `<div class="empty"><div class="big">💬</div>Nog geen berichten.</div>` : msgHtml}
      </div>
      <div class="composer">
        ${isL && c.type !== "dm" ? `<button class="icon-btn" id="btnMission" title="Nieuwe opdracht">📋</button>` : ""}
        <button class="icon-btn" id="btnPhoto" title="Foto sturen">📷</button>
        <textarea id="composerText" rows="1" placeholder="Bericht…"></textarea>
        <button class="icon-btn send" id="btnSend">➤</button>
      </div>
    </div>`;

  $("#composerText").value = draft;
  const msgsEl = $("#msgs");
  msgsEl.scrollTop = msgsEl.scrollHeight;

  msgsEl.querySelectorAll("img[data-img]").forEach(img => {
    loadImageInto(img.dataset.img, img).then(() => { msgsEl.scrollTop = msgsEl.scrollHeight; });
    img.onclick = () => { if(img.src) viewImage(img.src); };
  });
  msgsEl.querySelectorAll("[data-mission]").forEach(b => b.onclick = () => missionModal(b.dataset.mission));

  $("#chatBack").onclick = closeChat;
  const ta = $("#composerText");
  ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 110) + "px"; };
  ta.onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(); } };
  const doSend = async () => {
    const t = ta.value.trim(); if(!t) return;
    ta.value = ""; ta.style.height = "auto";
    await sendMessage(c.id, {type:"text", t});
  };
  $("#btnSend").onclick = doSend;
  $("#btnPhoto").onclick = async () => {
    const f = await pickImage(); if(!f) return;
    toast("Foto uploaden…");
    try{
      const imgId = await uploadImage(f);
      await sendMessage(c.id, {type:"img", imgId});
    }catch(e){ console.error(e); toast("Uploaden mislukt"); }
  };
  const bm = $("#btnMission"); if(bm) bm.onclick = () => newMissionModal(c.id);
  const ge = $("#grpEdit"); if(ge) ge.onclick = () => editGroupModal(c);
}

function editGroupModal(c){
  const players = S.players.filter(p => !p.isLeader);
  modal(`
    <h3>Groep: ${esc(c.name)}</h3>
    <div class="check-list">
      ${players.map(p => `<label><input type="checkbox" value="${p.id}" ${(c.members||[]).includes(p.id) ? "checked" : ""}> ${esc(p.name)}</label>`).join("")}
    </div>
    <button class="btn btn-green btn-block" id="grpSave" style="margin-bottom:10px">Opslaan</button>
    <button class="btn btn-red btn-block" id="grpDel">Groep verwijderen</button>
  `, m => {
    m.querySelector("#grpSave").onclick = async () => {
      const members = [...m.querySelectorAll(".check-list input:checked")].map(cb => cb.value);
      await DB.set("chats/" + c.id, {members});
      closeModal(); toast("Groep bijgewerkt"); renderChat();
    };
    m.querySelector("#grpDel").onclick = () => confirmModal(`Groep <b>${esc(c.name)}</b> verwijderen?`, async () => {
      await DB.del("chats/" + c.id); closeChat();
    });

}

let missionUnsub = null;
function missionModal(missionId){
  const openIt = () => {
    const mi = S.missions.find(x => x.id === missionId);
    if(!mi){ closeModal(); return; }
    const isL = S.me.isLeader;
    const st = MSTATUS[mi.status] || MSTATUS.open;

    modal(`
      <h3 style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span>📋 ${esc(mi.title)}</span><span class="pill ${st.pill}">${st.label}</span>
      </h3>
      ${mi.desc ? `<p style="font-size:14px;color:#d6d6dc;white-space:pre-wrap;margin-bottom:8px">${esc(mi.desc)}</p>` : ""}
      ${mi.deadline ? `<div style="font-size:13px;color:var(--muted);margin-bottom:8px">⏰ Deadline: ${fmtDT(mi.deadline)}</div>` : ""}
      <div class="section-label" style="margin-top:14px">Bewijsfoto's</div>
      <div class="photo-grid" id="miPhotos"><div class="empty" style="grid-column:1/-1;padding:16px">Nog geen foto's.</div></div>
      ${!isL && mi.status !== "goedgekeurd" ? `
        <button class="btn btn-ghost btn-block" id="miAddPhoto" style="margin-bottom:10px">📷 Bewijsfoto toevoegen</button>
        ${mi.status === "open" ? `<button class="btn btn-gold btn-block btn-green" id="miSubmit">✅ Opdracht indienen als voltooid</button>` : ""}
        ${mi.status === "ingediend" ? `<div style="text-align:center;color:var(--muted);font-size:13px">Wacht op beoordeling door de spelleider…</div>` : ""}` : ""}
      ${isL ? `
        <div style="display:flex;gap:10px;margin-top:6px">
          ${mi.status !== "goedgekeurd" ? `<button class="btn btn-green" style="flex:1" id="miApprove">✅ Goedkeuren</button>` : ""}
          ${mi.status === "ingediend" ? `<button class="btn btn-ghost" style="flex:1" id="miReject">↩️ Afwijzen</button>` : ""}
          <button class="btn btn-red btn-sm" id="miDelete">🗑️</button>
        </div>` : ""}
    `, m => {
      // foto's live laden
      if(missionUnsub) missionUnsub();
      missionUnsub = DB.listen(`missions/${missionId}/photos`, docs => {
        const grid = m.querySelector("#miPhotos");
        if(!grid) return;
        docs.sort((a,b) => (a.at||0)-(b.at||0));
        if(docs.length === 0) return;
        grid.innerHTML = docs.map(ph => `
          <div class="ph"><img data-img="${ph.imgId}" alt="bewijs"><div class="who">${esc(ph.sn)} · ${fmtTime(ph.at)}</div></div>`).join("");
        grid.querySelectorAll("img[data-img]").forEach(img => {
          loadImageInto(img.dataset.img, img);
          img.onclick = () => { if(img.src) viewImage(img.src); };
        });
      });

      const addBtn = m.querySelector("#miAddPhoto");
      if(addBtn) addBtn.onclick = async () => {
        const f = await pickImage(); if(!f) return;
        toast("Foto uploaden…");
        try{
          const imgId = await uploadImage(f);
          await DB.add(`missions/${missionId}/photos`, {imgId, sid:S.me.id, sn:S.me.name, at: now()});
          await DB.set("missions/" + missionId, {photoCount: (mi.photoCount||0) + 1});
          toast("Foto toegevoegd ✔");
        }catch(e){ console.error(e); toast("Uploaden mislukt"); }
      };
      const subBtn = m.querySelector("#miSubmit");
      if(subBtn) subBtn.onclick = async () => {
        await DB.set("missions/" + missionId, {status:"ingediend", submittedBy:S.me.name, submittedAt: now()});
        await sendSystem(mi.chatId, `✅ ${S.me.name} heeft de opdracht "${mi.title}" ingediend als voltooid.`);
        toast("Ingediend! De spelleider beoordeelt je opdracht.");
      };
      const ap = m.querySelector("#miApprove");
      if(ap) ap.onclick = async () => {
        await DB.set("missions/" + missionId, {status:"goedgekeurd", reviewedAt: now()});
        await sendSystem(mi.chatId, `🏆 De opdracht "${mi.title}" is GOEDGEKEURD door de spelleider!`);
        toast("Goedgekeurd");
      };
      const rj = m.querySelector("#miReject");
      if(rj) rj.onclick = async () => {
        await DB.set("missions/" + missionId, {status:"open"});
        await sendSystem(mi.chatId, `↩️ De opdracht "${mi.title}" is afgewezen — probeer het opnieuw.`);
        toast("Afgewezen — status weer open");
      };
      const del = m.querySelector("#miDelete");
      if(del) del.onclick = () => confirmModal("Opdracht verwijderen?", async () => {
        await DB.del("missions/" + missionId); closeModal();
      });
    }, () => { if(missionUnsub){ missionUnsub(); missionUnsub = null; } });
  };
  openIt();
}

/* =====================================================================
   VIEW: Deadlines
   ===================================================================== */
function countdown(ms){
  const diff = ms - now();
  if(diff <= 0) return "Verlopen";
  const m = Math.floor(diff/60000);
  if(m < 60) return m + " min";
  const h = Math.floor(m/60);
  if(h < 24) return h + "u " + (m%60) + "m";
  return Math.floor(h/24) + "d " + (h%24) + "u";
}
function renderDeadlines(el){
  const isL = S.me.isLeader;
  const items = [...S.deadlines].sort((a,b) => (a.dueAt||0)-(b.dueAt||0));
  const upcoming = items.filter(d => d.dueAt >= now());
  const past = items.filter(d => d.dueAt < now());

  const card = d => {
    const soon = d.dueAt - now() < 60*60*1000 && d.dueAt > now();
    const isPast = d.dueAt < now();
    return `
    <div class="deadline-card ${soon ? "soon" : ""} ${isPast ? "past" : ""}">
      <div class="cd">${countdown(d.dueAt)}</div>
      <div class="row-main">
        <div class="row-title">${esc(d.title)}</div>
        <div class="row-sub">${fmtDT(d.dueAt)}${d.desc ? " · " + esc(d.desc) : ""}</div>
      </div>
      ${isL ? `<button class="icon-btn" data-del="${d.id}">🗑️</button>` : ""}
    </div>`;
  };

  el.innerHTML = `
    ${isL ? `<button class="btn btn-green btn-block" id="newDeadline" style="margin-bottom:14px">➕ Nieuwe deadline</button>` : ""}
    ${items.length === 0 ? `<div class="empty"><div class="big">⏰</div>Nog geen deadlines ingesteld.</div>` : ""}
    ${upcoming.map(card).join("")}
    ${past.length ? `<div class="section-label">Verlopen</div>` + past.map(card).join("") : ""}`;

  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () =>
    confirmModal("Deadline verwijderen?", async () => { await DB.del("deadlines/" + b.dataset.del); }));
  const nb = $("#newDeadline");
  if(nb) nb.onclick = () => {
    const today = new Date();
    const dstr = (h,mn) => { const d = new Date(); d.setHours(h,mn,0,0); if(d < new Date()) d.setDate(d.getDate()+1);
      return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16); };
    modal(`
      <h3>Nieuwe deadline</h3>
      <div class="quick-row">
        <button class="btn btn-sm btn-ghost" data-preset="missie">🕚 Missie doorgeven 11:00</button>
        <button class="btn btn-sm btn-ghost" data-preset="avond">🌙 Avondbijeenkomst 22:30</button>
      </div>
      <div class="field"><label>Titel</label><input id="dlTitle" placeholder="Bijv. Missie doorgeven aan spelleider" maxlength="60"></div>
      <div class="field"><label>Omschrijving (optioneel)</label><input id="dlDesc" placeholder="Bijv. via de infiltranten-chat" maxlength="80"></div>
      <div class="field"><label>Datum & tijd</label><input id="dlWhen" type="datetime-local"></div>
      <button class="btn btn-green btn-block" id="dlCreate">Deadline instellen</button>
    `, m => {
      m.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
        if(b.dataset.preset === "missie"){
          m.querySelector("#dlTitle").value = "Geheime missie doorgeven aan spelleider";
          m.querySelector("#dlWhen").value = dstr(11,0);
        } else {
          m.querySelector("#dlTitle").value = "Avondbijeenkomst op de tennisbaan";
          m.querySelector("#dlWhen").value = dstr(22,30);
        }
      });
      m.querySelector("#dlCreate").onclick = async () => {
        const title = m.querySelector("#dlTitle").value.trim();
        const when = m.querySelector("#dlWhen").value;
        if(!title || !when){ toast("Vul titel en tijd in"); return; }
        await DB.add("deadlines", {title, desc: m.querySelector("#dlDesc").value.trim(), dueAt: new Date(when).getTime(), at: now()});
        await sendSystem("all", `⏰ Nieuwe deadline: ${title} — ${fmtDT(new Date(when).getTime())}`);
        closeModal();
      };
    });
  };
}

      <summary>⚖️ Spelersverhouding</summary>
      <div class="dbody">
        <table>
          <tr><th>Spelers</th><th>Infiltranten</th><th>Gelovigen</th><th>Speciaal</th></tr>
          ${Object.entries(VERHOUDING).map(([n,[i,g]]) => `<tr><td>${n}</td><td style="color:var(--red)">${i}</td><td style="color:var(--green)">${g}</td><td>${n >= 17 ? "2x veldwerker" : "alles 1x"}</td></tr>`).join("")}
        </table>
      </div>
    </details>
    <button class="btn btn-ghost btn-block" id="logoutBtn" style="margin-top:16px">Uitloggen op dit apparaat</button>`;
  $("#logoutBtn").onclick = () => confirmModal("Weet je zeker dat je wilt uitloggen? Je kunt daarna opnieuw aanmelden met dezelfde naam.", () => {
    localStorage.removeItem("gd_player_id"); location.reload();
  });
}

/* =====================================================================
   MODALS
   ===================================================================== */
let modalCloseCb = null;
function modal(html, setup, onClose){
  closeModal();
  const w = document.createElement("div");
  w.className = "modal-wrap"; w.id = "modalWrap";
  w.innerHTML = `<div class="modal">${html}</div>`;
  w.onclick = e => { if(e.target === w) closeModal(); };
  document.body.appendChild(w);
  modalCloseCb = onClose || null;
  if(setup) setup(w.querySelector(".modal"));
}
function closeModal(){
  const w = $("#modalWrap");
  if(w) w.remove();
  if(modalCloseCb){ const cb = modalCloseCb; modalCloseCb = null; cb(); }
}
function confirmModal(html, onYes){
  modal(`
    <h3>Weet je het zeker?</h3>
    <p style="font-size:14px;color:#d6d6dc;margin-bottom:16px">${html}</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" id="cNo">Annuleren</button>
      <button class="btn btn-red" style="flex:1" id="cYes">Ja</button>
    </div>
  `, m => {
    m.querySelector("#cNo").onclick = closeModal;
    m.querySelector("#cYes").onclick = async () => { closeModal(); await onYes(); };
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  if(DEMO){
    $("#demoBanner").classList.remove("hidden");
    DB = makeDemoDB();
  } else {
    try{ DB = await makeFirebaseDB(); }
    catch(e){
      console.error(e);
      $("#root").innerHTML = `<div class="join"><div><h1 style="font-size:30px">⚠️ Fout</h1>
        <p style="color:var(--muted);margin-top:12px">Kan geen verbinding maken met Firebase. Controleer de config in <b>firebase-config.js</b> en je internetverbinding.</p></div></div>`;
      return;
    }
  }

  let attempted = false;
  function maybeAutoLogin(){
    if(attempted) return;
    attempted = true;
    const saved = localStorage.getItem("gd_player_id");
    if(saved && S.players.find(p => p.id === saved)){
      enterApp(saved);
    } else {
      localStorage.removeItem("gd_player_id");
      renderJoin();
    }
  }

  // live data
  DB.listen("players", docs => { S.players = docs; if(S.syncMe) S.syncMe(); else maybeAutoLogin(); });
  DB.listen("chats", docs => { S.chats = docs; if(S.me && !S.openChat) render(); });
  DB.listen("deadlines", docs => { S.deadlines = docs; if(S.me && !S.openChat && S.tab === "deadlines") render(); });
  DB.listen("missions", docs => { S.missions = docs; if(S.me && S.openChat) renderChat(true); });
  DB.listenDoc("settings/main", doc => { S.settings = doc || {rolesRevealed:false}; if(S.me && !S.openChat) render(); });
  // als players-collectie leeg blijft, toch join tonen
  setTimeout(() => { if(!S.me && !attempted) maybeAutoLogin(); }, 1500);
}
boot();
</script>
