<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit AI — Interim Platform (UX prototype)</title>
<meta name="description" content="Self-contained clickable prototype of the Audit AI interim platform. Fictional data, no network.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b2430'/><path d='M9 21V11h3.2c2.6 0 4.3 1.9 4.3 5s-1.7 5-4.3 5H9zm13 0v-4' stroke='%23a8bed6' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>">
<style>
/* ==========================================================================
   Audit AI — V3 design system.

   One idea runs through the whole system:

       ELEVATION CARRIES EVIDENTIARY MEANING.
       The work product rises. The evidence sits beneath it.

   .s-paper     raised, white, lifts on hover      the audit file
   .s-recessed  sunk, tinted, never lifts          the sources it rests on

   Everything else — the lens, the map, the decision dock — is that idea
   applied. See V3-DESIGN-DIRECTION.md.
   ========================================================================== */

:root {
  /* --- Ground and surfaces ------------------------------------------------ */
  --ground:     #f3f1eb;
  --surface:    #faf8f4;
  --paper:      #ffffff;
  --recessed:   #edebe3;
  --sunk:       #e5e2d8;

  /* --- Ink ---------------------------------------------------------------- */
  --ink:        #1a1c18;
  --ink-2:      #40443c;
  --ink-3:      #6a6f64;
  --ink-4:      #8c9184;
  --ink-5:      #b0b4a8;

  /* --- Lines -------------------------------------------------------------- */
  --line:       #e4e1d6;
  --line-2:     #d3cfc0;

  /* --- Brand: a mineral green dark enough to be an ink -------------------- */
  --accent:      #22392f;
  --accent-hi:   #2e4b3e;
  --accent-mid:  #3f6b57;
  --accent-soft: #e6ede7;
  --accent-line: #c5d5c9;

  /* --- Semantic. Meaning, never decoration. ------------------------------- */
  --ok:      #3f7350;  --ok-soft:     #e9f0ea;  --ok-line:     #c6dbcb;
  --warn:    #9c6a1b;  --warn-soft:   #f8efdc;  --warn-line:   #e5d2a8;
  --danger:  #a5412f;  --danger-soft: #f7e9e5;  --danger-line: #e6c5bb;
  --concept: #5b5478;  --concept-soft:#efedf4;  --concept-line:#d2cde0;

  /* --- Type --------------------------------------------------------------- */
  --sans: Inter, "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia,
           "Times New Roman", serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* --- Elevation. Almost invisible; only ever used to lift. --------------- */
  --sh-1: 0 1px 2px rgba(26,28,24,.04), 0 1px 1px rgba(26,28,24,.03);
  --sh-2: 0 2px 6px rgba(26,28,24,.05), 0 10px 24px -10px rgba(26,28,24,.08);
  --sh-3: 0 24px 64px -14px rgba(26,28,24,.22), 0 4px 12px rgba(26,28,24,.07);

  /* --- Radius ------------------------------------------------------------- */
  --r-1: 6px; --r-2: 9px; --r-3: 12px; --r-4: 16px; --r-pill: 999px;

  /* --- Space -------------------------------------------------------------- */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 88px;

  /* --- Motion ------------------------------------------------------------- */
  --t-fast: 120ms; --t-base: 160ms; --t-slow: 220ms;
  --ease: cubic-bezier(.2,.8,.3,1);

  --measure: 68ch;

  /* --- Canvas: width follows the task ------------------------------------
     Seven spatial modes, not one column. A screen declares what kind of work
     it is and the wrapper follows; nothing sets its own max-width.

       focus      one professional judgement at a time
       reading    the working paper and long-form narrative
       form       setup forms — legible field pairs, never a giant form
       standard   structured sequential work
       overview   orientation: where is this, what needs me
       workspace  spatial work — the process map, the trace
       data       genuinely tabular

     See V3-DESIGN-DIRECTION.md → RESPONSIVE CANVAS & TASK WIDTH.
     ---------------------------------------------------------------------- */
  --w-focus:      780px;
  --w-reading:    880px;
  --w-form:       960px;
  --w-standard:  1160px;
  --w-overview:  1300px;
  --w-workspace: 1480px;
  --w-data:      1600px;

  /* The gutter is the framing, and it grows with the screen rather than the
     content growing to fill it. */
  --gutter: 40px;
}

@media (min-width: 1600px) { :root { --gutter: 56px; } }
@media (max-width: 700px)  { :root { --gutter: 18px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 15.5px/1.62 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
h1, h2, h3, h4, p, dl, dd, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent-mid); outline-offset: 2px; border-radius: var(--r-1); }
::selection { background: var(--accent-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ==========================================================================
   TYPE
   ========================================================================== */

.t-display { font-size: 34px; font-weight: 600; letter-spacing: -.022em; line-height: 1.15; }
.t-title   { font-size: 26px; font-weight: 600; letter-spacing: -.019em; line-height: 1.22; }
.t-h       { font-size: 19px; font-weight: 600; letter-spacing: -.011em; line-height: 1.35; }
.t-h-sm    { font-size: 16px; font-weight: 600; letter-spacing: -.006em; }
.t-lede    { font-size: 17px; color: var(--ink-3); line-height: 1.6; max-width: 60ch; }
.t-body    { font-size: 15.5px; color: var(--ink-2); line-height: 1.62; }
.t-sub     { font-size: 14.5px; color: var(--ink-3); line-height: 1.55; }
.t-meta    { font-size: 13px; color: var(--ink-4); line-height: 1.5; }
.t-eyebrow {
  font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-4);
}
.t-num  { font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
.t-doc  { font: 18.5px/1.78 var(--serif); color: var(--ink); }
.t-quote{ font: 16px/1.68 var(--serif); color: var(--ink-2); }
.mono   { font-family: var(--mono); font-size: .88em; letter-spacing: -.01em; }
.b      { font-weight: 600; }
.ink    { color: var(--ink); } .ink2 { color: var(--ink-2); }
.ink3   { color: var(--ink-3); } .ink4 { color: var(--ink-4); } .ink5 { color: var(--ink-5); }
.nowrap { white-space: nowrap; }
.measure { max-width: 62ch; }
/* Header metadata — a run of facts, not a sentence, so it takes a wider measure
   than body copy and does not break after a separator. */
.t-lede--meta { max-width: 100ch; }

/* ==========================================================================
   LAYOUT
   ========================================================================== */

#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.canvas { flex: 1; overflow-y: auto; overflow-x: hidden; background: var(--ground); }
/* One formula. `--w` is the only thing a spatial mode changes. */
.wrap {
  --w: var(--w-standard);
  width: min(100% - var(--gutter) * 2, var(--w));
  margin-inline: auto;
  padding: var(--s-8) 0 140px;
}
.wrap--focus     { --w: var(--w-focus); }
.wrap--reading   { --w: var(--w-reading); }
.wrap--form      { --w: var(--w-form); }
.wrap--standard  { --w: var(--w-standard); }
.wrap--overview  { --w: var(--w-overview); }
.wrap--workspace { --w: var(--w-workspace); }
.wrap--data      { --w: var(--w-data); }

/* --- Composition ------------------------------------------------------------
   A small, reusable set. Extra width is spent on composition, never on larger
   components or longer text lines. Everything collapses to one column at the
   point where a second column stops helping rather than at a device size.
   -------------------------------------------------------------------------- */
.lay { display: grid; gap: var(--s-6) var(--s-7); align-items: start; }
.lay--main-aside { grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); }
.lay--60-40      { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.lay--equal      { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1120px) {
  .lay--main-aside, .lay--60-40, .lay--equal { grid-template-columns: 1fr; }
}
/* A field pair inside a composition column has half the room, so it stacks. */
.lay .grid2 { grid-template-columns: 1fr; }
/* A section that is already a column does not need its own top margin. */
.lay > .sec, .lay > .sec--loose { margin-top: 0; }

.page-in { animation: pagein var(--t-fast) var(--ease); }
@keyframes pagein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.row { display: flex; align-items: center; gap: var(--s-3); }
.row--top { align-items: flex-start; }
.row--base { align-items: baseline; }
.sp { flex: 1; }
.acts { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.acts--end { justify-content: flex-end; }
.gap-xs > * + * { margin-top: var(--s-1); }
.gap-s  > * + * { margin-top: var(--s-3); }
.gap-m  > * + * { margin-top: var(--s-5); }
.gap-l  > * + * { margin-top: var(--s-7); }

.head { margin-bottom: var(--s-7); }
.head__row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-6); }
.head .t-lede { margin-top: var(--s-3); }

.sec { margin-top: var(--s-7); }
.sec--tight { margin-top: var(--s-6); }
.sec--loose { margin-top: var(--s-8); }
.sec__h { display: flex; align-items: baseline; gap: var(--s-3); margin-bottom: var(--s-4); }
.sec__h .sp { flex: 1; }
/* `sec__h` is also used as spacing on the sentence under a heading. A paragraph
   is never a header row, so it must not become a flex container — inline <b>
   inside one would otherwise be laid out as a second column. */
p.sec__h, p.sec__note { display: block; }
.sec__note { margin-top: var(--s-3); }
.rule { border: 0; border-top: 1px solid var(--line); margin: var(--s-7) 0 0; }

/* ==========================================================================
   SURFACES — the core idea
   ========================================================================== */

.s-surface {
  background: var(--surface); border-radius: var(--r-3);
  box-shadow: inset 0 0 0 1px var(--line);
}
.s-paper {
  background: var(--paper); border-radius: var(--r-3);
  box-shadow: inset 0 0 0 1px var(--line), var(--sh-1);
}
.s-recessed {
  background: var(--recessed); border-radius: var(--r-2);
  box-shadow: inset 0 0 0 1px rgba(26,28,24,.055);
}
.s-sunk {
  background: var(--sunk); border-radius: var(--r-2);
  box-shadow: inset 0 1px 2px rgba(26,28,24,.05), inset 0 0 0 1px rgba(26,28,24,.05);
}
.pad-s { padding: var(--s-4); }
.pad   { padding: var(--s-5); }
.pad-l { padding: var(--s-6); }

/* A raised surface that responds. The lift is the affordance. */
.lift { transition: box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.lift:hover { box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-2); transform: translateY(-1px); }
.lift:active { transform: none; box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-1); }

/* ==========================================================================
   BUTTONS
   ========================================================================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  height: 38px; padding: 0 18px; border-radius: var(--r-2);
  font-size: 15px; font-weight: 550; line-height: 1; white-space: nowrap;
  color: var(--ink-2); background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--line-2), var(--sh-1);
  transition: background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.btn:hover { box-shadow: inset 0 0 0 1px var(--ink-5), var(--sh-2); color: var(--ink); transform: translateY(-1px); }
.btn:active { transform: none; box-shadow: inset 0 0 0 1px var(--ink-5); }
.btn:disabled { opacity: .42; cursor: not-allowed; transform: none; box-shadow: inset 0 0 0 1px var(--line-2); }
.btn:disabled:hover { color: var(--ink-2); }

.btn--primary {
  background: var(--accent); color: #f4f6f3; box-shadow: var(--sh-1);
  font-weight: 600;
}
.btn--primary:hover { background: var(--accent-hi); color: #fff; box-shadow: var(--sh-2); }
.btn--primary:active { box-shadow: var(--sh-1); }
.btn--primary:disabled:hover { background: var(--accent); color: #f4f6f3; }

.btn--ok { background: var(--ok); color: #f2f7f3; box-shadow: var(--sh-1); font-weight: 600; }
.btn--ok:hover { background: #35633f; color: #fff; }
.btn--danger { background: var(--paper); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger-line); }
.btn--danger:hover { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }

.btn--ghost { background: none; box-shadow: none; color: var(--ink-3); padding: 0 12px; }
.btn--ghost:hover { background: var(--recessed); color: var(--ink); box-shadow: none; transform: none; }

.btn--sm { height: 30px; padding: 0 12px; font-size: 13.5px; border-radius: var(--r-1); }
.btn--sm.btn--ghost { padding: 0 9px; }
.btn--lg { height: 46px; padding: 0 24px; font-size: 16px; border-radius: var(--r-2); }
.btn--wide { width: 100%; }

.btn .k {
  font: 10.5px/1 var(--mono); opacity: .62; padding: 3px 4px; border-radius: 3px;
  box-shadow: inset 0 0 0 1px currentColor; margin-left: 2px;
}
.btn svg { opacity: .75; }
.btn--primary svg, .btn--ok svg { opacity: .9; }

.lnk {
  color: var(--accent-mid); font-size: 14.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  border-bottom: 1px solid transparent; transition: border-color var(--t-fast);
}
.lnk:hover { border-bottom-color: var(--accent-line); }

/* ==========================================================================
   STATUS
   ========================================================================== */

.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-5); flex: none; }
.dot--ok { background: var(--ok); } .dot--warn { background: var(--warn); }
.dot--alert { background: var(--danger); }
.dot--open { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-5); }
.dot--accent { background: var(--accent-mid); }

.state { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-3); }
.state--ok { color: var(--ok); } .state--warn { color: var(--warn); } .state--alert { color: var(--danger); }

.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
  border-radius: var(--r-pill); font-size: 12px; font-weight: 550; letter-spacing: .01em;
  background: var(--recessed); color: var(--ink-3); box-shadow: inset 0 0 0 1px rgba(26,28,24,.05);
}
.tag--ok { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok-line); }
.tag--warn { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
.tag--alert { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger-line); }
.tag--accent { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.tag--concept { background: var(--concept-soft); color: var(--concept); box-shadow: inset 0 0 0 1px var(--concept-line); }
.tag--quiet { background: none; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-4); }
.chip {
  font: 12px var(--mono); padding: 3px 8px; border-radius: var(--r-1);
  background: var(--recessed); color: var(--ink-3);
}
.chip--ok { background: var(--ok-soft); color: var(--ok); }
.chip--warn { background: var(--warn-soft); color: var(--warn); }
.chip--alert { background: var(--danger-soft); color: var(--danger); }
.chip--open { background: none; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-4); }
.chipline { display: flex; flex-wrap: wrap; gap: 6px; }

.bar { height: 6px; border-radius: var(--r-pill); background: var(--sunk); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; transition: width var(--t-slow) var(--ease); }
.bar .f-ok { background: var(--ok); }
.bar .f-part { background: var(--ok-line); }
.bar .f-open { background: transparent; }

/* ==========================================================================
   APP HEADER
   ========================================================================== */

.hdr {
  flex: none; height: 56px; display: flex; align-items: center; gap: var(--s-4);
  padding: 0 var(--s-5); background: var(--ground);
  border-bottom: 1px solid var(--line); position: relative; z-index: 20;
}
.mark { display: inline-flex; align-items: center; gap: 9px; flex: none; }
.mark__g { color: var(--accent); }
.mark__t { font-size: 15px; font-weight: 650; letter-spacing: -.015em; color: var(--ink); }
.mark:hover .mark__t { color: var(--accent); }

.crumb { display: flex; align-items: center; gap: 2px; min-width: 0; }
.crumb__i {
  font-size: 13.5px; color: var(--ink-3); padding: 5px 8px; border-radius: var(--r-1);
  white-space: nowrap; transition: background var(--t-fast), color var(--t-fast);
}
.crumb__i:hover { background: var(--paper); color: var(--ink); }
.crumb__i.is-here { color: var(--ink); font-weight: 600; }
.crumb__s { color: var(--ink-5); flex: none; }

.hdr__r { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; flex: none; }
.saved { font-size: 12.5px; color: var(--ink-4); display: inline-flex; align-items: center; gap: 6px; }
.srch {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px;
  border-radius: var(--r-pill); background: var(--paper); color: var(--ink-4);
  box-shadow: inset 0 0 0 1px var(--line-2); font-size: 13.5px;
  transition: box-shadow var(--t-fast), color var(--t-fast);
}
.srch:hover { box-shadow: inset 0 0 0 1px var(--ink-5); color: var(--ink-2); }
.srch .k { font: 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 3px; background: var(--recessed); }
.iconbtn {
  width: 32px; height: 32px; border-radius: var(--r-pill); display: inline-flex;
  align-items: center; justify-content: center; color: var(--ink-4);
  transition: background var(--t-fast), color var(--t-fast);
}
.iconbtn:hover { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #eef2ee;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 650; letter-spacing: .02em; flex: none;
  transition: box-shadow var(--t-fast) var(--ease);
}
button.avatar:hover { box-shadow: 0 0 0 3px var(--accent-soft); }

/* The avatar menu — the only firm-level destination in the product */
.menu-scrim { position: fixed; inset: 0; z-index: 90; }
.menu {
  position: absolute; top: 48px; right: var(--s-5); z-index: 91; width: 264px;
  background: var(--paper); border-radius: var(--r-3); box-shadow: var(--sh-3);
  padding: var(--s-2); animation: rise var(--t-base) var(--ease);
}
.menu__hd { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); }
.menu__n { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.menu__r { display: block; font-size: 12px; color: var(--ink-4); margin-top: 2px; }
.menu__i {
  display: flex; align-items: center; gap: var(--s-3); width: 100%; padding: 9px var(--s-3);
  border-radius: var(--r-2); font-size: 14.5px; color: var(--ink-2);
  transition: background var(--t-fast);
}
.menu__i:hover { background: var(--recessed); color: var(--ink); }
.menu__i svg { color: var(--ink-4); flex: none; }
.menu__i.is-off { color: var(--ink-5); }
.menu__i.is-off:hover { background: none; cursor: default; }
.menu__sep { height: 1px; background: var(--line); margin: var(--s-2) var(--s-3); }

/* ==========================================================================
   PROCESS JOURNEY
   ========================================================================== */

.jrn {
  flex: none; height: 60px; display: flex; align-items: stretch; gap: 0;
  padding: 0 var(--s-5); background: var(--ground); border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none; position: relative; z-index: 19;
}
.jrn::-webkit-scrollbar { display: none; }
.jstep {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  padding: 0 14px 0 0; white-space: nowrap; position: relative;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.jstep__top { display: flex; align-items: center; gap: 7px; }
.jstep__m { width: 13px; height: 13px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.jstep__m i {
  width: 7px; height: 7px; border-radius: 50%; display: block;
  box-shadow: inset 0 0 0 1.5px var(--ink-5); transition: all var(--t-base) var(--ease);
}
.jstep__n { font-size: 13.5px; font-weight: 550; color: var(--ink-3); transition: color var(--t-fast); }
.jstep__c { font-size: 12px; color: var(--ink-4); padding-left: 20px; }
.jstep__ln { align-self: center; width: 18px; height: 1px; background: var(--line-2); flex: none; margin: 0 2px 0 -2px; }

/* List rows — quiet, for enumeration rather than decision */

.mapnode__ctl { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); }

/* The queue on a workspace-width screen. Two columns show four items where one
   showed two, at exactly the same card size and the same text measure — the
   items stay numbered, so the priority order still reads. Below the threshold

.aq--split { display: grid; gap: var(--s-3); }
@media (min-width: 1340px) { .aq--split { grid-template-columns: 1fr 1fr; } }

.maplegend { display: flex; gap: var(--s-4); font-size: 12.5px; color: var(--ink-4); align-items: center; flex-wrap: wrap; }

.maplegend b { color: var(--ink-3); }

.mapdetail {
  margin-top: var(--s-4); padding: var(--s-5) var(--s-6); background: var(--paper);
  border-radius: var(--r-3); box-shadow: inset 0 0 0 1px var(--line), var(--sh-1);
  animation: rise var(--t-base) var(--ease);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5) var(--s-6); align-items: start; }

/* ==========================================================================

.tracehead { padding: var(--s-4) var(--s-6); border-bottom: 1px solid var(--line); background: var(--ground); }

/* Progress ribbon — where the auditor is in the transaction */
.ribbon { display: flex; align-items: stretch; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.ribbon::-webkit-scrollbar { display: none; }
.rbn { display: flex; flex-direction: column; gap: 4px; padding: 0 12px 0 0; white-space: nowrap; }

  justify-content: center; box-shadow: inset 0 0 0 1.5px var(--ink-5); color: transparent; flex: none; }
.rbn__n { font-size: 13px; color: var(--ink-3); font-weight: 550; }
.rbn__c { font-size: 11.5px; color: var(--ink-4); padding-left: 22px; }

.rbn.is-ex .rbn__m { background: var(--danger); box-shadow: none; color: #fff; }

.expect { margin-top: var(--s-6); border-radius: var(--r-2); overflow: hidden;
          box-shadow: inset 0 0 0 1px rgba(26,28,24,.06); background: var(--recessed); }
.expect__r { display: flex; gap: var(--s-4); padding: 12px var(--s-5); font-size: 14.5px; }
.expect__r + .expect__r { border-top: 1px solid rgba(26,28,24,.07); }

.expect__r dd { flex: 1; margin: 0; color: var(--ink-2); line-height: 1.55; }

.actual { margin-top: var(--s-6); }

.actual__o { font-size: 15px; color: var(--ink-2); line-height: 1.66; max-width: 62ch; }

.tally { display: flex; gap: var(--s-8); padding: var(--s-5) var(--s-6); border-radius: var(--r-3);
         background: var(--paper); box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); }
.tally div { display: flex; flex-direction: column; gap: 4px; }
.tally__n { font-size: 34px; font-weight: 600; letter-spacing: -.022em; line-height: 1; }

/* ==========================================================================
   CONTROL TESTING
   ========================================================================== */

.tflow { border-radius: var(--r-3); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); }

.ticks { font-size: 14.5px; color: var(--ink-2); }
.ticks li { padding: 6px 0 6px 22px; position: relative; line-height: 1.55; }
.ticks li::before {
  content: ""; position: absolute; left: 2px; top: 13px; width: 7px; height: 7px;
  border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-5);
}

/* ==========================================================================
   AUDIT GRID — the RCM. Tabular data gets a table.
   ========================================================================== */

.gridwrap {

}

  font-size: 11.5px; font-weight: 650; letter-spacing: .085em; text-transform: uppercase;

.filters { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }

/* ==========================================================================
   PROGRESSIVE DISCLOSURE
   ========================================================================== */

.more { margin-top: var(--s-4); }

  font-size: 13.5px; color: var(--ink-4); display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 9px 5px 6px; border-radius: var(--r-1); margin-left: -6px;
  transition: background var(--t-fast), color var(--t-fast);

/* ==========================================================================
   FORMS
   ========================================================================== */

.field {
  width: 100%; padding: 11px 14px; border-radius: var(--r-2); background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--line-2); border: 0; outline: none; font-size: 15px;
  color: var(--ink); transition: box-shadow var(--t-fast) var(--ease);
}
.field:hover { box-shadow: inset 0 0 0 1px var(--ink-5); }

.flabel { display: block; margin-bottom: 6px; }
.fgroup + .fgroup { margin-top: var(--s-4); }
.grid2 + .grid2, .fgroup + .grid2, .grid2 + .fgroup { margin-top: var(--s-4); }
/* No sibling margin inside the pair: the grid's own gap spaces the fields in
   both states, and a margin here pushes the right-hand label out of line with
   the left-hand one whenever only one of them carries a hint. */

/* ==========================================================================

   ========================================================================== */

.scrim { position: fixed; inset: 0; background: rgba(26,28,24,.34); z-index: 200; animation: fade var(--t-fast); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  width: min(680px, calc(100vw - 32px)); background: var(--paper);

.pal__hd { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-5); border-bottom: 1px solid var(--line); }

.pal__list { max-height: 52vh; overflow-y: auto; padding: var(--s-2); }
.pal__g {
  font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;

}
.pal__i {
  display: flex; align-items: center; gap: var(--s-3); width: 100%; padding: 9px var(--s-3);
  border-radius: var(--r-2); font-size: 14.5px; color: var(--ink-2);
}
.pal__i svg { color: var(--ink-4); flex: none; }

.pal__ft {

}

.sheet {
  position: fixed; z-index: 201; top: 50%; left: 50%; transform: translate(-50%, -50%);

.keys .k {

.demo {

}
.demo__n { font: 11.5px var(--mono); color: var(--ink-4); flex: none; }

/* ==========================================================================
   MISC
   ========================================================================== */

.callout {
  font-size: 14.5px; color: var(--ink-3); line-height: 1.65; padding: var(--s-4) var(--s-5);
  background: var(--paper); border-radius: var(--r-2); box-shadow: inset 0 0 0 1px var(--line);
}
.callout b { color: var(--ink); font-weight: 600; }

.callout--alert { background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger-line); color: #7b2f22; }

.empty { padding: var(--s-9) var(--s-5); text-align: center; }
.empty__ic { color: var(--ink-5); display: inline-flex; margin-bottom: var(--s-4); }
.empty__t { font-size: 20px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; }

.phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-3); }
.phase { padding: var(--s-4) var(--s-5); border-radius: var(--r-2); background: var(--surface);
         box-shadow: inset 0 0 0 1px var(--line); }

.vcard { margin-top: var(--s-4); padding: var(--s-5) var(--s-6); background: var(--paper);
         border-radius: var(--r-3); box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); }

/* Client questionnaire — a separate, plainer, mobile-first surface */
.cq { min-height: 100vh; background: var(--ground); }
.cq__bar {
  padding: var(--s-4) var(--s-6); display: flex; align-items: center; gap: var(--s-4);
  border-bottom: 1px solid var(--line); background: var(--ground);
  position: sticky; top: 0; z-index: 10;
}
/* The portal wrapper owns the width now; the body just flows inside it. */
.cq__body { max-width: 100%; }
.cq__q { font-size: 27px; font-weight: 600; line-height: 1.32; letter-spacing: -.018em; }
.cq__prog { height: 4px; border-radius: var(--r-pill); background: var(--sunk); overflow: hidden; }
.cq__prog i { display: block; height: 100%; background: var(--accent-mid); transition: width var(--t-slow) var(--ease); }
.cq__done { padding: var(--s-4) 0; border-bottom: 1px solid var(--line); }
.cq__done .qq { font-size: 14.5px; color: var(--ink-4); }

@media (max-width: 620px) {
  .cq__bar { padding: var(--s-3) var(--s-4); flex-wrap: wrap; }
  .cq__q { font-size: 23px; }

}

/* ==========================================================================
   THE CLIENT PORTAL

   The other half of the product. Same identity — warm ground, mineral-green
   ink, the same type and the same buttons — and a deliberately different
   feel: larger body text, far more air, fewer things per screen, no small
   grey labels. A client should never feel they are operating audit software.
   ========================================================================== */

.pt { min-height: 100vh; background: var(--ground); display: flex; flex-direction: column; }
.pt--live { height: 100vh; overflow: hidden; }

.pt__bar {
  flex: none; display: flex; align-items: center; gap: var(--s-4);
  padding: 0 var(--s-6); height: 62px; background: var(--ground);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
}
.pt__bar .sp { flex: 1; }
.pt__mark { display: inline-flex; align-items: center; gap: 9px; color: var(--accent); flex: none; }
.pt__mark span { font-size: 15px; font-weight: 650; letter-spacing: -.015em; color: var(--ink); }
.pt__ctx { display: flex; align-items: baseline; gap: 8px; font-size: 14px; color: var(--ink-3);
           padding-left: var(--s-4); border-left: 1px solid var(--line); }
.pt__ctx b { color: var(--ink); font-weight: 600; }
.pt__help { font-size: 14px; color: var(--ink-3); padding: 6px 10px; border-radius: var(--r-1); }
.pt__help:hover { color: var(--ink); background: var(--surface); }
.pt__me {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 12px; font-weight: 650; letter-spacing: .02em;
  display: inline-flex; align-items: center; justify-content: center;
}

/* The prototype view switch. Marked as one, and styled so it can never be
   mistaken for a production control. */
.pt__dev {
  flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 7px var(--s-6); background: var(--recessed);
  border-bottom: 1px solid var(--line); font-size: 12px;
}
.pt__dev-k { color: var(--ink-4); text-transform: uppercase; letter-spacing: .09em;
             font-weight: 650; font-size: 10.5px; margin-right: 4px; }
.pt__dev-b {
  font-size: 12px; color: var(--ink-3); padding: 3px 9px; border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.pt__dev-b:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-5); }
.pt__dev-b.is-on { background: var(--paper); color: var(--ink); font-weight: 600; }
.pt__dev-s { flex: 1; }

.pt__canvas { flex: 1; overflow-y: auto; }
.pt__wrap { width: min(100% - 48px, 980px); margin-inline: auto; padding: var(--s-8) 0 var(--s-9); }
.pt__wrap--narrow { width: min(100% - 48px, 720px); }
.pt__wrap--wide { width: min(100% - 48px, 1080px); }

/* --- Type. One step up from the auditor side everywhere. ----------------- */
.pt__head { margin-bottom: var(--s-7); }
.pt__head--centre { text-align: center; }
.pt__head h1 { font-size: 34px; font-weight: 600; letter-spacing: -.022em; line-height: 1.18; }
.pt__eyebrow {
  font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 10px;
}
.pt__lede { font-size: 18px; line-height: 1.6; color: var(--ink-2); margin-top: 12px; max-width: 56ch; }
.pt__head--centre .pt__lede { margin-inline: auto; }
.pt__head--centre ~ .pt__sec .pt__acts,
.pt__head--centre ~ .pt__sec .pt__note { justify-content: center; margin-inline: auto; text-align: center; }
.pt__sh { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: var(--s-4); }
.pt__sec { margin-top: var(--s-7); }
.pt__note { font-size: 14px; color: var(--ink-4); line-height: 1.6; margin-top: var(--s-4); max-width: 58ch; }
.pt__acts { display: flex; gap: var(--s-3); flex-wrap: wrap; margin-top: var(--s-6); }
.pt__acts--centre { justify-content: center; }
.pt__trust { font-size: 14px; color: var(--ink-4); line-height: 1.65; margin-top: var(--s-9);
             padding-top: var(--s-5); border-top: 1px solid var(--line); max-width: 62ch; }

/* --- A task. The only object on the portal home. ------------------------- */
.ptask {
  background: var(--paper); border-radius: var(--r-4); padding: var(--s-6);
  box-shadow: inset 0 0 0 1px var(--line), var(--sh-1);
}
.ptask + .ptask { margin-top: var(--s-4); }
.ptask--done { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ptask__hd { display: flex; align-items: flex-start; gap: var(--s-4); }
.ptask__ic { color: var(--accent-mid); flex: none; margin-top: 2px; }
.ptask__t { flex: 1; min-width: 0; display: flex; align-items: baseline;
            gap: var(--s-3); flex-wrap: wrap; }
.ptask__t h2 { font-size: 21px; font-weight: 600; letter-spacing: -.013em; line-height: 1.3; }
.ptask__w { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin-top: 12px; max-width: 60ch; }
.ptask__m { font-size: 14.5px; color: var(--ink-3); margin-top: 8px; }
.ptask__go { margin-top: var(--s-5); }

.ptag {
  font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-pill);
  background: var(--recessed); color: var(--ink-3); white-space: nowrap;
}
.ptag--accent { background: var(--accent-soft); color: var(--accent); }
.ptag--ok { background: var(--ok-soft); color: var(--ok); }

.pdone { display: flex; align-items: flex-start; gap: var(--s-3); padding: 14px 0;
         border-bottom: 1px solid var(--line); color: var(--ink-3); }
.pdone:last-child { border-bottom: 0; }
.pdone > span { color: var(--ok); flex: none; margin-top: 1px; }
.pdone b { display: block; font-size: 15.5px; font-weight: 600; color: var(--ink-2); }
.pdone div span { font-size: 14px; color: var(--ink-4); }

.pt__empty { text-align: center; padding: var(--s-8) 0; }
.pt__empty > span { color: var(--ok); display: inline-flex; }
.pt__empty h2 { font-size: 21px; font-weight: 600; margin-top: var(--s-3); }
.pt__empty p { font-size: 16px; color: var(--ink-3); margin-top: 8px; max-width: 46ch;
               margin-inline: auto; line-height: 1.6; }
.pt__tick { color: var(--ok); display: inline-flex; margin-bottom: var(--s-3); }

/* --- Interview task, waiting room ---------------------------------------- */
.pfacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-5);
          background: var(--paper); border-radius: var(--r-4); padding: var(--s-6);
          box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); }
.pfacts > div { display: flex; flex-direction: column; gap: 4px; }
.pfacts span { font-size: 13px; color: var(--ink-4); text-transform: uppercase;
               letter-spacing: .08em; font-weight: 650; }
.pfacts b { font-size: 16.5px; font-weight: 600; line-height: 1.4; }
.pfacts i { font-style: normal; font-size: 14px; color: var(--ink-3); }
@media (max-width: 720px) { .pfacts { grid-template-columns: 1fr; gap: var(--s-4); } }

.ptopics { display: grid; gap: 12px; }
.ptopics li { display: flex; align-items: flex-start; gap: 10px; font-size: 16.5px;
              color: var(--ink-2); line-height: 1.5; }
.ptopics li svg { color: var(--ok); flex: none; margin-top: 3px; }

.pwho { display: flex; align-items: center; gap: var(--s-3); padding: 12px 0; }
.pwho > span { flex: none; width: 34px; height: 34px; border-radius: 50%;
               background: var(--recessed); color: var(--ink-2); font-size: 12.5px;
               font-weight: 650; display: inline-flex; align-items: center; justify-content: center; }
.pwho b { display: block; font-size: 16px; font-weight: 600; }
.pwho div span { font-size: 14px; color: var(--ink-3); }

.pready { background: var(--paper); border-radius: var(--r-4);
          box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); overflow: hidden; }
.pready__r { display: flex; align-items: flex-start; gap: var(--s-4); padding: var(--s-5) var(--s-6); }
.pready__r + .pready__r { border-top: 1px solid var(--line); }
.pready__i { color: var(--accent-mid); flex: none; margin-top: 2px; }
.pready__r > div { flex: 1; }
.pready__r b { display: block; font-size: 16px; font-weight: 600; }
.pready__r div span { display: block; font-size: 14.5px; color: var(--ink-3);
                      line-height: 1.6; margin-top: 4px; max-width: 52ch; }

.pdot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 8px; }
.pdot--ok { background: var(--ok); }
.pdot--rec { background: var(--danger); margin-top: 0; animation: ptpulse 2.4s infinite; }
@keyframes ptpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.pconsent {
  display: flex; align-items: flex-start; gap: 12px; margin-top: var(--s-5);
  padding: var(--s-4) var(--s-5); border-radius: var(--r-3); cursor: pointer;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 15.5px; line-height: 1.55; color: var(--ink-2);
}
.pconsent:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
.pconsent.is-on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.pconsent input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }

/* --- Live: the conversation, and nothing that belongs to the auditor ----- */
.plive__bar {
  flex: none; display: flex; align-items: center; gap: var(--s-3);
  padding: 0 var(--s-6); height: 62px; border-bottom: 1px solid var(--line); background: var(--ground);
}
.plive__bar .sp { flex: 1; }
.plive__t b { display: block; font-size: 15.5px; font-weight: 600; }
.plive__t span { display: block; font-size: 13.5px; color: var(--ink-3); }
.plive__clock { font: 15px var(--mono); color: var(--ink-3); letter-spacing: -.02em; }
.plive__topic {
  flex: none; display: flex; align-items: baseline; gap: 10px;
  padding: 10px var(--s-6); background: var(--surface); border-bottom: 1px solid var(--line);
}
.plive__topic span { font-size: 11px; font-weight: 650; letter-spacing: .09em;
                     text-transform: uppercase; color: var(--ink-4); }
.plive__topic b { font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.plive__body { flex: 1; overflow-y: auto; padding: var(--s-7) var(--s-6) var(--s-8); }
.plive__in { width: min(100%, 720px); margin-inline: auto; }
.plive__foot {
  flex: none; display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-6); border-top: 1px solid var(--line); background: var(--surface);
}
.plive__foot .sp { flex: 1; }

.pturn { margin-bottom: var(--s-6); opacity: .74; transition: opacity var(--t-slow) var(--ease); }
.pturn.is-new { opacity: 1; }
.pturn__w { font-size: 13.5px; font-weight: 650; color: var(--ink-3); margin-bottom: 6px; }
.pturn__x { font: 18px/1.65 var(--serif); color: var(--ink); max-width: 58ch; }
.pturn--me { padding-left: var(--s-4); border-left: 2px solid var(--accent-line); }
.pturn--me .pturn__w { color: var(--accent); }
.pturn__dots { display: flex; gap: 5px; padding: 6px 0; }
.pturn__dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-5);
                 animation: ptdot 1.4s infinite; }
.pturn__dots i:nth-child(2) { animation-delay: .2s; }
.pturn__dots i:nth-child(3) { animation-delay: .4s; }
@keyframes ptdot { 0%,60%,100% { opacity: .3; } 30% { opacity: 1; } }

.pmic {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px;
  border-radius: var(--r-pill); font-size: 14.5px; font-weight: 550; color: var(--accent);
  background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line);
}
.pmic.is-off { color: var(--ink-3); background: var(--recessed); box-shadow: inset 0 0 0 1px var(--line-2); }

/* --- Document request, follow-up ---------------------------------------- */
.pt__drop {
  text-align: center; padding: var(--s-8) var(--s-6); border-radius: var(--r-4);
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-2);
}
.pt__drop > span { color: var(--ink-4); display: inline-flex; }
.pt__drop p { font-size: 16px; color: var(--ink-2); margin: var(--s-3) 0 var(--s-5); }
.pt__drop .pt__note { margin-inline: auto; }
.pt__ok { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-5) var(--s-6);
          border-radius: var(--r-4); background: var(--ok-soft);
          box-shadow: inset 0 0 0 1px var(--ok-line); }
.pt__ok > span { color: var(--ok); flex: none; }
.pt__ok b { display: block; font-size: 16.5px; font-weight: 600; }
.pt__ok div span { font-size: 14.5px; color: var(--ink-2); }

.pq__q { font-size: 28px; line-height: 1.3; }
.pq__in { font: 17px/1.65 var(--sans); min-height: 150px; }
.pq__was { background: var(--surface); border-radius: var(--r-3); padding: var(--s-5);
           box-shadow: inset 0 0 0 1px var(--line); }
.pq__was > span { font-size: 14.5px; color: var(--ink-4); }
.pq__was p { font: 17px/1.6 var(--serif); color: var(--ink); margin-top: 8px; }

/* --- The questionnaire, now a portal screen ------------------------------ */
.cq__head { margin-bottom: var(--s-7); }
.cq__count { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-bottom: var(--s-4); }
.cq__count span { font-size: 17px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }

/* --- Phone. The client may well be on one. ------------------------------- */
@media (max-width: 700px) {
  /* Two rows: the brand and the way out first, then which audit this is. */
  .pt__bar { height: auto; padding: 10px var(--s-4); gap: var(--s-3); row-gap: 8px; flex-wrap: wrap; }
  .pt__ctx { order: 5; flex: 1 1 100%; padding-left: 0; border-left: 0; font-size: 13px; }
  .pt__help { display: none; }
  /* The header back button is the client's main way out on a phone, so it
     gets a real tap target rather than the auditor side's compact one. */
  .pt__bar .btn--sm { height: 38px; padding-inline: 14px; }
  .pt__dev { padding: 6px var(--s-4); }
  .pt__wrap, .pt__wrap--narrow, .pt__wrap--wide { width: calc(100% - 32px); padding: var(--s-6) 0 var(--s-8); }
  .pt__head h1 { font-size: 27px; }
  .pt__lede { font-size: 16.5px; }
  .ptask { padding: var(--s-5); }
  .ptask__t h2 { font-size: 19px; }
  .ptask__go .btn, .pt__acts .btn { flex: 1 1 auto; justify-content: center; }
  .plive__bar, .plive__foot, .plive__topic { padding-inline: var(--s-4); }
  .plive__bar { height: auto; padding-block: 10px; }
  .plive__t { min-width: 0; }
  .plive__t b, .plive__t span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plive__clock { font-size: 13.5px; }
  .plive__topic b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Two rows on a phone: the microphone, then the actions. Nothing clipped. */
  .plive__foot { flex-wrap: wrap; gap: 10px; }
  .plive__foot .sp { display: none; }
  .pmic { flex: 1 1 100%; justify-content: center; white-space: nowrap; }
  .plive__foot .btn { flex: 1 1 0; justify-content: center; min-width: 0; height: 40px; }
  .plive__body { padding: var(--s-5) var(--s-4) var(--s-7); }
  .pturn__x { font-size: 17px; }
  .pq__q, .cq__q { font-size: 23px; }
  .cq__count { font-size: 26px; }
}

/* Live cockpit — conversation leads, everything else is quiet */
.ck { display: flex; flex: 1; min-height: 0; background: var(--ground); }
.ck__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ck__conv { flex: 1; overflow-y: auto; padding: var(--s-6) var(--s-7) var(--s-8); }
.ck__conv-in { max-width: 680px; margin: 0 auto; }
.ck__side { flex: 0 0 320px; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ck__sh { padding: var(--s-4) var(--s-5) var(--s-2); }
.ck__sb { flex: 1; overflow-y: auto; padding: 0 var(--s-5) var(--s-6); }
@media (max-width: 1080px) { .ck__side { flex: 0 0 280px; } }
.turn { margin-bottom: var(--s-5); opacity: .62; transition: opacity var(--t-slow) var(--ease); }
.turn.is-new { opacity: 1; }
.turn__w { font-size: 12.5px; color: var(--ink-4); margin-bottom: 4px; }
.turn__w b { color: var(--ink-2); font-weight: 600; }
.turn__x { font: 16.5px/1.7 var(--serif); color: var(--ink-2); }
.turn.is-new .turn__x { color: var(--ink); }
.cue {
  padding: var(--s-4); border-radius: var(--r-2); background: var(--paper); margin-bottom: var(--s-2);
  box-shadow: inset 0 0 0 1px var(--line), var(--sh-1); animation: rise var(--t-base) var(--ease);
}
.cue__k { font-size: 11px; font-weight: 650; letter-spacing: .085em; text-transform: uppercase; color: var(--ink-4);
          display: flex; align-items: center; gap: 6px; }
.cue__t { font-size: 14.5px; line-height: 1.5; margin: 7px 0 5px; color: var(--ink); }
.cue__w { font-size: 12.5px; color: var(--ink-4); line-height: 1.5; }
.cue--hi { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--danger), var(--sh-1); }
.cue--hi .cue__k { color: var(--danger); }
.cue--md { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--warn), var(--sh-1); }
.cue--md .cue__k { color: var(--warn); }
.covrow { display: flex; align-items: center; gap: var(--s-3); padding: 7px 0; font-size: 13px; }
.covrow__n { flex: 1; color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.covrow__b { flex: 0 0 54px; }
.covrow__p { flex: 0 0 30px; text-align: right; color: var(--ink-4); font-size: 12px; }

/* Review points */
.rp { padding: var(--s-5); border-radius: var(--r-3); background: var(--paper);
      box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--danger), var(--sh-1); }
.rp + .rp { margin-top: var(--s-3); }
.rp.is-done { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--ok), var(--sh-1); }
.rp__hd { display: flex; align-items: flex-start; gap: var(--s-3); }
.rp__q { font: 17px/1.6 var(--serif); color: var(--ink); margin-top: var(--s-3); max-width: 60ch; }
.rp__meta { font-size: 13px; color: var(--ink-4); margin-top: 5px; }


@media (max-width: 700px) {
  .hdr { padding: 0 var(--s-4); } .jrn { padding: 0 var(--s-4); }
  .wrap { padding: var(--s-6) 0 120px; }
  .t-display { font-size: 27px; } .t-title { font-size: 22px; }
}

</style>

const narrative = [
  { id: "N1", n: "1", heading: "Overview", sub: "R1", blocks: [
    { id: "N1.1", text: "Vandersteen Industrial Systems B.V. designs, manufactures and installs conveyor and material-handling systems for the food processing industry, and provides maintenance services on the installed base. Revenue comprises two streams: machines and spare parts of approximately EUR 41.2 million, and service and maintenance contracts of approximately EUR 7.4 million. [[T:seg-02|Q:1]]" },
    { id: "N1.2", text: "The entity reports under EU-IFRS. Machine revenue is recognised at a point in time on customer acceptance; service revenue is recognised over time on a straight-line basis across the contract term. [[T:seg-25|T:seg-23]]" },
    { id: "N1.3", text: "The most significant change in the process during the period is the outsourcing of warehousing and despatch to Van Dijk Logistics in March 2026. In the prior year these activities were performed in-house at the Eindhoven site. [[T:seg-19|D:doc-py-7]]" },
  ]},

  { id: "N2", n: "2", heading: "Systems involved", sub: "R10", blocks: [
    { id: "N2.1", text: "Microsoft Dynamics 365 Business Central is the system of record for quotations, sales orders, shipments, invoices and the general ledger. ServiceTrack holds service contracts and field service records and generates the deferred revenue schedule. Van Dijk Logistics operates its own warehouse management system. [[T:seg-03|T:seg-23]]" },
    { id: "N2.2", text: "Two interfaces carry revenue data. Van Dijk Logistics transmits a despatch confirmation file each evening which posts shipments in Business Central. ServiceTrack posts the service billing and deferral schedule into Business Central nightly. IT is alerted if either interface fails to load. [[T:seg-19|T:seg-24]]" },
  ]},

  { id: "N3", n: "3", heading: "Roles and responsibilities", sub: "R1", blocks: [
    { id: "N3.1", text: "Sales engineers prepare quotations and enter machine orders. The Commercial Director approves quotations above EUR 100,000 and releases orders blocked for discounts above twelve per cent. [[Q:2|Q:3|T:seg-12]]" },
    { id: "N3.2", text: "Sales administration creates and maintains customer master data and the customer price lists, converts signed quotations into sales orders, and raises credit notes. [[T:seg-05|Q:8|T:seg-26]]" },
    { id: "N3.3", text: "Credit control sets credit limits and releases orders blocked for credit. The financial controller performs the month-end reconciliations, the cut-off review and the rebate accrual, and approves manual invoices. The CFO approves write-offs above EUR 10,000. [[T:seg-15|T:seg-18|T:seg-31]]" },
  ]},

  { id: "N4", n: "4", heading: "Order initiation and capture", sub: "R2", blocks: [
    { id: "N4.1", text: "Machine sales begin with a quotation prepared in the Business Central configurator by a sales engineer. The customer signs the quotation and sales administration converts it into a sales order. Spare part orders arrive by e-mail to the sales desk and through the webshop. Service work is initiated in ServiceTrack. [[T:seg-03]]" },
    { id: "N4.2", text: "There is no reconciliation between the sales mailbox and the orders recorded in Business Central. The company would become aware of an unrecorded spare part order when the customer followed up on the delivery. [[T:seg-04]]" },
  ]},

  { id: "N5", n: "5", heading: "Pricing and discounts", sub: "R2", blocks: [
    { id: "N5.1", text: "The price on a machine order is taken from the signed quotation. Spare part prices are derived by the system from the customer price list, of which each trade customer has an agreed version, with a standard list applied to all other customers. [[T:seg-08]]" },
    { id: "N5.2", text: "Sales staff are able to change the price on an order line. The system requires a reason code to be entered and records the user who made the change. A price override report is available in Business Central. [[T:seg-09]]" },
    { id: "N5.3", missing: true, text: "We did not establish who reviews the price override report, how often it is reviewed, or what evidence exists that exceptions are followed up. The financial controller stated that he did not believe the report was run on a routine basis. A question has been issued to the client. [[T:seg-11]]" },
    { id: "N5.4", text: "Discounts above twelve per cent block the sales order in the system until the Commercial Director releases it. This block has been configured since the Business Central implementation. [[T:seg-12|Q:3]]" },
  ]},

  { id: "N6", n: "6", heading: "Credit management", sub: "R3", blocks: [
    { id: "N6.1", text: "Credit limits are assessed at onboarding on the basis of a Graydon credit report and, for existing customers, the payment history on the account. [[T:seg-15]]" },
    { id: "N6.2", conflict: true,
      options: [
        { choice: "controller", label: "Credit control is correct",
          detail: "Two corroborating sources against one. The Commercial Director's answer is recorded as inconsistent and followed up.",
          text: "Credit limits are set and changed only by credit control, with the agreement of the CFO above EUR 250,000. [[T:seg-17|D:note-1]]" },
        { choice: "both", label: "Both are true — record the second route",
          detail: "The Commercial Director has an override the financial controller was unaware of. This weakens control C-02 and is itself a finding.",
          text: "Credit limits are set by credit control, with CFO agreement above EUR 250,000. The Commercial Director is additionally able to raise a limit by up to EUR 50,000 where an order is blocked, which the financial controller was not aware of. [[T:seg-17|Q:6]]" },
        { choice: "unresolved", label: "Leave it open and document the difference",
          detail: "Records the contradiction as an audit finding. The open item stays live and sign-off stays blocked.",
          text: "The authority to change a customer credit limit could not be established. Two sources give different answers and the difference has been raised with the entity. [[conflict:T:seg-17|Q:6]]" },
      ], text: "Authority to change a customer credit limit could not be established. The financial controller stated that only credit control may change a limit, with CFO agreement above EUR 250,000, and credit control confirmed that position. The Commercial Director stated in the questionnaire that he is able to raise a limit by up to EUR 50,000 himself where an order is blocked and he knows the customer. [[conflict:T:seg-17|Q:6|D:note-1]]" },
    { id: "N6.3", text: "An order that breaches the customer's credit limit is blocked by the system and can be released only by credit control. Releases are recorded in a log within Business Central. [[T:seg-18|D:note-1]]" },
  ]},

  { id: "N7", n: "7", heading: "Delivery and performance", sub: "R4", blocks: [
    { id: "N7.1", text: "Since March 2026 warehousing, picking, packing and despatch have been performed by Van Dijk Logistics at its Tilburg distribution centre. A despatch confirmation file is transmitted each evening and posts the corresponding shipments in Business Central. [[T:seg-19|D:doc-so-4]]" },
    { id: "N7.2", text: "Machine sales additionally require installation at the customer site and signature of an acceptance protocol by the customer. For a single conveyor this typically occurs in the same week as delivery; for a complete line it may occur up to six weeks after delivery. [[T:seg-25]]" },
    { id: "N7.3", text: "If the despatch file fails to load an error is raised and IT investigates. The financial controller stated that a file which loads successfully but contains fewer records than were despatched would not be detected. The ISAE 3402 report for Van Dijk Logistics identifies reconciliation of the despatch confirmation to the user entity's own records as a complementary user entity control. [[T:seg-21|D:doc-so-11]]" },
  ]},

  { id: "N8", n: "8", heading: "Invoicing", sub: "R5", blocks: [
    { id: "N8.1", text: "Invoices are generated automatically by Business Central in an overnight batch from posted shipments. The invoiced quantity is taken from the shipment record and the price from the sales order. No manual re-entry occurs in the standard flow. [[T:seg-13|D:doc-py-3]]" },
    { id: "N8.2", text: "Invoice numbering follows the Business Central number series and one invoice is generated per posted shipment. [[T:seg-13|D:doc-py-3]]" },
    { id: "N8.3", text: "Invoices may also be raised manually by finance, for settlements and for milestone billing on large projects. A manual invoice requires the approval of the financial controller before it is issued. [[T:seg-14]]" },
    { id: "N8.4", text: "Service contracts are invoiced quarterly in advance from ServiceTrack. [[T:seg-23]]" },
  ]},

  { id: "N9", n: "9", heading: "Revenue recognition", sub: "R6", blocks: [
    { id: "N9.1", text: "Machine revenue is recognised when the equipment has been installed and the customer has signed the acceptance protocol. Service revenue is recognised on a straight-line basis over the term of the maintenance contract. [[T:seg-25|T:seg-23|D:doc-py-3]]" },
    { id: "N9.2", text: "Service contracts are billed quarterly in advance. ServiceTrack maintains the deferral schedule and posts the monthly release of deferred revenue into Business Central. The financial controller reconciles the service revenue account at month end. [[T:seg-23|T:seg-24]]" },
    { id: "N9.3", text: "Volume rebate arrangements are in place with three OEM customers. The rebate accrual is calculated by the financial controller at month end from the contract terms and the year-to-date volume. The entity acts as principal in all revenue streams and there are no agency or bill-and-hold arrangements. [[T:seg-27|Q:12]]" },
  ]},

  { id: "N10", n: "10", heading: "Credit notes, returns and rebates", sub: "R7", blocks: [
    { id: "N10.1", text: "Credit notes are raised by sales administration and approved by the sales manager. A credit note must reference the original invoice. [[T:seg-26|D:doc-py-5]]" },
    { id: "N10.2", unsupported: true,
      suggestion: "Credit notes are raised by sales administration and approved by the sales manager. No value threshold requiring finance approval was identified. [[T:seg-26|D:doc-py-5]]",
      askedText: "We asked whether a value threshold applies above which finance must approve a credit note. No threshold has been established. [[T:seg-26]]", text: "Credit notes above EUR 5,000 additionally require the approval of the financial controller. [[none]]",
      why: "The model generalised from the pattern of value thresholds elsewhere in the process (CFO approval of write-offs above EUR 10,000, Commercial Director approval of quotations above EUR 100,000) and from the Commercial Director's statement that he would \"expect finance to look at\" larger credit notes. No source states a EUR 5,000 threshold." },
    { id: "N10.3", text: "Machines are not returnable under the standard sales conditions. Spare parts may be returned within thirty days, but returns are infrequent and immaterial, and no return provision is recognised. [[Q:11]]" },
    { id: "N10.4", missing: true, text: "We did not obtain evidence of any review of the volume rebate accrual. The financial controller prepares the calculation and releases it without independent review. [[T:seg-29]]" },
  ]},

  { id: "N11", n: "11", heading: "Cash receipt and receivables", sub: "R8", blocks: [
    { id: "N11.1", text: "Bank statements are loaded daily and matched automatically to open invoices on the payment reference. Items that do not match are placed on a suspense list which credit control clears. [[T:seg-30]]" },
    { id: "N11.2", unsupported: true,
      suggestion: "Receipts that do not match automatically are placed on a suspense list which credit control clears. No ageing threshold or escalation route for unapplied cash was established. [[T:seg-30]]",
      askedText: "We asked how long unapplied cash may remain on the suspense list and who is informed. No answer has been obtained. [[T:seg-30]]", text: "Unapplied cash older than sixty days is escalated to the financial controller for investigation. [[none]]",
      why: "No source states an ageing threshold or an escalation route for unapplied cash. The transcript establishes only that credit control clears the suspense list." },
    { id: "N11.3", text: "The aged receivables listing is reviewed monthly by the financial controller together with the CFO. Write-offs above EUR 10,000 require CFO approval. [[T:seg-30|T:seg-31]]" },
  ]},

  { id: "N12", n: "12", heading: "Cut-off", sub: "R9", blocks: [
    { id: "N12.1", text: "At each month end the financial controller compares shipment dates and invoice dates for transactions falling either side of the reporting date. The ledger closes on working day four, after which only the financial controller is able to post. [[T:seg-32]]" },
    { id: "N12.2", missing: true, text: "The cut-off review is not documented and is performed by one individual without independent review. We did not obtain a written cut-off procedure or evidence that the review was performed for any specific period. [[T:seg-34|D:note-2]]" },
    { id: "N12.3", missing: true, text: "We did not establish how undelivered orders, goods in transit at the third-party logistics provider, or stock held on consignment at the German distributor are treated at the reporting date. Questions have been issued to the client. [[Q:4]]" },
  ]},

  { id: "N13", n: "13", heading: "Manual journals and management override", sub: "R11", blocks: [
    { id: "N13.1", text: "Manual journals to revenue accounts may be posted by the financial controller and by the CFO. Each approves the entries posted by the other. No individual outside these two roles is able to post to a revenue account. [[T:seg-35]]" },
    { id: "N13.2", text: "The only standing entry affecting revenue is the monthly release of deferred service revenue, which is generated automatically from the ServiceTrack schedule. [[T:seg-23|T:seg-27]]" },
    { id: "N13.3", text: "Sales engineers are remunerated in part by commission on invoiced revenue and the Commercial Director's bonus contains a turnover component. The entity has an EBITDA covenant with its bank which is tested half-yearly. [[T:seg-36|Q:9]]" },
  ]},

  { id: "N14", n: "14", heading: "Monitoring and IT dependencies", sub: "R12", blocks: [
    { id: "N14.1", text: "The financial controller reviews revenue and gross margin by stream against budget each month and discusses the result with the CFO. Variances of approximately EUR 250,000 or more are investigated. [[T:seg-37]]" },
    { id: "N14.2", unsupported: true,
      suggestion: "The reports used in this review are produced by Business Central. We did not establish how their completeness and accuracy is confirmed. [[T:seg-37]]",
      askedText: "We asked how the completeness and accuracy of the revenue and margin report is established. No answer has been obtained. [[T:seg-37]]", text: "The reports used in this review are produced by Business Central and their completeness and accuracy are confirmed against the general ledger before the review takes place. [[none]]",
      why: "No source addresses the completeness and accuracy of the information used in the management review. This is the ISA 500 information-produced-by-the-entity question, and it remains open." },
    { id: "N14.3", text: "Fourteen users hold the permission to modify price lists and nine hold the permission to modify customer master data, including two IT service accounts. There is no periodic review of who holds this access. [[T:seg-38|D:doc-al-1]]" },
  ]},

/* --- Client contacts and systems, and what a process uses of them ---------- */

const contactById = (cid, clientId = activeClient()?.id) =>

const systemById = (sid, clientId = activeClient()?.id) =>

const pkey = (proc = "revenue", e = S.engId) => `${e}::${proc}`;

/** Contacts the auditor has marked relevant to this process, with their role

    .filter((p) => p.contact);
}
function procSystemsFor(proc = "revenue") {
  return (S.procSystems[pkey(proc)] || []).map((id) => systemById(id)).filter(Boolean);
}
/** The named reviewer and partner on the active engagement, for sign-off copy. */
const reviewerName = () =>
  engTeam().find((t) => t.role === "Manager")?.user.name || "the manager";
