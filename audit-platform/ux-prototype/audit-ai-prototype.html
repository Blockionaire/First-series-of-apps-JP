<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit AI — Interim Platform (UX prototype)</title>
<meta name="description" content="Self-contained clickable prototype of the Audit AI interim platform. Fictional data, no network.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231b2430'/><path d='M9 21V11h3.2c2.6 0 4.3 1.9 4.3 5s-1.7 5-4.3 5H9zm13 0v-4' stroke='%23a8bed6' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>">
<style>
/* ==========================================================================
   Audit AI — interim platform prototype, second iteration.

   An audit-native design system built on typography and whitespace rather
   than boxes. Rules it holds itself to:
     · no panel headers, no card borders, no metric tiles, no data grids
     · one accent colour; three attention colours as rules and dots, never fills
     · hairlines only where whitespace genuinely cannot do the job
     · two transitions in the entire product, both functional
   ========================================================================== */

:root {
  /* Ink */
  --ink:      #15181c;
  --ink-2:    #3d454f;
  --ink-3:    #626c78;
  --ink-4:    #8b95a1;
  --ink-5:    #b3bac3;

  /* Ground */
  --paper:    #fcfcfa;
  --white:    #ffffff;
  --sink:     #f2f2ee;
  --sink-2:   #e9e9e4;

  /* Hairlines */
  --line:     #ececea;
  --line-2:   #dededa;

  /* The single accent */
  --accent:   #1b3a5c;
  --accent-2: #2b5885;
  --accent-w: #eef2f7;

  /* Attention — used as 3px rules and 5px dots. Never as a filled badge. */
  --warn:     #9a6608;   --warn-w:  #fbf3e2;
  --alert:    #a03a31;   --alert-w: #faeeec;
  --ok:       #256b47;   --ok-w:    #eaf2ed;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --shadow: 0 12px 48px rgba(21, 24, 28, .16), 0 2px 6px rgba(21, 24, 28, .06);
  --measure: 68ch;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
h1, h2, h3, p, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
::selection { background: #dbe6f1; }

/* --- Frame: one identity line, one stage spine. 64px total. -------------- */

#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.idline {
  flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 10px;
  padding: 0 24px; font-size: 12.5px; color: var(--ink-3);
}
.idline__who { color: var(--ink); font-weight: 550; }
.idline__sep { color: var(--ink-5); }
.idline__sp { flex: 1; }
.idline__saved { color: var(--ink-4); font-size: 12px; }
.kbd {
  font: 11px var(--mono); color: var(--ink-3); background: var(--white);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 6px;
}
.idline button.kbd:hover { border-color: var(--ink-4); color: var(--ink); }

.spine {
  flex: 0 0 auto; display: flex; align-items: stretch; gap: 0;
  padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--paper);
}
.stage {
  display: flex; align-items: baseline; gap: 9px; padding: 5px 12px 11px;
  color: var(--ink-4); font-size: 13px; border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap;
}
.stage:hover { color: var(--ink-2); }
.stage__n { font-weight: 550; }
.stage.is-on { color: var(--ink); border-bottom-color: var(--ink); }
.stage.is-on .stage__n { font-weight: 650; }
.stage__c { font-size: 12.5px; color: var(--ink-4); }
.stage.is-on .stage__c { color: var(--ink-3); }
.stage__c--warn { color: var(--warn); }
.stage__c--alert { color: var(--alert); }
.stage__c--ok { color: var(--ok); }
.stage__dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-5); align-self: center; }
.spine__sp { flex: 1; }

.canvas { flex: 1; overflow-y: auto; overflow-x: hidden; }
.wrap { max-width: 940px; margin: 0 auto; padding: 52px 32px 120px; }
.wrap--narrow { max-width: 720px; }
.wrap--wide { max-width: 1240px; }

/* --- Typography ---------------------------------------------------------- */

.t-title { font-size: 30px; font-weight: 600; letter-spacing: -.021em; line-height: 1.2; }
.t-h { font-size: 20px; font-weight: 600; letter-spacing: -.012em; }
.t-lede { font-size: 16px; color: var(--ink-3); line-height: 1.62; max-width: 62ch; }
.t-sub { font-size: 14px; color: var(--ink-3); }
.t-meta { font-size: 12.5px; color: var(--ink-4); }
.t-eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .085em; text-transform: uppercase;
  color: var(--ink-4);
}
.t-num { font-size: 30px; font-weight: 600; letter-spacing: -.02em; }
.ink2 { color: var(--ink-2); } .ink3 { color: var(--ink-3); } .ink4 { color: var(--ink-4); }
.mono { font-family: var(--mono); font-size: .88em; }
.b { font-weight: 600; }
.nowrap { white-space: nowrap; }

.head { margin-bottom: 36px; }
.head__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; }
.gap-xs > * + * { margin-top: 6px; }
.gap-s > * + * { margin-top: 14px; }
.gap-m > * + * { margin-top: 28px; }
.gap-l > * + * { margin-top: 52px; }
.row { display: flex; align-items: center; gap: 12px; }
.row--top { align-items: flex-start; }
.sp { flex: 1; }
.wrapf { flex-wrap: wrap; }

/* --- Buttons: quiet by default ------------------------------------------- */

.b-act {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
  border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--ink-2);
  background: var(--white); box-shadow: inset 0 0 0 1px var(--line-2);
  transition: box-shadow .1s, background .1s, color .1s;
}
.b-act:hover { box-shadow: inset 0 0 0 1px var(--ink-4); color: var(--ink); }
.b-act:disabled { opacity: .4; cursor: not-allowed; }
.b-act:disabled:hover { box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.b-act--go { background: var(--ink); color: var(--white); box-shadow: none; }
.b-act--go:hover { background: #262b32; color: var(--white); }
.b-act--ok { background: var(--ok); color: var(--white); box-shadow: none; }
.b-act--ok:hover { background: #1f5a3b; color: var(--white); }
.b-act--plain { box-shadow: none; background: none; color: var(--ink-3); padding: 7px 10px; }
.b-act--plain:hover { background: var(--sink); color: var(--ink); box-shadow: none; }
.b-act--lg { padding: 10px 20px; font-size: 15px; border-radius: 8px; }
.b-act--sm { padding: 4px 10px; font-size: 13px; border-radius: 6px; }
.b-act .k {
  font: 10.5px var(--mono); opacity: .55; border: 1px solid currentColor;
  border-radius: 3px; padding: 0 3px; margin-left: 2px;
}
.b-link { color: var(--accent); font-size: 14px; }
.b-link:hover { text-decoration: underline; }
.acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* --- Status: a dot and a word. No pills. --------------------------------- */

.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-5); flex: 0 0 5px; }
.dot--ok { background: var(--ok); }
.dot--warn { background: var(--warn); }
.dot--alert { background: var(--alert); }
.dot--open { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-5); }
.state { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); }
.state--ok { color: var(--ok); } .state--warn { color: var(--warn); } .state--alert { color: var(--alert); }

/* --- List rows: hairline + air, never a table ---------------------------- */

.rows { border-top: 1px solid var(--line); }
.rw {
  display: flex; align-items: flex-start; gap: 20px; width: 100%;
  padding: 17px 4px; border-bottom: 1px solid var(--line);
  transition: background .09s;
}
button.rw { cursor: pointer; }
button.rw:hover, .rw.is-hot:hover { background: var(--white); }
.rw__lead { flex: 0 0 auto; padding-top: 6px; }
.rw__main { flex: 1; min-width: 0; display: block; }
/* Rows are built from spans so they can nest inside a <button>; they still
   have to stack. */
.rw__t { display: block; font-size: 15px; color: var(--ink); line-height: 1.45; }
.rw__d { display: block; font-size: 13.5px; color: var(--ink-3); line-height: 1.5; margin-top: 3px; }
.rw__lead { display: block; }
.rw__side { flex: 0 0 auto; text-align: right; color: var(--ink-4); font-size: 13px; }
.rw--attn { box-shadow: inset 3px 0 0 var(--warn); padding-left: 16px; }
.rw--conflict { box-shadow: inset 3px 0 0 var(--alert); padding-left: 16px; }
.rw--done .rw__t { color: var(--ink-3); }
.inline-list { font-size: 14px; color: var(--ink-3); line-height: 1.9; }
.inline-list b { color: var(--ink-2); font-weight: 500; }

/* --- Triage -------------------------------------------------------------- */

.triage__group { padding: 30px 0; border-bottom: 1px solid var(--line); }
.triage__group:last-child { border-bottom: 0; }
.triage__n { font-size: 21px; font-weight: 600; letter-spacing: -.014em; margin-bottom: 5px; }
.triage__n .c { font-variant-numeric: tabular-nums; }

/* --- Focus mode: one judgement, full width ------------------------------- */

.focus { min-height: 100%; display: flex; flex-direction: column; }
.focus__bar {
  display: flex; align-items: center; gap: 14px; padding: 14px 32px;
  font-size: 13px; color: var(--ink-4);
}
.focus__body { flex: 1; padding: 8px 32px 140px; }
.focus__in { max-width: 760px; margin: 0 auto; }
.focus__ctx {
  font: 17px/1.75 var(--serif); color: var(--ink-5); padding: 10px 0 10px 20px;
}
.focus__item {
  font: 17px/1.75 var(--serif); color: var(--ink); padding: 14px 0 14px 20px;
  box-shadow: inset 3px 0 0 var(--warn); background: var(--warn-w);
  border-radius: 0 4px 4px 0;
}
.focus__item--alert { box-shadow: inset 3px 0 0 var(--alert); background: var(--alert-w); }
.focus__why { margin-top: 26px; }
.focus__why h4 { font-size: 15px; font-weight: 600; margin: 0 0 5px; }
.focus__why p { font-size: 14.5px; color: var(--ink-3); line-height: 1.65; }
.suggest {
  margin-top: 22px; background: var(--white); border-radius: 8px; padding: 18px 20px;
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.suggest__l { font-size: 12.5px; color: var(--ink-4); margin-bottom: 7px; }
.suggest__t { font: 16px/1.7 var(--serif); color: var(--ink); }
.focus__acts { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Two source cards, side by side, for a contradiction */
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
@media (max-width: 820px) { .versus { grid-template-columns: 1fr; } }
.vs {
  background: var(--white); border-radius: 8px; padding: 16px 18px;
  box-shadow: inset 0 0 0 1px var(--line-2);
}
.vs__who { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.vs__meta { font: 11.5px var(--mono); color: var(--ink-4); margin-bottom: 10px; }
.vs__q { font: 15px/1.65 var(--serif); color: var(--ink-2); }
.vs--a { box-shadow: inset 0 0 0 1px var(--line-2), inset 3px 0 0 var(--ok); }
.vs--b { box-shadow: inset 0 0 0 1px var(--line-2), inset 3px 0 0 var(--alert); }

/* --- The document -------------------------------------------------------- */

.doc { max-width: var(--measure); margin: 0 auto; padding: 8px 0 160px; }
.doc__sec { padding: 0 0 12px; scroll-margin-top: 20px; }
.doc__h {
  font-size: 13px; font-weight: 650; letter-spacing: .075em; text-transform: uppercase;
  color: var(--ink-4); margin: 52px 0 14px; display: flex; align-items: center; gap: 10px;
}
.doc__h:first-child { margin-top: 12px; }
.doc__h .n { font-family: var(--mono); font-weight: 400; color: var(--ink-5); letter-spacing: 0; }
.doc__h .sp { flex: 1; }

.claim {
  font: 18px/1.78 var(--serif); color: var(--ink); padding: 9px 0 9px 18px;
  margin-left: -18px; border-radius: 0 4px 4px 0; cursor: pointer;
  box-shadow: inset 3px 0 0 transparent; transition: box-shadow .1s, background .1s;
}
.claim:hover { box-shadow: inset 3px 0 0 var(--line-2); }
.claim.is-open { box-shadow: inset 3px 0 0 var(--accent); background: var(--white); }
.claim--warn { box-shadow: inset 3px 0 0 var(--warn); background: var(--warn-w); }
.claim--alert { box-shadow: inset 3px 0 0 var(--alert); background: var(--alert-w); }
.claim--absent { color: var(--ink-3); font-style: italic; box-shadow: inset 3px 0 0 var(--sink-2); }
.claim--gone { color: var(--ink-5); text-decoration: line-through; }
.claim--edited { box-shadow: inset 3px 0 0 var(--accent-2); }
.claim__n {
  font: 11.5px var(--sans); color: var(--ink-4); margin-left: 8px;
  vertical-align: 2px; opacity: 0; transition: opacity .1s;
}
.claim:hover .claim__n, .claim.is-open .claim__n { opacity: 1; }
.claim__note {
  font: 13px/1.55 var(--sans); color: var(--ink-3); margin-top: 7px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}

/* Evidence opens inline, beneath the claim the eye is already on. */
.ev { overflow: hidden; animation: evin .14s ease-out; }
@keyframes evin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.ev__in {
  margin: 4px 0 12px 18px; padding: 16px 18px; background: var(--white);
  border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2);
}
.ev__src + .ev__src { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.ev__who { font-size: 13px; font-weight: 600; color: var(--ink); }
.ev__meta { font: 11.5px var(--mono); color: var(--ink-4); margin: 1px 0 8px; }
.ev__q { font: 15px/1.65 var(--serif); color: var(--ink-2); }
.ev__foot { margin-top: 14px; display: flex; gap: 8px; align-items: center; }

/* Attention rail: a minimap in the margin, not a menu. */
.reader { display: flex; gap: 0; }
.rail { flex: 0 0 172px; position: sticky; top: 0; align-self: flex-start; padding: 20px 20px 0 0; }
.rail__i {
  display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 5px 0;
  font-size: 12.5px; color: var(--ink-3); line-height: 1.4; text-align: left;
}
.rail__i .rail__tick { margin-top: 6px; }
.rail__i:hover { color: var(--ink-2); }
.rail__i.is-on { color: var(--ink); }
.rail__tick { width: 14px; height: 2px; border-radius: 1px; background: var(--ink-5); flex: 0 0 14px; }
.rail__i.is-on .rail__tick { background: var(--ink); width: 20px; }
.rail__tick--ok { background: var(--ok); } .rail__tick--warn { background: var(--warn); }
.rail__tick--alert { background: var(--alert); } .rail__tick--gone { background: var(--ink-5); }
.rail__i--quiet { color: var(--ink-4); }
.rail__i--quiet:hover { color: var(--ink-2); }
.reader__doc { flex: 1; min-width: 0; }
@media (max-width: 1080px) { .rail { display: none; } }

/* --- Queue card: one recommendation at a time ---------------------------- */

.q { max-width: 760px; margin: 0 auto; }
.q__t { font-size: 25px; font-weight: 600; letter-spacing: -.018em; line-height: 1.3; }
.q__d { font-size: 15.5px; color: var(--ink-2); line-height: 1.68; margin-top: 14px; max-width: 64ch; }
.q__block { margin-top: 26px; }
.q__block h4 { font-size: 14px; font-weight: 600; margin: 0 0 5px; }
.q__block p { font-size: 14.5px; color: var(--ink-3); line-height: 1.65; max-width: 64ch; }
.q__facts { margin-top: 24px; }
.q__fact { display: flex; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.q__fact dt { flex: 0 0 132px; color: var(--ink-4); }
.q__fact dd { flex: 1; color: var(--ink-2); margin: 0; }
.q__flag {
  margin-top: 22px; padding: 14px 18px; border-radius: 8px; background: var(--warn-w);
  box-shadow: inset 3px 0 0 var(--warn); font-size: 14px; color: #6f4a08; line-height: 1.6;
}
.q__flag--alert { background: var(--alert-w); box-shadow: inset 3px 0 0 var(--alert); color: #7c2b25; }
.q__sug { margin-top: 30px; display: flex; align-items: baseline; gap: 12px; }
.q__sug .l { font-size: 13px; color: var(--ink-4); }
.q__sug .v { font-size: 17px; font-weight: 600; }
.q__acts { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* --- Progressive disclosure ---------------------------------------------- */

.more { margin-top: 18px; }
.more__t { font-size: 13px; color: var(--ink-4); display: inline-flex; align-items: center; gap: 6px; }
.more__t:hover { color: var(--ink-2); }
.more__t .cv { transition: transform .12s; display: inline-block; }
.more.is-open .more__t .cv { transform: rotate(90deg); }
.more__body { margin-top: 14px; animation: evin .14s ease-out; }
.meth {
  background: var(--white); border-radius: 8px; padding: 18px 20px;
  box-shadow: inset 0 0 0 1px var(--line-2); font-size: 13.5px;
}
.meth dl { display: grid; grid-template-columns: 172px 1fr; gap: 8px 18px; }
.meth dt { color: var(--ink-4); font-family: var(--mono); font-size: 12px; }
.meth dd { margin: 0; color: var(--ink-2); }
.chipline { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 11.5px var(--mono); padding: 2px 7px; border-radius: 4px;
  background: var(--sink); color: var(--ink-3);
}
.chip--ok { background: var(--ok-w); color: var(--ok); }
.chip--warn { background: var(--warn-w); color: var(--warn); }
.chip--alert { background: var(--alert-w); color: var(--alert); }
.chip--open { background: none; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-4); }

/* --- Command palette ------------------------------------------------------ */

.pal-scrim { position: fixed; inset: 0; background: rgba(21, 24, 28, .3); z-index: 200; }
.pal {
  position: fixed; z-index: 201; top: 14vh; left: 50%; transform: translateX(-50%);
  width: min(660px, calc(100vw - 32px)); background: var(--white);
  border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
}
.pal__in {
  width: 100%; border: 0; padding: 20px 22px; font-size: 17px; outline: none;
  border-bottom: 1px solid var(--line);
}
.pal__in::placeholder { color: var(--ink-5); }
.pal__list { max-height: 52vh; overflow-y: auto; padding: 8px; }
.pal__g { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-5); padding: 12px 12px 6px; }
.pal__i {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px;
  border-radius: 8px; font-size: 14.5px; color: var(--ink-2);
}
.pal__i.is-on { background: var(--sink); color: var(--ink); }
.pal__i .s { color: var(--ink-4); font-size: 13px; margin-left: auto; }
.pal__none { padding: 34px 22px; text-align: center; color: var(--ink-4); font-size: 14px; }
.pal__foot {
  padding: 10px 16px; border-top: 1px solid var(--line); background: var(--paper);
  font-size: 12px; color: var(--ink-4); display: flex; gap: 16px;
}

/* --- Undo bar (replaces confirmation dialogs) ---------------------------- */

.undo {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 150;
  background: var(--ink); color: #eef0f3; border-radius: 10px; padding: 11px 14px 11px 18px;
  display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow);
  font-size: 14px; max-width: calc(100vw - 40px); animation: evin .14s ease-out;
}
.undo b { color: var(--white); font-weight: 600; }
.undo button { color: #a9c4e0; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.undo button:hover { color: var(--white); }
.undo .k { font: 10.5px var(--mono); border: 1px solid #4a5560; border-radius: 3px; padding: 1px 4px; }

/* --- Demo bar ------------------------------------------------------------ */

.demo {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 145;
  background: var(--white); border-radius: 12px; padding: 14px 16px 14px 20px;
  display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow);
  max-width: min(900px, calc(100vw - 40px));
}
.demo__n { font: 11.5px var(--mono); color: var(--ink-4); flex: 0 0 auto; }
.demo__t { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.demo__t b { color: var(--ink); }

/* --- Sheets and misc ----------------------------------------------------- */

.sheet-scrim { position: fixed; inset: 0; background: rgba(21,24,28,.3); z-index: 200; }
.sheet {
  position: fixed; z-index: 201; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(560px, calc(100vw - 32px)); background: var(--white); border-radius: 14px;
  box-shadow: var(--shadow); padding: 28px 30px; max-height: 80vh; overflow-y: auto;
}

const narrative = [
  { id: "N1", n: "1", heading: "Overview", sub: "R1", blocks: [
    { id: "N1.1", text: "Vandersteen Industrial Systems B.V. designs, manufactures and installs conveyor and material-handling systems for the food processing industry, and provides maintenance services on the installed base. Revenue comprises two streams: machines and spare parts of approximately EUR 41.2 million, and service and maintenance contracts of approximately EUR 7.4 million. [[T:seg-02|Q:1]]" },
    { id: "N1.2", text: "The entity reports under EU-IFRS. Machine revenue is recognised at a point in time on customer acceptance; service revenue is recognised over time on a straight-line basis across the contract term. [[T:seg-25|T:seg-23]]" },
    { id: "N1.3", text: "The most significant change in the process during the period is the outsourcing of warehousing and despatch to Van Dijk Logistics in March 2026. In the prior year these activities were performed in-house at the Eindhoven site. [[T:seg-19|D:doc-py-7]]" },
  ]},

  { id: "N2", n: "2", heading: "Systems involved", sub: "R10", blocks: [
    { id: "N2.1", text: "Microsoft Dynamics 365 Business Central is the system of record for quotations, sales orders, shipments, invoices and the general ledger. ServiceTrack holds service contracts and field service records and generates the deferred revenue schedule. Van Dijk Logistics operates its own warehouse management system. [[T:seg-03|T:seg-23]]" },
    { id: "N2.2", text: "Two interfaces carry revenue data. Van Dijk Logistics transmits a despatch confirmation file each evening which posts shipments in Business Central. ServiceTrack posts the service billing and deferral schedule into Business Central nightly. IT is alerted if either interface fails to load. [[T:seg-19|T:seg-24]]" },
  ]},

  { id: "N3", n: "3", heading: "Roles and responsibilities", sub: "R1", blocks: [
    { id: "N3.1", text: "Sales engineers prepare quotations and enter machine orders. The Commercial Director approves quotations above EUR 100,000 and releases orders blocked for discounts above twelve per cent. [[Q:2|Q:3|T:seg-12]]" },
    { id: "N3.2", text: "Sales administration creates and maintains customer master data and the customer price lists, converts signed quotations into sales orders, and raises credit notes. [[T:seg-05|Q:8|T:seg-26]]" },
    { id: "N3.3", text: "Credit control sets credit limits and releases orders blocked for credit. The financial controller performs the month-end reconciliations, the cut-off review and the rebate accrual, and approves manual invoices. The CFO approves write-offs above EUR 10,000. [[T:seg-15|T:seg-18|T:seg-31]]" },
  ]},

  { id: "N4", n: "4", heading: "Order initiation and capture", sub: "R2", blocks: [
    { id: "N4.1", text: "Machine sales begin with a quotation prepared in the Business Central configurator by a sales engineer. The customer signs the quotation and sales administration converts it into a sales order. Spare part orders arrive by e-mail to the sales desk and through the webshop. Service work is initiated in ServiceTrack. [[T:seg-03]]" },
    { id: "N4.2", text: "There is no reconciliation between the sales mailbox and the orders recorded in Business Central. The company would become aware of an unrecorded spare part order when the customer followed up on the delivery. [[T:seg-04]]" },
  ]},

  { id: "N5", n: "5", heading: "Pricing and discounts", sub: "R2", blocks: [
    { id: "N5.1", text: "The price on a machine order is taken from the signed quotation. Spare part prices are derived by the system from the customer price list, of which each trade customer has an agreed version, with a standard list applied to all other customers. [[T:seg-08]]" },
    { id: "N5.2", text: "Sales staff are able to change the price on an order line. The system requires a reason code to be entered and records the user who made the change. A price override report is available in Business Central. [[T:seg-09]]" },
    { id: "N5.3", missing: true, text: "We did not establish who reviews the price override report, how often it is reviewed, or what evidence exists that exceptions are followed up. The financial controller stated that he did not believe the report was run on a routine basis. A question has been issued to the client. [[T:seg-11]]" },
    { id: "N5.4", text: "Discounts above twelve per cent block the sales order in the system until the Commercial Director releases it. This block has been configured since the Business Central implementation. [[T:seg-12|Q:3]]" },
  ]},

  { id: "N6", n: "6", heading: "Credit management", sub: "R3", blocks: [
    { id: "N6.1", text: "Credit limits are assessed at onboarding on the basis of a Graydon credit report and, for existing customers, the payment history on the account. [[T:seg-15]]" },
    { id: "N6.2", conflict: true,
      options: [
        { choice: "controller", label: "Credit control is correct",
          detail: "Two corroborating sources against one. The Commercial Director's answer is recorded as inconsistent and followed up.",
          text: "Credit limits are set and changed only by credit control, with the agreement of the CFO above EUR 250,000. [[T:seg-17|D:note-1]]" },
        { choice: "both", label: "Both are true — record the second route",
          detail: "The Commercial Director has an override the financial controller was unaware of. This weakens control C-02 and is itself a finding.",
          text: "Credit limits are set by credit control, with CFO agreement above EUR 250,000. The Commercial Director is additionally able to raise a limit by up to EUR 50,000 where an order is blocked, which the financial controller was not aware of. [[T:seg-17|Q:6]]" },
        { choice: "unresolved", label: "Leave it open and document the difference",
          detail: "Records the contradiction as an audit finding. The open item stays live and sign-off stays blocked.",
          text: "The authority to change a customer credit limit could not be established. Two sources give different answers and the difference has been raised with the entity. [[conflict:T:seg-17|Q:6]]" },
      ], text: "Authority to change a customer credit limit could not be established. The financial controller stated that only credit control may change a limit, with CFO agreement above EUR 250,000, and credit control confirmed that position. The Commercial Director stated in the questionnaire that he is able to raise a limit by up to EUR 50,000 himself where an order is blocked and he knows the customer. [[conflict:T:seg-17|Q:6|D:note-1]]" },
    { id: "N6.3", text: "An order that breaches the customer's credit limit is blocked by the system and can be released only by credit control. Releases are recorded in a log within Business Central. [[T:seg-18|D:note-1]]" },
  ]},

  { id: "N7", n: "7", heading: "Delivery and performance", sub: "R4", blocks: [
    { id: "N7.1", text: "Since March 2026 warehousing, picking, packing and despatch have been performed by Van Dijk Logistics at its Tilburg distribution centre. A despatch confirmation file is transmitted each evening and posts the corresponding shipments in Business Central. [[T:seg-19|D:doc-so-4]]" },
    { id: "N7.2", text: "Machine sales additionally require installation at the customer site and signature of an acceptance protocol by the customer. For a single conveyor this typically occurs in the same week as delivery; for a complete line it may occur up to six weeks after delivery. [[T:seg-25]]" },
    { id: "N7.3", text: "If the despatch file fails to load an error is raised and IT investigates. The financial controller stated that a file which loads successfully but contains fewer records than were despatched would not be detected. The ISAE 3402 report for Van Dijk Logistics identifies reconciliation of the despatch confirmation to the user entity's own records as a complementary user entity control. [[T:seg-21|D:doc-so-11]]" },
  ]},

  { id: "N8", n: "8", heading: "Invoicing", sub: "R5", blocks: [
    { id: "N8.1", text: "Invoices are generated automatically by Business Central in an overnight batch from posted shipments. The invoiced quantity is taken from the shipment record and the price from the sales order. No manual re-entry occurs in the standard flow. [[T:seg-13|D:doc-py-3]]" },
    { id: "N8.2", text: "Invoice numbering follows the Business Central number series and one invoice is generated per posted shipment. [[T:seg-13|D:doc-py-3]]" },
    { id: "N8.3", text: "Invoices may also be raised manually by finance, for settlements and for milestone billing on large projects. A manual invoice requires the approval of the financial controller before it is issued. [[T:seg-14]]" },
    { id: "N8.4", text: "Service contracts are invoiced quarterly in advance from ServiceTrack. [[T:seg-23]]" },
  ]},

  { id: "N9", n: "9", heading: "Revenue recognition", sub: "R6", blocks: [
    { id: "N9.1", text: "Machine revenue is recognised when the equipment has been installed and the customer has signed the acceptance protocol. Service revenue is recognised on a straight-line basis over the term of the maintenance contract. [[T:seg-25|T:seg-23|D:doc-py-3]]" },
    { id: "N9.2", text: "Service contracts are billed quarterly in advance. ServiceTrack maintains the deferral schedule and posts the monthly release of deferred revenue into Business Central. The financial controller reconciles the service revenue account at month end. [[T:seg-23|T:seg-24]]" },
    { id: "N9.3", text: "Volume rebate arrangements are in place with three OEM customers. The rebate accrual is calculated by the financial controller at month end from the contract terms and the year-to-date volume. The entity acts as principal in all revenue streams and there are no agency or bill-and-hold arrangements. [[T:seg-27|Q:12]]" },
  ]},

  { id: "N10", n: "10", heading: "Credit notes, returns and rebates", sub: "R7", blocks: [
    { id: "N10.1", text: "Credit notes are raised by sales administration and approved by the sales manager. A credit note must reference the original invoice. [[T:seg-26|D:doc-py-5]]" },
    { id: "N10.2", unsupported: true,
      suggestion: "Credit notes are raised by sales administration and approved by the sales manager. No value threshold requiring finance approval was identified. [[T:seg-26|D:doc-py-5]]",
      askedText: "We asked whether a value threshold applies above which finance must approve a credit note. No threshold has been established. [[T:seg-26]]", text: "Credit notes above EUR 5,000 additionally require the approval of the financial controller. [[none]]",
      why: "The model generalised from the pattern of value thresholds elsewhere in the process (CFO approval of write-offs above EUR 10,000, Commercial Director approval of quotations above EUR 100,000) and from the Commercial Director's statement that he would \"expect finance to look at\" larger credit notes. No source states a EUR 5,000 threshold." },
    { id: "N10.3", text: "Machines are not returnable under the standard sales conditions. Spare parts may be returned within thirty days, but returns are infrequent and immaterial, and no return provision is recognised. [[Q:11]]" },
    { id: "N10.4", missing: true, text: "We did not obtain evidence of any review of the volume rebate accrual. The financial controller prepares the calculation and releases it without independent review. [[T:seg-29]]" },
  ]},

  { id: "N11", n: "11", heading: "Cash receipt and receivables", sub: "R8", blocks: [
    { id: "N11.1", text: "Bank statements are loaded daily and matched automatically to open invoices on the payment reference. Items that do not match are placed on a suspense list which credit control clears. [[T:seg-30]]" },
    { id: "N11.2", unsupported: true,
      suggestion: "Receipts that do not match automatically are placed on a suspense list which credit control clears. No ageing threshold or escalation route for unapplied cash was established. [[T:seg-30]]",
      askedText: "We asked how long unapplied cash may remain on the suspense list and who is informed. No answer has been obtained. [[T:seg-30]]", text: "Unapplied cash older than sixty days is escalated to the financial controller for investigation. [[none]]",
      why: "No source states an ageing threshold or an escalation route for unapplied cash. The transcript establishes only that credit control clears the suspense list." },
    { id: "N11.3", text: "The aged receivables listing is reviewed monthly by the financial controller together with the CFO. Write-offs above EUR 10,000 require CFO approval. [[T:seg-30|T:seg-31]]" },
  ]},

  { id: "N12", n: "12", heading: "Cut-off", sub: "R9", blocks: [
    { id: "N12.1", text: "At each month end the financial controller compares shipment dates and invoice dates for transactions falling either side of the reporting date. The ledger closes on working day four, after which only the financial controller is able to post. [[T:seg-32]]" },
    { id: "N12.2", missing: true, text: "The cut-off review is not documented and is performed by one individual without independent review. We did not obtain a written cut-off procedure or evidence that the review was performed for any specific period. [[T:seg-34|D:note-2]]" },

  // Recomputed from the facts, so a resolution moves the item without a second action.
  if (facts.every(factSettled)) return "covered";
  if (facts.some(factSettled) || forced === "partial") return "partial";

}

/* --- Line walkthrough, per variant --------------------------------------------
   A walkthrough is required per applicable variant, not once for the process.
   Every verdict is keyed by transaction, so selecting a transaction genuinely

/** The methodology pack *proposes*; nothing is required until the auditor says

const lwRequirement = (vid) => S.lwRequirements[vid] ?? { state: "not_decided", reason: null };

const traceVerdict = (txnId, t) => S.traceDecisions[`${txnId}::${t.id}`] ?? null;
const traceConcluded = (txnId) => !!S.traceConcluded[txnId];

const txnForVariant = (vid) =>
  transactions.find((t) => t.variant === vid && (S.traceStarted[t.id] || S.traceConcluded[t.id] || S.traceTxn === t.id));

function traceProgress(txnId) {
  const txn = txnById(txnId);
  if (!txn) return null;
  const done = txn.steps.filter((t) => traceVerdict(txnId, t));
  return {
    txn,
    expected: txn.steps.length,
    done: done.length,
    corroborated: txn.steps.filter((t) => traceVerdict(txnId, t) === "corroborated").length,
    exceptions: txn.steps.filter((t) => traceVerdict(txnId, t) === "exception").length,
    pending: txn.steps.filter((t) => !traceVerdict(txnId, t)),
    concluded: traceConcluded(txnId),
  };
}

/** Requirement and status for every variant — what the completion gate reads. */
function variantWalkthroughs() {
  return variants.map((v) => {
    const req = lwRequirement(v.id);
    const txn = txnForVariant(v.id);
    const prog = txn ? traceProgress(txn.id) : null;
    const state = req.state === "not_required" ? "not_required"
      : req.state === "not_decided" ? "not_decided"
      : prog?.concluded ? "completed"
      : prog ? "in_progress" : "not_started";
    return { variant: v, requirement: req, txn, progress: prog, state,
             satisfied: state === "not_required" || state === "completed" };
  });
}

  const vws = variantWalkthroughs();
  const required = vws.filter((v) => v.requirement.state === "required");
  return {
    variants: vws,
    required: required.length,
    completed: required.filter((v) => v.state === "completed").length,
    satisfied: vws.every((v) => v.satisfied),
    undecided: vws.filter((v) => v.requirement.state === "not_decided").length,
    exceptions: vws.reduce((n, v) => n + (v.progress?.exceptions || 0), 0),
    active: S.traceTxn ? traceProgress(S.traceTxn) : null,
  };

const traceStepFor = (txnId, mapStepId) =>
  (txnById(txnId)?.steps || []).find((t) => t.step === mapStepId) || null;

   -------------------------------------------------------------------------- */

const testScopeFor = (cid) => S.testScope[cid] ?? { state: "deferred", reason: null };

/** Test state for one control. Never global — concluding C-04 says nothing
 *  about any other control that was scoped for testing. */
const controlTest = (cid) =>

/** Only this control carries a worked example in the prototype. */

function testingScope() {
  const keys = controlSummary().keyControls;
  const rows = keys.map((c) => ({ control: c, scope: testScopeFor(c.id), test: controlTest(c.id) }));
  const required = rows.filter((r) => r.scope.state === "required");
  const deferred = rows.filter((r) => r.scope.state === "deferred");
  const concluded = required.filter((r) => !!r.test.conclusion);
  return {
    rows, keys,
    required, deferred, concluded,
    outstanding: required.filter((r) => !r.test.conclusion),
    notRequired: rows.filter((r) => r.scope.state === "not_required"),
    decided: rows.length - deferred.length,
    // Nothing to test is a legitimate outcome, provided it was decided.
    applicable: required.length > 0,
    scopeDecided: keys.length > 0 && deferred.length === 0,
  };
}

/** The worked test, for the one control that has a workpaper. */
function testSummary(cid = controlTestPack.controlId) {
  const t = controlTest(cid);
  if (!hasWorkpaper(cid)) {
    return { control: cid, workpaper: false, results: [], selected: 0, corroborated: 0,
             exceptions: 0, extended: false, concluded: !!t.conclusion, conclusion: t.conclusion };
  }
  const base = controlTestPack.results;
  const ext = t.extended ? controlTestPack.extendedResults : [];
  const all = [...base, ...ext];
  return {
    control: cid, workpaper: true,
    results: all,
    selected: all.length,
    corroborated: all.filter((x) => x.ok).length,
    exceptions: all.filter((x) => !x.ok).length,
    extended: t.extended,
    // Extending is not concluding.
    concluded: !!t.conclusion,
    conclusion: t.conclusion,
  };
}

/** Step 6 is satisfied when every key control has been scoped, and every
 *  control scoped as requiring a test has its *own* conclusion. */
function testingSatisfied() {
  const sc = testingScope();
  if (!sc.keys.length) return true;             // nothing concluded key yet
  if (!sc.scopeDecided) return false;
  return sc.outstanding.length === 0;
}

  return gateStates().filter((g) => !g.signature && g.applicable).every((g) => g.ok);
}

function processState() {
  const so = S.signOff;
  if (so.review === "approved") return { id: "complete", label: "Complete" };
  if (so.review === "in_review") return { id: "in_review", label: "In review" };
  if (so.review === "reopened") return { id: "reopened", label: "Review points open" };
  if (so.review === "submitted") return { id: "submitted", label: "Submitted for review" };
  if (so.preparer === "signed") return { id: "signed", label: "Ready for review" };
  if (workComplete()) return { id: "ready", label: "Ready to sign" };
  return { id: "wip", label: "Work in progress" };
}

/* --- Open items --------------------------------------------------------------- */

const itemState = (i) => S.itemStates[i.id] ?? i.state;
const allOpenItems = () => [...openItems, ...questionnaireItems()];

function openItemSummary() {
  const all = allOpenItems();
  const live = all.filter((i) => !["resolved", "carried_forward", "dismissed"].includes(itemState(i)));
  return {
    total: all.length, all, open: live.length, live,
    questions: live.filter((i) => i.kind === "question").length,
    evidence: live.filter((i) => i.kind === "evidence").length,
    contradictions: live.filter((i) => i.kind === "contradiction").length,
    sent: live.filter((i) => itemState(i) === "sent").length,
    blocking: live.filter((i) => i.blocks && i.blocks.length),
    carried: all.filter((i) => itemState(i) === "carried_forward"),
    resolved: all.length - live.length,
  };
}

/* --- RCM ---------------------------------------------------------------------- */

function rcmRows() {
  if (!S.analysed) return [];
  const rows = [];
  risks.forEach((r) => {
    const linked = controls.filter((c) => c.risks.includes(r.id));
    if (!linked.length) rows.push({ risk: r, control: null, gap: gaps.find((g) => g.risk === r.id) || null });
    else linked.forEach((c) => rows.push({ risk: r, control: c, gap: null }));
  });
  return rows;
}

/* --- Questionnaire answers feed the same fact model -------------------------
   A questionnaire answer is another evidence source into coverage, not a
   separate mini-application. Deterministic, but structurally connected.
   -------------------------------------------------------------------------- */

const QUESTION_FACTS = {
  13: { item: "R5.3", fact: "override_report_reviewer", openItem: "OI-02",
        value: "Nobody reviews it routinely — confirmed by the Commercial Director." },
  14: { item: "R9.3", fact: "consignment_treatment", openItem: "OI-03",
        value: "Recognised on sale to the end customer, not on despatch to the distributor." },
};

/** Facts established during this session, with the evidence behind each — the
 *  answer to "where did that come from?" for anything settled after the draft. */
function sessionFacts() {
  return Object.entries(S.factOverrides)
    .filter(([, v]) => v.refs && v.refs.length)
    .map(([key, v]) => {
      const [itemId, factKey] = key.split("::");
      const item = allItems().find((i) => i.id === itemId);
      return { itemId, factKey, item, ...v };
    });
}

const questionState = (q) => S.answers[q.n]?.kind
  ?? (q.a ? "answer" : q.state === "sent" ? "sent" : "open");
const questionAnswer = (q) => S.answers[q.n]?.text ?? q.a ?? null;

/** Open items the questionnaire raised, alongside the methodology ones. */
function questionnaireItems() {
  return Object.entries(S.answers)
    .filter(([, a]) => a.kind !== "answer")
    .map(([n, a]) => ({
      id: `QQ-${n}`, kind: "question", coverage: "—", priority: "medium",
      state: "open", origin: "client_response",
      title: a.kind === "unknown"
        ? `The client could not answer question ${n}`
        : `The client asked for a call about question ${n}`,
      detail: a.kind === "unknown"
        ? "Recorded as unable to answer. The underlying fact is still unresolved and needs another route."
        : "The client would rather discuss this than answer in writing. Schedule the follow-up.",
      blocks: [], refs: [], owner: "Unassigned", fromQuestionnaire: true,
    }));
}

/** Evidence that settled an open item, when a questionnaire answer did it. */
function itemEvidence(i) {
  const entry = Object.entries(QUESTION_FACTS).find(([, m]) => m.openItem === i.id);
  if (!entry) return [];
  const a = S.answers[Number(entry[0])];
  return a && a.kind === "answer" && a.evidenceId ? [a.evidenceId] : [];
}

/* --- Open items: carry-forward carries a destination and a reason ------------ */

const itemCarry = (i) => S.itemCarry[i.id] ?? null;

/* --- The process journey -------------------------------------------------------
   Seven ordered steps, each carrying its own state.
   -------------------------------------------------------------------------- */

function journeyStates() {
  const cov = coverageSummary();
  const n = narrativeSummary();
  const cs = controlSummary();
  const fs = findingSummary();
  const tr = traceSummary();
  const sc = testingScope();
  const ps = processState();

  const st = (id) => {
    switch (id) {
      case "prepare":
        return S.prepared ? { s: "done", c: "confirmed" } : { s: "open", c: "start here" };
      case "interview":
        return interviewComplete() ? { s: "done", c: `${cov.pct}%` }
          : cov.facts.contradictory ? { s: "open", c: "contradiction", tone: "alert" }
          : cov.mandatoryOpen.length ? { s: "open", c: `${cov.pct}%`, tone: "warn" }
          : { s: "open", c: `${cov.pct}%` };
      case "understanding":
        return !S.generated ? { s: "later", c: "not drafted", why: "Draft the current understanding once the interview has established enough to draft from." }
          : n.attention.length ? { s: "open", c: `${n.attention.length} need you`, tone: "warn" }
          : n.pending ? { s: "open", c: `${n.pending} to approve` }
          : { s: "done", c: "approved" };
      case "controls": {
        const owed = cs.pending + fs.pending.length;
        return !S.generated ? { s: "later", c: "—", why: "Controls are analysed from the process understanding, so the process has to be documented first." }
          : n.pending ? { s: "later", c: "—", why: "The analysis runs against the reviewed understanding. Finish reviewing the draft first." }
          : !S.analysed ? { s: "open", c: "not analysed" }
          : fs.fromTraceOpen.length ? { s: "open", c: "new finding", tone: "alert" }
          : owed ? { s: "open", c: `${owed} to conclude` }
          : { s: "done", c: `${cs.agreedKey} key` };
      }
      case "trace":
        return !S.analysed ? { s: "later", c: "—", why: "A transaction is traced against the documented process and the controls identified on it, so step 4 has to run first." }
          : tr.undecided ? { s: "open", c: "scope undecided" }
          : tr.satisfied ? { s: "done", c: tr.exceptions ? `${tr.exceptions} exception` : "no exceptions", tone: tr.exceptions ? "warn" : "" }
          : { s: "open", c: `${tr.completed} of ${tr.required}` };
      case "testing":
        if (!cs.keyControls.length) return { s: "later", c: "—", why: "Controls concluded as key appear here." };
        if (!sc.scopeDecided) return { s: "open", c: "decide scope" };
        if (!sc.applicable) return { s: "done", c: "not required" };
        return sc.outstanding.length === 0 ? { s: "done", c: `${sc.concluded.length} concluded` }
          : { s: "open", c: `${sc.outstanding.length} to conclude` };
      case "complete":
        return ps.id === "complete" ? { s: "done", c: "complete", tone: "ok" }
          : ps.id === "reopened" ? { s: "open", c: "review points", tone: "alert" }
          : ps.id === "wip" ? { s: "later", c: "blocked", why: "Every applicable gate has to be met first." }
          : { s: "open", c: ps.label.toLowerCase(), tone: "ok" };
    }
    return { s: "later", c: "" };
  };

  return journey.map((j) => ({ ...j, ...st(j.id) }));
}

const journeyStep = (id) => journeyStates().find((j) => j.id === id);

/** The process interview is complete when nothing required is left unresolved. */
function interviewComplete() {
  const cov = coverageSummary();
  return S.prepared && cov.mandatoryOpen.length === 0 && cov.facts.contradictory === 0;
}

function processProgress() {
  const js = journeyStates();
  return {
    done: js.filter((j) => j.s === "done").length,
    total: js.length,
    current: js.find((j) => j.s === "open") || js[js.length - 1],
  };
}

/* --- Completion gates ----------------------------------------------------------
   Every gate declares whether it applies, so nothing blocks on work this
   process does not need. No risk-analysis gate: interim ends before it.
   -------------------------------------------------------------------------- */

function gateStates() {
  const n = narrativeSummary(), cs = controlSummary(), fs = findingSummary();
  const oi = openItemSummary(), cov = coverageSummary(), tr = traceSummary();
  const sc = testingScope(), so = S.signOff;
  const carried = openItems.filter((i) => itemState(i) === "carried_forward").length;

  const g = [
    { id: "prepared", label: "Preparation confirmed", step: "prepare", applicable: true,
      ok: S.prepared, detail: S.prepared ? "Scope, participants and carried context confirmed" : "Not yet confirmed" },

    { id: "interview", label: "Process interview sufficiently complete", step: "interview", applicable: true,
      ok: interviewComplete(),
      detail: !S.prepared ? "Preparation not confirmed"
        : cov.facts.contradictory ? `${cov.facts.contradictory} facts are still contradictory`
        : cov.mandatoryOpen.length ? `${cov.mandatoryOpen.length} required areas still open`
        : `${cov.covered} of ${cov.applicable} areas established` },

    { id: "mandatory", label: "Required methodology areas addressed or documented", step: "interview", applicable: true,
      ok: cov.mandatoryOpen.length === 0,
      detail: cov.mandatoryOpen.length ? `${cov.mandatoryOpen.map((i) => i.id).join(", ")} open without a documented reason` : "All required areas addressed" },

    { id: "understanding", label: "Process understanding reviewed", step: "understanding", applicable: true,
      ok: S.generated && n.pending === 0,
      detail: !S.generated ? "Nothing drafted yet" : `${n.approved} approved · ${n.rejected} rejected · ${n.pending} to decide` },

    { id: "needsSource", label: "No unsupported statements", step: "understanding", applicable: true,
      ok: S.generated && n.needsSource.length === 0,
      detail: n.needsSource.length ? `${n.needsSource.length} statements have no support` : "Every statement is traced to a source" },

    /* Carrying a contradiction forward preserves it — it does not resolve it,
       and it does not clear this gate. The label has to say that. */
    { id: "contradiction", label: "No unresolved contradictions", step: "interview", applicable: true,
      ok: n.contradiction.length === 0 && cov.facts.contradictory === 0,
      detail: cov.facts.contradictory || n.contradiction.length
        ? (openItems.some((i) => itemState(i) === "carried_forward" && i.kind === "contradiction")
            ? "Carried forward, which preserves the conflict — it does not resolve it"
            : "One contradiction is unresolved")
        : "Every contradiction is resolved on the evidence" },

    { id: "analysed", label: "Controls and findings analysed", step: "controls", applicable: true,
      ok: S.analysed,
      detail: S.analysed ? `${cs.total} controls and ${fs.total} findings identified from the reviewed understanding`
        : n.pending ? "The analysis runs against the reviewed understanding, which is not finished"
        : "Not analysed yet" },

    { id: "controls", label: "Controls concluded", step: "controls", applicable: true,
      ok: S.analysed && cs.pending === 0,
      detail: !S.analysed ? "Not analysed yet"
        : cs.undecided.length ? `${cs.undecided.length} left undecided — carry forward or conclude`
        : `${cs.decided} of ${cs.total} concluded · ${cs.agreedKey} key` },

    { id: "findings", label: "Findings concluded", step: "controls", applicable: true,
      ok: S.analysed && fs.pending.length === 0,
      detail: !S.analysed ? "Not analysed yet"
        : fs.fromTraceOpen.length ? "A finding raised by the line walkthrough needs review"
        : `${fs.decided} of ${fs.total} concluded` },

    { id: "trace", label: "Required line walkthroughs completed", step: "trace",
      applicable: true, ok: tr.satisfied,
      detail: tr.undecided ? `${tr.undecided} variants have no walkthrough decision`
        : tr.required === 0 ? "No line walkthrough required for this process"
        : `${tr.completed} of ${tr.required} required walkthroughs complete` },

    { id: "testing", label: "Control testing completed or documented as not required", step: "testing",
      applicable: cs.keyControls.length > 0, ok: testingSatisfied(),
      detail: !cs.keyControls.length ? "No key controls concluded yet"
        : !sc.scopeDecided ? `${sc.deferred.length} key controls have no testing decision`
        : !sc.applicable ? "No reliance planned on any key control — no testing required, reasons on file"
        : sc.outstanding.length ? `${sc.concluded.length} of ${sc.required.length} scoped tests concluded · ${
            sc.outstanding.map((r) => r.control.id).join(", ")} outstanding`
        : `${sc.concluded.length} of ${sc.required.length} scoped tests concluded` },

    { id: "openItems", label: "Open matters resolved or carried forward", step: "interview", applicable: true,
      ok: oi.open === 0, detail: `${oi.open} open · ${oi.resolved} settled · ${carried} carried forward` },

    { id: "signed", label: "Preparer signed", step: "complete", applicable: true, signature: true,
      ok: so.preparer === "signed",
      detail: so.preparer === "signed" ? `Signed by the preparer` : "Not yet signed" },

    { id: "review", label: "Manager review approved", step: "complete",
      applicable: methodologyConfig.requiresManagerReview, signature: true,
      ok: so.review === "approved",
      detail: so.review === "approved" ? "Approved"
        : so.review === "reopened" ? `Reopened · ${openReviewPoints().length} review point${
            openReviewPoints().length === 1 ? "" : "s"} to answer before it can go back`
        : so.review === "in_review" ? "With the reviewer"
        : so.review === "submitted" ? "Submitted, awaiting review"
        : "Not yet submitted" },

    { id: "partner", label: "Partner review approved", step: "complete",
      applicable: methodologyConfig.requiresPartnerReview, signature: true,
      ok: false, detail: methodologyConfig.partnerReviewNote },
  ];
  return g.filter((x) => x.applicable);
}

const readyToSign = () => workComplete() && S.signOff.preparer !== "signed";

/** The most valuable unresolved next step, following the corrected order. */
function nextAction() {
  const cov = coverageSummary(), n = narrativeSummary(), cs = controlSummary();
  const fs = findingSummary(), oi = openItemSummary(), tr = traceSummary();
  const sc = testingScope(), so = S.signOff;

  if (!S.prepared) return { t: "Prepare the Revenue process", d: "Scope, systems, people and the context carried in from planning.", href: "#/prepare" };
  if (cov.facts.contradictory) return { t: "Two sources disagree about who can change a credit limit", d: "It blocks a statement, a control and a coverage area at once.", href: "#/interview" };
  if (cov.mandatoryOpen.length) return { t: `${cov.mandatoryOpen.length} required areas are still open`, d: "The process interview cannot be concluded while an ISA 240 area is unaddressed.", href: "#/interview" };
  if (!S.generated) return { t: "Draft the process understanding", d: `Coverage is ${cov.pct}% and the required areas are addressed.`, href: "#/understanding" };
  if (n.attention.length) return { t: `${n.attention.length} statements need your judgement`, d: "Unsupported or contradictory statements are blocking their sections.", href: "#/understanding" };
  if (n.pending) return { t: `${n.pending} sections to approve`, d: "Every statement in them is traced to a source. Nothing is analysed until the understanding is reviewed.", href: "#/understanding" };
  if (!S.analysed) return { t: "Analyse controls and findings", d: "The understanding is reviewed. Step 4 identifies what controls this process and what is wrong with it.", href: "#/controls" };
  if (fs.fromTraceOpen.length) return { t: "The line walkthrough raised a finding", d: "Testing a real transaction changed the documented understanding. Review it before moving on.", href: "#/controls" };
  if (cs.pending) return { t: `${cs.pending} controls to conclude`, d: cs.undecided.length ? `${cs.undecided.length} are undecided — conclude them or carry them forward with a reason.` : `${cs.suggestedKey} are suggested as key controls.`, href: "#/controls" };
  if (fs.pending.length) return { t: `${fs.pending.length} findings to conclude`, d: "Confirm, modify or dismiss each one. Severity is your judgement.", href: "#/controls" };
  if (tr.undecided) return { t: "Decide which variants need a line walkthrough", d: "Revenue has three process variants and they do not all need one.", href: "#/trace" };
  if (!tr.satisfied) return { t: `${tr.required - tr.completed} required line walkthroughs outstanding`, d: "Trace a real transaction through each variant that needs one.", href: "#/trace" };
  if (cs.keyControls.length && !sc.scopeDecided) return { t: "Decide which controls require testing", d: `${sc.deferred.length} key controls have no testing decision.`, href: "#/testing" };
  if (sc.outstanding.length) {
    const r = sc.outstanding[0];
    return { t: sc.outstanding.length === 1
        ? `Conclude the control test on ${r.control.id}`
        : `${sc.outstanding.length} control tests still to conclude`,
      d: r.test.extended ? "The sample was extended; a conclusion is still required."
        : `Each control scoped for testing needs its own conclusion — ${sc.outstanding.map((x) => x.control.id).join(", ")}.`,
      href: "#/testing" };
  }
  if (oi.open) return { t: `${oi.open} open matters`, d: "Resolve each one, or carry it forward with a destination and a reason.", href: "#/resolve" };
  if (so.preparer !== "signed") return { t: "Sign as preparer", d: "Every applicable gate is met. Signing makes Revenue ready for review.", href: "#/complete" };
  /* Reopened work comes back to the preparer, and says so. */
  if (openReviewPoints().length) {
    const n2 = openReviewPoints().length;
    return { t: `${n2} review point${n2 === 1 ? "" : "s"} need${n2 === 1 ? "s" : ""} your attention`,
      d: `The reviewer sent Revenue back. ${openReviewPoints()[0].subject}.`, href: "#/complete" };
  }
  if (methodologyConfig.requiresManagerReview && so.review === "reopened") return { t: "Resubmit for manager review", d: "Every review point has been answered.", href: "#/complete" };
  if (methodologyConfig.requiresManagerReview && so.review === "not_submitted") return { t: "Submit for manager review", d: "The preparer has signed. The process is not complete until the reviewer approves.", href: "#/complete" };
  if (methodologyConfig.requiresManagerReview && so.review !== "approved") return { t: "Awaiting manager review", d: "The reviewer approves, or reopens with review points.", href: "#/complete" };
  return { t: "Revenue is complete", d: "Handed forward to risk analysis.", href: "#/complete" };
}

/* --- Actions ----------------------------------------------------------------
   Every mutating action takes a checkpoint first, so ⌘Z always works and no
   routine action needs a confirmation dialog.
   -------------------------------------------------------------------------- */

const act = {
  go(href) { location.hash = href; },
  toast(label) { commit(label); },

  /* palette + sheets */
  openPalette() { S.palette = true; S.palQuery = ""; S.palIx = 0; commit(); },
  closePalette() { S.palette = false; commit(); },
  palQuery(q) { S.palQuery = q; S.palIx = 0; commit(); },
  palMove(d, max) { S.palIx = Math.max(0, Math.min(max - 1, S.palIx + d)); commit(); },
  sheet(k) { S.sheet = k; commit(); },

  disclose(id) { S.disclosed[id] = !S.disclosed[id]; commit(); },

  readGenResult() { S.genSeen = true; commit(); },

  /* review modes */
  reviewMode(m) { S.reviewMode = m; S.openClaim = null; commit(); },
  startFocus(kind) {
    S.focusKind = kind; S.focusIx = 0; S.reviewMode = "focus"; S.openClaim = null; commit();
  },
  /** Skip: the item stays in the queue, so move past it. */
  focusNext() {
    const len = focusLength();
    if (S.focusIx + 1 >= len) { S.reviewMode = "triage"; S.focusKind = null; }
    else S.focusIx++;
    commit();
  },

  /** After a decision the item leaves the queue, so the next one slides into
   *  the same index. Incrementing here would silently skip it. */
  afterDecision() {
    const len = focusLength();
    if (len === 0) { S.reviewMode = "triage"; S.focusKind = null; S.focusIx = 0; }
    else S.focusIx = Math.min(S.focusIx, len - 1);
  },
  focusPrev() { S.focusIx = Math.max(0, S.focusIx - 1); commit(); },
  exitFocus() { S.reviewMode = "triage"; S.focusKind = null; commit(); },

  /* reading */
  toggleClaim(id) { S.openClaim = S.openClaim === id ? null : id; S.editing = null; commit(); },
  selectSection(id) { S.section = id; S.scrollTo = id; commit(); },

  /* claim decisions */
  editClaim(id) { S.editing = id; S.openClaim = id; commit(); },
  cancelEdit() { S.editing = null; commit(); },
  saveClaim(id, text) {
    checkpoint("statement edited");
    S.blocks[id] = { ...(S.blocks[id] || {}), text, edited: true };
    S.editing = null;
    if (S.reviewMode === "focus") this.afterDecision();
    commit("Statement replaced", true);
  },
  rejectClaim(id) {
    checkpoint("statement rejected");
    S.blocks[id] = { ...(S.blocks[id] || {}), rejected: true };
    if (S.reviewMode === "focus") this.afterDecision();
    commit("Statement rejected", true);
  },
  askAbout(id) {
    checkpoint("question raised");
    S.blocks[id] = { ...(S.blocks[id] || {}), resolution: { kind: "asked" },
      text: (claimById(id)?.askedText) || claimText(claimById(id)) };
    if (S.reviewMode === "focus") this.afterDecision();
    commit("Question sent to the client", true);
  },
  /** One decision, propagated: narrative → fact/coverage → open item → gates.
   *  The two conflicting source statements stay in provenance in every case. */
  resolveConflict(id, choice, text) {
    checkpoint("contradiction resolved");
    S.blocks[id] = { ...(S.blocks[id] || {}), text, resolution: { kind: "conflict", choice } };

    const status = choice === "controller" ? "resolved_known"
      : choice === "both" ? "resolved_with_exception"
      : "contradictory";                       // left unresolved, deliberately
    const note = choice === "controller"
      ? "Credit control is the accepted process, on two corroborating sources. The Commercial Director's answer is recorded as inconsistent and followed up."
      : choice === "both"
      ? "Both routes exist. The Commercial Director can raise a limit by up to EUR 50,000, which the financial controller was unaware of."
      : "Unresolved. The difference is documented and carried forward.";

    ["limit_change_owner", "limit_change_approval"].forEach((key) => {
      S.factOverrides[`R3.1::${key}`] = { status, resolution: note,
        value: choice === "unresolved" ? undefined : note };
    });

    S.itemStates["OI-01"] = choice === "unresolved" ? "carried_forward" : "resolved";
    if (choice === "unresolved") {
      S.itemCarry["OI-01"] = { destination: "Final audit",
        reason: "The difference between the two sources could not be settled during interim and is carried forward." };
    }
    if (S.reviewMode === "focus") this.afterDecision();
    commit(choice === "unresolved"
      ? "Left unresolved and carried forward — the gate stays blocked"
      : "Contradiction resolved — coverage updated", true);
  },

  /* sections */
  approveSection(id) {
    checkpoint("section approved");
    S.sections[id] = "approved";
    commit("Section approved", true);
  },
  rejectSection(id) { checkpoint("section rejected"); S.sections[id] = "rejected"; commit("Section rejected", true); },
  reopenSection(id) { checkpoint("section reopened"); delete S.sections[id]; commit(); },
  acceptClean() {
    const ready = narrativeSummary().cleanReady;
    if (!ready.length) return;
    checkpoint(`${ready.length} sections approved`);
    ready.forEach((s) => { S.sections[s.id] = "approved"; });
    commit(`${ready.length} sections approved`, true);
  },

  /* risks and controls */
  decideFinding(id, d, fields) {
    checkpoint("finding concluded");
    // The system proposal stays on the finding; this is the auditor's conclusion.
    S.findingDecisions[id] = { decision: d, fields: fields || null };
    S.editingFinding = null;
    if (S.reviewMode === "focus" && S.focusKind === "findings") this.afterDecision();
    commit(d === "confirmed" ? `${id} confirmed` : d === "modified" ? `${id} confirmed as modified` : `${id} dismissed`, true);
  },
  editFinding(id) { S.editingFinding = id; commit(); },
  cancelFindingEdit() { S.editingFinding = null; commit(); },
  decideControl(id, d) {
    checkpoint("control concluded");
    S.controlDecisions[id] = d;
    S.editing = null;
    if (S.reviewMode === "focus" && S.focusKind === "controls") this.afterDecision();
    commit(`${id} recorded as ${d === "key" ? "a key control" : "not key"}`, true);
  },
  /** Parking is a bookmark. The control stays in the queue and still blocks the
   *  gate; only a conclusion or a carry-forward removes it. */
  parkControl(id) {
    checkpoint("control parked");
    S.controlDecisions[id] = "undecided";
    S.editing = null;
    if (S.reviewMode === "focus" && S.focusKind === "controls") this.focusNext();
    else commit(`${id} left undecided — still outstanding`, true);
  },
  clearFinding(id) { checkpoint("finding reopened"); delete S.findingDecisions[id]; S.editingFinding = null; commit(); },

  carryControl(id, reason) {
    checkpoint("control carried forward");
    S.controlDecisions[id] = "carried_forward";
    S.controlCarry[id] = reason || "Carried forward undecided.";
    S.editing = null;
    commit(`${id} carried forward undecided`, true);
  },
  clearControl(id) { checkpoint("control reopened"); delete S.controlDecisions[id]; commit(); },

  /* open items */

const { processMap, mapLegend, mapDetail } = __req('js/views/map.js');
const S = st.S;
const refsOf = (ids) => (ids || []).map(ref).filter(Boolean);

const NAT = { manual: "Manual", automated: "Automated", it_dependent_manual: "IT-dependent manual" };
const FRQ = { per_transaction: "Per transaction", daily: "Daily", weekly: "Weekly", monthly: "Monthly",
  quarterly: "Quarterly", annual: "Annual", event_driven: "Event-driven" };

const CRIT = {
  addresses_rmm: "Addresses an assessed risk at assertion level",
  precision: "Precise enough to detect a material misstatement",
  evidence_of_operation: "Evidence exists that it operated",
  owner_competence_authority: "Owner has the authority to act on exceptions",
  it_dependencies_identified: "IT dependencies and information used are identified",
  not_redundant: "Not redundant with a stronger control",
};

const SEV = {
  observation: "Observation",
  deficiency: "Deficiency",
  significant_deficiency_candidate: "Significant deficiency — candidate",
  material_weakness_candidate: "Material weakness — candidate",
};

const focusBar = (i, len, label) => `<div class="focus__bar">
  <button class="b-act b-act--plain b-act--sm" data-act="exit-focus">← Back</button>
  <span class="sp"></span><span>${esc(label)}</span><span class="idline__sep">·</span>
  <span><b style="color:var(--ink-2)">${i + 1}</b> of ${len}</span>
</div>`;

/* ── The analysis run ─────────────────────────────────────────────────────
   Step 4 is its own piece of work. It reads the understanding the auditor has
   just reviewed and proposes what controls the process and what is wrong with
   it. Step 3 deliberately did none of this.
   ------------------------------------------------------------------------- */

function fill(t) {
  return t.replace("CONTROL_COUNT", controls.length)
    .replace("FINDING_COUNT", gaps.length + 1)
    .replace("GAP_COUNT", gaps.length)
    .replace("RISK_COUNT", risks.length)
    .replace("KEY_COUNT", controls.filter((c) => c.keyProposal === true).length)
    .replace("RCM_ROWS", 15);
}

function analysisView() {
  const running = S.analysing;
  const done = S.analysed && !S.anaSeen;
  const n = st.narrativeSummary();

  const body = `
    <div class="head">
      <h1 class="t-title">${done ? "Analysis ready" : running ? "Analysing controls and findings"
        : "Analyse controls and findings"}</h1>
      <p class="t-lede" style="margin-top:10px">
        ${analysisPipeline.length} stages against the understanding you approved. This is where
        controls, gaps and risk signals are identified — none of it happened in step 3, because none
        of it should be proposed from a draft nobody has read.
      </p>
    </div>

    ${!running && !done ? `
      <div class="rows" style="margin-top:36px">
        ${row({ title: "Process understanding", side: `${n.approved} sections approved` })}
        ${row({ title: "Process steps to analyse", side: `${processSteps.length} across 3 variants` })}
        ${row({ title: "Control library", side: "33 entries · revenue v0.1.0" })}
        ${row({ title: "Risk library", side: "30 entries · revenue v0.1.0" })}
      </div>
      <div style="margin-top:30px">
        ${btn("Start the analysis", "run-analysis", { variant: "go", size: "lg", key: "Enter" })}
      </div>
      <p class="t-meta" style="margin-top:14px;max-width:64ch">
        Everything it produces is a proposal. Nothing is concluded until you conclude it, one item
        at a time.</p>` : `
      <div style="margin-top:36px" class="rows">
        ${analysisPipeline.map((p, i) => {
          const fin = i < S.anaStage, now = i === S.anaStage && running;
          return `<div class="rw" style="opacity:${fin || now ? 1 : .35};transition:opacity .3s">
            <span class="rw__lead" style="padding-top:4px;width:18px">
              ${fin ? `<span style="color:var(--ok)">✓</span>`
                : now ? `<span class="dot dot--open"></span>` : `<span class="t-meta">${i + 1}</span>`}</span>
            <span class="rw__main">
              <span class="rw__t">${esc(p.name)}</span>
              <span class="rw__d">${esc(p.desc)}</span>
              ${fin ? `<span class="rw__d" style="color:var(--ink-2);margin-top:5px">${esc(fill(p.out))}</span>` : ""}
            </span>
            <span class="rw__side mono" style="font-size:11.5px">${esc(p.model)}</span>
          </div>`;
        }).join("")}
      </div>
      ${done ? `
        <div style="margin-top:32px">
          ${callout(`<b>${controls.length} controls and ${gaps.length + 1} findings proposed.</b>
            Every one cites the part of the understanding it came from, and every one is a proposal
            until you conclude it. ${controls.filter((c) => c.keyProposal === null).length} controls
            could not be assessed against the key-control criteria at all — those are questions, not
            low-confidence answers.`)}
          <div class="acts" style="margin-top:22px">
            ${btn("Review the proposals", "read-analysis", { variant: "go", size: "lg", key: "Enter" })}
          </div>
        </div>` : ""}`}
  `;
  return screen("controls", body);
}

/* ── Triage ──────────────────────────────────────────────────────────────── */

      ${processMap("annotated", { selected: S.mapStep })}
      ${S.mapStep ? mapDetail(S.mapStep) : `<p class="t-meta" style="margin-top:12px">
        Click a step to see what controls it and what is wrong with it.</p>`}
    </section>

    ${fs.fromTraceOpen.length ? `
      <section class="triage__group" style="margin-top:36px">
        <div class="callout callout--alert">
          <b>The line walkthrough changed the process understanding.</b>
          Tracing a real transaction raised ${fs.fromTraceOpen.length === 1 ? "a finding" : `${fs.fromTraceOpen.length} findings`}

          not been concluded yet.
          <div class="acts" style="margin-top:12px">
            ${btn("Review it now", "start-focus", { variant: "go", data: { kind: "findings" } })}
          </div>
        </div>

    ${cs.pending ? `
      <section class="triage__group" style="margin-top:36px">

        <p class="t-sub" style="margin-bottom:18px">
          ${cs.suggestedKey} suggested as key · ${cs.unassessable} where the criteria could not be
          established${undecided.length ? ` · <b>${undecided.length} left undecided</b>` : ""}
        </p>
        ${undecided.length ? `<div class="callout" style="margin-bottom:18px">
          <b>Undecided is not a conclusion.</b> ${undecided.length === 1 ? "One control is" : `${undecided.length} controls are`}

        <div class="triage__n">Controls concluded</div>

          cs.carriedForward ? ` · ${cs.carriedForward} carried forward undecided, with a reason` : ""}.</p>
        ${cs.carriedForward ? `<div class="rows" style="margin-top:14px">

            lead: dot(f.severity === "observation" ? "warn" : "alert"),
            title: esc(f.title),

/* ── Control focus ───────────────────────────────────────────────────────── */

        <div class="q__fact"><dt>Evidence it operated</dt><dd>${c.evidenceOfOperation ? esc(c.evidenceOfOperation)
          : `<span style="color:var(--warn)">Not established</span>`}</dd></div>
        ${c.ipe ? `<div class="q__fact"><dt>Information used</dt><dd>${esc(c.ipe)}${
          c.ipeNote ? `<div class="t-meta" style="margin-top:3px">${esc(c.ipeNote)}</div>` : ""}</dd></div>` : ""}
      </dl>

      ${more("csrc", `Supported by ${refs.length} sources`, evidence(refs), S.disclosed.csrc)}

      ${c.blocked ? `<div class="q__flag q__flag--alert"><b>Blocked.</b> ${esc(c.blocked)}</div>` : ""}
      ${!c.blocked && unmet.length ? `<div class="q__flag">
        <b>${unmet.length === 1 ? "One criterion is not met" : `${unmet.length} criteria are not met`}.</b>
        ${unmet.map(([k]) => esc(CRIT[k].toLowerCase())).join("; ")}.
        ${c.followUp ? " " + esc(c.followUp) : ""}</div>` : ""}
      ${parked && !carrying ? `<div class="q__flag">
        <b>Left undecided.</b> That is a bookmark, not a conclusion — this control is still counted
        as outstanding and still blocks the completion gate.</div>` : ""}

      ${more("crit", "Show the six criteria", `<div class="meth">
        ${Object.entries(c.criteria).map(([k, v]) => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)">
          <span style="flex:1;color:var(--ink-2)">${esc(CRIT[k])}</span>
          ${v === "met" ? state("approved", "Met") : v === "not_met" ? state("rejected", "Not met") : state("needs_source", "Unknown")}
        </div>`).join("")}
        <p class="t-meta" style="margin-top:12px">A criterion that cannot be established produces a
        follow-up question, never a lower-confidence conclusion.</p>
      </div>`, S.disclosed.crit)}

      <div class="q__sug">
        <span class="l">Proposed by the platform</span>
        <span class="v">${c.keyProposal === true ? "Key control"
          : c.keyProposal === false ? "Not a key control" : "Cannot be assessed"}</span>
      </div>

      ${carrying ? `
        <div class="q__block" style="margin-top:18px">
          <h4>Carry forward undecided — why</h4>
          <p class="t-meta" style="margin-bottom:10px">This reason goes on the file and is shown to
          the reviewer. It is what makes moving on without a conclusion defensible.</p>

/* ── Finding focus ───────────────────────────────────────────────────────── */

function controlsStep() {

      ${empty("The process is not documented yet",
        "Controls are analysed from the process understanding, so step 3 has to run first.")}

  return triage();
}
