notes: |
  The point of this case is that almost nothing here is a control in the audit sense: the
  owner "looking through" invoices leaves no evidence, the tray check is unrecorded, and one
  person performs every step. A weak engine will list these as controls. A strong one will
  classify them as controls without evidence of operation, or as gaps, and will raise
  segregation of duties and management override as the dominant risks.
  Deliberate omissions: nothing about invoice sequence, nothing about how the consignment
  stock is valued, and no cut-off procedure at all.
