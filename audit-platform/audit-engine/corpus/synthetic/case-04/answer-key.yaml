notes: |
  The dominant point is that controls differ before and after 1 July, so any control tested
  in one half says nothing about the other. A strong engine states that explicitly rather than
  describing a single control environment. The three configuration defects at cutover
  (open price field, soft credit block, unreconciled feed) are each a separate risk with a
  dated period of exposure. Deliberate omissions: nothing about contract terms, nothing about
  cash application, and no answer on whether the second consultant account was closed.
