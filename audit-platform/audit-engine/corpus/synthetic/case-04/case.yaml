clientProfile: |
  Distributor of medical consumables. Single Dutch entity, IFRS reporting. Revenue
  approximately EUR 55m. Migrated from a legacy system (Navision 2013) to SAP Business
  ByDesign on 1 July, mid financial year. Order entry, delivery, invoicing and the general
  ledger all moved. The finance team is unchanged.
