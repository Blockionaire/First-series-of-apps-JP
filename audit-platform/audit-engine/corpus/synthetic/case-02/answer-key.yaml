notes: |
  The estimate-to-complete conversation is the heart of this case: the person who sets the
  estimate is bonused on the margin the estimate drives, and nobody reviews it. A weak engine
  will report generic over-time revenue risk; a strong one will name that specific driver.
  Deliberate omissions: nothing is said about credit control, cash application, cut-off
  procedures at period end, or the completeness of the Timewax to AFAS feed.
