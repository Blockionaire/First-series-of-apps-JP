notes: |
  The defining feature is that the entity never touches most of its own revenue process: the
  invoice, the collection, the deferral and the reporting all happen at two service
  organisations. The strongest single observation available is that the management review and
  the figure it checks share one source, so it provides no independent assurance over
  completeness. A weak engine will describe the reconciliation as a completeness control; it
  is a cash control and does not address unrecorded subscriptions.
  Deliberate omissions: nothing about how a customer is accepted, nothing about credit, and
  no statement of when the performance obligation is satisfied for a monthly plan.
