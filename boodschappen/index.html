    if(lr) lr.onclick = async () => {
      if(!confirm("De pincode van " + lid.naam + " wissen?\n\n" + lid.naam.split(" ")[0] +
                  " kiest bij de volgende keer inloggen zelf een nieuwe code.")) return;
      await DB.zet(PAD.leden + "/" + lid.id, {pinHash:null});
      sluitSheet(); toast("Pincode gewist");
    };
  }});
}

/* ---------- thema ---------- */
function sheetThema(){
  const huidig = LS.get("boodschappen_thema", "auto");
  const opties = [
    {id:"auto", naam:"Automatisch", uitleg:"volgt de instelling van je telefoon", em:"🌗"},
    {id:"licht", naam:"Licht", uitleg:"warm beige, altijd licht", em:"☀️"},
    {id:"donker", naam:"Donker", uitleg:"rustig donker, fijn 's avonds", em:"🌙"}
  ];
  const body = `<div class="lijst">
    ${opties.map(o => `
      <button class="rij" data-themakeuze="${o.id}">
        <span class="ik" style="font-size:17px">${o.em}</span>
        <div class="tk"><b>${o.naam}</b><span>${o.uitleg}</span></div>
        ${huidig === o.id ? `<span class="na" style="color:var(--accent)">${IK.vink}</span>` : ""}
      </button>`).join("")}
  </div>`;
  sheet({titel:"Thema", body, naTeken:() => {
    $$("[data-themakeuze]").forEach(b => b.onclick = () => {
      zetThema(b.dataset.themakeuze); tril(); sluitSheet(); tekenNu();
    });
  }});
}

/* ---------- over ---------- */
function sheetOver(){
  const body = `
    <div style="text-align:center; margin-bottom:20px">
      <div class="logo" style="width:64px;height:64px;border-radius:20px;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px">
        <span style="width:32px;height:32px;color:var(--accent-ink)">${IK.winkel}</span></div>
      <div style="font-size:19px; font-weight:700; letter-spacing:-.02em">${esc(CFG.huisNaam)} · Boodschappen</div>
      <div style="color:var(--muted); font-size:13.5px; margin-top:3px">versie ${VERSIE}</div>
    </div>
    <p style="color:var(--ink-2); font-size:14.5px; line-height:1.55; margin:0 0 16px">
      Een gedeelde boodschappenlijst voor het huisje. Alles wat jij toevoegt of afvinkt,
      ziet je huisgenoot meteen — inclusief wie wat erop zette, waar het te koop is en de foto's erbij.
    </p>
    <div class="lijst" style="margin-bottom:14px">
      <div class="rij"><span class="ik">${IK.kar}</span>
        <div class="tk"><b>Winkelmodus</b><span>groot afvinkscherm per winkel, scherm blijft aan</span></div></div>
      <div class="rij"><span class="ik">${IK.euro}</span>
        <div class="tk"><b>Uitgaven</b><span>wie schoot wat voor — met één tik verrekend</span></div></div>
      <div class="rij"><span class="ik">${IK.ster}</span>
        <div class="tk"><b>Vaste boodschappen</b><span>de wekelijkse dingen in één tik op de lijst</span></div></div>
    </div>
    <div class="lijst">
      <button class="rij" id="o-installeer">
        <span class="ik" style="background:var(--accent-zacht); color:var(--accent)">${IK.plus}</span>
        <div class="tk"><b>Op je beginscherm zetten</b><span>dan opent hij als een echte app</span></div>
      </button>
      <button class="rij" id="o-ververs">
        <span class="ik">${IK.herhaal}</span>
        <div class="tk"><b>App verversen</b><span>haal de nieuwste versie op</span></div>
      </button>
    </div>`;
  sheet({titel:"Over deze app", body, naTeken:() => {
    $("#o-installeer").onclick = () => {
      if(window.installPrompt){ window.installPrompt.prompt(); sluitSheet(); }
      else alert("Op de iPhone: tik onderin op het deelicoon en kies “Zet op beginscherm”.\n\nOp Android: tik op de drie puntjes rechtsboven en kies “App installeren”.");
    };
    $("#o-ververs").onclick = async () => {
      try{
        if("caches" in window){ for(const k of await caches.keys()) await caches.delete(k); }
        const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
        for(const r of regs) await r.update();
      }catch(e){}
      location.reload();
    };
  }});
}

/* ---------- delen ---------- */
function deelLijst(){
  const groepen = groepeer(openItems());
  let t = "🧺 " + CFG.huisNaam + " — boodschappen\n";
  groepen.forEach(g => {
    t += "\n*" + g.naam + "*\n";
    g.items.forEach(i => {
      t += "• " + (i.hoeveelheid ? i.hoeveelheid + " " : "") + i.tekst +
           (i.notitie ? " (" + i.notitie + ")" : "") + (i.urgent ? " ⚡" : "") + "\n";
    });
  });
  if(!groepen.length) t += "\nDe lijst is leeg 🎉\n";
  if(navigator.share){
    navigator.share({title:"Boodschappen", text:t}).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(t).then(() => toast("Lijst gekopieerd", "📋"))
      .catch(() => alert(t));
  }
}

/* =====================================================================
   16 · NAVIGATIE & TEKENEN
   ===================================================================== */
function navHtml(){
  const open = openItems().length;
  const tabs = [
    {id:"lijst",    naam:"Lijst",    ik:IK.lijst, bel:open},
    {id:"winkelen", naam:"Winkelen", ik:IK.kar},
    {id:"uitgaven", naam:"Uitgaven", ik:IK.euro},
    {id:"meer",     naam:"Meer",     ik:IK.meer}
  ];
  return `<nav class="nav"><div class="nav-rij">
    ${tabs.map(t => `
      <button class="nav-knop ${S.tab===t.id?"aan":""}" data-tab="${t.id}">
        ${t.ik}<span>${t.naam}</span>
        ${t.bel ? `<span class="bel">${t.bel > 99 ? "99+" : t.bel}</span>` : ""}
      </button>`).join("")}
  </div></nav>`;
}

function tekenNu(){
  const app = $("#app");

  if(!S.geladen){
    app.innerHTML = `<div class="midden"><div class="spinner"></div><span>Boodschappen laden…</span></div>`;
    return;
  }
  if(!S.ik){ tekenInlog(); return; }
  if(S.ik && !lidVan(S.ik.id)){ uitloggen(); return; }

  let scherm = "";
  if(S.tab === "lijst")         scherm = schermLijst();
  else if(S.tab === "winkelen") scherm = schermWinkelen();
  else if(S.tab === "uitgaven") scherm = schermUitgaven();
  else                          scherm = schermMeer();

  const inWinkelSessie = S.tab === "winkelen" && S.winkelSessie;
  app.innerHTML = scherm + (inWinkelSessie ? "" : navHtml());

  $$("[data-tab]").forEach(b => b.onclick = () => {
    if(S.tab === b.dataset.tab && b.dataset.tab === "lijst"){
      const inh = $("#inhoud"); if(inh) inh.scrollTo({top:0, behavior:"smooth"});
      return;
    }
    S.tab = b.dataset.tab; tril();
    if(S.tab !== "winkelen") houdSchermAan(false);
    tekenNu();
  });

  if(S.tab === "lijst")         bindLijst();
  else if(S.tab === "winkelen") bindWinkelen();
  else if(S.tab === "uitgaven") bindUitgaven();
  else                          bindMeer();

  vulFotos(app);
}

/* hertekent alleen de inhoud — zo blijft het zoekveld de focus houden */
function tekenAlleenInhoud(){
  if(S.tab !== "lijst") return tekenNu();
  const nieuw = document.createElement("div");
  nieuw.innerHTML = schermLijst();
  const bron = nieuw.querySelector("#inhoud"), doel = $("#inhoud");
  if(!bron || !doel) return tekenNu();
  const pos = doel.scrollTop;
  doel.innerHTML = bron.innerHTML;
  doel.scrollTop = pos;
  bindLijst();
  vulFotos(doel);
}

/* =====================================================================
   17 · LUISTEREN NAAR DE GEDEELDE LIJST
   ===================================================================== */
let eersteItems = true;
function startLuisteren(){
  DB.luister(PAD.leden, l => {
    S.leden = l.sort((a,b) => (a.gemaakt||0)-(b.gemaakt||0));
    if(S.ik){
      const m = lidVan(S.ik.id);
      if(m && m.naam !== S.ik.naam){ S.ik.naam = m.naam; LS.zet("boodschappen_ik_" + P, S.ik); }
    }else{
      /* kwamen de accounts pas ná het opstarten binnen? Dan alsnog inloggen */
      const bewaard = LS.get("boodschappen_ik_" + P, null);
      if(bewaard && l.some(x => x.id === bewaard.id)){ S.ik = bewaard; startHartslag(); }
    }
    if(S.geladen) tekenNu();
  });

  DB.luister(PAD.items, l => {
    const oud = S.items;
    S.items = l;
    if(!eersteItems && S.ik){
      const oudeIds = new Set(oud.map(i => i.id));
      const nieuweVanAnder = l.filter(i => !oudeIds.has(i.id) && i.door !== S.ik.id && (nu() - (i.gemaakt||0) < 90000));
      if(nieuweVanAnder.length === 1){
        const i = nieuweVanAnder[0];
        toast(naamVan(i.door).split(" ")[0] + " zette " + i.tekst + " op de lijst", "🧺");
      }else if(nieuweVanAnder.length > 1){
        toast(naamVan(nieuweVanAnder[0].door).split(" ")[0] + " voegde " + nieuweVanAnder.length + " boodschappen toe", "🧺");
      }
    }
    eersteItems = false;
    if(S.geladen) tekenNu();
  });

  DB.luister(PAD.winkels, l => {
    S.winkels = l.length ? l : S.winkels;
    if(S.geladen) tekenNu();
  });
  DB.luister(PAD.vast,   l => { S.vast = l;   if(S.geladen && S.tab === "meer") tekenNu(); });
  DB.luister(PAD.bonnen, l => { S.bonnen = l; if(S.geladen && (S.tab === "uitgaven" || S.tab === "meer")) tekenNu(); });
}

async function zetWinkelsKlaar(){
  /* meteen bruikbaar, ook als de database nog niet geantwoord heeft */
  S.winkels = STANDAARD_WINKELS.map(w => ({...w}));
  const bestaand = await DB.haalAlles(PAD.winkels);
  if(bestaand.length){ S.winkels = bestaand; return; }
  /* de eerste keer de standaardwinkels wegschrijven — op de achtergrond.
     Firestore lost een schrijfactie pas in als de server hem bevestigt; daar
     mag het laadscherm niet op blijven wachten. */
  Promise.all(STANDAARD_WINKELS.map(w => {
    const {id, ...rest} = w;
    return DB.zet(PAD.winkels + "/" + id, rest);
  })).catch(e => console.error("standaardwinkels", e));
}

/* =====================================================================
   18 · START
   ===================================================================== */
async function start(){
  try{
    DB = CFG.firebase ? await firestoreDB() : demoDB();
  }catch(e){
    console.error("Firebase lukte niet:", e);
    DB = demoDB();
    S.syncFout = "De gedeelde lijst kon niet geladen worden — de app draait nu op dit apparaat.";
  }

  /* nooit langer dan een paar tellen op de database wachten — de luisteraars
     vullen alles alsnog aan zodra het binnen is */
  const metGrens = (belofte, terugval, ms = 5000) =>
    Promise.race([belofte, new Promise(r => setTimeout(() => r(terugval), ms))]);

  try{ await metGrens(zetWinkelsKlaar(), null); }
  catch(e){ console.error(e); S.winkels = STANDAARD_WINKELS.map(w => ({...w})); toonSyncFout(e); }

  startLuisteren();

  try{ S.leden  = await metGrens(DB.haalAlles(PAD.leden), []); }catch(e){ toonSyncFout(e); }
  try{ S.items  = await metGrens(DB.haalAlles(PAD.items), []); eersteItems = false; }catch(e){}
  try{ S.bonnen = await metGrens(DB.haalAlles(PAD.bonnen), []); }catch(e){}
  try{ S.vast   = await metGrens(DB.haalAlles(PAD.vast), []); }catch(e){}

  const bewaard = LS.get("boodschappen_ik_" + P, null);
  if(bewaard && S.leden.some(l => l.id === bewaard.id)){
    S.ik = bewaard;
    startHartslag();
  }

  S.geladen = true;
  tekenNu();

  /* installeerbaar maken */
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.installPrompt = e; });

  /* service worker voor offline gebruik */
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  /* terug-knop sluit eerst een sheet of de winkelmodus */
  history.pushState({app:true}, "");
  window.addEventListener("popstate", () => {
    history.pushState({app:true}, "");
    if($(".kijker")){ $(".kijker").click(); return; }
    if(S.sheet){ sluitSheet(); return; }
    if(S.tab === "winkelen" && S.winkelSessie){ S.winkelSessie = null; houdSchermAan(false); tekenNu(); return; }
    if(S.tab !== "lijst"){ S.tab = "lijst"; tekenNu(); }
  });

  /* ververs de "laatst gezien"-tijden af en toe */
  setInterval(() => { if(S.geladen && S.ik && document.visibilityState === "visible" && !S.sheet) tekenNu(); }, 60000);
}

start();
</script>
