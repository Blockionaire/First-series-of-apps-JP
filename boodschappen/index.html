<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<meta name="theme-color" content="#F2EDE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191713" media="(prefers-color-scheme: dark)">
<meta name="description" content="De boodschappenlijst van Huisje OVS — voor Merel en Jelle samen.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Huisje OVS — Boodschappen</title>
<style>
/* =====================================================================
   HUISJE OVS · BOODSCHAPPEN
   Ontwerp: warm beige, rustig, strak. Alles in één bestand.
   ===================================================================== */

:root{
  --bg:#F2EDE4;
  --bg-2:#EAE3D6;
  --card:#FBF8F3;
  --card-2:#F6F1E8;
  --ink:#2E2A24;
  --ink-2:#5C554A;
  --muted:#918878;
  --line:#E4DBCA;
  --line-2:#D6CAB4;
  --accent:#8C6E4F;
  --accent-ink:#FFF9F0;
  --accent-zacht:#EFE4D5;
  --groen:#6E8B62;
  --groen-zacht:#E4EBDF;
  --rood:#B85C43;
  --rood-zacht:#F6E3DC;
  --geel:#C9A227;
  --schaduw:0 1px 2px rgba(60,45,25,.05), 0 8px 24px -12px rgba(60,45,25,.18);
  --schaduw-op:0 2px 6px rgba(60,45,25,.08), 0 20px 40px -16px rgba(60,45,25,.30);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --kop:-0.02em;
  --nav-h:64px;
  --vt:.22s cubic-bezier(.32,.72,0,1);
}
html[data-thema="donker"]{
  --bg:#191713;
  --bg-2:#12100D;
  --card:#221F1A;
  --card-2:#2A2620;
  --ink:#F1EBE1;
  --ink-2:#C8BFB1;
  --muted:#928A7C;
  --line:#332E27;
  --line-2:#433C32;
  --accent:#C9A67C;
  --accent-ink:#241D14;
  --accent-zacht:#33291F;
  --groen:#93B183;
  --groen-zacht:#25302172;
  --rood:#D98168;
  --rood-zacht:#3A241D;
  --geel:#DFBE4E;
  --schaduw:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  --schaduw-op:0 2px 8px rgba(0,0,0,.4), 0 24px 48px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background .25s ease, color .25s ease;
}
input,button,select,textarea{font:inherit; color:inherit;}
button{border:none; background:none; padding:0; cursor:pointer;}
::selection{background:var(--accent-zacht); color:var(--ink);}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:0; height:0;}

/* ---------- app frame ---------- */
#app{min-height:100dvh; display:flex; flex-direction:column;}
.scherm{flex:1; display:flex; flex-direction:column; min-height:0;}
.inhoud{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px; margin:0 auto; width:100%;}

/* ---------- kop ---------- */
.kop{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  transition:border-color .2s ease;
}
.kop.geplakt{border-bottom-color:var(--line);}
.kop-rij{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px;}
.kop-titel{flex:1; min-width:0;}
.kop-titel h1{
  margin:0; font-size:22px; font-weight:700; letter-spacing:var(--kop);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.kop-titel .sub{font-size:12.5px; color:var(--muted); margin-top:1px; letter-spacing:.01em;}
.kop-acties{display:flex; align-items:center; gap:6px;}

.ikoonknop{
  width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
  color:var(--ink-2); background:transparent; transition:background var(--vt), transform var(--vt);
}
.ikoonknop:active{transform:scale(.9); background:var(--bg-2);}
.ikoonknop.aan{background:var(--accent); color:var(--accent-ink);}
.ikoonknop svg{width:21px; height:21px; stroke-width:1.9;}

/* ---------- avatars ---------- */
.av{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; letter-spacing:.02em; color:#fff;
  flex:none; position:relative; user-select:none;
}
.av.mini{width:20px; height:20px; font-size:9px; border-radius:50%;}
.av.groot{width:52px; height:52px; font-size:18px;}
.av.xl{width:76px; height:76px; font-size:26px;}
.av .stip{
  position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%;
  background:var(--groen); border:2px solid var(--bg);
}
.av-stapel{display:flex;}
.av-stapel .av{margin-left:-8px; box-shadow:0 0 0 2px var(--bg);}
.av-stapel .av:first-child{margin-left:0;}

/* ---------- zoek ---------- */
.zoekbalk{position:relative; margin:10px auto 0; max-width:620px;}
.zoekbalk svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--muted); pointer-events:none;
}
.zoekbalk input{
  width:100%; padding:11px 38px 11px 38px; border-radius:var(--r-m);
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:15.5px; outline:none; transition:border-color var(--vt), box-shadow var(--vt);
}
.zoekbalk input::placeholder{color:var(--muted);}
.zoekbalk input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-zacht);}
.zoek-wis{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--muted);
}

/* ---------- chips ---------- */
.chiprij{
  display:flex; gap:7px; overflow-x:auto; padding:10px 16px 2px;
  margin:0 -16px; scrollbar-width:none;
}
.chiprij::-webkit-scrollbar{display:none;}
.chiprij .rek{flex:none; width:0;}
.chip{
  flex:none; display:inline-flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--card); border:1px solid var(--line); color:var(--ink-2);
  white-space:nowrap; transition:all var(--vt); letter-spacing:.005em;
}
.chip:active{transform:scale(.95);}
.chip.aan{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip.aan.winkel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.chip .telw{
  font-size:11px; font-weight:700; opacity:.6; font-variant-numeric:tabular-nums;
}
.chip .punt{width:8px; height:8px; border-radius:50%; flex:none;}

/* ---------- secties & kaarten ---------- */
.sectie{margin-top:22px;}
.sectie-kop{
  display:flex; align-items:center; gap:9px; padding:0 4px 8px;
}
.sectie-kop h2{
  margin:0; font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:7px;
}
.sectie-kop .lijn{flex:1; height:1px; background:var(--line);}
.sectie-kop .telw{
  font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;
  background:var(--bg-2); padding:2px 7px; border-radius:999px;
}
.sectie-kop button.mini{
  font-size:12px; font-weight:600; color:var(--accent); padding:4px 8px; border-radius:8px;
}
.sectie-kop button.mini:active{background:var(--accent-zacht);}

.lijst{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-l);
  overflow:hidden; box-shadow:var(--schaduw);
}

/* ---------- item ---------- */
.item{
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
  border-bottom:1px solid var(--line); position:relative;
  background:var(--card); transition:background var(--vt);
}
.item:last-child{border-bottom:none;}
.item:active{background:var(--card-2);}
.item.af .item-tekst{text-decoration:line-through; color:var(--muted);}
.item.af .item-mid{opacity:.6;}
.item.weg{animation:wegvegen .3s ease forwards;}
@keyframes wegvegen{to{opacity:0; transform:translateX(24px); max-height:0; padding-top:0; padding-bottom:0;}}
.item.nieuw{animation:erin .35s cubic-bezier(.32,.72,0,1);}
@keyframes erin{from{opacity:0; transform:translateY(-6px);}}

.vink{
  width:26px; height:26px; border-radius:50%; flex:none; margin-top:1px;
  border:2px solid var(--line-2); display:grid; place-items:center;
  transition:all var(--vt); background:transparent;
}
.vink:active{transform:scale(.85);}
.vink svg{width:15px; height:15px; stroke-width:3; color:#fff; opacity:0; transform:scale(.5); transition:all var(--vt);}
.item.af .vink, .wm-item.af .vink{background:var(--groen); border-color:var(--groen);}
.item.af .vink svg, .wm-item.af .vink svg{opacity:1; transform:scale(1);}

.item-mid{flex:1; min-width:0;}
.item-titelrij{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
.item-tekst{font-size:16px; font-weight:600; letter-spacing:-.005em; word-break:break-word;}
.item-hoev{
  font-size:12.5px; font-weight:700; color:var(--accent);
  background:var(--accent-zacht); padding:1px 7px; border-radius:7px; flex:none;
}
.item-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:4px; font-size:12.5px; color:var(--muted);
}
.item-meta .stuk{display:inline-flex; align-items:center; gap:4px;}
.item-meta svg{width:12px; height:12px; stroke-width:2.2;}
.item-notitie{
  margin-top:5px; font-size:13.5px; color:var(--ink-2); line-height:1.4;
  padding-left:9px; border-left:2px solid var(--line-2);
}
.vlag{
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; border-radius:6px; background:var(--rood-zacht); color:var(--rood); flex:none;
}
.item-thumb{
  width:46px; height:46px; border-radius:var(--r-s); object-fit:cover; flex:none;
  background:var(--bg-2); border:1px solid var(--line); margin-top:1px;
}
.item-thumb.laden{animation:pols 1.4s ease-in-out infinite;}
@keyframes pols{50%{opacity:.45;}}

/* ---------- lege staat ---------- */
.leeg{
  text-align:center; padding:54px 24px; color:var(--muted);
}
.leeg .em{font-size:40px; display:block; margin-bottom:10px; opacity:.85;}
.leeg h3{margin:0 0 5px; font-size:17px; font-weight:700; color:var(--ink); letter-spacing:var(--kop);}
.leeg p{margin:0; font-size:14px; line-height:1.5; max-width:280px; margin-inline:auto;}

/* ---------- knoppen ---------- */
.knop{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--r-m); font-size:15.5px; font-weight:650;
  background:var(--accent); color:var(--accent-ink); letter-spacing:.005em;
  transition:transform var(--vt), opacity var(--vt), background var(--vt);
}
.knop:active{transform:scale(.97); opacity:.9;}
.knop.vol{width:100%;}
.knop.stil{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.knop.zacht{background:var(--accent-zacht); color:var(--accent);}
.knop.groen{background:var(--groen); color:#fff;}
.knop.gevaar{background:var(--rood-zacht); color:var(--rood);}
.knop.klein{padding:9px 14px; font-size:14px; border-radius:var(--r-s);}
.knop[disabled]{opacity:.45; pointer-events:none;}
.knop svg{width:18px; height:18px; stroke-width:2.2;}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:16px; z-index:40;
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  height:54px; padding:0 22px 0 18px; border-radius:999px;
  background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; gap:8px; font-size:16px; font-weight:650;
  box-shadow:0 6px 20px -4px rgba(90,65,35,.45); letter-spacing:-.005em;
  transition:transform var(--vt), box-shadow var(--vt);
}
.fab:active{transform:scale(.94);}
.fab svg{width:22px; height:22px; stroke-width:2.4;}
@media(min-width:660px){ .fab{right:calc(50vw - 310px);} }

/* ---------- navigatie ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(16px);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-rij{display:flex; max-width:620px; margin:0 auto; height:var(--nav-h);}
.nav-knop{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:10.5px; font-weight:650; letter-spacing:.01em;
  transition:color var(--vt); position:relative;
}
.nav-knop svg{width:23px; height:23px; stroke-width:1.9; transition:transform var(--vt);}
.nav-knop:active svg{transform:scale(.86);}
.nav-knop.aan{color:var(--accent);}
.nav-knop .bel{
  position:absolute; top:8px; left:50%; margin-left:6px;
  min-width:17px; height:17px; padding:0 5px; border-radius:999px;
  background:var(--rood); color:#fff; font-size:10px; font-weight:700;
  display:grid; place-items:center; font-variant-numeric:tabular-nums;
}

/* ---------- bottom sheet ---------- */
.overlay{
  position:fixed; inset:0; z-index:80; background:rgba(35,26,14,.42);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  opacity:0; transition:opacity var(--vt);
}
.overlay.open{opacity:1;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:81;
  background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--schaduw-op);
  transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:92dvh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{transform:translateY(0);}
.sheet-in{max-width:620px; margin:0 auto; width:100%; display:flex; flex-direction:column; min-height:0;}
.greep{
  width:38px; height:4.5px; border-radius:999px; background:var(--line-2);
  margin:9px auto 4px; flex:none;
}
.sheet-kop{
  display:flex; align-items:center; gap:10px; padding:6px 18px 12px; flex:none;
}
.sheet-kop h2{margin:0; font-size:19px; font-weight:700; letter-spacing:var(--kop); flex:1;}
.sheet-body{overflow-y:auto; padding:0 18px 18px; -webkit-overflow-scrolling:touch;}
.sheet-voet{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom)); flex:none;
  border-top:1px solid var(--line); background:var(--bg);
  display:flex; gap:10px;
}
@media(min-width:660px){
  .sheet{left:50%; transform:translate(-50%,100%); width:620px; border-radius:var(--r-xl);
         bottom:20px; max-height:86dvh;}
  .sheet.open{transform:translate(-50%,0);}
}

/* ---------- formulier ---------- */
.veld{margin-bottom:15px;}
.veld > label{
  display:block; font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); margin-bottom:7px; padding-left:2px;
}
.invoer{
  width:100%; padding:13px 14px; border-radius:var(--r-m);
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:16px; outline:none; transition:border-color var(--vt), box-shadow var(--vt);
}
.invoer::placeholder{color:var(--muted);}
.invoer:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-zacht);}
textarea.invoer{resize:none; line-height:1.45; min-height:74px;}
.veld-rij{display:flex; gap:10px;}
.veld-rij > *{flex:1; min-width:0;}

.keuzes{display:flex; flex-wrap:wrap; gap:7px;}
.keuze{
  display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px;
  font-size:14px; font-weight:600; background:var(--card); border:1px solid var(--line);
  color:var(--ink-2); transition:all var(--vt);
}
.keuze:active{transform:scale(.95);}
.keuze.aan{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.keuze.aan.grijs{background:var(--ink); border-color:var(--ink); color:var(--bg);}

.schakel{
  display:flex; align-items:center; gap:12px; padding:13px 14px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m);
}
.schakel .tk{flex:1; min-width:0;}
.schakel .tk b{display:block; font-size:15px; font-weight:650;}
.schakel .tk span{font-size:12.5px; color:var(--muted);}
.tuimel{
  width:48px; height:29px; border-radius:999px; background:var(--line-2); flex:none;
  position:relative; transition:background var(--vt);
}
.tuimel::after{
  content:""; position:absolute; top:2.5px; left:2.5px; width:24px; height:24px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform var(--vt);
}
.tuimel.aan{background:var(--groen);}
.tuimel.aan::after{transform:translateX(19px);}

/* ---------- foto in formulier ---------- */
.fotovak{
  display:flex; gap:10px; align-items:center;
}
.fotoknop{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px; border-radius:var(--r-m); border:1.5px dashed var(--line-2);
  color:var(--ink-2); font-size:14.5px; font-weight:600; background:var(--card);
  transition:all var(--vt);
}
.fotoknop:active{background:var(--card-2); transform:scale(.98);}
.fotoknop svg{width:19px; height:19px; stroke-width:2;}
.fotovb{
  position:relative; width:82px; height:82px; border-radius:var(--r-m); overflow:hidden;
  border:1px solid var(--line); flex:none; background:var(--bg-2);
}
.fotovb img{width:100%; height:100%; object-fit:cover; display:block;}
.fotovb .weg{
  position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
  background:rgba(20,14,6,.62); color:#fff; display:grid; place-items:center;
  backdrop-filter:blur(4px);
}
.fotovb .weg svg{width:13px; height:13px; stroke-width:2.6;}

/* ---------- suggesties ---------- */
.sugg{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px;}
.sugg button{
  padding:7px 12px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--accent-zacht); color:var(--accent); border:1px solid transparent;
  transition:transform var(--vt);
}
.sugg button:active{transform:scale(.94);}

/* ---------- winkelmodus ---------- */
.wm-kop{
  padding:16px; border-radius:var(--r-l); background:var(--card);
  border:1px solid var(--line); box-shadow:var(--schaduw); margin-top:14px;
}
.wm-kop .bovenrij{display:flex; align-items:center; gap:12px;}
.wm-kop h2{margin:0; font-size:20px; font-weight:700; letter-spacing:var(--kop); flex:1;}
.balk{height:8px; border-radius:999px; background:var(--bg-2); overflow:hidden; margin-top:12px;}
.balk > div{
  height:100%; border-radius:999px; background:var(--groen);
  transition:width .4s cubic-bezier(.32,.72,0,1);
}
.wm-tel{
  font-size:13px; color:var(--muted); margin-top:7px; display:flex; justify-content:space-between;
  font-variant-numeric:tabular-nums;
}
.winkelkaart{
  display:flex; align-items:center; gap:13px; padding:15px 16px;
  border-bottom:1px solid var(--line); transition:background var(--vt);
}
.winkelkaart:last-child{border-bottom:none;}
.winkelkaart:active{background:var(--card-2);}
.winkelkaart .bol{
  width:42px; height:42px; border-radius:13px; display:grid; place-items:center;
  font-size:19px; flex:none;
}
.winkelkaart .tk{flex:1; min-width:0;}
.winkelkaart .tk b{display:block; font-size:16px; font-weight:650; letter-spacing:-.005em;}

<script src="firebase-config.js"></script>
<script>
/* =====================================================================
   0 · INSTELLINGEN & CONSTANTEN
   ===================================================================== */
const CFG = Object.assign({
  firebase:null, huisNaam:"Huisje OVS", ondertitel:"Boodschappen", ruimte:"ovs"
}, window.BOODSCHAPPEN_CONFIG || {});

const VERSIE = "1.0.0";
const P = CFG.ruimte || "ovs";                    // voorvoegsel van alle collecties
const PAD = {
  leden:  P+"_leden",
  items:  P+"_items",
  fotos:  P+"_fotos",
  winkels:P+"_winkels",
  vast:   P+"_vast",
  geleerd:P+"_geleerd",   // categorieën die jullie zelf hebben rechtgezet
  cats:   P+"_cats",
  bonnen: P+"_bonnen",
  meta:   P+"_meta"
};

const KLEUREN = ["#8C6E4F","#6E8B62","#B85C43","#4F6E8C","#8C5F7A","#A8853C","#5B7D7A","#7A5C8C"];

const STANDAARD_CATS = [
  {id:"groente",  naam:"Groente & fruit", em:"🥬"},
  {id:"brood",    naam:"Brood & banket",  em:"🥖"},
  {id:"zuivel",   naam:"Zuivel & eieren", em:"🥛"},
  {id:"vlees",    naam:"Vlees & vis",     em:"🥩"},
  {id:"maaltijd", naam:"Maaltijd & pasta",em:"🍝"},
  {id:"voorraad", naam:"Voorraadkast",    em:"🥫"},
  {id:"diepvries",naam:"Diepvries",       em:"🧊"},
  {id:"snacks",   naam:"Snoep & snacks",  em:"🍫"},
  {id:"drinken",  naam:"Drinken",         em:"🥤"},
  {id:"huis",     naam:"Huishouden",      em:"🧴"},
  {id:"verzorg",  naam:"Verzorging",      em:"🧼"},
  {id:"klus",     naam:"Huisje & klussen",em:"🔧"},
  {id:"overig",   naam:"Overig",          em:"📦"}
];
/* de categorieën staan in de database, zodat jullie ze zelf kunnen beheren.
   Zolang die nog niet binnen is, gelden de standaardcategorieën. */
const cats = () => (S.cats && S.cats.length) ? S.cats : STANDAARD_CATS;
const catVan = id => cats().find(c => c.id === id)
                  || cats().find(c => c.id === "overig")
                  || cats()[cats().length-1]
                  || {id:"overig", naam:"Overig", em:"📦"};
const catBestaat = id => cats().some(c => c.id === id);

/* De volgorde van de categorieën. Heeft een winkel een looproute, dan telt die;
   categorieën die er niet in staan komen daarachter in de gewone volgorde. */
function catOrde(winkelId){
  const w = winkelId && winkelId !== "alles" ? S.winkels.find(x => x.id === winkelId) : null;
  const route = (w && Array.isArray(w.route) && w.route.length) ? w.route : null;
  const orde = new Map();
  let n = 0;
  if(route) route.forEach(id => { if(catBestaat(id) && !orde.has(id)) orde.set(id, n++); });
  cats().forEach(c => { if(!orde.has(c.id)) orde.set(c.id, n++); });
  return orde;
}
const STANDAARD_ORDE = () => catOrde(null);
const catIndex = (id, orde) => {
  const m = orde || STANDAARD_ORDE();
  return m.has(id) ? m.get(id) : 999;
};

const STANDAARD_WINKELS = [
  {id:"ah",      naam:"Albert Heijn", em:"🛒", kleur:"#4F84C4", volgorde:1},
  {id:"jumbo",   naam:"Jumbo",        em:"🛒", kleur:"#C9A227", volgorde:2},
  {id:"lidl",    naam:"Lidl",         em:"🛒", kleur:"#5B8C5A", volgorde:3},
  {id:"action",  naam:"Action",       em:"🏬", kleur:"#B85C43", volgorde:4},
  {id:"bouw",    naam:"Bouwmarkt",    em:"🔨", kleur:"#8C6E4F", volgorde:5},
  {id:"drog",    naam:"Drogist",      em:"💊", kleur:"#8C5F7A", volgorde:6},
  {id:"markt",   naam:"Markt",        em:"🧺", kleur:"#6E8B62", volgorde:7},
  {id:"online",  naam:"Online",       em:"📦", kleur:"#5B7D7A", volgorde:8},
  {id:"nvt",     naam:"Nog niet gekozen", em:"❓", kleur:"#918878", volgorde:99}
];

/* woorden waarmee de app zelf een categorie raadt bij het typen */
const RAAD = {
  groente:["appel","banaan","sla","tomaat","komkommer","ui","uien","paprika","wortel","aardappel","avocado","citroen","sinaasappel","broccoli","spinazie","champignon","knoflook","druiven","peer","aardbei","courgette","bloemkool","mandarijn","meloen","prei","boontjes","salade","fruit","groente"],
  brood:["brood","bolletjes","croissant","stokbrood","beschuit","crackers","taart","gebak","pistolet","wraps","tortilla","bagel","cake","koek"],
  zuivel:["melk","kaas","yoghurt","boter","ei","eieren","kwark","room","slagroom","vla","karnemelk","mozzarella","feta","margarine","skyr"],
  vlees:["kip","gehakt","biefstuk","worst","ham","spek","zalm","vis","garnalen","tonijn","kipfilet","hamburger","salami","tofu","vegaburger","rookworst","speklapjes"],
  maaltijd:["pasta","spaghetti","rijst","noedels","couscous","penne","macaroni","lasagne","pizza","maaltijdmix","bami","nasi"],
  voorraad:["olie","azijn","zout","peper","suiker","meel","bloem","tomatenblik","bonen","soep","saus","ketchup","mayonaise","mosterd","kruiden","bouillon","pindakaas","jam","hagelslag","honing","muesli","cornflakes","thee","koffie","kokosmelk","curry","sambal"],
  diepvries:["diepvries","ijs","spinazie diepvries","friet","frites","pizza diepvries","ijsjes","erwtjes"],

/* “tomaten” en “tomaat”, “broodjes” en “brood”: terug naar de stam */
function stam(w){
  let s = String(w||"").toLowerCase().replace(/[^a-zà-ÿ]/g, "");
  s = s.replace(/(tjes|jes|tje)$/, "");
  s = s.replace(/(en|s)$/, "");
  s = s.replace(/([bdfgklmnprst])\1$/, "$1");     // pakken → pak
  s = s.replace(/aa([bdfgklmnprstz])$/, "a$1");   // tomaten → tomat → tomaat-achtig
  return s;
}
const RAAD_STAM = {};
for(const [cat, woorden] of Object.entries(RAAD)){
  for(const w of woorden){
    for(const deel of w.split(" ")){
      const s = stam(deel);
      if(s.length >= 3 && !(s in RAAD_STAM)) RAAD_STAM[s] = cat;
    }
  }
}
/* sleutel waaronder een boodschap in de database staat: kleine letters,
   zonder accenten en leestekens, zodat "Kleine tomaatjes!" altijd op
   hetzelfde plekje uitkomt */
function leerSleutel(tekst){
  return String(tekst||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
}

/* Heeft iemand deze boodschap ooit zelf in een andere categorie gezet?
   Dan telt die keuze, ook als de woordenlijst er anders over denkt. */
function geleerdeCategorie(tekst){
  const sleutel = leerSleutel(tekst);
  if(!sleutel || !S.geleerd.length) return null;
  const zelfde = S.geleerd.find(g => g.id === sleutel);
  if(zelfde && catBestaat(zelfde.cat)) return zelfde.cat;
  const st = stam(tekst);
  if(st.length < 3) return null;
  const viaStam = S.geleerd.find(g => stam(g.tekst || "") === st && catBestaat(g.cat));
  return viaStam ? viaStam.cat : null;
}

/* onthoud een verbetering, voor jullie allebei */
async function leerCategorie(tekst, cat){
  const sleutel = leerSleutel(tekst);
  if(!sleutel || !cat) return;
  try{
    await DB.zet(PAD.geleerd + "/" + sleutel, {
      tekst: String(tekst).trim(), cat, door: S.ik ? S.ik.id : null, laatst: nu()
    });
  }catch(e){ console.error("leren", e); }
}

function raadCategorie(tekst){
  const geleerd = geleerdeCategorie(tekst);
  if(geleerd) return geleerd;
  const t = String(tekst||"").toLowerCase().trim();
  if(!t) return null;
  const heel = stam(t);
  if(heel.length >= 3 && RAAD_STAM[heel]) return RAAD_STAM[heel];
  const woorden = t.split(/[\s,./-]+/).filter(Boolean);
  for(const woord of woorden){
    const s = stam(woord);
    if(s.length >= 3 && RAAD_STAM[s] && catBestaat(RAAD_STAM[s])) return RAAD_STAM[s];
  }
  /* samengestelde woorden: volkorenbrood, wasmiddel, sinaasappelsap */
  for(const woord of woorden){
    const s = stam(woord);
    if(s.length < 5) continue;
    let besteLengte = 0, besteCat = null;
    for(const [sleutel, cat] of Object.entries(RAAD_STAM)){
      if(sleutel.length >= 4 && sleutel.length > besteLengte && s.includes(sleutel) && catBestaat(cat)){
        besteLengte = sleutel.length; besteCat = cat;
      }
    }
    if(besteCat) return besteCat;
  }
  return null;
}

  const d = String(naam||"?").trim().split(/\s+/);

}
function datumKort(ts){
  if(!ts) return "";
  const d = new Date(ts), n = new Date();
  const zelfdeDag = d.toDateString() === n.toDateString();
  const gisteren = new Date(n.getTime() - 864e5).toDateString() === d.toDateString();
  const tijd = d.toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"});
  if(zelfdeDag) return tijd;
  if(gisteren) return "gisteren " + tijd;
  const dagen = Math.round((n - d) / 864e5);
  if(dagen < 7) return d.toLocaleDateString("nl-NL", {weekday:"short"}) + " " + tijd;
  return d.toLocaleDateString("nl-NL", {day:"numeric", month:"short"});
}
function datumLang(ts){
  if(!ts) return "";
  return new Date(ts).toLocaleDateString("nl-NL", {weekday:"long", day:"numeric", month:"long"});
}
function maandSleutel(ts){ const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function maandKort(sleutel){
  const [j, m] = sleutel.split("-").map(Number);
  const naam = new Date(j, m-1, 1).toLocaleDateString("nl-NL", {month:"long"});
  const kop = naam.charAt(0).toUpperCase() + naam.slice(1);
  return j === new Date().getFullYear() ? kop : kop + " " + j;
}
function maandNaam(sleutel){
  const [j,m] = sleutel.split("-").map(Number);
  const naam = new Date(j, m-1, 1).toLocaleDateString("nl-NL", {month:"long", year:"numeric"});
  return naam.charAt(0).toUpperCase() + naam.slice(1);
}

const LS = {
  get(k, val){ try{ const s = localStorage.getItem(k); return s === null ? val : JSON.parse(s); }catch(e){ return val; } },
  zet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  weg(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

function demoDB(){
  const SLEUTEL = "boodschappen_demo_" + P;
  let store = LS.get(SLEUTEL, {});
  const luisteraars = {};
  const bewaar = () => LS.zet(SLEUTEL, store);
  const herlaad = () => { store = LS.get(SLEUTEL, {}); };
  const meld = col => (luisteraars[col]||[]).forEach(cb => cb(alles(col)));
  const alles = col => Object.entries(store[col]||{}).map(([id,d]) => ({id, ...d}));
  window.addEventListener("storage", e => {
    if(e.key === SLEUTEL){ herlaad(); Object.keys(luisteraars).forEach(meld); }
  });
  return {
    demo:true,
    luister(col, cb){
      (luisteraars[col] ||= []).push(cb);
      herlaad(); setTimeout(() => cb(alles(col)), 0);
      return () => { luisteraars[col] = (luisteraars[col]||[]).filter(f => f !== cb); };
    },
    async voegToe(col, data){ herlaad(); const i = id6(); (store[col] ||= {})[i] = data; bewaar(); meld(col); return i; },
    async zet(pad, data){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      (store[col] ||= {})[i] = Object.assign({}, store[col][i]||{}, data); bewaar(); meld(col);
    },
    async wis(pad){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      if(store[col]){ delete store[col][i]; bewaar(); meld(col); }
    },
    async haal(pad){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      return store[col] && store[col][i] ? {id:i, ...store[col][i]} : null;
    },
    async haalAlles(col){ herlaad(); return alles(col); }
  };
}

async function firestoreDB(){
  const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(CFG.firebase);
  let db;
  try{
    db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
  }catch(e){ db = F.getFirestore(app); }
  const colRef = p => F.collection(db, ...p.split("/"));
  const docRef = p => F.doc(db, ...p.split("/"));
  return {
    demo:false,
    luister(col, cb){
      return F.onSnapshot(colRef(col),
        s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))),
        e => { console.error("luister", col, e); toonSyncFout(e); });
    },
    /* Firestore lost een schrijfactie pas in als de server hem bevestigt.
       De lokale cache is meteen bij, dus we wachten daar niet op: zo werkt de
       app ook met een slechte verbinding of helemaal offline gewoon door. */
    async voegToe(col, data){
      const i = id6();
      F.setDoc(docRef(col + "/" + i), data).catch(e => { console.error("schrijven", col, e); toonSyncFout(e); });
      return i;
    },
    async zet(pad, data){
      F.setDoc(docRef(pad), data, {merge:true}).catch(e => { console.error("schrijven", pad, e); toonSyncFout(e); });
    },
    async wis(pad){
      F.deleteDoc(docRef(pad)).catch(e => { console.error("wissen", pad, e); toonSyncFout(e); });
    },
    async haal(pad){ const s = await F.getDoc(docRef(pad)); return s.exists() ? {id:s.id, ...s.data()} : null; },
    async haalAlles(col){ const s = await F.getDocs(colRef(col)); return s.docs.map(d => ({id:d.id, ...d.data()})); }
  };
}

/* =====================================================================
   4 · FOTO'S — verkleinen, opslaan, ophalen
   ===================================================================== */
function leesBestand(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function laadPlaatje(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}
function schaal(im, maxZij, kwaliteit){
  const f = Math.min(1, maxZij / Math.max(im.width, im.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(im.width * f);
  cv.height = Math.round(im.height * f);
  const ct = cv.getContext("2d");
  ct.fillStyle = "#fff"; ct.fillRect(0,0,cv.width,cv.height);
  ct.drawImage(im, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", kwaliteit);
}
/* geeft {groot, klein} terug — allebei data-urls */
async function verkleinFoto(file){
  const ruw = await leesBestand(file);
  const im = await laadPlaatje(ruw);
  let groot = schaal(im, 1280, 0.72);
  let q = 0.72;
  while(groot.length > 780000 && q > 0.32){ q -= 0.1; groot = schaal(im, 1280, q); }
  if(groot.length > 780000) groot = schaal(im, 900, 0.5);
  const klein = schaal(im, 220, 0.55);
  return {groot, klein};
}
async function bewaarFoto(file){
  const {groot, klein} = await verkleinFoto(file);
  const fid = id6();
  await DB.zet(PAD.fotos + "/" + fid, {data:groot, gemaakt:nu()});
  await DB.zet(PAD.fotos + "/" + fid + "_k", {data:klein, gemaakt:nu()});
  S.fotoCache[fid] = groot;
  S.fotoCache[fid + "_k"] = klein;
  return fid;
}
async function haalFoto(fid){
  if(!fid) return null;
  if(S.fotoCache[fid]) return S.fotoCache[fid];
  const d = await DB.haal(PAD.fotos + "/" + fid);
  if(d && d.data){ S.fotoCache[fid] = d.data; return d.data; }
  return null;
}
/* vult <img data-foto="..."> zodra het plaatje binnen is */
async function vulFotos(root){
  const els = Array.from((root||document).querySelectorAll("img[data-foto]"));
  for(const el of els){
    const fid = el.dataset.foto;
    el.removeAttribute("data-foto");
    const d = await haalFoto(fid);
    if(d){ el.src = d; el.classList.remove("laden"); }
    else { el.classList.remove("laden"); el.style.visibility = "hidden"; }
  }
}
async function wisFoto(fid){
  if(!fid) return;
  try{ await DB.wis(PAD.fotos + "/" + fid); await DB.wis(PAD.fotos + "/" + fid + "_k"); }catch(e){}
  delete S.fotoCache[fid]; delete S.fotoCache[fid + "_k"];
}

/* =====================================================================
   5 · PINCODE
   ===================================================================== */
async function hashPin(naam, pin){
  const tekst = "huisje-ovs::" + String(naam).toLowerCase().trim() + "::" + pin;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tekst));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h = 5381;
    for(let i=0;i<tekst.length;i++){ h = ((h<<5) + h + tekst.charCodeAt(i)) | 0; }
    return "s" + (h >>> 0).toString(16);
  }
}

async function pinKlaar(){
  if(IN.bezig) return;
  IN.bezig = true;
  try{
    if(IN.stap === "pin"){
      const h = await hashPin(IN.lid.naam, IN.pin);
      if(h === IN.lid.pinHash){ await inloggenAls(IN.lid.id); return; }
      IN.fout = true; IN.pin = ""; tril(60); tekenInlog();
    }
    else if(IN.stap === "pin-nieuw"){
      IN.stap = "pin-herhaal"; IN.pin2 = ""; tekenInlog();
    }
    else if(IN.stap === "pin-herhaal"){
      if(IN.pin !== IN.pin2){
        IN.fout = true; IN.pin = ""; IN.pin2 = ""; IN.stap = "pin-nieuw"; tril(60); tekenInlog();
        setTimeout(() => toast("De codes waren niet gelijk", "🔒"), 100);
        return;
      }
      const naam = IN.lid ? IN.lid.naam : IN.naam;
      const h = await hashPin(naam, IN.pin);
      if(IN.lid){
        await DB.zet(PAD.leden + "/" + IN.lid.id, {pinHash:h});
        await inloggenAls(IN.lid.id);
      }else{
        const lid = {
          naam,
          kleur: KLEUREN[S.leden.length % KLEUREN.length],
          pinHash: h, gemaakt: nu(), laatstGezien: nu()
        };
        const nid = await DB.voegToe(PAD.leden, lid);
        S.leden.push({id:nid, ...lid});
        await inloggenAls(nid);
      }
    }
  }catch(e){
    console.error(e); toast("Er ging iets mis — probeer opnieuw");
    IN.fout = true; IN.pin = ""; IN.pin2 = ""; tekenInlog();
  }finally{ IN.bezig = false; }
}

/* =====================================================================
   7 · ITEMS — filteren, groeperen, acties
   ===================================================================== */
function openItems(){ return S.items.filter(i => !i.af); }
function afItems(){ return S.items.filter(i => i.af); }

function pasFilterToe(lijst){
  const f = S.filter;
  const z = f.zoek.trim().toLowerCase();
  return lijst.filter(i => {
    if(f.winkel && (i.winkel || "nvt") !== f.winkel) return false;
    if(f.cat && (i.cat || "overig") !== f.cat) return false;
    if(f.door && i.door !== f.door) return false;
    if(f.urgent && !i.urgent) return false;
    if(z){
      const hooi = [i.tekst, i.notitie, i.hoeveelheid, winkelVan(i.winkel).naam, catVan(i.cat).naam].join(" ").toLowerCase();
      if(!hooi.includes(z)) return false;
    }
    return true;
  });
}
function filterActief(){
  const f = S.filter;
  return !!(f.cat || f.door || f.urgent || f.zoek.trim());
}
function sorteerItems(lijst, orde){
  const m = orde || STANDAARD_ORDE();
  return [...lijst].sort((a,b) => {
    if(!!b.urgent !== !!a.urgent) return b.urgent ? 1 : -1;
    const ca = catIndex(a.cat, m), cb = catIndex(b.cat, m);
    if(ca !== cb) return ca - cb;
    return (a.gemaakt||0) - (b.gemaakt||0);
  });
}
function groepeer(lijst){
  const groepen = new Map();
  if(S.filter.groep === "cat"){
    for(const i of sorteerItems(lijst)){
      const c = catVan(i.cat);
      if(!groepen.has(c.id)) groepen.set(c.id, {sleutel:c.id, naam:c.naam, em:c.em, kleur:null, items:[]});
      groepen.get(c.id).items.push(i);
    }
    return [...groepen.values()].sort((a,b) => catIndex(a.sleutel) - catIndex(b.sleutel));
  }
  for(const i of sorteerItems(lijst)){
    const w = winkelVan(i.winkel);
    if(!groepen.has(w.id)) groepen.set(w.id, {sleutel:w.id, naam:w.naam, em:w.em, kleur:w.kleur, volgorde:w.volgorde||50, items:[]});
    groepen.get(w.id).items.push(i);
  }
  return [...groepen.values()].sort((a,b) => (a.volgorde||50) - (b.volgorde||50) || a.naam.localeCompare(b.naam));
}

/* onthoudt wat je vaak koopt, voor de snelknoppen bij toevoegen */
function onthoudVoorSuggestie(item){
  const t = (item.tekst||"").trim();
  if(t.length < 2) return;
  const lijst = LS.get("boodschappen_vaak_" + P, {});
  const k = t.toLowerCase();
  lijst[k] = {tekst:t, n:(lijst[k]?.n||0)+1, winkel:item.winkel, cat:item.cat, laatst:nu()};
  LS.zet("boodschappen_vaak_" + P, lijst);
}
function vaakGekocht(n=8, zoek=""){
  const lijst = Object.values(LS.get("boodschappen_vaak_" + P, {}));
  const opLijst = new Set(openItems().map(i => (i.tekst||"").toLowerCase()));
  const z = zoek.trim().toLowerCase();
  return lijst
    .filter(v => !opLijst.has(v.tekst.toLowerCase()))
    .filter(v => !z || v.tekst.toLowerCase().includes(z))
    .sort((a,b) => (b.n - a.n) || (b.laatst - a.laatst))
    .slice(0, n);
}

/* =====================================================================
   8 · SCHERM: LIJST
   ===================================================================== */
function schermLijst(){
  const alleOpen = openItems();
  const zichtbaar = pasFilterToe(alleOpen);
  const groepen = groepeer(zichtbaar);
  const af = S.filter.toonAf
    ? pasFilterToe(afItems()).sort((a,b) => (b.afOp||0) - (a.afOp||0))
    : [];
  const f = S.filter;

  const winkelTellers = {};
  alleOpen.forEach(i => { const w = i.winkel || "nvt"; winkelTellers[w] = (winkelTellers[w]||0)+1; });

function bindLijst(){
  const zoekIn = $("#zoek-in");
  if(zoekIn){
    zoekIn.oninput = () => { S.filter.zoek = zoekIn.value; tekenAlleenInhoud(); };
    if(S.filter.zoekOpen && !S.filter.zoek) setTimeout(() => zoekIn.focus(), 60);
  }
  const zk = $("#k-zoek");
  if(zk) zk.onclick = () => {
    S.filter.zoekOpen = !S.filter.zoekOpen;
    if(!S.filter.zoekOpen) S.filter.zoek = "";
    tril(); tekenNu();
  };
  const zw = $("#zoek-wis");
  if(zw) zw.onclick = () => { S.filter.zoek = ""; tekenNu(); };
  const kf = $("#k-filter"); if(kf) kf.onclick = () => { tril(); sheetFilters(); };
  const kl = $("#k-leden");  if(kl) kl.onclick = () => { tril(); S.tab = "meer"; tekenNu(); };

  $$("[data-wfilter]").forEach(b => b.onclick = () => {
    S.filter.winkel = b.dataset.wfilter || null; tril(); tekenNu();
  });
  $$("[data-wisfilter]").forEach(b => b.onclick = () => {
    const k = b.dataset.wisfilter;
    if(k === "urgent") S.filter.urgent = false;
    else if(k === "zoek"){ S.filter.zoek = ""; S.filter.zoekOpen = false; }
    else S.filter[k] = null;
    tril(); tekenNu();
  });
  const waf = $("#wis-alle-filters");
  if(waf) waf.onclick = () => {
    S.filter = Object.assign(S.filter, {winkel:null, cat:null, door:null, urgent:false, zoek:"", zoekOpen:false});
    tekenNu();
  };
  $$("[data-winkelen]").forEach(b => b.onclick = () => {
    S.winkelSessie = {winkelId:b.dataset.winkelen, gestart:nu()};
    S.tab = "winkelen"; tril(); tekenNu();
  });

  $$("[data-vink]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const it = S.items.find(x => x.id === b.dataset.vink);
    if(!it) return;
    tril(12);
    const rij = b.closest(".item");
    if(!it.af && rij) rij.classList.add("af");
    await vinkItem(it, !it.af);
  });
  $$("[data-open]").forEach(el => el.onclick = () => {
    const it = S.items.find(x => x.id === el.dataset.open);
    if(it) sheetItem(it);
  });
  $$(".item-thumb").forEach(im => im.onclick = e => {
    e.stopPropagation();
    const it = S.items.find(x => x.id === im.closest(".item").dataset.item);
    if(it) openKijker(it.fotoId, it.tekst);
  });
  const wa = $("#wis-af");
  if(wa) wa.onclick = () => sheetOpruimen();
  const fab = $("#fab");
  if(fab) fab.onclick = () => { tril(); sheetToevoegen(); };

  volgScroll();
}

/* =====================================================================
   9 · BODEMPANEEL (sheet)
   ===================================================================== */
function sluitSheet(){
  $$(".overlay").forEach(ov => { ov.classList.remove("open"); setTimeout(() => ov.remove(), 240); });
  $$(".sheet").forEach(sh => {
    sh.removeAttribute("id");
    sh.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    sh.classList.remove("open");
    setTimeout(() => sh.remove(), 320);
  });
  S.sheet = null;
}
function sheet({titel, body, voet="", naTeken, sluitKnop=true}){
  /* een openstaand paneel gaat er meteen uit — anders staan er even twee
     panelen met dezelfde id's in de pagina en klik je op de verkeerde */
  const vervangt = !!$(".sheet");
  $$(".sheet").forEach(el => el.remove());
  let ov = $(".overlay");
  if(!ov){ ov = document.createElement("div"); ov.className = "overlay"; document.body.appendChild(ov); }
  ov.classList.remove("weg");
  const sh = document.createElement("div"); sh.className = "sheet" + (vervangt ? " open" : "");
  sh.innerHTML = `
    <div class="greep"></div>
    <div class="sheet-in">
      <div class="sheet-kop">
        <h2>${titel}</h2>
        ${sluitKnop ? `<button class="ikoonknop" id="sheet-dicht">${IK.kruis}</button>` : ""}
      </div>
      <div class="sheet-body">${body}</div>
      ${voet ? `<div class="sheet-voet">${voet}</div>` : ""}
    </div>`;
  document.body.appendChild(sh);
  requestAnimationFrame(() => { ov.classList.add("open"); sh.classList.add("open"); });
  /* de tik die dit paneel opende, komt op een telefoon vlak daarna nóg een keer
     als "click" binnen — die zou de overlay meteen weer sluiten */
  const geopend = nu();
  ov.onclick = () => { if(nu() - geopend > 400) sluitSheet(); };
  const d = $("#sheet-dicht"); if(d) d.onclick = sluitSheet;
  /* naar beneden vegen sluit ook */
  let start = null;
  const greep = sh.querySelector(".greep");
  const kop = sh.querySelector(".sheet-kop");
  [greep, kop].forEach(el => {
    el.addEventListener("touchstart", e => { start = e.touches[0].clientY; }, {passive:true});
    el.addEventListener("touchmove", e => {
      if(start === null) return;
      const dy = e.touches[0].clientY - start;
      if(dy > 0) sh.style.transform = `translateY(${dy}px)` + (window.innerWidth >= 660 ? "" : "");
    }, {passive:true});
    el.addEventListener("touchend", e => {
      const dy = (e.changedTouches[0].clientY - (start||0));
      sh.style.transform = "";
      if(dy > 90) sluitSheet();
      start = null;
    });
  });
  S.sheet = sh;
  if(naTeken) naTeken(sh);
  return sh;
}

function keuzeChips(naam, opties, huidig, extraKlas=""){

}
function bindKeuze(naam, opZet){

  vak.querySelectorAll(".keuze").forEach(b => b.onclick = () => {
    vak.querySelectorAll(".keuze").forEach(x => x.classList.remove("aan"));

function sheetToevoegen(voorinvul){
  const f = Object.assign({
    tekst:"", hoeveelheid:"", winkel:S.filter.winkel || "nvt", cat:S.filter.cat || "overig",
    notitie:"", urgent:false, fotoVb:null, fotoFile:null, catHandmatig:false
  }, voorinvul||{});

  const body = `
    <div class="veld">
      <label>Wat heb je nodig?</label>
      <input class="invoer" id="f-tekst" placeholder="Bijvoorbeeld melk" maxlength="60"
             autocomplete="off" autocapitalize="sentences" value="${esc(f.tekst)}">
      <div class="sugg" id="f-sugg"></div>
    </div>
    <div class="veld-rij">
      <div class="veld">
        <label>Hoeveel</label>
        <input class="invoer" id="f-hoev" placeholder="2 pakken" maxlength="18" autocomplete="off" value="${esc(f.hoeveelheid)}">
      </div>
      <div class="veld">
        <label>Spoed</label>
        <button type="button" class="schakel" id="f-urgent" style="width:100%">
          <span class="tk"><b style="font-size:14px">Snel nodig</b></span>
          <span class="tuimel ${f.urgent?"aan":""}"></span>
        </button>
      </div>
    </div>
    <div class="veld">
      <label>Waar te koop</label>
      ${keuzeChips("winkel", S.winkels.map(w => ({id:w.id, naam:w.naam, em:w.em})), f.winkel)}
    </div>
    <div class="veld">
      <label>Categorie</label>
      ${keuzeChips("cat", cats().map(c => ({id:c.id, naam:c.naam, em:c.em})), f.cat, "grijs")}
      <div class="hint verborgen" id="f-geleerd">${IK.ster} Onthouden van de vorige keer.</div>
    </div>
    <div class="veld">
      <label>Foto <span style="text-transform:none; letter-spacing:0; font-weight:500">(bijv. het merk of de verpakking)</span></label>
      <div class="fotovak">
        <button type="button" class="fotoknop" id="f-foto">${IK.camera}<span>Foto toevoegen</span></button>
        <div class="fotovb verborgen" id="f-fotovb"><img alt=""><button type="button" class="weg" id="f-fotoweg">${IK.kruis}</button></div>
      </div>
      <input type="file" accept="image/*" id="f-bestand" class="verborgen">
    </div>
    <div class="veld">
      <label>Notitie</label>
      <textarea class="invoer" id="f-notitie" placeholder="Merk, smaak, of waar het voor is…" maxlength="200">${esc(f.notitie)}</textarea>
    </div>`;

  const voet = `
    <button class="knop stil" id="f-annuleer" style="flex:0 0 auto">Annuleer</button>
    <button class="knop" id="f-opslaan" style="flex:1">${IK.plus} Op de lijst</button>`;

  sheet({titel:"Boodschap toevoegen", body, voet, naTeken:() => {
    const ti = $("#f-tekst");
    setTimeout(() => ti.focus(), 260);

    const tekenSugg = () => {
      const s = vaakGekocht(6, ti.value);
      $("#f-sugg").innerHTML = s.length
        ? s.map(v => `<button type="button" data-sug="${esc(v.tekst)}">${esc(v.tekst)}</button>`).join("")
        : "";
      $$("#f-sugg [data-sug]").forEach(b => b.onclick = () => {
        ti.value = b.dataset.sug; f.tekst = ti.value;
        const bron = Object.values(LS.get("boodschappen_vaak_" + P, {})).find(v => v.tekst === b.dataset.sug);
        if(bron){
          if(bron.cat) zetKeuze("cat", bron.cat), f.cat = bron.cat;
          if(bron.winkel && !S.filter.winkel) zetKeuze("winkel", bron.winkel), f.winkel = bron.winkel;
        }
        tril(6); tekenSugg(); $("#f-hoev").focus();
      });
    };
    const zetKeuze = (naam, waarde) => {
      const vak = document.querySelector(`[data-keuze="${naam}"]`);
      if(!vak) return;
      vak.querySelectorAll(".keuze").forEach(x => x.classList.toggle("aan", x.dataset.waarde === waarde));
      const aan = vak.querySelector(".keuze.aan"); if(aan) aan.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
    };
    tekenSugg();

    const toonGeleerd = tekst => {
      const vak = $("#f-geleerd");
      if(vak) vak.classList.toggle("verborgen", !geleerdeCategorie(tekst));
    };
    ti.oninput = () => {
      f.tekst = ti.value;
      tekenSugg();
      if(!f.catHandmatig){
        const geraden = raadCategorie(ti.value);
        if(geraden && geraden !== f.cat){ f.cat = geraden; zetKeuze("cat", geraden); }
      }
      toonGeleerd(ti.value);
    };
    ti.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("#f-hoev").focus(); } };
    $("#f-hoev").oninput = e => f.hoeveelheid = e.target.value;
    $("#f-notitie").oninput = e => f.notitie = e.target.value;
    $("#f-urgent").onclick = () => {
      f.urgent = !f.urgent; tril();
      $("#f-urgent .tuimel").classList.toggle("aan", f.urgent);
    };
    bindKeuze("winkel", v => f.winkel = v);
    bindKeuze("cat", v => {
      f.cat = v; f.catHandmatig = true;
      const vak = $("#f-geleerd"); if(vak) vak.classList.add("verborgen");
    });

    $("#f-foto").onclick = () => $("#f-bestand").click();
    $("#f-bestand").onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      $("#f-foto").innerHTML = `<span class="spinner"></span><span>Foto klaarmaken…</span>`;
      try{
        const {klein} = await verkleinFoto(file);
        f.fotoFile = file; f.fotoVb = klein;
        $("#f-fotovb").classList.remove("verborgen");
        $("#f-fotovb img").src = klein;
        $("#f-foto").innerHTML = `${IK.herhaal}<span>Andere foto</span>`;
      }catch(err){
        console.error(err); toast("Die foto lukte niet");
        $("#f-foto").innerHTML = `${IK.camera}<span>Foto toevoegen</span>`;
      }
      e.target.value = "";
    };
    $("#f-fotoweg").onclick = () => {
      f.fotoFile = null; f.fotoVb = null;
      $("#f-fotovb").classList.add("verborgen");
      $("#f-foto").innerHTML = `${IK.camera}<span>Foto toevoegen</span>`;
    };
    $("#f-annuleer").onclick = sluitSheet;

    $("#f-opslaan").onclick = async () => {
      const tekst = ti.value.trim();
      if(!tekst){ ti.focus(); ti.style.borderColor = "var(--rood)"; return; }
      const knop = $("#f-opslaan");
      knop.disabled = true; knop.innerHTML = `<span class="spinner"></span> Opslaan…`;
      try{
        let fotoId = null;
        if(f.fotoFile) fotoId = await bewaarFoto(f.fotoFile);
        const zouRaden = raadCategorie(tekst) || "overig";
        const zelfGekozen = f.catHandmatig && f.cat !== zouRaden;
        await nieuwItem({
          tekst, hoeveelheid:f.hoeveelheid.trim(), winkel:f.winkel, cat:f.cat,
          notitie:f.notitie.trim(), urgent:f.urgent, fotoId
        });
        if(zelfGekozen) await leerCategorie(tekst, f.cat);
        sluitSheet();
        toast(zelfGekozen ? "Onthouden: " + tekst + " is " + catVan(f.cat).naam.toLowerCase()
                          : tekst + " staat op de lijst",
              zelfGekozen ? "⭐" : "✓");
        tril(14);
      }catch(e){
        console.error(e); toast("Opslaan lukte niet");
        knop.disabled = false; knop.innerHTML = `${IK.plus} Op de lijst`;
      }
    };
  }});
}

          notitie:$("#b-notitie").value.trim(), urgent:f.urgent

        if(catGewijzigd) await leerCategorie(tekst, f.cat);
        sluitSheet();

              catGewijzigd ? "⭐" : "✓");
      }catch(e){ console.error(e); toast("Opslaan lukte niet"); knop.disabled = false; knop.innerHTML = "Opslaan"; }
    };
  }});

/* =====================================================================
   13 · SCHERM: WINKELEN
   ===================================================================== */
let wakeLock = null;
async function houdSchermAan(aan){
  try{
    if(aan && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(!aan && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && S.tab === "winkelen" && S.winkelSessie) houdSchermAan(true);
});

/* ---------- de rit: wat sla je over, wat staat ingeklapt ----------
   Dit is van jou alleen (je huisgenoot hoeft jouw ritje niet te zien) en
   blijft 8 uur bewaard, zodat je de app tussendoor mag afsluiten. */
const RIT = () => "boodschappen_rit_" + P;
function ritLaden(wid){
  const alles = LS.get(RIT(), {});
  const r = alles[wid];
  if(r && nu() - (r.tijd || 0) < 8 * 3600 * 1000) return r;
  return null;
}
function ritBewaren(){
  const s = S.winkelSessie; if(!s) return;
  const alles = LS.get(RIT(), {});
  alles[s.winkelId] = {over:s.over || [], handmatig:s.handmatig || {}, routeVan:s.routeVan || null, tijd:nu()};
  LS.zet(RIT(), alles);
}
function ritWissen(wid){
  const alles = LS.get(RIT(), {});
  delete alles[wid]; LS.zet(RIT(), alles);
}
function startRit(wid){
  const bewaard = ritLaden(wid) || {};
  S.winkelSessie = {
    winkelId: wid, gestart: nu(), gepakt: [],
    over: bewaard.over || [], handmatig: bewaard.handmatig || {},
    routeVan: bewaard.routeVan || null
  };
}

function schermWinkelen(){
  if(!S.winkelSessie) return schermWinkelKiezen();

  const sessie = S.winkelSessie;
  const wid = sessie.winkelId;
  const w = wid === "alles" ? {id:"alles", naam:"Alle winkels", em:"🧺", kleur:"var(--accent)"} : winkelVan(wid);

  const alleItems = S.items.filter(i => wid === "alles" ? true : (i.winkel||"nvt") === wid)
    .filter(i => !i.af || (sessie.gepakt||[]).includes(i.id) || (i.afOp||0) >= sessie.gestart);
  const overIds = new Set(sessie.over || []);
  const actief = alleItems.filter(i => !overIds.has(i.id));
  const later  = alleItems.filter(i => overIds.has(i.id));

  const gedaan = actief.filter(i => i.af).length;
  const pct = actief.length ? Math.round(gedaan / actief.length * 100) : 0;
  const klaar = actief.length > 0 && gedaan === actief.length;

  /* Loop je alles in één lijst af, dan kies je bovenin van welke winkel je de
     looproute wilt aanhouden. Bij één winkel is dat vanzelf die winkel. */
  const winkelsMetRoute = S.winkels
    .filter(x => x.id !== "nvt" && Array.isArray(x.route) && x.route.length)
    .sort((a,b) => (a.volgorde||50)-(b.volgorde||50));
  const routeVan = wid === "alles"
    ? (sessie.routeVan && winkelsMetRoute.some(x => x.id === sessie.routeVan) ? sessie.routeVan : null)
    : wid;
  const routeWinkel = routeVan ? winkelVan(routeVan) : null;
  const orde = catOrde(routeVan);
  const perCat = new Map();
  sorteerItems(actief, orde).forEach(i => {
    const c = catVan(i.cat);
    if(!perCat.has(c.id)) perCat.set(c.id, {c, items:[]});
    perCat.get(c.id).items.push(i);
  });
  const groepen = [...perCat.values()].sort((a,b) => catIndex(a.c.id, orde) - catIndex(b.c.id, orde));
  const heeftRoute = !!(routeWinkel && Array.isArray(routeWinkel.route) && routeWinkel.route.length);
  const handmatig = sessie.handmatig || {};

  return `
  <div class="scherm">
    <div class="kop" id="kop">
      <div class="kop-rij">
        <button class="ikoonknop" id="w-terug">${IK.terug}</button>
        <div class="kop-titel">
          <h1>${w.em} ${esc(w.naam)}</h1>
          <div class="sub">${gedaan} van ${actief.length} in de kar${later.length ? " · " + later.length + " niet nu" : ""}</div>
        </div>
        <button class="ikoonknop" id="w-plus">${IK.plus}</button>
      </div>
      ${wid === "alles" && winkelsMetRoute.length ? `
      <div class="chiprij">
        <span class="routelabel">${IK.route}</span>
        <button class="chip ${!routeVan?"aan":""}" data-routevan="">Standaard</button>
        ${winkelsMetRoute.map(x => `
          <button class="chip ${routeVan===x.id?"aan winkel":""}" data-routevan="${esc(x.id)}">
            <span>${x.em}</span>${esc(x.naam)}
          </button>`).join("")}
        <span class="rek">&nbsp;</span>
      </div>` : ""}
    </div>
    <div class="inhoud" id="inhoud">
      <div class="wrap">
        <div class="wm-kop">
          <div class="bovenrij">
            <div class="bol" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--bg-2)">${w.em}</div>
            <h2>${actief.length ? pct + "% gedaan" : "Niets te pakken"}</h2>
            ${klaar ? `<span style="font-size:26px">🎉</span>` : ""}
          </div>
          <div class="balk"><div style="width:${pct}%"></div></div>
          <div class="wm-tel">
            <span>${actief.length - gedaan} nog te pakken</span>
            <span>${gedaan}/${actief.length}</span>
          </div>
          ${actief.filter(i => !i.af).length > 1
            ? `<button class="wm-actie" id="w-allelater">${IK.later}<span>Alles niet nu</span></button>` : ""}
          ${heeftRoute ? `<div class="hint" style="text-align:center; margin-top:10px">
            ${IK.route.replace("<svg", '<svg style="width:13px;height:13px;vertical-align:-2px"')}
            Op volgorde van jullie looproute door ${esc(routeWinkel.naam)}.</div>`
          : (wid === "alles" && !winkelsMetRoute.length && actief.length > 2 ? `
            <div class="hint" style="text-align:center; margin-top:10px; line-height:1.5">
              Stel bij <b>Meer → Winkels</b> een looproute in, dan kun je deze lijst hier
              op de volgorde van die winkel zetten.</div>` : "")}
        </div>

        ${alleItems.length === 0 ? `
          <div class="leeg fade"><span class="em">✨</span><h3>Niets te halen hier</h3>
          <p>Er staat op dit moment niets op de lijst voor deze winkel.</p></div>`
        : groepen.map(g => {
            const gGedaan = g.items.filter(i => i.af).length;
            const allesAf = g.items.length > 0 && gGedaan === g.items.length;
            /* alleen inklappen als je er zelf op tikt — anders verdwijnt de
               boodschap die je net afvinkt onder je handen vandaan */
            const dicht = !!handmatig[g.c.id];
            return `
            <div class="sectie">
              <button class="groepkop ${dicht?"":"open"}" data-groep="${esc(g.c.id)}">
                <span class="chev">${IK.pijl}</span>
                <h2><span style="font-size:14px">${g.c.em}</span>${esc(g.c.naam)}</h2>
                <span class="teller ${allesAf?"klaar":""}">${gGedaan}/${g.items.length}</span>
                <span class="lijn"></span>
              </button>
              ${dicht ? "" : `<div class="lijst fade">${g.items.map(i => wmItemHtml(i, false)).join("")}</div>`}
            </div>`;
          }).join("")}

        ${later.length ? (() => {
          /* net als bij de categorieën betekent true hier "ingeklapt". Heb je er
             zelf nog niet op getikt, dan staat hij dicht — behalve als er verder
             niets te pakken is, want dan is dit het enige wat er te zien valt. */
          const laterDicht = (typeof handmatig.__later === "boolean")
            ? handmatig.__later : actief.length > 0;
          return `
          <div class="sectie">
            <button class="groepkop ${laterDicht ? "" : "open"}" data-groep="__later">
              <span class="chev">${IK.pijl}</span>
              <h2><span style="font-size:14px">⏭️</span>Niet nu</h2>
              <span class="teller">${later.length}</span>
              <span class="lijn"></span>
            </button>
            ${laterDicht
              ? `<div class="hint" style="padding-left:4px">Tik erop om te zien wat je hebt weggezet.</div>`
              : `<div class="lijst fade">${sorteerItems(later, orde).map(i => wmItemHtml(i, true)).join("")}</div>
                 <button class="wm-actie" id="w-alleterug" style="margin-top:10px">
                   ${IK.omhoog}<span>Alles weer meenemen</span></button>`}
          </div>`;
        })() : ""}

}

function bindWinkelen(){
  const t = $("#w-terug");
  if(t) t.onclick = () => { S.winkelSessie = null; houdSchermAan(false); tril(); tekenNu(); };
  const p = $("#w-plus");
  if(p) p.onclick = () => sheetToevoegen({winkel: S.winkelSessie.winkelId === "alles" ? "nvt" : S.winkelSessie.winkelId});
  $$("[data-start]").forEach(b => b.onclick = () => {
    startRit(b.dataset.start);
    tril(); houdSchermAan(true); tekenNu();
  });

  /* van welke winkel houden we de looproute aan? */
  $$("[data-routevan]").forEach(b => b.onclick = () => {
    S.winkelSessie.routeVan = b.dataset.routevan || null;
    ritBewaren(); tril(); tekenNu(); naarBoven();
  });

  /* categorie in- of uitklappen */
  $$("[data-groep]").forEach(b => b.onclick = () => {
    const cat = b.dataset.groep;
    S.winkelSessie.handmatig ||= {};
    S.winkelSessie.handmatig[cat] = b.classList.contains("open");
    ritBewaren(); tril(6); tekenNu();
  });

  /* niet nu halen — of toch weer meenemen */
  $$("[data-later]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.later;
    const over = S.winkelSessie.over ||= [];
    const stond = over.includes(id);
    S.winkelSessie.over = stond ? over.filter(x => x !== id) : [...over, id];
    ritBewaren(); tril(12); tekenNu();
  });
  const al = $("#w-allelater");
  if(al) al.onclick = () => {
    const wid = S.winkelSessie.winkelId;
    const nietAf = S.items
      .filter(i => wid === "alles" ? true : (i.winkel||"nvt") === wid)
      .filter(i => !i.af)
      .map(i => i.id);
    S.winkelSessie.over = [...new Set([...(S.winkelSessie.over||[]), ...nietAf])];
    S.winkelSessie.handmatig = Object.assign({}, S.winkelSessie.handmatig, {__later:false});
    ritBewaren(); tril(14); tekenNu(); naarBoven();
    toast("Tik aan wat je nu wél haalt", "⏭️");
  };
  const at = $("#w-alleterug");
  if(at) at.onclick = () => {
    S.winkelSessie.over = [];
    ritBewaren(); tril(); tekenNu();
    toast("Alles staat weer in je lijstje", "🧺");
  };

  $$("[data-wmitem]").forEach(el => el.onclick = async e => {
    if(e.target.closest("[data-wmfoto]") || e.target.closest("[data-later]")) return;
    const it = S.items.find(x => x.id === el.dataset.wmitem);
    if(!it) return;
    tril(14);
    el.classList.toggle("af", !it.af);
    (S.winkelSessie.gepakt ||= []).push(it.id);
    await vinkItem(it, !it.af);
  });
  $$("[data-wmfoto]").forEach(im => im.onclick = e => {
    e.stopPropagation();
    const it = S.items.find(x => x.id === im.dataset.wmfoto);
    if(it) openKijker(it.fotoId, it.tekst);
  });
  const k = $("#w-klaar");
  if(k) k.onclick = () => sheetAfrekenen();
  volgScroll();
}

/* welke winkel ligt het meest voor de hand? Bij "alle winkels" kijken we
   waar de boodschappen vandaan komen die je zojuist hebt afgevinkt. */
function winkelVoorstel(){
  const sessie = S.winkelSessie;
  if(!sessie) return "nvt";
  if(sessie.winkelId !== "alles") return sessie.winkelId;
  /* koos je bovenin de looproute van een winkel, dan sta je daar waarschijnlijk ook */
  if(sessie.routeVan && winkelVan(sessie.routeVan).id === sessie.routeVan) return sessie.routeVan;
  const tel = {};
  S.items.filter(i => i.af && (i.afOp||0) >= sessie.gestart)
         .forEach(i => { const w = i.winkel || "nvt"; tel[w] = (tel[w]||0) + 1; });
  const beste = Object.entries(tel).filter(([w]) => w !== "nvt").sort((a,b) => b[1]-a[1])[0];
  return beste ? beste[0] : "nvt";
}

  const wid = S.winkelSessie ? S.winkelSessie.winkelId : "alles";

/* =====================================================================
   BUDGET — rekenwerk
   ===================================================================== */
function budgetVoor(maand){
  const per = (S.budget && S.budget.perMaand) || {};
  if(per[maand] != null && per[maand] !== "") return Number(per[maand]) || 0;
  return Number((S.budget && S.budget.standaard) || 0);
}
function bonnenVan(maand){
  return S.bonnen.filter(b => maandSleutel(b.datum || b.gemaakt || 0) === maand);
}
function maandInfo(maand){
  const [jaar, mnd] = maand.split("-").map(Number);
  const dagenTotaal = new Date(jaar, mnd, 0).getDate();
  const n = new Date();
  const isNu = maand === maandSleutel(nu());
  const isToekomst = maand > maandSleutel(nu());
  const dagVandaag = isNu ? n.getDate() : (isToekomst ? 0 : dagenTotaal);
  return {jaar, mnd, dagenTotaal, dagVandaag, isNu, isToekomst,
          dagenOver: Math.max(0, dagenTotaal - dagVandaag + (isNu ? 1 : 0))};
}

/* =====================================================================
   14 · SCHERM: BUDGET
   ===================================================================== */
function schermBudget(){
  const maand = S.maand || maandSleutel(nu());
  const budget = budgetVoor(maand);
  const bonnen = bonnenVan(maand).sort((a,b) => (b.datum||0) - (a.datum||0));
  const uitgegeven = bonnen.reduce((s,b) => s + (Number(b.bedrag)||0), 0);
  const over = budget - uitgegeven;
  const deel = budget > 0 ? uitgegeven / budget : 0;
  const info = maandInfo(maand);

  /* maanden om tussen te wisselen: alles met bonnen, plus deze maand */
  const maanden = [...new Set([maandSleutel(nu()), ...S.bonnen.map(b => maandSleutel(b.datum||b.gemaakt||0))])]
    .filter(m => m > "2000-00").sort().reverse().slice(0, 13);

  return `
  <div class="scherm">
    <div class="kop" id="kop">
      <div class="kop-rij">
        <div class="kop-titel">
          <h1>Budget</h1>
          <div class="sub">${esc(maandNaam(maand))}${info.isNu && info.dagenOver ? " · nog " + info.dagenOver + (info.dagenOver===1?" dag":" dagen") : ""}</div>
        </div>
        <button class="ikoonknop" id="b-instel" aria-label="Budget instellen">${IK.tandwiel}</button>
        <button class="ikoonknop" id="b-plus" aria-label="Uitgave toevoegen">${IK.plus}</button>
      </div>
      ${maanden.length > 1 ? `
      <div class="chiprij">
        ${maanden.map(m => `<button class="chip ${maand===m?"aan":""}" data-maand="${esc(m)}">${esc(maandKort(m))}</button>`).join("")}
        <span class="rek">&nbsp;</span>
      </div>` : ""}
    </div>

    <div class="inhoud" id="inhoud">
      <div class="wrap">
        ${budget <= 0 ? geenBudgetKaart(uitgegeven, bonnen.length) : budgetKaart(budget, uitgegeven, over, deel, info)}
        ${budget > 0 ? statRij(bonnen, uitgegeven, info, budget) : ""}
        ${verdelingSectie(bonnen, uitgegeven)}
        ${uitgavenSectie(bonnen, maand)}
        ${maandenSectie(maand)}
      </div>
    </div>

    <button class="fab" id="b-fab">${IK.plus}<span>Uitgave</span></button>
  </div>`;
}

function geenBudgetKaart(uitgegeven, aantal){
  return `
  <div class="budgetkaart">
    <div style="font-size:38px; margin-bottom:8px">🎯</div>
    <div style="font-size:19px; font-weight:700; letter-spacing:var(--kop)">Nog geen maandbudget</div>
    <p style="color:var(--ink-2); font-size:14.5px; line-height:1.5; margin:8px 0 0">
      Stel in hoeveel jullie per maand aan boodschappen willen uitgeven.
      Daarna zie je hier in één oogopslag wat er nog over is.
    </p>
    ${aantal ? `<div class="hint" style="margin-top:10px">Deze maand al ${euro(uitgegeven)} uitgegeven in ${aantal} ${aantal===1?"bon":"bonnen"}.</div>` : ""}
    <button class="knop vol" id="b-instel2" style="margin-top:16px">${IK.euro} Budget instellen</button>
  </div>`;
}

function budgetKaart(budget, uitgegeven, over, deel, info){
  const O = 2 * Math.PI * 52;                       /* omtrek van de ring */
  const gevuld = Math.min(1, Math.max(0, deel));
  const kleur = deel > 1 ? "var(--rood)" : (deel > 0.85 ? "var(--geel)" : "var(--groen)");
  const procent = Math.round(deel * 100);

  /* ligt het uitgavetempo voor of achter op schema? */
  let tempo = "";
  if(info.isNu && info.dagVandaag > 0){
    const verwacht = budget * (info.dagVandaag / info.dagenTotaal);
    const verschil = verwacht - uitgegeven;
    if(over < 0){
      tempo = `<div class="tempo let">${IK.waarsch}<span>Je zit ${euro(-over)} boven het budget van deze maand</span></div>`;
    }else if(Math.abs(verschil) < budget * 0.03){
      tempo = `<div class="tempo neutraal">${IK.klok}<span>Je zit precies op schema</span></div>`;
    }else if(verschil > 0){
      tempo = `<div class="tempo goed">${IK.vink}<span>Je ligt ${euro(verschil)} voor op schema</span></div>`;
    }else{
      tempo = `<div class="tempo let">${IK.waarsch}<span>Je ligt ${euro(-verschil)} achter op schema</span></div>`;
    }
  }else if(!info.isToekomst){
    tempo = over >= 0
      ? `<div class="tempo goed">${IK.vink}<span>Deze maand ${euro(over)} onder het budget gebleven</span></div>`
      : `<div class="tempo let">${IK.waarsch}<span>Deze maand ${euro(-over)} over het budget gegaan</span></div>`;
  }

  const perDag = (info.isNu && info.dagenOver > 0 && over > 0) ? over / info.dagenOver : null;

  return `
  <div class="budgetkaart">
    <div class="ringvak">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="baan" cx="60" cy="60" r="52"></circle>
        <circle class="vul" cx="60" cy="60" r="52"
                style="stroke:${kleur}"
                stroke-dasharray="${O.toFixed(1)}"
                stroke-dashoffset="${(O * (1 - gevuld)).toFixed(1)}"></circle>
      </svg>
      <div class="ringtekst">
        <div class="groot" style="color:${over < 0 ? "var(--rood)" : "var(--ink)"}">${over < 0 ? "−" : ""}${euro(Math.abs(over))}</div>
        <div class="klein">${over < 0 ? "te veel" : "nog te gaan"}</div>
      </div>
    </div>
    <div class="onder">
      <b>${euro(uitgegeven)}</b> van ${euro(budget)} uitgegeven · ${procent}%
    </div>
    ${tempo}
    ${perDag !== null ? `<div class="hint" style="text-align:center; margin-top:10px">
      Dat is nog ${euro(perDag)} per dag voor de resterende ${info.dagenOver} ${info.dagenOver===1?"dag":"dagen"}.</div>` : ""}
  </div>`;
}

function statRij(bonnen, uitgegeven, info, budget){
  const dagenGeweest = Math.max(1, info.dagVandaag);
  const perDag = uitgegeven / dagenGeweest;
  const gem = bonnen.length ? uitgegeven / bonnen.length : 0;
  const verwachtEind = info.isNu ? perDag * info.dagenTotaal : uitgegeven;
  return `
  <div class="stat-rij">
    <div class="stat"><b>${bonnen.length}</b><span>${bonnen.length===1?"uitgave":"uitgaven"}</span></div>
    <div class="stat"><b>${euro(perDag)}</b><span>per dag</span></div>
    <div class="stat">
      <b style="color:${verwachtEind > budget ? "var(--rood)" : "var(--ink)"}">${euro(verwachtEind)}</b>
      <span>${info.isNu ? "einde maand" : "totaal"}</span>
    </div>
  </div>`;
}

function verdelingSectie(bonnen, uitgegeven){
  if(!bonnen.length) return "";
  const perWinkel = new Map();
  bonnen.forEach(b => {
    const w = winkelVan(b.winkel);
    if(!perWinkel.has(w.id)) perWinkel.set(w.id, {w, som:0, n:0});
    const v = perWinkel.get(w.id);
    v.som += Number(b.bedrag)||0; v.n++;
  });
  const lijst = [...perWinkel.values()].sort((a,b) => b.som - a.som);
  const grootste = lijst[0].som || 1;
  return `
  <div class="sectie">
    <div class="sectie-kop"><h2>Waar gaat het heen</h2><span class="lijn"></span></div>
    <div class="lijst">
      ${lijst.map(v => `
        <div class="verdeel">
          <div class="rij1">
            <span class="em">${v.w.em}</span>
            <b>${esc(v.w.naam)}</b>
            <span class="eur">${euro(v.som)}</span>
            <span class="pct">${uitgegeven ? Math.round(v.som/uitgegeven*100) : 0}%</span>
          </div>
          <div class="staaf"><div style="width:${(v.som/grootste*100).toFixed(1)}%; background:${esc(v.w.kleur)}"></div></div>
        </div>`).join("")}
    </div>
  </div>`;
}

function uitgavenSectie(bonnen, maand){
  if(!bonnen.length){
    return `
    <div class="leeg fade"><span class="em">🧾</span><h3>Nog geen uitgaven</h3>
    <p>Noteer na het winkelen wat je hebt uitgegeven, dan loopt de teller mee.</p>

function maandenSectie(huidigeMaand){
  const perMaand = new Map();
  S.bonnen.forEach(b => {
    const m = maandSleutel(b.datum || b.gemaakt || 0);
    perMaand.set(m, (perMaand.get(m)||0) + (Number(b.bedrag)||0));
  });
  const nuM = maandSleutel(nu());
  perMaand.set(nuM, perMaand.get(nuM) || 0);
  const maanden = [...perMaand.keys()].filter(m => m > "2000-00").sort().slice(-6);
  if(maanden.length < 2) return "";

  const budgetten = maanden.map(m => budgetVoor(m));
  const top = Math.max(...maanden.map(m => perMaand.get(m)||0), ...budgetten, 1) * 1.12;

  return `
  <div class="sectie">
    <div class="sectie-kop"><h2>Per maand</h2><span class="lijn"></span>
      <span class="telw">gemiddeld ${euro(maanden.reduce((s,m)=>s+(perMaand.get(m)||0),0)/maanden.length)}</span>
    </div>
    <div class="lijst">
      <div class="maandgrafiek">
        ${maanden.map(m => {
          const som = perMaand.get(m) || 0;
          const bud = budgetVoor(m);
          const h = Math.max(3, som/top*86);
          const doel = bud > 0 ? (bud/top*86) : null;
          return `<button class="mkolom ${m===huidigeMaand?"nu":""} ${bud>0&&som>bud?"over":""}" data-maand="${esc(m)}">
            <span class="mbedrag">${som >= 100 ? "€" + Math.round(som) : euro(som)}</span>
            <span class="staafvak">
              ${doel !== null ? `<span class="mdoel" style="bottom:${doel.toFixed(1)}px"></span>` : ""}
              <span class="mstaaf" style="height:${h.toFixed(1)}px"></span>
            </span>
            <span class="mlabel">${new Date(Number(m.slice(0,4)), Number(m.slice(5,7))-1, 1).toLocaleDateString("nl-NL",{month:"short"}).replace(".","")}</span>
          </button>`;
        }).join("")}
      </div>
      <div class="hint" style="padding:0 15px 13px; text-align:center">
        De stippellijn is het budget van die maand.
      </div>
    </div>
  </div>`;
}

function bindBudget(){
  const instel = () => sheetBudgetInstellen();
  [$("#b-instel"), $("#b-instel2")].forEach(b => { if(b) b.onclick = instel; });
  [$("#b-plus"), $("#b-plus2"), $("#b-fab")].forEach(b => { if(b) b.onclick = () => { tril(); sheetUitgave(); }; });
  $$("[data-maand]").forEach(b => b.onclick = () => {
    S.maand = b.dataset.maand; tril(); tekenNu();
    naarBoven();
  });
  $$("[data-bon]").forEach(b => b.onclick = () => {
    const bon = S.bonnen.find(x => x.id === b.dataset.bon);
    if(bon) sheetUitgaveDetail(bon);
  });
  volgScroll();
}

/* ---------- budget instellen ---------- */
function sheetBudgetInstellen(){
  const maand = S.maand || maandSleutel(nu());
  const standaard = Number((S.budget && S.budget.standaard) || 0);
  const perMaand = (S.budget && S.budget.perMaand) || {};
  const heeftEigen = perMaand[maand] != null && perMaand[maand] !== "";
  const body = `
    <p style="margin:0 0 16px; color:var(--ink-2); font-size:14.5px; line-height:1.5">
      Hoeveel willen jullie per maand aan boodschappen uitgeven? Dit geldt voor jullie samen
      en je huisgenoot ziet dezelfde teller.
    </p>
    <div class="veld">
      <label>Budget per maand</label>
      <div style="position:relative">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:24px; font-weight:700; color:var(--muted)">€</span>
        <input class="invoer" id="bi-bedrag" inputmode="decimal" placeholder="400"
               value="${standaard ? String(standaard).replace(".", ",") : ""}"
               style="font-size:26px; font-weight:700; text-align:center; letter-spacing:-.02em; padding-left:40px">
      </div>
      <div class="sugg" id="bi-sugg">
        ${[250, 300, 400, 500, 600].map(n => `<button type="button" data-snel="${n}">€${n}</button>`).join("")}
      </div>
    </div>
    <div class="veld">
      <label>Alleen voor ${esc(maandNaam(maand))}</label>
      <button type="button" class="schakel" id="bi-eigen" style="width:100%">
        <span class="tk"><b>Afwijkend bedrag deze maand</b>
          <span>handig voor een feestmaand of een lange vakantie</span></span>
        <span class="tuimel ${heeftEigen?"aan":""}"></span>
      </button>
      <div class="${heeftEigen?"":"verborgen"}" id="bi-eigenvak" style="margin-top:10px">
        <input class="invoer" id="bi-eigenbedrag" inputmode="decimal" placeholder="Budget voor deze maand"
               value="${heeftEigen ? String(perMaand[maand]).replace(".", ",") : ""}"
               style="text-align:center; font-weight:650">
      </div>
    </div>`;
  const voet = `
    <button class="knop stil" id="bi-annuleer" style="flex:0 0 auto">Annuleer</button>
    <button class="knop" id="bi-opslaan" style="flex:1">Opslaan</button>`;

  sheet({titel:"Maandbudget", body, voet, naTeken:() => {
    const inp = $("#bi-bedrag");
    setTimeout(() => inp.focus(), 250);
    let eigenAan = heeftEigen;
    $$("#bi-sugg [data-snel]").forEach(b => b.onclick = () => { inp.value = b.dataset.snel; tril(6); });
    $("#bi-eigen").onclick = () => {
      eigenAan = !eigenAan; tril();
      $("#bi-eigen .tuimel").classList.toggle("aan", eigenAan);
      $("#bi-eigenvak").classList.toggle("verborgen", !eigenAan);
      if(eigenAan) $("#bi-eigenbedrag").focus();
    };
    $("#bi-annuleer").onclick = sluitSheet;
    $("#bi-opslaan").onclick = async () => {
      const lees = el => Number(String(el.value).replace(",", ".").replace(/[^0-9.]/g,"")) || 0;
      const bedrag = lees(inp);
      if(bedrag <= 0){ inp.focus(); inp.style.borderColor = "var(--rood)"; return; }
      const nieuwPer = Object.assign({}, perMaand);
      if(eigenAan){
        const eigen = lees($("#bi-eigenbedrag"));
        if(eigen > 0) nieuwPer[maand] = eigen; else delete nieuwPer[maand];
      }else delete nieuwPer[maand];
      const knop = $("#bi-opslaan");
      knop.disabled = true; knop.innerHTML = `<span class="spinner"></span> Opslaan…`;
      try{
        await DB.zet(PAD.meta + "/budget", {standaard:bedrag, perMaand:nieuwPer, gewijzigdDoor:S.ik.id, gewijzigdOp:nu()});
        S.budget = {standaard:bedrag, perMaand:nieuwPer};
        sluitSheet(); tekenNu(); toast("Budget ingesteld op " + euro(budgetVoor(maand)), "🎯");
      }catch(e){ console.error(e); toast("Opslaan lukte niet"); knop.disabled = false; knop.innerHTML = "Opslaan"; }
    };
  }});
}

/* ---------- uitgave toevoegen of aanpassen ---------- */
function datumVoorVeld(ts){
  const d = new Date(ts || nu());
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function veldNaarDatum(s){
  const [j,m,d] = String(s||"").split("-").map(Number);
  if(!j || !m || !d) return nu();
  return new Date(j, m-1, d, 12, 0, 0).getTime();
}
