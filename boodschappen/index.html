<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boodschappen">
<meta name="theme-color" content="#F2EDE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191713" media="(prefers-color-scheme: dark)">
<meta name="description" content="De boodschappenlijst van Huisje OVS — voor Merel en Jelle samen.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Huisje OVS — Boodschappen</title>
<style>
/* =====================================================================
   HUISJE OVS · BOODSCHAPPEN
   Ontwerp: warm beige, rustig, strak. Alles in één bestand.
   ===================================================================== */

:root{
  --bg:#F2EDE4;
  --bg-2:#EAE3D6;
  --card:#FBF8F3;
  --card-2:#F6F1E8;
  --ink:#2E2A24;
  --ink-2:#5C554A;
  --muted:#918878;
  --line:#E4DBCA;
  --line-2:#D6CAB4;
  --accent:#8C6E4F;
  --accent-ink:#FFF9F0;
  --accent-zacht:#EFE4D5;
  --groen:#6E8B62;
  --groen-zacht:#E4EBDF;
  --rood:#B85C43;
  --rood-zacht:#F6E3DC;
  --geel:#C9A227;
  --schaduw:0 1px 2px rgba(60,45,25,.05), 0 8px 24px -12px rgba(60,45,25,.18);
  --schaduw-op:0 2px 6px rgba(60,45,25,.08), 0 20px 40px -16px rgba(60,45,25,.30);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --kop:-0.02em;
  --nav-h:64px;
  --vt:.22s cubic-bezier(.32,.72,0,1);
}
html[data-thema="donker"]{
  --bg:#191713;
  --bg-2:#12100D;
  --card:#221F1A;
  --card-2:#2A2620;
  --ink:#F1EBE1;
  --ink-2:#C8BFB1;
  --muted:#928A7C;
  --line:#332E27;
  --line-2:#433C32;
  --accent:#C9A67C;
  --accent-ink:#241D14;
  --accent-zacht:#33291F;
  --groen:#93B183;
  --groen-zacht:#25302172;
  --rood:#D98168;
  --rood-zacht:#3A241D;
  --geel:#DFBE4E;
  --schaduw:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.7);
  --schaduw-op:0 2px 8px rgba(0,0,0,.4), 0 24px 48px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  transition:background .25s ease, color .25s ease;
}
input,button,select,textarea{font:inherit; color:inherit;}
button{border:none; background:none; padding:0; cursor:pointer;}
::selection{background:var(--accent-zacht); color:var(--ink);}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:0; height:0;}

/* ---------- app frame ---------- */
#app{min-height:100dvh; display:flex; flex-direction:column;}
.scherm{flex:1; display:flex; flex-direction:column; min-height:0;}
.inhoud{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px; margin:0 auto; width:100%;}

/* ---------- kop ---------- */
.kop{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;
  transition:border-color .2s ease;
}
.kop.geplakt{border-bottom-color:var(--line);}
.kop-rij{max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px;}
.kop-titel{flex:1; min-width:0;}
.kop-titel h1{
  margin:0; font-size:22px; font-weight:700; letter-spacing:var(--kop);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.kop-titel .sub{font-size:12.5px; color:var(--muted); margin-top:1px; letter-spacing:.01em;}
.kop-acties{display:flex; align-items:center; gap:6px;}

.ikoonknop{
  width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
  color:var(--ink-2); background:transparent; transition:background var(--vt), transform var(--vt);
}
.ikoonknop:active{transform:scale(.9); background:var(--bg-2);}
.ikoonknop.aan{background:var(--accent); color:var(--accent-ink);}
.ikoonknop svg{width:21px; height:21px; stroke-width:1.9;}

/* ---------- avatars ---------- */
.av{
  width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; letter-spacing:.02em; color:#fff;
  flex:none; position:relative; user-select:none;
}
.av.mini{width:20px; height:20px; font-size:9px; border-radius:50%;}
.av.groot{width:52px; height:52px; font-size:18px;}
.av.xl{width:76px; height:76px; font-size:26px;}
.av .stip{
  position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%;
  background:var(--groen); border:2px solid var(--bg);
}
.av-stapel{display:flex;}
.av-stapel .av{margin-left:-8px; box-shadow:0 0 0 2px var(--bg);}
.av-stapel .av:first-child{margin-left:0;}

/* ---------- zoek ---------- */
.zoekbalk{position:relative; margin:10px auto 0; max-width:620px;}
.zoekbalk svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--muted); pointer-events:none;
}
.zoekbalk input{
  width:100%; padding:11px 38px 11px 38px; border-radius:var(--r-m);
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:15.5px; outline:none; transition:border-color var(--vt), box-shadow var(--vt);
}
.zoekbalk input::placeholder{color:var(--muted);}
.zoekbalk input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-zacht);}
.zoek-wis{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--muted);
}

/* ---------- chips ---------- */
.chiprij{
  display:flex; gap:7px; overflow-x:auto; padding:10px 16px 2px;
  margin:0 -16px; scrollbar-width:none;
}
.chiprij::-webkit-scrollbar{display:none;}
.chiprij .rek{flex:none; width:0;}
.chip{
  flex:none; display:inline-flex; align-items:center; gap:6px;
  padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--card); border:1px solid var(--line); color:var(--ink-2);
  white-space:nowrap; transition:all var(--vt); letter-spacing:.005em;
}
.chip:active{transform:scale(.95);}
.chip.aan{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip.aan.winkel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.chip .telw{
  font-size:11px; font-weight:700; opacity:.6; font-variant-numeric:tabular-nums;
}
.chip .punt{width:8px; height:8px; border-radius:50%; flex:none;}

/* ---------- secties & kaarten ---------- */
.sectie{margin-top:22px;}
.sectie-kop{
  display:flex; align-items:center; gap:9px; padding:0 4px 8px;
}
.sectie-kop h2{
  margin:0; font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:7px;
}
.sectie-kop .lijn{flex:1; height:1px; background:var(--line);}
.sectie-kop .telw{
  font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;
  background:var(--bg-2); padding:2px 7px; border-radius:999px;
}
.sectie-kop button.mini{
  font-size:12px; font-weight:600; color:var(--accent); padding:4px 8px; border-radius:8px;
}
.sectie-kop button.mini:active{background:var(--accent-zacht);}

.lijst{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-l);
  overflow:hidden; box-shadow:var(--schaduw);
}

/* ---------- item ---------- */
.item{
  display:flex; align-items:flex-start; gap:12px; padding:12px 14px;
  border-bottom:1px solid var(--line); position:relative;
  background:var(--card); transition:background var(--vt);
}
.item:last-child{border-bottom:none;}
.item:active{background:var(--card-2);}
.item.af .item-tekst{text-decoration:line-through; color:var(--muted);}
.item.af .item-mid{opacity:.6;}
.item.weg{animation:wegvegen .3s ease forwards;}
@keyframes wegvegen{to{opacity:0; transform:translateX(24px); max-height:0; padding-top:0; padding-bottom:0;}}
.item.nieuw{animation:erin .35s cubic-bezier(.32,.72,0,1);}
@keyframes erin{from{opacity:0; transform:translateY(-6px);}}

.vink{
  width:26px; height:26px; border-radius:50%; flex:none; margin-top:1px;
  border:2px solid var(--line-2); display:grid; place-items:center;
  transition:all var(--vt); background:transparent;
}
.vink:active{transform:scale(.85);}
.vink svg{width:15px; height:15px; stroke-width:3; color:#fff; opacity:0; transform:scale(.5); transition:all var(--vt);}
.item.af .vink{background:var(--groen); border-color:var(--groen);}
.item.af .vink svg{opacity:1; transform:scale(1);}

.item-mid{flex:1; min-width:0;}
.item-titelrij{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
.item-tekst{font-size:16px; font-weight:600; letter-spacing:-.005em; word-break:break-word;}
.item-hoev{
  font-size:12.5px; font-weight:700; color:var(--accent);
  background:var(--accent-zacht); padding:1px 7px; border-radius:7px; flex:none;
}
.item-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:4px; font-size:12.5px; color:var(--muted);
}
.item-meta .stuk{display:inline-flex; align-items:center; gap:4px;}
.item-meta svg{width:12px; height:12px; stroke-width:2.2;}
.item-notitie{
  margin-top:5px; font-size:13.5px; color:var(--ink-2); line-height:1.4;
  padding-left:9px; border-left:2px solid var(--line-2);
}
.vlag{
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; border-radius:6px; background:var(--rood-zacht); color:var(--rood); flex:none;
}
.item-thumb{
  width:46px; height:46px; border-radius:var(--r-s); object-fit:cover; flex:none;
  background:var(--bg-2); border:1px solid var(--line); margin-top:1px;
}
.item-thumb.laden{animation:pols 1.4s ease-in-out infinite;}
@keyframes pols{50%{opacity:.45;}}

/* ---------- lege staat ---------- */
.leeg{
  text-align:center; padding:54px 24px; color:var(--muted);
}
.leeg .em{font-size:40px; display:block; margin-bottom:10px; opacity:.85;}
.leeg h3{margin:0 0 5px; font-size:17px; font-weight:700; color:var(--ink); letter-spacing:var(--kop);}
.leeg p{margin:0; font-size:14px; line-height:1.5; max-width:280px; margin-inline:auto;}

/* ---------- knoppen ---------- */
.knop{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--r-m); font-size:15.5px; font-weight:650;
  background:var(--accent); color:var(--accent-ink); letter-spacing:.005em;
  transition:transform var(--vt), opacity var(--vt), background var(--vt);
}
.knop:active{transform:scale(.97); opacity:.9;}
.knop.vol{width:100%;}
.knop.stil{background:var(--card); color:var(--ink); border:1px solid var(--line);}
.knop.zacht{background:var(--accent-zacht); color:var(--accent);}
.knop.groen{background:var(--groen); color:#fff;}
.knop.gevaar{background:var(--rood-zacht); color:var(--rood);}
.knop.klein{padding:9px 14px; font-size:14px; border-radius:var(--r-s);}
.knop[disabled]{opacity:.45; pointer-events:none;}
.knop svg{width:18px; height:18px; stroke-width:2.2;}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:16px; z-index:40;
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  height:54px; padding:0 22px 0 18px; border-radius:999px;
  background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; gap:8px; font-size:16px; font-weight:650;
  box-shadow:0 6px 20px -4px rgba(90,65,35,.45); letter-spacing:-.005em;
  transition:transform var(--vt), box-shadow var(--vt);
}
.fab:active{transform:scale(.94);}
.fab svg{width:22px; height:22px; stroke-width:2.4;}
@media(min-width:660px){ .fab{right:calc(50vw - 310px);} }

/* ---------- navigatie ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(16px);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-rij{display:flex; max-width:620px; margin:0 auto; height:var(--nav-h);}
.nav-knop{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:10.5px; font-weight:650; letter-spacing:.01em;
  transition:color var(--vt); position:relative;
}
.nav-knop svg{width:23px; height:23px; stroke-width:1.9; transition:transform var(--vt);}
.nav-knop:active svg{transform:scale(.86);}
.nav-knop.aan{color:var(--accent);}
.nav-knop .bel{
  position:absolute; top:8px; left:50%; margin-left:6px;
  min-width:17px; height:17px; padding:0 5px; border-radius:999px;
  background:var(--rood); color:#fff; font-size:10px; font-weight:700;
  display:grid; place-items:center; font-variant-numeric:tabular-nums;
}

/* ---------- bottom sheet ---------- */
.overlay{
  position:fixed; inset:0; z-index:80; background:rgba(35,26,14,.42);
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
  opacity:0; transition:opacity var(--vt);
}
.overlay.open{opacity:1;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:81;
  background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--schaduw-op);
  transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:92dvh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{transform:translateY(0);}
.sheet-in{max-width:620px; margin:0 auto; width:100%; display:flex; flex-direction:column; min-height:0;}
.greep{
  width:38px; height:4.5px; border-radius:999px; background:var(--line-2);
  margin:9px auto 4px; flex:none;
}
.sheet-kop{
  display:flex; align-items:center; gap:10px; padding:6px 18px 12px; flex:none;
}
.sheet-kop h2{margin:0; font-size:19px; font-weight:700; letter-spacing:var(--kop); flex:1;}
.sheet-body{overflow-y:auto; padding:0 18px 18px; -webkit-overflow-scrolling:touch;}
.sheet-voet{
  padding:12px 18px calc(12px + env(safe-area-inset-bottom)); flex:none;
  border-top:1px solid var(--line); background:var(--bg);
  display:flex; gap:10px;
}
@media(min-width:660px){
  .sheet{left:50%; transform:translate(-50%,100%); width:620px; border-radius:var(--r-xl);
         bottom:20px; max-height:86dvh;}
  .sheet.open{transform:translate(-50%,0);}
}

/* ---------- formulier ---------- */
.veld{margin-bottom:15px;}
.veld > label{
  display:block; font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); margin-bottom:7px; padding-left:2px;
}
.invoer{
  width:100%; padding:13px 14px; border-radius:var(--r-m);
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  font-size:16px; outline:none; transition:border-color var(--vt), box-shadow var(--vt);
}
.invoer::placeholder{color:var(--muted);}
.invoer:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-zacht);}
textarea.invoer{resize:none; line-height:1.45; min-height:74px;}
.veld-rij{display:flex; gap:10px;}
.veld-rij > *{flex:1; min-width:0;}

.keuzes{display:flex; flex-wrap:wrap; gap:7px;}
.keuze{
  display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px;
  font-size:14px; font-weight:600; background:var(--card); border:1px solid var(--line);
  color:var(--ink-2); transition:all var(--vt);
}
.keuze:active{transform:scale(.95);}
.keuze.aan{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.keuze.aan.grijs{background:var(--ink); border-color:var(--ink); color:var(--bg);}

.schakel{
  display:flex; align-items:center; gap:12px; padding:13px 14px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m);
}
.schakel .tk{flex:1; min-width:0;}
.schakel .tk b{display:block; font-size:15px; font-weight:650;}
.schakel .tk span{font-size:12.5px; color:var(--muted);}
.tuimel{
  width:48px; height:29px; border-radius:999px; background:var(--line-2); flex:none;
  position:relative; transition:background var(--vt);
}
.tuimel::after{
  content:""; position:absolute; top:2.5px; left:2.5px; width:24px; height:24px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform var(--vt);
}
.tuimel.aan{background:var(--groen);}
.tuimel.aan::after{transform:translateX(19px);}

/* ---------- foto in formulier ---------- */
.fotovak{
  display:flex; gap:10px; align-items:center;
}
.fotoknop{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:14px; border-radius:var(--r-m); border:1.5px dashed var(--line-2);
  color:var(--ink-2); font-size:14.5px; font-weight:600; background:var(--card);
  transition:all var(--vt);
}
.fotoknop:active{background:var(--card-2); transform:scale(.98);}
.fotoknop svg{width:19px; height:19px; stroke-width:2;}
.fotovb{
  position:relative; width:82px; height:82px; border-radius:var(--r-m); overflow:hidden;
  border:1px solid var(--line); flex:none; background:var(--bg-2);
}
.fotovb img{width:100%; height:100%; object-fit:cover; display:block;}
.fotovb .weg{
  position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
  background:rgba(20,14,6,.62); color:#fff; display:grid; place-items:center;
  backdrop-filter:blur(4px);
}
.fotovb .weg svg{width:13px; height:13px; stroke-width:2.6;}

/* ---------- suggesties ---------- */
.sugg{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px;}
.sugg button{
  padding:7px 12px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--accent-zacht); color:var(--accent); border:1px solid transparent;
  transition:transform var(--vt);
}
.sugg button:active{transform:scale(.94);}

/* ---------- winkelmodus ---------- */
.wm-kop{
  padding:16px; border-radius:var(--r-l); background:var(--card);
  border:1px solid var(--line); box-shadow:var(--schaduw); margin-top:14px;
}
.wm-kop .bovenrij{display:flex; align-items:center; gap:12px;}
.wm-kop h2{margin:0; font-size:20px; font-weight:700; letter-spacing:var(--kop); flex:1;}
.balk{height:8px; border-radius:999px; background:var(--bg-2); overflow:hidden; margin-top:12px;}
.balk > div{
  height:100%; border-radius:999px; background:var(--groen);
  transition:width .4s cubic-bezier(.32,.72,0,1);
}
.wm-tel{
  font-size:13px; color:var(--muted); margin-top:7px; display:flex; justify-content:space-between;
  font-variant-numeric:tabular-nums;
}
.winkelkaart{
  display:flex; align-items:center; gap:13px; padding:15px 16px;
  border-bottom:1px solid var(--line); transition:background var(--vt);
}
.winkelkaart:last-child{border-bottom:none;}
.winkelkaart:active{background:var(--card-2);}
.winkelkaart .bol{
  width:42px; height:42px; border-radius:13px; display:grid; place-items:center;
  font-size:19px; flex:none;
}
.winkelkaart .tk{flex:1; min-width:0;}
.winkelkaart .tk b{display:block; font-size:16px; font-weight:650; letter-spacing:-.005em;}
.winkelkaart .tk span{font-size:13px; color:var(--muted);}

/* “tomaten” en “tomaat”, “broodjes” en “brood”: terug naar de stam */
function stam(w){
  let s = String(w||"").toLowerCase().replace(/[^a-zà-ÿ]/g, "");
  s = s.replace(/(tjes|jes|tje)$/, "");
  s = s.replace(/(en|s)$/, "");
  s = s.replace(/([bdfgklmnprst])\1$/, "$1");     // pakken → pak
  s = s.replace(/aa([bdfgklmnprstz])$/, "a$1");   // tomaten → tomat → tomaat-achtig
  return s;
}
const RAAD_STAM = {};
for(const [cat, woorden] of Object.entries(RAAD)){
  for(const w of woorden){
    for(const deel of w.split(" ")){
      const s = stam(deel);
      if(s.length >= 3 && !(s in RAAD_STAM)) RAAD_STAM[s] = cat;
    }
  }
}
function raadCategorie(tekst){
  const t = String(tekst||"").toLowerCase().trim();
  if(!t) return null;
  const heel = stam(t);
  if(heel.length >= 3 && RAAD_STAM[heel]) return RAAD_STAM[heel];
  const woorden = t.split(/[\s,./-]+/).filter(Boolean);
  for(const woord of woorden){
    const s = stam(woord);
    if(s.length >= 3 && RAAD_STAM[s]) return RAAD_STAM[s];
  }
  /* samengestelde woorden: volkorenbrood, wasmiddel, sinaasappelsap */
  for(const woord of woorden){
    const s = stam(woord);
    if(s.length < 5) continue;
    let besteLengte = 0, besteCat = null;
    for(const [sleutel, cat] of Object.entries(RAAD_STAM)){
      if(sleutel.length >= 4 && sleutel.length > besteLengte && s.includes(sleutel)){
        besteLengte = sleutel.length; besteCat = cat;
      }
    }
    if(besteCat) return besteCat;
  }
  return null;
}

function datumKort(ts){
  if(!ts) return "";
  const d = new Date(ts), n = new Date();
  const zelfdeDag = d.toDateString() === n.toDateString();
  const gisteren = new Date(n.getTime() - 864e5).toDateString() === d.toDateString();
  const tijd = d.toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"});
  if(zelfdeDag) return tijd;
  if(gisteren) return "gisteren " + tijd;
  const dagen = Math.round((n - d) / 864e5);
  if(dagen < 7) return d.toLocaleDateString("nl-NL", {weekday:"short"}) + " " + tijd;
  return d.toLocaleDateString("nl-NL", {day:"numeric", month:"short"});
}

}

   2 · OPSLAG — demo (dit apparaat) of Firestore (gedeeld)
   ===================================================================== */
const LS = {
  get(k, val){ try{ const s = localStorage.getItem(k); return s === null ? val : JSON.parse(s); }catch(e){ return val; } },
  zet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  weg(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

function demoDB(){
  const SLEUTEL = "boodschappen_demo_" + P;
  let store = LS.get(SLEUTEL, {});
  const luisteraars = {};
  const bewaar = () => LS.zet(SLEUTEL, store);
  const herlaad = () => { store = LS.get(SLEUTEL, {}); };
  const meld = col => (luisteraars[col]||[]).forEach(cb => cb(alles(col)));
  const alles = col => Object.entries(store[col]||{}).map(([id,d]) => ({id, ...d}));
  window.addEventListener("storage", e => {
    if(e.key === SLEUTEL){ herlaad(); Object.keys(luisteraars).forEach(meld); }
  });
  return {
    demo:true,
    luister(col, cb){
      (luisteraars[col] ||= []).push(cb);
      herlaad(); setTimeout(() => cb(alles(col)), 0);
      return () => { luisteraars[col] = (luisteraars[col]||[]).filter(f => f !== cb); };
    },
    async voegToe(col, data){ herlaad(); const i = id6(); (store[col] ||= {})[i] = data; bewaar(); meld(col); return i; },
    async zet(pad, data){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      (store[col] ||= {})[i] = Object.assign({}, store[col][i]||{}, data); bewaar(); meld(col);
    },
    async wis(pad){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      if(store[col]){ delete store[col][i]; bewaar(); meld(col); }
    },
    async haal(pad){
      herlaad(); const d = pad.split("/"); const i = d.pop(); const col = d.join("/");
      return store[col] && store[col][i] ? {id:i, ...store[col][i]} : null;
    },
    async haalAlles(col){ herlaad(); return alles(col); }
  };
}

async function firestoreDB(){
  const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(CFG.firebase);
  let db;
  try{
    db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
  }catch(e){ db = F.getFirestore(app); }
  const colRef = p => F.collection(db, ...p.split("/"));
  const docRef = p => F.doc(db, ...p.split("/"));
  return {
    demo:false,
    luister(col, cb){
      return F.onSnapshot(colRef(col),
        s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))),
        e => { console.error("luister", col, e); toonSyncFout(e); });
    },
    /* Firestore lost een schrijfactie pas in als de server hem bevestigt.
       De lokale cache is meteen bij, dus we wachten daar niet op: zo werkt de
       app ook met een slechte verbinding of helemaal offline gewoon door. */
    async voegToe(col, data){
      const i = id6();
      F.setDoc(docRef(col + "/" + i), data).catch(e => { console.error("schrijven", col, e); toonSyncFout(e); });
      return i;
    },
    async zet(pad, data){
      F.setDoc(docRef(pad), data, {merge:true}).catch(e => { console.error("schrijven", pad, e); toonSyncFout(e); });
    },
    async wis(pad){
      F.deleteDoc(docRef(pad)).catch(e => { console.error("wissen", pad, e); toonSyncFout(e); });
    },
    async haal(pad){ const s = await F.getDoc(docRef(pad)); return s.exists() ? {id:s.id, ...s.data()} : null; },
    async haalAlles(col){ const s = await F.getDocs(colRef(col)); return s.docs.map(d => ({id:d.id, ...d.data()})); }
  };
}

/* =====================================================================
   4 · FOTO'S — verkleinen, opslaan, ophalen
   ===================================================================== */
function leesBestand(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function laadPlaatje(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}
function schaal(im, maxZij, kwaliteit){
  const f = Math.min(1, maxZij / Math.max(im.width, im.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(im.width * f);
  cv.height = Math.round(im.height * f);
  const ct = cv.getContext("2d");
  ct.fillStyle = "#fff"; ct.fillRect(0,0,cv.width,cv.height);
  ct.drawImage(im, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", kwaliteit);
}
/* geeft {groot, klein} terug — allebei data-urls */
async function verkleinFoto(file){
  const ruw = await leesBestand(file);
  const im = await laadPlaatje(ruw);
  let groot = schaal(im, 1280, 0.72);
  let q = 0.72;
  while(groot.length > 780000 && q > 0.32){ q -= 0.1; groot = schaal(im, 1280, q); }
  if(groot.length > 780000) groot = schaal(im, 900, 0.5);
  const klein = schaal(im, 220, 0.55);
  return {groot, klein};
}
async function bewaarFoto(file){
  const {groot, klein} = await verkleinFoto(file);
  const fid = id6();
  await DB.zet(PAD.fotos + "/" + fid, {data:groot, gemaakt:nu()});
  await DB.zet(PAD.fotos + "/" + fid + "_k", {data:klein, gemaakt:nu()});
  S.fotoCache[fid] = groot;
  S.fotoCache[fid + "_k"] = klein;
  return fid;
}
async function haalFoto(fid){
  if(!fid) return null;
  if(S.fotoCache[fid]) return S.fotoCache[fid];
  const d = await DB.haal(PAD.fotos + "/" + fid);
  if(d && d.data){ S.fotoCache[fid] = d.data; return d.data; }
  return null;
}
/* vult <img data-foto="..."> zodra het plaatje binnen is */
async function vulFotos(root){
  const els = Array.from((root||document).querySelectorAll("img[data-foto]"));
  for(const el of els){
    const fid = el.dataset.foto;
    el.removeAttribute("data-foto");
    const d = await haalFoto(fid);
    if(d){ el.src = d; el.classList.remove("laden"); }
    else { el.classList.remove("laden"); el.style.visibility = "hidden"; }
  }
}
async function wisFoto(fid){
  if(!fid) return;
  try{ await DB.wis(PAD.fotos + "/" + fid); await DB.wis(PAD.fotos + "/" + fid + "_k"); }catch(e){}
  delete S.fotoCache[fid]; delete S.fotoCache[fid + "_k"];
}

   ===================================================================== */
async function hashPin(naam, pin){
  const tekst = "huisje-ovs::" + String(naam).toLowerCase().trim() + "::" + pin;
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tekst));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    let h = 5381;
    for(let i=0;i<tekst.length;i++){ h = ((h<<5) + h + tekst.charCodeAt(i)) | 0; }
    return "s" + (h >>> 0).toString(16);
  }
}

  const onder = herhaal ? "Voer dezelfde vier cijfers nog eens in."
              : nieuw   ? "Vier cijfers. Die heb je voortaan nodig<br>om de lijst te openen."
                        : `Hoi ${esc(IN.lid?.naam||"")} — voer je pincode in.`;
  return `<div class="inlog fade">
    <div class="merk">
      ${IN.lid ? `<div style="display:grid;place-items:center;margin-bottom:14px">${AV.html(IN.lid,"xl")}</div>`
               : `<div class="logo">${IK.slot}</div>`}
      <h1>${titel}</h1>
      <p>${onder}</p>
    </div>
    <div class="pinvakken">
      ${[0,1,2,3].map(i => `<div class="pinvak ${pin.length>i?"vol":""} ${IN.fout?"fout":""}">${pin[i]?"•":""}</div>`).join("")}
    </div>
    <div class="hint" style="text-align:center; min-height:20px; color:${IN.fout?"var(--rood)":"var(--muted)"}">
      ${IN.fout ? "Dat klopt niet. Probeer het opnieuw." : ""}
    </div>
    <div class="toetsen">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="toets" data-cijfer="${n}">${n}</button>`).join("")}
      <button class="toets fn" id="pin-terug">Terug</button>
      <button class="toets" data-cijfer="0">0</button>

}

function bindInlog(){
  $$("[data-lid]").forEach(b => b.onclick = () => {
    IN.lid = lidVan(b.dataset.lid); IN.pin = ""; IN.fout = false;
    IN.stap = IN.lid && IN.lid.pinHash ? "pin" : "pin-nieuw";
    tril(); tekenInlog();
  });
  const nw = $("#nieuw-account");
  if(nw) nw.onclick = () => { IN.stap = "naam"; IN.naam = ""; tril(); tekenInlog(); };

  const nin = $("#naam-in");
  if(nin){
    setTimeout(() => nin.focus(), 120);
    const door = () => {
      const n = nin.value.trim();
      if(n.length < 2){ $("#naam-hint").textContent = "Vul minstens twee letters in."; $("#naam-hint").style.color = "var(--rood)"; return; }
      if(S.leden.some(l => l.naam.toLowerCase() === n.toLowerCase())){
        $("#naam-hint").textContent = "Die naam bestaat al — kies hem in de lijst hiervoor.";
        $("#naam-hint").style.color = "var(--rood)"; return;
      }
      IN.naam = n; IN.lid = null; IN.pin = ""; IN.pin2 = ""; IN.stap = "pin-nieuw"; tekenInlog();
    };
    $("#naam-door").onclick = door;
    nin.onkeydown = e => { if(e.key === "Enter") door(); };
    $("#naam-terug").onclick = () => { IN.stap = "kies"; tekenInlog(); };
  }

  $$("[data-cijfer]").forEach(b => b.onclick = () => {
    const veld = IN.stap === "pin-herhaal" ? "pin2" : "pin";
    if(IN[veld].length >= 4) return;
    IN[veld] += b.dataset.cijfer; IN.fout = false; tril(6);
    tekenInlog();
    if(IN[veld].length === 4) setTimeout(pinKlaar, 130);
  });
  const wis = $("#pin-wis");
  if(wis) wis.onclick = () => {
    const veld = IN.stap === "pin-herhaal" ? "pin2" : "pin";
    IN[veld] = IN[veld].slice(0,-1); IN.fout = false; tril(6); tekenInlog();
  };
  const pt = $("#pin-terug");
  if(pt) pt.onclick = () => {
    if(IN.stap === "pin-herhaal"){ IN.stap = "pin-nieuw"; IN.pin = ""; IN.pin2 = ""; }
    else if(IN.stap === "pin-nieuw" && !IN.lid){ IN.stap = "naam"; }
    else { IN.stap = "kies"; IN.lid = null; IN.pin = ""; }
    IN.fout = false; tekenInlog();
  };
  const pv = $("#pin-vergeten");
  if(pv) pv.onclick = () => {
    alert("Pincode vergeten?\n\nVraag " + (S.leden.filter(l => l.id !== IN.lid?.id)[0]?.naam || "de ander") +
          " om de app te openen en bij Meer → Huisgenoten jouw pincode te wissen. Daarna kies je een nieuwe.");
  };
}

async function pinKlaar(){
  if(IN.bezig) return;
  IN.bezig = true;
  try{
    if(IN.stap === "pin"){
      const h = await hashPin(IN.lid.naam, IN.pin);
      if(h === IN.lid.pinHash){ await inloggenAls(IN.lid.id); return; }
      IN.fout = true; IN.pin = ""; tril(60); tekenInlog();
    }
    else if(IN.stap === "pin-nieuw"){
      IN.stap = "pin-herhaal"; IN.pin2 = ""; tekenInlog();
    }
    else if(IN.stap === "pin-herhaal"){
      if(IN.pin !== IN.pin2){
        IN.fout = true; IN.pin = ""; IN.pin2 = ""; IN.stap = "pin-nieuw"; tril(60); tekenInlog();
        setTimeout(() => toast("De codes waren niet gelijk", "🔒"), 100);
        return;
      }
      const naam = IN.lid ? IN.lid.naam : IN.naam;
      const h = await hashPin(naam, IN.pin);
      if(IN.lid){
        await DB.zet(PAD.leden + "/" + IN.lid.id, {pinHash:h});
        await inloggenAls(IN.lid.id);
      }else{
        const lid = {
          naam,
          kleur: KLEUREN[S.leden.length % KLEUREN.length],
          pinHash: h, gemaakt: nu(), laatstGezien: nu()
        };
        const nid = await DB.voegToe(PAD.leden, lid);
        S.leden.push({id:nid, ...lid});
        await inloggenAls(nid);
      }
    }
  }catch(e){
    console.error(e); toast("Er ging iets mis — probeer opnieuw");
    IN.fout = true; IN.pin = ""; IN.pin2 = ""; tekenInlog();
  }finally{ IN.bezig = false; }
}

async function inloggenAls(lidId){
  const lid = lidVan(lidId);
  S.ik = {id:lidId, naam: lid ? lid.naam : "Ik"};
  LS.zet("boodschappen_ik_" + P, S.ik);
  try{ await DB.zet(PAD.leden + "/" + lidId, {laatstGezien: nu()}); }catch(e){}
  IN.pin = ""; IN.pin2 = ""; IN.fout = false;
  startHartslag();
  tekenNu();
  setTimeout(() => toast("Welkom, " + (lid?.naam.split(" ")[0] || "") + "!", "👋"), 260);
}

function uitloggen(){
  LS.weg("boodschappen_ik_" + P);
  S.ik = null; IN.stap = "kies"; IN.lid = null; IN.pin = ""; IN.pin2 = "";
  /* wie hierna inlogt begint gewoon weer bovenaan de lijst */
  S.tab = "lijst"; S.winkelSessie = null; S.bonMaand = null;
  S.filter = Object.assign(S.filter, {winkel:null, cat:null, door:null, urgent:false, zoek:"", zoekOpen:false});
  clearInterval(hartslagTimer);
  houdSchermAan(false);
  tekenNu();
}

let hartslagTimer = null;
function startHartslag(){
  clearInterval(hartslagTimer);
  const tik = () => { if(S.ik && document.visibilityState === "visible") DB.zet(PAD.leden + "/" + S.ik.id, {laatstGezien: nu()}).catch(()=>{}); };
  tik();
  hartslagTimer = setInterval(tik, 90*1000);
}

/* =====================================================================
   7 · ITEMS — filteren, groeperen, acties
   ===================================================================== */
function openItems(){ return S.items.filter(i => !i.af); }
function afItems(){ return S.items.filter(i => i.af); }

function pasFilterToe(lijst){
  const f = S.filter;
  const z = f.zoek.trim().toLowerCase();
  return lijst.filter(i => {
    if(f.winkel && (i.winkel || "nvt") !== f.winkel) return false;
    if(f.cat && (i.cat || "overig") !== f.cat) return false;
    if(f.door && i.door !== f.door) return false;
    if(f.urgent && !i.urgent) return false;
    if(z){
      const hooi = [i.tekst, i.notitie, i.hoeveelheid, winkelVan(i.winkel).naam, catVan(i.cat).naam].join(" ").toLowerCase();
      if(!hooi.includes(z)) return false;
    }
    return true;
  });
}
function filterActief(){
  const f = S.filter;
  return !!(f.cat || f.door || f.urgent || f.zoek.trim());
}
function sorteerItems(lijst){
  return [...lijst].sort((a,b) => {
    if(!!b.urgent !== !!a.urgent) return b.urgent ? 1 : -1;
    const ca = catIndex(a.cat), cb = catIndex(b.cat);
    if(ca !== cb) return ca - cb;
    return (a.gemaakt||0) - (b.gemaakt||0);
  });
}
function groepeer(lijst){
  const groepen = new Map();
  if(S.filter.groep === "cat"){
    for(const i of sorteerItems(lijst)){
      const c = catVan(i.cat);
      if(!groepen.has(c.id)) groepen.set(c.id, {sleutel:c.id, naam:c.naam, em:c.em, kleur:null, items:[]});
      groepen.get(c.id).items.push(i);
    }
    return [...groepen.values()].sort((a,b) => catIndex(a.sleutel) - catIndex(b.sleutel));
  }
  for(const i of sorteerItems(lijst)){
    const w = winkelVan(i.winkel);
    if(!groepen.has(w.id)) groepen.set(w.id, {sleutel:w.id, naam:w.naam, em:w.em, kleur:w.kleur, volgorde:w.volgorde||50, items:[]});
    groepen.get(w.id).items.push(i);
  }
  return [...groepen.values()].sort((a,b) => (a.volgorde||50) - (b.volgorde||50) || a.naam.localeCompare(b.naam));
}

async function nieuwItem(data){
  const item = Object.assign({
    tekst:"", hoeveelheid:"", winkel:"nvt", cat:"overig", notitie:"", fotoId:null,
    urgent:false, af:false, door:S.ik.id, gemaakt:nu()
  }, data);
  const iid = await DB.voegToe(PAD.items, item);
  onthoudVoorSuggestie(item);
  return iid;
}
async function vinkItem(item, af){
  await DB.zet(PAD.items + "/" + item.id, af
    ? {af:true, afDoor:S.ik.id, afOp:nu()}
    : {af:false, afDoor:null, afOp:null});
}
async function verwijderItem(item){
  await wisFoto(item.fotoId);
  await DB.wis(PAD.items + "/" + item.id);
}

/* onthoudt wat je vaak koopt, voor de snelknoppen bij toevoegen */
function onthoudVoorSuggestie(item){
  const t = (item.tekst||"").trim();
  if(t.length < 2) return;
  const lijst = LS.get("boodschappen_vaak_" + P, {});
  const k = t.toLowerCase();
  lijst[k] = {tekst:t, n:(lijst[k]?.n||0)+1, winkel:item.winkel, cat:item.cat, laatst:nu()};
  LS.zet("boodschappen_vaak_" + P, lijst);
}
function vaakGekocht(n=8, zoek=""){
  const lijst = Object.values(LS.get("boodschappen_vaak_" + P, {}));
  const opLijst = new Set(openItems().map(i => (i.tekst||"").toLowerCase()));
  const z = zoek.trim().toLowerCase();
  return lijst
    .filter(v => !opLijst.has(v.tekst.toLowerCase()))
    .filter(v => !z || v.tekst.toLowerCase().includes(z))
    .sort((a,b) => (b.n - a.n) || (b.laatst - a.laatst))
    .slice(0, n);
}

      ${f.zoekOpen || f.zoek ? `

      <div class="chiprij">

function bindLijst(){
  const zoekIn = $("#zoek-in");
  if(zoekIn){
    zoekIn.oninput = () => { S.filter.zoek = zoekIn.value; tekenAlleenInhoud(); };
    if(S.filter.zoekOpen && !S.filter.zoek) setTimeout(() => zoekIn.focus(), 60);
  }
  const zk = $("#k-zoek");
  if(zk) zk.onclick = () => {
    S.filter.zoekOpen = !S.filter.zoekOpen;
    if(!S.filter.zoekOpen) S.filter.zoek = "";
    tril(); tekenNu();
  };
  const zw = $("#zoek-wis");
  if(zw) zw.onclick = () => { S.filter.zoek = ""; tekenNu(); };
  const kf = $("#k-filter"); if(kf) kf.onclick = () => { tril(); sheetFilters(); };
  const kl = $("#k-leden");  if(kl) kl.onclick = () => { tril(); S.tab = "meer"; tekenNu(); };

  $$("[data-wfilter]").forEach(b => b.onclick = () => {
    S.filter.winkel = b.dataset.wfilter || null; tril(); tekenNu();
  });
  $$("[data-wisfilter]").forEach(b => b.onclick = () => {
    const k = b.dataset.wisfilter;
    if(k === "urgent") S.filter.urgent = false;
    else if(k === "zoek"){ S.filter.zoek = ""; S.filter.zoekOpen = false; }
    else S.filter[k] = null;
    tril(); tekenNu();
  });
  const waf = $("#wis-alle-filters");
  if(waf) waf.onclick = () => {
    S.filter = Object.assign(S.filter, {winkel:null, cat:null, door:null, urgent:false, zoek:"", zoekOpen:false});
    tekenNu();
  };
  $$("[data-winkelen]").forEach(b => b.onclick = () => {
    S.winkelSessie = {winkelId:b.dataset.winkelen, gestart:nu()};
    S.tab = "winkelen"; tril(); tekenNu();
  });

  $$("[data-vink]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const it = S.items.find(x => x.id === b.dataset.vink);
    if(!it) return;
    tril(12);
    const rij = b.closest(".item");
    if(!it.af && rij) rij.classList.add("af");
    await vinkItem(it, !it.af);
  });
  $$("[data-open]").forEach(el => el.onclick = () => {
    const it = S.items.find(x => x.id === el.dataset.open);
    if(it) sheetItem(it);
  });
  $$(".item-thumb").forEach(im => im.onclick = e => {
    e.stopPropagation();
    const it = S.items.find(x => x.id === im.closest(".item").dataset.item);
    if(it) openKijker(it.fotoId, it.tekst);
  });
  const wa = $("#wis-af");

  const fab = $("#fab");
  if(fab) fab.onclick = () => { tril(); sheetToevoegen(); };

  const inh = $("#inhoud"), kop = $("#kop");
  if(inh && kop) inh.onscroll = () => kop.classList.toggle("geplakt", inh.scrollTop > 4);
}

/* =====================================================================
   9 · BODEMPANEEL (sheet)
   ===================================================================== */
function sluitSheet(){
  $$(".overlay").forEach(ov => { ov.classList.remove("open"); setTimeout(() => ov.remove(), 240); });
  $$(".sheet").forEach(sh => {
    sh.removeAttribute("id");
    sh.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    sh.classList.remove("open");
    setTimeout(() => sh.remove(), 320);
  });
  S.sheet = null;
}
function sheet({titel, body, voet="", naTeken, sluitKnop=true}){
  /* een openstaand paneel gaat er meteen uit — anders staan er even twee
     panelen met dezelfde id's in de pagina en klik je op de verkeerde */
  const vervangt = !!$(".sheet");
  $$(".sheet").forEach(el => el.remove());
  let ov = $(".overlay");
  if(!ov){ ov = document.createElement("div"); ov.className = "overlay"; document.body.appendChild(ov); }
  ov.classList.remove("weg");
  const sh = document.createElement("div"); sh.className = "sheet" + (vervangt ? " open" : "");
  sh.innerHTML = `
    <div class="greep"></div>
    <div class="sheet-in">
      <div class="sheet-kop">
        <h2>${titel}</h2>
        ${sluitKnop ? `<button class="ikoonknop" id="sheet-dicht">${IK.kruis}</button>` : ""}
      </div>
      <div class="sheet-body">${body}</div>
      ${voet ? `<div class="sheet-voet">${voet}</div>` : ""}
    </div>`;
  document.body.appendChild(sh);
  requestAnimationFrame(() => { ov.classList.add("open"); sh.classList.add("open"); });
  /* de tik die dit paneel opende, komt op een telefoon vlak daarna nóg een keer
     als "click" binnen — die zou de overlay meteen weer sluiten */
  const geopend = nu();
  ov.onclick = () => { if(nu() - geopend > 400) sluitSheet(); };
  const d = $("#sheet-dicht"); if(d) d.onclick = sluitSheet;
  /* naar beneden vegen sluit ook */
  let start = null;
  const greep = sh.querySelector(".greep");
  const kop = sh.querySelector(".sheet-kop");
  [greep, kop].forEach(el => {
    el.addEventListener("touchstart", e => { start = e.touches[0].clientY; }, {passive:true});
    el.addEventListener("touchmove", e => {
      if(start === null) return;
      const dy = e.touches[0].clientY - start;
      if(dy > 0) sh.style.transform = `translateY(${dy}px)` + (window.innerWidth >= 660 ? "" : "");
    }, {passive:true});
    el.addEventListener("touchend", e => {
      const dy = (e.changedTouches[0].clientY - (start||0));
      sh.style.transform = "";
      if(dy > 90) sluitSheet();
      start = null;
    });
  });
  S.sheet = sh;
  if(naTeken) naTeken(sh);
  return sh;
}

function keuzeChips(naam, opties, huidig, extraKlas=""){
  return `<div class="keuzes" data-keuze="${naam}">
    ${opties.map(o => `
      <button type="button" class="keuze ${extraKlas} ${o.id===huidig?"aan":""}" data-waarde="${esc(o.id)}">
        ${o.em ? `<span>${o.em}</span>` : ""}${esc(o.naam)}
      </button>`).join("")}
  </div>`;
}
function bindKeuze(naam, opZet){
  const vak = document.querySelector(`[data-keuze="${naam}"]`);
  if(!vak) return;
  vak.querySelectorAll(".keuze").forEach(b => b.onclick = () => {
    vak.querySelectorAll(".keuze").forEach(x => x.classList.remove("aan"));
    b.classList.add("aan"); tril(6);
    opZet(b.dataset.waarde);
  });
}

function sheetToevoegen(voorinvul){
  const f = Object.assign({
    tekst:"", hoeveelheid:"", winkel:S.filter.winkel || "nvt", cat:S.filter.cat || "overig",
    notitie:"", urgent:false, fotoVb:null, fotoFile:null, catHandmatig:false

    </div>
    <div class="veld-rij">
      <div class="veld">
        <label>Hoeveel</label>

      </div>

        <label>Spoed</label>
        <button type="button" class="schakel" id="f-urgent" style="width:100%">

      ${keuzeChips("winkel", S.winkels.map(w => ({id:w.id, naam:w.naam, em:w.em})), f.winkel)}
    </div>
    <div class="veld">
      <label>Categorie</label>
      ${keuzeChips("cat", CATS.map(c => ({id:c.id, naam:c.naam, em:c.em})), f.cat, "grijs")}
    </div>
    <div class="veld">
      <label>Foto <span style="text-transform:none; letter-spacing:0; font-weight:500">(bijv. het merk of de verpakking)</span></label>

        <button type="button" class="fotoknop" id="f-foto">${IK.camera}<span>Foto toevoegen</span></button>
        <div class="fotovb verborgen" id="f-fotovb"><img alt=""><button type="button" class="weg" id="f-fotoweg">${IK.kruis}</button></div>
      </div>
      <input type="file" accept="image/*" id="f-bestand" class="verborgen">
    </div>
    <div class="veld">
      <label>Notitie</label>
      <textarea class="invoer" id="f-notitie" placeholder="Merk, smaak, of waar het voor is…" maxlength="200">${esc(f.notitie)}</textarea>
    </div>`;

  const voet = `
    <button class="knop stil" id="f-annuleer" style="flex:0 0 auto">Annuleer</button>
    <button class="knop" id="f-opslaan" style="flex:1">${IK.plus} Op de lijst</button>`;

  sheet({titel:"Boodschap toevoegen", body, voet, naTeken:() => {
    const ti = $("#f-tekst");
    setTimeout(() => ti.focus(), 260);

    const tekenSugg = () => {
      const s = vaakGekocht(6, ti.value);
      $("#f-sugg").innerHTML = s.length
        ? s.map(v => `<button type="button" data-sug="${esc(v.tekst)}">${esc(v.tekst)}</button>`).join("")
        : "";
      $$("#f-sugg [data-sug]").forEach(b => b.onclick = () => {
        ti.value = b.dataset.sug; f.tekst = ti.value;
        const bron = Object.values(LS.get("boodschappen_vaak_" + P, {})).find(v => v.tekst === b.dataset.sug);
        if(bron){
          if(bron.cat) zetKeuze("cat", bron.cat), f.cat = bron.cat;
          if(bron.winkel && !S.filter.winkel) zetKeuze("winkel", bron.winkel), f.winkel = bron.winkel;
        }
        tril(6); tekenSugg(); $("#f-hoev").focus();
      });
    };
    const zetKeuze = (naam, waarde) => {
      const vak = document.querySelector(`[data-keuze="${naam}"]`);
      if(!vak) return;
      vak.querySelectorAll(".keuze").forEach(x => x.classList.toggle("aan", x.dataset.waarde === waarde));
      const aan = vak.querySelector(".keuze.aan"); if(aan) aan.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
    };
    tekenSugg();

    ti.oninput = () => {
      f.tekst = ti.value;
      tekenSugg();
      if(!f.catHandmatig){
        const geraden = raadCategorie(ti.value);
        if(geraden && geraden !== f.cat){ f.cat = geraden; zetKeuze("cat", geraden); }
      }
    };
    ti.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("#f-hoev").focus(); } };
    $("#f-hoev").oninput = e => f.hoeveelheid = e.target.value;
    $("#f-notitie").oninput = e => f.notitie = e.target.value;
    $("#f-urgent").onclick = () => {
      f.urgent = !f.urgent; tril();
      $("#f-urgent .tuimel").classList.toggle("aan", f.urgent);
    };
    bindKeuze("winkel", v => f.winkel = v);
    bindKeuze("cat", v => { f.cat = v; f.catHandmatig = true; });

    $("#f-foto").onclick = () => $("#f-bestand").click();
    $("#f-bestand").onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      $("#f-foto").innerHTML = `<span class="spinner"></span><span>Foto klaarmaken…</span>`;
      try{
        const {klein} = await verkleinFoto(file);
        f.fotoFile = file; f.fotoVb = klein;
        $("#f-fotovb").classList.remove("verborgen");
        $("#f-fotovb img").src = klein;
        $("#f-foto").innerHTML = `${IK.herhaal}<span>Andere foto</span>`;
      }catch(err){
        console.error(err); toast("Die foto lukte niet");
        $("#f-foto").innerHTML = `${IK.camera}<span>Foto toevoegen</span>`;
      }
      e.target.value = "";
    };
    $("#f-fotoweg").onclick = () => {
      f.fotoFile = null; f.fotoVb = null;
      $("#f-fotovb").classList.add("verborgen");
      $("#f-foto").innerHTML = `${IK.camera}<span>Foto toevoegen</span>`;
    };
    $("#f-annuleer").onclick = sluitSheet;

    $("#f-opslaan").onclick = async () => {
      const tekst = ti.value.trim();
      if(!tekst){ ti.focus(); ti.style.borderColor = "var(--rood)"; return; }
      const knop = $("#f-opslaan");
      knop.disabled = true; knop.innerHTML = `<span class="spinner"></span> Opslaan…`;
      try{
        let fotoId = null;
        if(f.fotoFile) fotoId = await bewaarFoto(f.fotoFile);
        await nieuwItem({
          tekst, hoeveelheid:f.hoeveelheid.trim(), winkel:f.winkel, cat:f.cat,
          notitie:f.notitie.trim(), urgent:f.urgent, fotoId
        });
        sluitSheet();
        toast(tekst + " staat op de lijst", "✓");
        tril(14);
      }catch(e){
        console.error(e); toast("Opslaan lukte niet");
        knop.disabled = false; knop.innerHTML = `${IK.plus} Op de lijst`;
      }
    };
  }});
}

let wakeLock = null;
async function houdSchermAan(aan){
  try{
    if(aan && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); }
    else if(!aan && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && S.tab === "winkelen" && S.winkelSessie) houdSchermAan(true);
});

function schermWinkelen(){
  if(!S.winkelSessie) return schermWinkelKiezen();

  const wid = S.winkelSessie.winkelId;
  const w = wid === "alles" ? {id:"alles", naam:"Alle winkels", em:"🧺", kleur:"var(--accent)"} : winkelVan(wid);
  const alle = S.items.filter(i => wid === "alles" ? true : (i.winkel||"nvt") === wid)
                      .filter(i => !i.af || (S.winkelSessie.gepakt||[]).includes(i.id) || (i.afOp||0) >= S.winkelSessie.gestart);
  const gedaan = alle.filter(i => i.af).length;
  const pct = alle.length ? Math.round(gedaan / alle.length * 100) : 0;

  const perCat = new Map();
  sorteerItems(alle).forEach(i => {
    const c = catVan(i.cat);
    if(!perCat.has(c.id)) perCat.set(c.id, {c, items:[]});
    perCat.get(c.id).items.push(i);
  });
  const groepen = [...perCat.values()].sort((a,b) => catIndex(a.c.id) - catIndex(b.c.id));

  return `
  <div class="scherm">
    <div class="kop" id="kop">
      <div class="kop-rij">
        <button class="ikoonknop" id="w-terug">${IK.terug}</button>
        <div class="kop-titel">
          <h1>${w.em} ${esc(w.naam)}</h1>
          <div class="sub">${gedaan} van ${alle.length} in de kar</div>
        </div>
        <button class="ikoonknop" id="w-plus">${IK.plus}</button>
      </div>
    </div>
    <div class="inhoud" id="inhoud">
      <div class="wrap">
        <div class="wm-kop">
          <div class="bovenrij">
            <div class="bol" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--bg-2)">${w.em}</div>
            <h2>${pct}% gedaan</h2>
            ${gedaan === alle.length && alle.length ? `<span style="font-size:26px">🎉</span>` : ""}
          </div>
          <div class="balk"><div style="width:${pct}%"></div></div>
          <div class="wm-tel">
            <span>${alle.length - gedaan} nog te pakken</span>
            <span>${gedaan}/${alle.length}</span>
          </div>
        </div>

        ${alle.length === 0 ? `
          <div class="leeg fade"><span class="em">✨</span><h3>Niets te halen hier</h3>
          <p>Er staat op dit moment niets op de lijst voor deze winkel.</p></div>`
        : groepen.map(g => `
          <div class="sectie">
            <div class="sectie-kop">
              <h2><span style="font-size:14px">${g.c.em}</span>${esc(g.c.naam)}</h2>
              <span class="telw">${g.items.filter(i=>!i.af).length}</span>
              <span class="lijn"></span>
            </div>
            <div class="lijst">${g.items.map(wmItemHtml).join("")}</div>
          </div>`).join("")}

        ${alle.length ? `
        <button class="knop ${gedaan===alle.length?"groen":"stil"} vol" id="w-klaar" style="margin-top:24px">
          ${IK.bon} Klaar met winkelen
        </button>
        <div class="hint" style="text-align:center">Je kunt daarna meteen noteren wat je betaald hebt.</div>` : ""}
      </div>
    </div>
  </div>`;
}

function wmItemHtml(i){
  const lid = lidVan(i.door);
  return `
  <div class="wm-item ${i.af?"af":""}" data-wmitem="${esc(i.id)}">
    <span class="vink">${IK.vink}</span>
    <div class="tk">
      <b>${i.hoeveelheid ? `<span class="item-hoev" style="font-size:13px;vertical-align:2px">${esc(i.hoeveelheid)}</span> ` : ""}${esc(i.tekst)}${i.urgent && !i.af ? ` <span class="vlag">spoed</span>`:""}</b>
      <span>${i.notitie ? esc(i.notitie) + " · " : ""}${lid ? esc(lid.naam.split(" ")[0]) : ""}</span>
    </div>
    ${i.fotoId ? `<img class="item-thumb laden" data-foto="${esc(i.fotoId)}_k" data-wmfoto="${esc(i.id)}" alt="">` : ""}

}

function schermWinkelKiezen(){

  open.forEach(i => { const w = i.winkel || "nvt"; tellers[w] = (tellers[w]||0)+1; });

  return `

      </div>
    </div>
    <div class="inhoud" id="inhoud">

        ${open.length === 0 ? `
          <div class="leeg fade"><span class="em">🎉</span><h3>Niets te halen</h3>
          <p>De hele lijst is leeg. Geniet ervan.</p></div>` : `
          <div class="sectie" style="margin-top:14px">
            <div class="lijst">
              ${lijst.map(w => `
                <button class="winkelkaart" data-start="${esc(w.id)}">
                  <span class="bol" style="background:${esc(w.kleur)}22">${w.em}</span>
                  <div class="tk"><b>${esc(w.naam)}</b>
                    <span>${tellers[w.id]} ${tellers[w.id]===1?"boodschap":"boodschappen"}</span></div>
                  <span class="pijl">${IK.pijl}</span>
                </button>`).join("")}
              <button class="winkelkaart" data-start="alles">
                <span class="bol" style="background:var(--accent-zacht)">🧺</span>
                <div class="tk"><b>Alles in één lijst</b><span>${open.length} boodschappen, op categorie</span></div>
                <span class="pijl">${IK.pijl}</span>
              </button>
            </div>
          </div>
          <div class="hint" style="text-align:center; margin-top:18px">
            Tijdens het winkelen blijft je scherm aan en vink je met één tik af.<br>
            ${esc((S.leden.find(l => l.id !== S.ik.id)||{}).naam || "De ander")} ziet thuis meteen wat er al in de kar ligt.
          </div>`}

  const t = $("#w-terug");

  const wid = S.winkelSessie ? S.winkelSessie.winkelId : "alles";

/* =====================================================================
   14 · SCHERM: UITGAVEN

function saldoBerekening(bonnen){
  const deelnemers = S.leden.length || 1;
  const totaal = bonnen.reduce((s,b) => s + (Number(b.bedrag)||0), 0);
  const perPersoon = totaal / deelnemers;
  const betaald = {};
  S.leden.forEach(l => betaald[l.id] = 0);
  bonnen.forEach(b => { betaald[b.door] = (betaald[b.door]||0) + (Number(b.bedrag)||0); });
  const saldi = S.leden.map(l => ({lid:l, betaald:betaald[l.id]||0, saldo:(betaald[l.id]||0) - perPersoon}));
  return {totaal, perPersoon, saldi};
}

function schermUitgaven(){
  const open = S.bonnen.filter(b => !b.verrekend).sort((a,b) => (b.datum||0)-(a.datum||0));
  const {totaal, saldi} = saldoBerekening(open);
  const ik = saldi.find(s => s.lid.id === S.ik.id);
  const ander = saldi.filter(s => s.lid.id !== S.ik.id).sort((a,b) => a.saldo - b.saldo)[0];

  let saldoTekst = "Alles staat gelijk", saldoBedrag = euro(0), saldoKleur = "var(--muted)";
  if(ik && Math.abs(ik.saldo) >= 0.01){
    if(ik.saldo > 0){
      saldoKleur = "var(--groen)";
      saldoBedrag = "+" + euro(ik.saldo);
      saldoTekst = S.leden.length === 2 && ander
        ? `<b>${esc(ander.lid.naam)}</b> moet dit nog aan jou terugbetalen`
        : "Dit heb jij meer betaald dan je aandeel";
    }else{
      saldoKleur = "var(--rood)";
      saldoBedrag = "−" + euro(Math.abs(ik.saldo));
      saldoTekst = S.leden.length === 2 && ander
        ? `Dit moet jij nog aan <b>${esc(ander.lid.naam)}</b> terugbetalen`
        : "Dit heb jij minder betaald dan je aandeel";
    }
  }

  const maanden = [...new Set(S.bonnen.map(b => maandSleutel(b.datum||nu())))].sort().reverse();
  const gekozenMaand = S.bonMaand;
  const getoond = (gekozenMaand ? S.bonnen.filter(b => maandSleutel(b.datum||nu()) === gekozenMaand) : open)
                    .sort((a,b) => (b.datum||0)-(a.datum||0));

  return `
  <div class="scherm">
    <div class="kop" id="kop">
      <div class="kop-rij">
        <div class="kop-titel"><h1>Uitgaven</h1>
          <div class="sub">${open.length ? open.length + " open " + (open.length===1?"bon":"bonnen") + " · " + euro(totaal) : "nog niets te verrekenen"}</div></div>
        <button class="ikoonknop" id="u-plus">${IK.plus}</button>
      </div>
      ${maanden.length ? `
      <div class="chiprij">
        <button class="chip ${!gekozenMaand?"aan":""}" data-maand="">Openstaand</button>
        ${maanden.map(m => `<button class="chip ${gekozenMaand===m?"aan":""}" data-maand="${esc(m)}">${esc(maandNaam(m))}</button>`).join("")}
        <span class="rek">&nbsp;</span>
      </div>` : ""}
    </div>
    <div class="inhoud" id="inhoud">
      <div class="wrap">
        ${!gekozenMaand ? `
        <div class="saldo">
          <div class="label">Jouw saldo</div>
          <div class="bedrag" style="color:${saldoKleur}">${saldoBedrag}</div>
          <div class="uitleg">${saldoTekst}</div>
          ${S.leden.length < 2 ? `<div class="hint" style="text-align:center; margin-top:8px">
            Zodra je huisgenoot ook een account heeft, verdeelt de app de kosten automatisch.</div>` : ""}
        </div>
        <div class="stat-rij">
          ${saldi.map(s => `
            <div class="stat">
              <b>${euro(s.betaald)}</b>
              <span>${esc(s.lid.naam.split(" ")[0])} betaalde</span>
            </div>`).join("")}
        </div>
        ${open.length ? `<button class="knop stil vol" id="u-verreken" style="margin-top:12px">${IK.vink} Alles verrekend — op nul zetten</button>` : ""}
        ` : ""}

        ${getoond.length === 0 ? `
          <div class="leeg fade"><span class="em">🧾</span><h3>Geen bonnen</h3>
          <p>Noteer na het winkelen wat je betaald hebt, dan rekent de app het samen uit.</p>
          <button class="knop zacht klein" id="u-plus2" style="margin-top:14px">${IK.plus} Bon toevoegen</button></div>`
        : `
        <div class="sectie">
          <div class="sectie-kop">
            <h2>${gekozenMaand ? esc(maandNaam(gekozenMaand)) : "Openstaand"}</h2>
            <span class="telw">${euro(getoond.reduce((s,b)=>s+(Number(b.bedrag)||0),0))}</span>
            <span class="lijn"></span>
          </div>
          <div class="lijst">
            ${getoond.map(b => {
              const lid = lidVan(b.door), w = winkelVan(b.winkel);
              return `<button class="bon" data-bon="${esc(b.id)}" style="width:100%; text-align:left; background:var(--card)">
                ${lid ? AV.html(lid) : ""}
                <div class="tk">
                  <b>${esc(w.naam)}${b.verrekend?` <span style="font-size:11px;color:var(--muted);font-weight:600">· verrekend</span>`:""}</b>
                  <span>${esc(lid?lid.naam.split(" ")[0]:"Iemand")} betaalde · ${datumKort(b.datum)}${b.fotoId?" · 📷":""}</span>
                </div>
                <span class="eur">${euro(b.bedrag)}</span>
              </button>`;
            }).join("")}
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
}

        <button type="button" class="fotoknop" id="n-foto">${IK.camera}<span>Bon fotograferen</span></button>
        <div class="fotovb verborgen" id="n-fotovb"><img alt=""><button type="button" class="weg" id="n-fotoweg">${IK.kruis}</button></div>
      </div>
      <input type="file" accept="image/*" id="n-bestand" class="verborgen"></div>`;
  const voet = `<button class="knop vol" id="n-opslaan">Bon opslaan</button>`;
  sheet({titel:"Bon toevoegen", body, voet, naTeken:() => {
    setTimeout(() => $("#n-bedrag").focus(), 250);
    bindKeuze("winkel", v => st.winkel = v);
    bindKeuze("door", v => st.door = v);
    $("#n-foto").onclick = () => $("#n-bestand").click();
    $("#n-bestand").onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      $("#n-foto").innerHTML = `<span class="spinner"></span><span>Bezig…</span>`;
      try{
        const {klein} = await verkleinFoto(file);
        st.fotoFile = file;
        $("#n-fotovb").classList.remove("verborgen"); $("#n-fotovb img").src = klein;
        $("#n-foto").innerHTML = `${IK.herhaal}<span>Andere foto</span>`;
      }catch(err){ toast("Die foto lukte niet"); $("#n-foto").innerHTML = `${IK.camera}<span>Bon fotograferen</span>`; }
      e.target.value = "";
    };
    $("#n-fotoweg").onclick = () => { st.fotoFile = null; $("#n-fotovb").classList.add("verborgen");
      $("#n-foto").innerHTML = `${IK.camera}<span>Bon fotograferen</span>`; };
    $("#n-opslaan").onclick = async () => {
      const bedrag = Number(String($("#n-bedrag").value).replace(",", ".").replace(/[^0-9.]/g,"")) || 0;
      if(bedrag <= 0){ $("#n-bedrag").focus(); $("#n-bedrag").style.borderColor = "var(--rood)"; return; }
      const knop = $("#n-opslaan");
      knop.disabled = true; knop.innerHTML = `<span class="spinner"></span> Opslaan…`;
      try{
        let fotoId = null;
        if(st.fotoFile) fotoId = await bewaarFoto(st.fotoFile);
        await DB.voegToe(PAD.bonnen, {winkel:st.winkel, bedrag, door:st.door, datum:nu(), fotoId, verrekend:false});
        sluitSheet(); toast(euro(bedrag) + " genoteerd", "🧾");
      }catch(e){ console.error(e); toast("Opslaan lukte niet"); knop.disabled = false; knop.innerHTML = "Bon opslaan"; }
    };
  }});
}

/* ---------- vaste boodschappen ---------- */
function sheetVast(){
  const opLijst = new Set(openItems().map(i => (i.tekst||"").toLowerCase()));
  const body = `
    <p style="margin:0 0 14px; color:var(--ink-2); font-size:14.5px; line-height:1.5">
      Dingen die jullie steeds nodig hebben. Tik erop om ze op de boodschappenlijst te zetten.
    </p>
    ${S.vast.length === 0 ? `
      <div class="leeg" style="padding:30px 10px"><span class="em">⭐</span><h3>Nog geen vaste boodschappen</h3>
      <p>Voeg ze hier toe, of tik bij een boodschap op “Bij de vaste boodschappen”.</p></div>`
    : `<div class="lijst" style="margin-bottom:14px">
      ${[...S.vast].sort((a,b) => (a.tekst||"").localeCompare(b.tekst||"")).map(v => {
        const staatErop = opLijst.has((v.tekst||"").toLowerCase());
        const w = winkelVan(v.winkel);
        return `<div class="rij">
          <span class="ik" style="background:${staatErop?"var(--groen-zacht)":"var(--bg-2)"}; color:${staatErop?"var(--groen)":"var(--ink-2)"}">
            ${staatErop ? IK.vink : catVan(v.cat).em}</span>
          <div class="tk"><b>${esc(v.tekst)}</b><span>${w.em} ${esc(w.naam)}${v.hoeveelheid?" · "+esc(v.hoeveelheid):""}</span></div>
          ${staatErop
            ? `<span class="na nowrap" style="font-size:12px">staat erop</span>`
            : `<button class="knop zacht klein" data-vastadd="${esc(v.id)}">${IK.plus}</button>`}
          <button class="ikoonknop" data-vastwis="${esc(v.id)}" style="width:32px;height:32px;color:var(--muted)">${IK.prul}</button>
        </div>`;
      }).join("")}
    </div>`}
    <div class="veld" style="margin-bottom:0">
      <label>Nieuwe vaste boodschap</label>
      <div class="veld-rij">
        <input class="invoer" id="v-tekst" placeholder="Bijvoorbeeld koffie" maxlength="40">
        <button class="knop" id="v-add" style="flex:0 0 auto">${IK.plus}</button>
      </div>
    </div>`;
  const voet = `${S.vast.length ? `<button class="knop vol" id="v-alles">${IK.plus} Alles op de lijst zetten</button>` : ""}`;
  sheet({titel:"Vaste boodschappen", body, voet, naTeken:() => {
    $$("[data-vastadd]").forEach(b => b.onclick = async () => {
      const v = S.vast.find(x => x.id === b.dataset.vastadd); if(!v) return;
      await nieuwItem({tekst:v.tekst, hoeveelheid:v.hoeveelheid||"", winkel:v.winkel||"nvt", cat:v.cat||"overig"});
      tril(12); toast(v.tekst + " staat op de lijst", "✓"); sheetVast();
    });
    $$("[data-vastwis]").forEach(b => b.onclick = async () => {
      await DB.wis(PAD.vast + "/" + b.dataset.vastwis); sheetVast();
    });
    const inp = $("#v-tekst");
    const voegToe = async () => {
      const t = inp.value.trim(); if(t.length < 2) return;
      const cat = raadCategorie(t) || "overig";
      await DB.voegToe(PAD.vast, {tekst:t, hoeveelheid:"", winkel:"nvt", cat, door:S.ik.id, gemaakt:nu()});
      inp.value = ""; sheetVast();
    };
    $("#v-add").onclick = voegToe;
    inp.onkeydown = e => { if(e.key === "Enter") voegToe(); };
    const alles = $("#v-alles");
    if(alles) alles.onclick = async () => {
      let n = 0;
      for(const v of S.vast){
        if(opLijst.has((v.tekst||"").toLowerCase())) continue;
        await nieuwItem({tekst:v.tekst, hoeveelheid:v.hoeveelheid||"", winkel:v.winkel||"nvt", cat:v.cat||"overig"});
        n++;
      }
      sluitSheet(); S.tab = "lijst"; tekenNu();
      toast(n ? n + " boodschappen toegevoegd" : "Ze stonden er al", "⭐");
    };
  }});
}

function sheetWinkels(){
  const gesorteerd = [...S.winkels].sort((a,b) => (a.volgorde||50)-(b.volgorde||50));
  const body = `
    <p style="margin:0 0 14px; color:var(--ink-2); font-size:14.5px; line-height:1.5">
      Bij elke boodschap kies je waar hij te koop is. Hier bepaal je welke winkels dat zijn.
    </p>
    <div class="lijst" style="margin-bottom:14px">
      ${gesorteerd.map((w,idx) => `
        <div class="rij">
          <span class="ik" style="background:${esc(w.kleur)}22; font-size:17px">${w.em}</span>
          <div class="tk"><b>${esc(w.naam)}</b>
            <span>${S.items.filter(i => !i.af && (i.winkel||"nvt")===w.id).length} op de lijst</span></div>
          <button class="ikoonknop" data-wop="${esc(w.id)}" style="width:30px;height:30px" ${idx===0?"disabled":""}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          ${w.id === "nvt" ? "" : `<button class="ikoonknop" data-wwis="${esc(w.id)}" style="width:30px;height:30px;color:var(--muted)">${IK.prul}</button>`}
        </div>`).join("")}
    </div>
    <div class="veld" style="margin-bottom:0">
      <label>Winkel toevoegen</label>
      <div class="veld-rij">
        <input class="invoer" id="w-emoji" placeholder="🛒" maxlength="2" style="flex:0 0 62px; text-align:center; font-size:20px">
        <input class="invoer" id="w-naam" placeholder="Naam van de winkel" maxlength="26">
        <button class="knop" id="w-add" style="flex:0 0 auto">${IK.plus}</button>
      </div>
      <div class="hint">De volgorde bepaalt hoe de lijst gegroepeerd staat.</div>
    </div>`;
  sheet({titel:"Winkels", body, naTeken:() => {
    $$("[data-wop]").forEach(b => b.onclick = async () => {
      const lijst = [...S.winkels].sort((a,b) => (a.volgorde||50)-(b.volgorde||50));
      const i = lijst.findIndex(w => w.id === b.dataset.wop);
      if(i <= 0) return;
      const a = lijst[i], vorige = lijst[i-1];
      await DB.zet(PAD.winkels + "/" + a.id, {volgorde: (vorige.volgorde||50) - 1});
      tril(); setTimeout(sheetWinkels, 140);
    });
    $$("[data-wwis]").forEach(b => b.onclick = async () => {
      const w = winkelVan(b.dataset.wwis);
      const aantal = S.items.filter(i => (i.winkel||"nvt") === w.id).length;
      if(!confirm(`“${w.naam}” verwijderen?` + (aantal ? `\n\n${aantal} boodschappen komen dan bij “Nog niet gekozen”.` : ""))) return;
      for(const i of S.items.filter(i => (i.winkel||"nvt") === w.id)){
        await DB.zet(PAD.items + "/" + i.id, {winkel:"nvt"});
      }
      await DB.wis(PAD.winkels + "/" + w.id);
      setTimeout(sheetWinkels, 140);
    });
    const voegToe = async () => {
      const naam = $("#w-naam").value.trim();
      if(naam.length < 2){ $("#w-naam").focus(); return; }
      const em = $("#w-emoji").value.trim() || "🛒";
      const max = Math.max(0, ...S.winkels.filter(w => w.id !== "nvt").map(w => w.volgorde||0));
      await DB.voegToe(PAD.winkels, {
        naam, em, kleur: KLEUREN[S.winkels.length % KLEUREN.length], volgorde: max + 1
      });
      setTimeout(sheetWinkels, 160);
    };
    $("#w-add").onclick = voegToe;
    $("#w-naam").onkeydown = e => { if(e.key === "Enter") voegToe(); };
  }});
}

      <div class="stat"><b>${gehaald}</b><span>gehaald</span></div>
      <div class="stat"><b>${euro(betaald)}</b><span>betaald</span></div>
    </div>
    <div class="lijst">
      <button class="rij" id="l-filter">
        <span class="ik">${IK.filter}</span>
        <div class="tk"><b>Toon wat ${ikZelf ? "jij" : esc(lid.naam.split(" ")[0])} erop zette</b><span>filtert de lijst</span></div>
      </button>
      ${ikZelf ? `
      <button class="rij" id="l-naam">
        <span class="ik">${IK.potlood}</span>
        <div class="tk"><b>Naam wijzigen</b></div>
      </button>
      <button class="rij" id="l-pin">
        <span class="ik">${IK.slot}</span>
        <div class="tk"><b>Pincode wijzigen</b></div>
      </button>` : `
      <button class="rij" id="l-pinreset">
        <span class="ik" style="background:var(--rood-zacht); color:var(--rood)">${IK.slot}</span>
        <div class="tk"><b>Pincode wissen</b><span>als ${esc(lid.naam.split(" ")[0])} de code kwijt is</span></div>
      </button>`}
    </div>`;
  sheet({titel:"Huisgenoot", body, naTeken:() => {
    $("#l-filter").onclick = () => { S.filter.door = lid.id; S.tab = "lijst"; sluitSheet(); tekenNu(); };
    const ln = $("#l-naam");

    const lp = $("#l-pin");
