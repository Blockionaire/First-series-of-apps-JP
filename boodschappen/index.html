    <button class="knop stil" id="u-annuleer" style="flex:0 0 auto">${bewerk ? "Terug" : "Annuleer"}</button>
    <button class="knop" id="u-opslaan" style="flex:1">${bewerk ? "Opslaan" : "Uitgave opslaan"}</button>`;

  sheet({titel: bewerk ? "Uitgave aanpassen" : "Uitgave toevoegen", body, voet, naTeken:() => {
    vulFotos($(".sheet"));
    if(!bewerk) setTimeout(() => $("#u-bedrag").focus(), 250);
    bindKeuze("winkel", v => st.winkel = v);
    $("#u-foto").onclick = () => $("#u-bestand").click();
    $("#u-bestand").onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      $("#u-foto").innerHTML = `<span class="spinner"></span><span>Bezig…</span>`;
      try{
        const {klein} = await verkleinFoto(file);
        st.fotoFile = file; st.fotoWeg = false;
        $("#u-fotovb").classList.remove("verborgen");
        $("#u-fotovb img").src = klein; $("#u-fotovb img").classList.remove("laden");
        $("#u-foto").innerHTML = `${IK.herhaal}<span>Andere foto</span>`;

      $("#u-fotovb").classList.add("verborgen");
      $("#u-foto").innerHTML = `${IK.camera}<span>Bon fotograferen</span>`;

      knop.disabled = true; knop.innerHTML = `<span class="spinner"></span> Opslaan…`;

        const datum = veldNaarDatum($("#u-datum").value);

          await DB.voegToe(PAD.bonnen, gegevens);
          S.maand = maandSleutel(datum);

          naarBoven();
          toast(euro(bedrag) + " genoteerd" + restTekst(), "🧾");
        }
      }catch(e){
        console.error(e); toast("Opslaan lukte niet");
        knop.disabled = false; knop.innerHTML = bewerk ? "Opslaan" : "Uitgave opslaan";
      }
    };
  }});
}

/* korte staart voor de melding: hoeveel budget er nog over is */
function restTekst(){
  const m = maandSleutel(nu());
  const budget = budgetVoor(m);
  if(budget <= 0) return "";
  const over = budget - bonnenVan(m).reduce((s,b) => s + (Number(b.bedrag)||0), 0);
  return over >= 0 ? " · nog " + euro(over) : " · " + euro(-over) + " over budget";
}

      }).join("")}

  const body = `
    <div style="text-align:center; margin-bottom:20px">

                  background:${esc(w.kleur)}22; margin:0 auto 12px">${w.em}</div>
      <div style="font-size:21px; font-weight:700; letter-spacing:-.02em">${esc(w.naam)}</div>
      <div style="color:var(--muted); font-size:13.5px; margin-top:2px">
        ${aantal} ${aantal===1?"boodschap":"boodschappen"} · ${route ? route.length + " stappen in de looproute" : "geen looproute"}
      </div>
    </div>
    <div class="veld-rij" style="margin-bottom:15px">
      <input class="invoer" id="ww-emoji" maxlength="2" value="${esc(w.em)}"
             style="flex:0 0 62px; text-align:center; font-size:20px">
      <input class="invoer" id="ww-naam" maxlength="26" value="${esc(w.naam)}">
      <button class="knop" id="ww-bewaar" style="flex:0 0 auto">${IK.vink}</button>
    </div>
    <div class="lijst">
      <button class="rij" id="ww-route">
        <span class="ik" style="background:var(--accent-zacht); color:var(--accent)">${IK.route}</span>
        <div class="tk"><b>Looproute</b>
          <span>${route ? "de volgorde waarin je door de winkel loopt" : "nog niet ingesteld — volgt nu de standaardvolgorde"}</span></div>
        <span class="na">${route ? route.length : ""}${IK.pijl}</span>
      </button>
      ${w.id === "nvt" ? "" : `
      <button class="rij" id="ww-wis">
        <span class="ik" style="background:var(--rood-zacht); color:var(--rood)">${IK.prul}</span>
        <div class="tk"><b style="color:var(--rood)">Winkel verwijderen</b>
          <span>${aantal ? aantal + " boodschappen gaan naar “Nog niet gekozen”" : "er hangt niets aan deze winkel"}</span></div>
      </button>`}
    </div>`;
  sheet({titel:"Winkel", body, naTeken:() => {
    $("#ww-bewaar").onclick = async () => {
      const naam = $("#ww-naam").value.trim();
      if(naam.length < 2){ $("#ww-naam").focus(); return; }
      await DB.zet(PAD.winkels + "/" + w.id, {naam, em: $("#ww-emoji").value.trim() || w.em});
      tril(); toast("Opgeslagen", "✓"); setTimeout(sheetWinkels, 160);

    $("#ww-route").onclick = () => sheetRoute(w.id);

      setTimeout(sheetWinkels, 160);

/* ---------- looproute van één winkel ---------- */
function sheetRoute(winkelId){
  const w = winkelVan(winkelId);
  const opgeslagen = Array.isArray(w.route) ? w.route.filter(catBestaat) : [];
  /* categorieën die nog niet in de route staan, komen er in de gewone volgorde achter */
  const volgorde = [...opgeslagen];
  cats().forEach(c => { if(!volgorde.includes(c.id)) volgorde.push(c.id); });
  const eigen = opgeslagen.length > 0;

  const body = `
    <p style="margin:0 0 14px; color:var(--ink-2); font-size:14.5px; line-height:1.5">
      Zet de categorieën in de volgorde waarin je bij <b>${esc(w.naam)}</b> door de winkel
      loopt. Tijdens het winkelen staat je lijst dan precies zo op je scherm.
    </p>
    ${!eigen ? `<div class="banner info">${IK.info}<span>Nog geen eigen route — dit is de standaardvolgorde. Verschuif er een en hij wordt bewaard.</span></div>` : ""}
    <div class="lijst" style="margin-top:14px">
      ${volgorde.map((id, idx) => {
        const c = catVan(id);
        return `<div class="rij">
          <span style="width:22px; text-align:center; font-size:12px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; flex:none">${idx+1}</span>
          <span class="ik" style="font-size:17px">${c.em}</span>
          <div class="tk"><b>${esc(c.naam)}</b></div>
          <button data-op="${esc(id)}" ${idx===0?"disabled":""}
                  style="width:34px;height:34px;display:grid;place-items:center;color:${idx===0?"var(--line)":"var(--ink-2)"};flex:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button data-neer="${esc(id)}" ${idx===volgorde.length-1?"disabled":""}
                  style="width:34px;height:34px;display:grid;place-items:center;color:${idx===volgorde.length-1?"var(--line)":"var(--ink-2)"};flex:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </button>
        </div>`;
      }).join("")}
    </div>
    ${eigen ? `<button class="knop stil vol klein" id="rt-standaard" style="margin-top:12px">
      ${IK.herhaal} Terug naar de standaardvolgorde</button>` : ""}`;

  sheet({titel:"Looproute", body, naTeken:() => {
    const bewaar = async nieuw => {
      await DB.zet(PAD.winkels + "/" + w.id, {route: nieuw});
      const kopie = S.winkels.find(x => x.id === w.id);
      if(kopie) kopie.route = nieuw;
      tril(8); setTimeout(() => sheetRoute(w.id), 100);
    };
    const verschuif = (id, richting) => {
      const i = volgorde.indexOf(id);
      const j = i + richting;
      if(i < 0 || j < 0 || j >= volgorde.length) return;
      const nieuw = [...volgorde];
      nieuw[i] = nieuw[j]; nieuw[j] = id;
      bewaar(nieuw);
    };
    $$("[data-op]").forEach(b => b.onclick = () => verschuif(b.dataset.op, -1));
    $$("[data-neer]").forEach(b => b.onclick = () => verschuif(b.dataset.neer, +1));
    const std = $("#rt-standaard");
    if(std) std.onclick = async () => {
      await DB.zet(PAD.winkels + "/" + w.id, {route: []});
      const kopie = S.winkels.find(x => x.id === w.id);
      if(kopie) kopie.route = [];
      toast("Terug naar de standaardvolgorde"); setTimeout(() => sheetRoute(w.id), 120);
    };
  }});
}

/* ---------- categorieën beheren ---------- */

  return S.items.filter(i => (i.cat||"overig") === id).length

}

            <span class="ik" style="font-size:17px; flex:none">${c.em}</span>

              <b style="display:block; font-size:15.5px; font-weight:600">${esc(c.naam)}</b>
              <span style="font-size:12.5px; color:var(--muted)">${n ? n + " " + (n===1?"boodschap":"boodschappen") : "niet in gebruik"}</span>
            </span>
          </button>
          <button data-cwis="${esc(c.id)}"
                  style="width:32px;height:32px;display:grid;place-items:center;flex:none;
                         color:${c.id === "overig" || n ? "var(--line-2)" : "var(--muted)"}">
            <span style="width:17px;height:17px">${c.id === "overig" ? IK.slot : IK.prul}</span>
          </button>
        </div>`;
      }).join("")}
    </div>
    <div class="veld" style="margin-bottom:0">
      <label>Categorie toevoegen</label>
      <div class="veld-rij">
        <input class="invoer" id="c-emoji" placeholder="📦" maxlength="2" style="flex:0 0 62px; text-align:center; font-size:20px">
        <input class="invoer" id="c-naam" placeholder="Naam van de categorie" maxlength="26">
        <button class="knop" id="c-add" style="flex:0 0 auto">${IK.plus}</button>

      </div>
    </div>`;

  sheet({titel:"Categorieën", body, naTeken:() => {

      tril(); setTimeout(sheetCategorieen, 140);
    });
    $$("[data-cbewerk]").forEach(b => b.onclick = () => sheetCategorie(catVan(b.dataset.cbewerk)));
    $$("[data-cwis]").forEach(b => b.onclick = () => {
      const id = b.dataset.cwis, c = catVan(id), n = catInGebruik(id);
      if(id === "overig"){
        alert("“Overig” kan niet weg.\n\nDat is de categorie waar de app alles in zet wat hij niet kan thuisbrengen.");
        return;
      }
      if(n){
        alert(`“${c.naam}” kan nu niet weg.\n\nEr ${n===1?"hangt":"hangen"} nog ${n} ${n===1?"boodschap":"boodschappen"} aan deze categorie. Zet die eerst in een andere categorie, of vink ze af en ruim de kar op.`);
        return;
      }
      if(!confirm(`“${c.naam}” verwijderen?`)) return;
      (async () => {
        await DB.wis(PAD.cats + "/" + id);
        S.cats = S.cats.filter(x => x.id !== id);
        /* de categorie ook uit alle looproutes halen */
        for(const w of S.winkels.filter(w => Array.isArray(w.route) && w.route.includes(id))){
          await DB.zet(PAD.winkels + "/" + w.id, {route: w.route.filter(x => x !== id)});
        }
        toast("Categorie verwijderd"); setTimeout(sheetCategorieen, 140);
      })();
    });
    const voegToe = async () => {
      const naam = $("#c-naam").value.trim();
      if(naam.length < 2){ $("#c-naam").focus(); return; }
      const basis = leerSleutel(naam) || "cat";
      let id = basis, n = 2;
      while(catBestaat(id)) id = basis + "-" + (n++);
      const max = Math.max(0, ...cats().map(c => c.volgorde || 0));
      const em = $("#c-emoji").value.trim() || "📦";
      await DB.zet(PAD.cats + "/" + id, {naam, em, volgorde: max + 1});
      /* de luisteraar heeft hem meestal al binnen — alleen aanvullen als dat nog niet zo is */
      if(!catBestaat(id)) S.cats = [...S.cats, {id, naam, em, volgorde: max + 1}];
      setTimeout(sheetCategorieen, 160);
    };
    $("#c-add").onclick = voegToe;
    $("#c-naam").onkeydown = e => { if(e.key === "Enter") voegToe(); };
  }});
}

             style="flex:0 0 62px; text-align:center; font-size:20px">

/* ---------- huisgenoot ---------- */
function sheetLid(lid){
  if(!lid) return;
  const ikZelf = lid.id === S.ik.id;
  const items = S.items.filter(i => i.door === lid.id);
  const gehaald = S.items.filter(i => i.afDoor === lid.id).length;
  const betaald = S.bonnen.filter(b => b.door === lid.id).reduce((s,b) => s+(Number(b.bedrag)||0), 0);
  const body = `
    <div style="text-align:center; margin-bottom:20px">
      <div style="display:grid; place-items:center; margin-bottom:12px">${AV.html(lid, "xl", isOnline(lid))}</div>
      <div style="font-size:21px; font-weight:700; letter-spacing:-.02em">${esc(lid.naam)}</div>
      <div style="color:var(--muted); font-size:13.5px; margin-top:2px">
        ${isOnline(lid) ? "nu online" : (lid.laatstGezien ? "laatst gezien " + datumKort(lid.laatstGezien) : "nog niet ingelogd")}
      </div>
    </div>
    <div class="stat-rij" style="margin-bottom:16px">
      <div class="stat"><b>${items.length}</b><span>toegevoegd</span></div>
      <div class="stat"><b>${gehaald}</b><span>gehaald</span></div>
      <div class="stat"><b>${euro(betaald)}</b><span>betaald</span></div>
    </div>
    <div class="lijst">
      <button class="rij" id="l-filter">
        <span class="ik">${IK.filter}</span>
        <div class="tk"><b>Toon wat ${ikZelf ? "jij" : esc(lid.naam.split(" ")[0])} erop zette</b><span>filtert de lijst</span></div>
      </button>
      ${ikZelf ? `
      <button class="rij" id="l-naam">
        <span class="ik">${IK.potlood}</span>
        <div class="tk"><b>Naam wijzigen</b></div>
      </button>
      <button class="rij" id="l-pin">
        <span class="ik">${IK.slot}</span>
        <div class="tk"><b>Pincode wijzigen</b></div>
      </button>` : `
      <button class="rij" id="l-pinreset">
        <span class="ik" style="background:var(--rood-zacht); color:var(--rood)">${IK.slot}</span>
        <div class="tk"><b>Pincode wissen</b><span>als ${esc(lid.naam.split(" ")[0])} de code kwijt is</span></div>
      </button>`}
    </div>`;
  sheet({titel:"Huisgenoot", body, naTeken:() => {
    $("#l-filter").onclick = () => { S.filter.door = lid.id; S.tab = "lijst"; sluitSheet(); tekenNu(); };
    const ln = $("#l-naam");
    if(ln) ln.onclick = async () => {
      const n = prompt("Nieuwe naam:", lid.naam);
      if(!n || n.trim().length < 2) return;
      await DB.zet(PAD.leden + "/" + lid.id, {naam:n.trim()});
      S.ik.naam = n.trim(); LS.zet("boodschappen_ik_" + P, S.ik);
      sluitSheet(); toast("Naam gewijzigd");
    };
    const lp = $("#l-pin");
    if(lp) lp.onclick = async () => {
      const oud = prompt("Je huidige pincode:");
      if(oud === null) return;
      if(await hashPin(lid.naam, oud) !== lid.pinHash){ toast("Die code klopt niet", "🔒"); return; }
      const nieuw = prompt("Nieuwe pincode (4 cijfers):");
      if(!nieuw || !/^\d{4}$/.test(nieuw)){ toast("Vier cijfers graag"); return; }
      await DB.zet(PAD.leden + "/" + lid.id, {pinHash: await hashPin(lid.naam, nieuw)});
      sluitSheet(); toast("Pincode gewijzigd", "🔒");
    };
    const lr = $("#l-pinreset");
    if(lr) lr.onclick = async () => {
      if(!confirm("De pincode van " + lid.naam + " wissen?\n\n" + lid.naam.split(" ")[0] +
                  " kiest bij de volgende keer inloggen zelf een nieuwe code.")) return;
      await DB.zet(PAD.leden + "/" + lid.id, {pinHash:null});
      sluitSheet(); toast("Pincode gewist");
    };
  }});
}

/* ---------- delen ---------- */
function deelLijst(){
  const groepen = groepeer(openItems());
  let t = "🧺 " + CFG.huisNaam + " — boodschappen\n";
  groepen.forEach(g => {
    t += "\n*" + g.naam + "*\n";
    g.items.forEach(i => {
      t += "• " + (i.hoeveelheid ? i.hoeveelheid + " " : "") + i.tekst +
           (i.notitie ? " (" + i.notitie + ")" : "") + (i.urgent ? " ⚡" : "") + "\n";
    });
  });
  if(!groepen.length) t += "\nDe lijst is leeg 🎉\n";
  if(navigator.share){
    navigator.share({title:"Boodschappen", text:t}).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(t).then(() => toast("Lijst gekopieerd", "📋"))
      .catch(() => alert(t));
  }
}

/* =====================================================================
   16 · NAVIGATIE & TEKENEN
   ===================================================================== */
function navHtml(){
  const open = openItems().length;
  const tabs = [
    {id:"lijst",    naam:"Lijst",    ik:IK.lijst, bel:open},
    {id:"winkelen", naam:"Winkelen", ik:IK.kar},
    {id:"budget",   naam:"Budget",   ik:IK.euro},
    {id:"meer",     naam:"Meer",     ik:IK.meer}
  ];
  return `<nav class="nav"><div class="nav-rij">
    ${tabs.map(t => `
      <button class="nav-knop ${S.tab===t.id?"aan":""}" data-tab="${t.id}">
        ${t.ik}<span>${t.naam}</span>
        ${t.bel ? `<span class="bel">${t.bel > 99 ? "99+" : t.bel}</span>` : ""}
      </button>`).join("")}
  </div></nav>`;
}

function tekenNu(){
  const app = $("#app");

  if(!S.geladen){
    app.innerHTML = `<div class="midden"><div class="spinner"></div><span>Boodschappen laden…</span></div>`;
    return;
  }
  if(!S.ik){ tekenInlog(); return; }
  if(S.ik && !lidVan(S.ik.id)){ uitloggen(); return; }

  let scherm = "";
  if(S.tab === "lijst")         scherm = schermLijst();
  else if(S.tab === "winkelen") scherm = schermWinkelen();
  else if(S.tab === "budget")   scherm = schermBudget();
  else                          scherm = schermMeer();

  const inWinkelSessie = S.tab === "winkelen" && S.winkelSessie;
  app.innerHTML = scherm + (inWinkelSessie ? "" : navHtml());

  $$("[data-tab]").forEach(b => b.onclick = () => {
    if(S.tab === b.dataset.tab && b.dataset.tab === "lijst"){
      naarBoven(true);
      return;
    }
    S.tab = b.dataset.tab; tril();
    if(S.tab !== "winkelen") houdSchermAan(false);
    tekenNu(); naarBoven();
  });

  if(S.tab === "lijst")         bindLijst();
  else if(S.tab === "winkelen") bindWinkelen();
  else if(S.tab === "budget")   bindBudget();
  else                          bindMeer();

  vulFotos(app);
}

/* hertekent alleen de inhoud — zo blijft het zoekveld de focus houden */
function tekenAlleenInhoud(){
  if(S.tab !== "lijst") return tekenNu();
  const nieuw = document.createElement("div");
  nieuw.innerHTML = schermLijst();
  const bron = nieuw.querySelector("#inhoud"), doel = $("#inhoud");
  if(!bron || !doel) return tekenNu();
  const pos = scrollNu();
  doel.innerHTML = bron.innerHTML;
  window.scrollTo({top:pos});
  bindLijst();
  vulFotos(doel);
}

/* =====================================================================
   17 · LUISTEREN NAAR DE GEDEELDE LIJST
   ===================================================================== */
let eersteItems = true;
function startLuisteren(){
  DB.luister(PAD.leden, l => {
    S.leden = l.sort((a,b) => (a.gemaakt||0)-(b.gemaakt||0));
    if(S.ik){
      const m = lidVan(S.ik.id);
      if(m && m.naam !== S.ik.naam){ S.ik.naam = m.naam; LS.zet("boodschappen_ik_" + P, S.ik); }
    }else{
      /* kwamen de accounts pas ná het opstarten binnen? Dan alsnog inloggen */
      const bewaard = LS.get("boodschappen_ik_" + P, null);
      if(bewaard && l.some(x => x.id === bewaard.id)){ S.ik = bewaard; startHartslag(); }
    }
    if(S.geladen) tekenNu();
  });

  DB.luister(PAD.items, l => {
    const oud = S.items;
    S.items = l;
    if(!eersteItems && S.ik){
      const oudeIds = new Set(oud.map(i => i.id));
      const nieuweVanAnder = l.filter(i => !oudeIds.has(i.id) && i.door !== S.ik.id && (nu() - (i.gemaakt||0) < 90000));
      if(nieuweVanAnder.length === 1){
        const i = nieuweVanAnder[0];
        toast(naamVan(i.door).split(" ")[0] + " zette " + i.tekst + " op de lijst", "🧺");
      }else if(nieuweVanAnder.length > 1){
        toast(naamVan(nieuweVanAnder[0].door).split(" ")[0] + " voegde " + nieuweVanAnder.length + " boodschappen toe", "🧺");
      }
    }
    eersteItems = false;
    if(S.geladen) tekenNu();
  });

  DB.luister(PAD.winkels, l => {
    S.winkels = l.length ? l : S.winkels;
    if(S.geladen) tekenNu();
  });
  DB.luister(PAD.vast,   l => { S.vast = l;   if(S.geladen && S.tab === "meer") tekenNu(); });
  DB.luister(PAD.geleerd, l => { S.geleerd = l; });
  DB.luister(PAD.cats, l => {
    if(!l.length) return;
    S.cats = l.sort((a,b) => (a.volgorde||50) - (b.volgorde||50));
    if(S.geladen) tekenNu();
  });
  DB.luister(PAD.bonnen, l => { S.bonnen = l; if(S.geladen && (S.tab === "budget" || S.tab === "meer")) tekenNu(); });
  DB.luister(PAD.meta, l => {
    const b = l.find(x => x.id === "budget");
    S.budget = b ? {standaard: Number(b.standaard)||0, perMaand: b.perMaand || {}} : {standaard:0, perMaand:{}};
    if(S.geladen && (S.tab === "budget" || S.tab === "meer")) tekenNu();
  });
}

async function zetCatsKlaar(){
  /* meteen bruikbaar, ook als de database nog niet geantwoord heeft */
  S.cats = STANDAARD_CATS.map((c,i) => ({...c, volgorde:i+1}));
  const bestaand = await DB.haalAlles(PAD.cats);
  if(bestaand.length){
    S.cats = bestaand.sort((a,b) => (a.volgorde||50) - (b.volgorde||50));
    return;
  }
  /* de eerste keer: dezelfde id's als voorheen, zodat bestaande boodschappen
     gewoon in hun categorie blijven staan */
  Promise.all(STANDAARD_CATS.map((c,i) => {
    const {id, ...rest} = c;
    return DB.zet(PAD.cats + "/" + id, {...rest, volgorde:i+1});
  })).catch(e => console.error("standaardcategorieën", e));
}

async function zetWinkelsKlaar(){
  /* meteen bruikbaar, ook als de database nog niet geantwoord heeft */
  S.winkels = STANDAARD_WINKELS.map(w => ({...w}));
  const bestaand = await DB.haalAlles(PAD.winkels);
  if(bestaand.length){ S.winkels = bestaand; return; }
  /* de eerste keer de standaardwinkels wegschrijven — op de achtergrond.
     Firestore lost een schrijfactie pas in als de server hem bevestigt; daar
     mag het laadscherm niet op blijven wachten. */
  Promise.all(STANDAARD_WINKELS.map(w => {
    const {id, ...rest} = w;
    return DB.zet(PAD.winkels + "/" + id, rest);
  })).catch(e => console.error("standaardwinkels", e));
}

/* =====================================================================
   18 · START
   ===================================================================== */
async function start(){
  try{
    DB = CFG.firebase ? await firestoreDB() : demoDB();
  }catch(e){
    console.error("Firebase lukte niet:", e);
    DB = demoDB();
    S.syncFout = "De gedeelde lijst kon niet geladen worden — de app draait nu op dit apparaat.";
  }

  /* nooit langer dan een paar tellen op de database wachten — de luisteraars
     vullen alles alsnog aan zodra het binnen is */
  const metGrens = (belofte, terugval, ms = 5000) =>
    Promise.race([belofte, new Promise(r => setTimeout(() => r(terugval), ms))]);

  try{ await metGrens(zetWinkelsKlaar(), null); }
  catch(e){ console.error(e); S.winkels = STANDAARD_WINKELS.map(w => ({...w})); toonSyncFout(e); }
  try{ await metGrens(zetCatsKlaar(), null); }
  catch(e){ console.error(e); S.cats = STANDAARD_CATS.map((c,i) => ({...c, volgorde:i+1})); }

  startLuisteren();

  try{ S.leden  = await metGrens(DB.haalAlles(PAD.leden), []); }catch(e){ toonSyncFout(e); }
  try{ S.items  = await metGrens(DB.haalAlles(PAD.items), []); eersteItems = false; }catch(e){}
  try{ S.bonnen = await metGrens(DB.haalAlles(PAD.bonnen), []); }catch(e){}
  try{ S.vast   = await metGrens(DB.haalAlles(PAD.vast), []); }catch(e){}
  try{ S.geleerd = await metGrens(DB.haalAlles(PAD.geleerd), []); }catch(e){}

  const bewaard = LS.get("boodschappen_ik_" + P, null);
  if(bewaard && S.leden.some(l => l.id === bewaard.id)){
    S.ik = bewaard;
    startHartslag();
  }

  S.geladen = true;
  tekenNu();

  /* installeerbaar maken */
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.installPrompt = e; });

  /* service worker voor offline gebruik */
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  /* terug-knop sluit eerst een sheet of de winkelmodus */
  history.pushState({app:true}, "");
  window.addEventListener("popstate", () => {
    history.pushState({app:true}, "");
    if($(".kijker")){ $(".kijker").click(); return; }
    if(S.sheet){ sluitSheet(); return; }
    if(S.tab === "winkelen" && S.winkelSessie){ S.winkelSessie = null; houdSchermAan(false); tekenNu(); return; }
    if(S.tab !== "lijst"){ S.tab = "lijst"; tekenNu(); }
  });

  /* ververs de "laatst gezien"-tijden af en toe */
  setInterval(() => { if(S.geladen && S.ik && document.visibilityState === "visible" && !S.sheet) tekenNu(); }, 60000);
}

start();
