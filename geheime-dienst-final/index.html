  });
}

/* ---------- automatische groepschats ---------- */
async function syncAutoChats(){
  if(!S.me || !S.me.isLeader || !S.settings.rolesRevealed) return;
  const inf = S.players.filter(p => !p.isLeader && p.role && ROLES[p.role] && ROLES[p.role].team === "infiltrant").map(p => p.id);
  const infChat = S.chats.find(c => c.id === "infiltranten");
  if(inf.length || infChat){
    await DB.set("chats/infiltranten", {name:"Infiltranten", type:"group", members:inf, at: infChat ? (infChat.at || now()) : now()});
  }
  const gev = S.players.filter(p => !p.isLeader && p.status === "gevangen").map(p => p.id);
  const gevChat = S.chats.find(c => c.id === "gevangenen");
  if(gev.length || gevChat){
    await DB.set("chats/gevangenen", {name:"Gevangenen", type:"group", members:gev, at: gevChat ? (gevChat.at || now()) : now()});
  }
}

/* ---------- voorvraag aan de infiltranten (spelleider) ----------
   Alleen infiltranten mogen om een andere rol vragen, en alleen zolang de
   rollen nog niet onthuld zijn — daarna zitten ze al samen in de groepschat.
   Daarom dit tussenmoment: de infiltranten horen het stilletjes vast, de rest
   merkt er niets van, en pas bij de onthulling ligt alles vast. */
const infCheckActief = () => !!S.settings.infCheck && !S.settings.rolesRevealed;
const isInfiltrant = p => !!(p && p.role && ROLES[p.role] && ROLES[p.role].team === "infiltrant");

function infCheckHtml(nInf){
  if(S.settings.rolesRevealed || !nInf) return "";
  const aan = !!S.settings.infCheck;
  const infs = S.players.filter(p => !p.isLeader && isInfiltrant(p))
    .sort((a,b) => (a.name||"").localeCompare(b.name||""));
  const stand = p => S.roleRequests.some(r => r.pid === p.id && r.status === "open")
    ? {tekst:"Wil ruilen", kleur:"pill-gold", icoon:"🙋"}
    : p.infAkkoord ? {tekst:"Akkoord", kleur:"pill-green", icoon:"✅"}
    : {tekst:"Nog geen reactie", kleur:"pill-gray", icoon:"⏳"};
  const tel = k => infs.filter(p => stand(p).tekst === k).length;
  return `
    <div class="card" style="border:1.5px solid ${aan ? "var(--gold)" : "var(--line)"}">
      <h3>🤫 Voorvraag aan de infiltranten</h3>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 0 10px">
        ${aan
          ? `De ${nInf} ingedeelde infiltrant${nInf === 1 ? "" : "en"} ${nInf === 1 ? "ziet" : "zien"} nu stilletjes dat ${nInf === 1 ? "hij" : "ze"} infiltrant ${nInf === 1 ? "is" : "zijn"} en kan ${nInf === 1 ? "" : "kunnen "}de rol aannemen of om een andere vragen. De rest merkt er niets van.`
          : `Laat de ingedeelde infiltranten vooraf weten dat ze infiltrant zijn, zodat wie het niet ziet zitten nog kan ruilen. Alleen zij krijgen dit te zien — hun rolkaart blijft nog verborgen.`}
      </p>
      ${aan ? `
        <div class="vv-tel">✅ ${tel("Akkoord")} akkoord · 🙋 ${tel("Wil ruilen")} wil ruilen · ⏳ ${tel("Nog geen reactie")} nog geen reactie</div>
        ${infs.map(p => { const s = stand(p); return `
          <div class="vv-rij">
            <div class="avatar red" style="width:34px;height:34px;font-size:14px">${initial(p.name)}</div>
            <span style="flex:1">${esc(p.name)}</span>
            <span class="pill ${s.kleur}">${s.icoon} ${s.tekst}</span>
          </div>`; }).join("")}` : ""}
      <button class="btn btn-sm ${aan ? "btn-ghost" : "btn-green"}" id="infCheckBtn" style="margin-top:${aan ? "10px" : "0"}">
        ${aan ? "⏹️ Voorvraag stoppen" : "🤫 Vraag de infiltranten om akkoord"}
      </button>
    </div>`;
}

/* ---------- opdrachtenlijst infiltranten (spelleider) ---------- */
function missionLibHtml(){
  const lijst = S.missionLib;
  return `
    <div class="card">
      <details ${lijst.length ? "" : "open"}>
        <summary style="font-family:'Lilita One';font-size:17px;cursor:pointer">
          📋 Opdrachtenlijst infiltranten <span class="pill pill-outline">${lijst.length}</span>
        </summary>
        <p style="font-size:12.5px;color:var(--muted);line-height:1.5;margin:8px 0 10px">
          Zet hier de opdrachten klaar die je wilt gebruiken. Bij een missiestemming en bij de
          drie missies voor de veldwerker kies je er zo eentje uit de lijst.
        </p>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input id="mlInput" placeholder="Bijv. Verstop de handdoek van de spelleider" maxlength="90">
          <button class="btn btn-green" id="mlAdd" style="flex:none">➕</button>
        </div>
        ${lijst.length === 0
          ? `<div style="font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0">Nog geen opdrachten in de lijst.</div>`
          : lijst.map(o => `
            <div class="ml-item">
              <span>${esc(o.text)}</span>
              <button class="ml-del" data-ml-del="${o.id}" title="Verwijderen">✕</button>
            </div>`).join("")}
      </details>
    </div>`;
}
function wireMissionLib(el){
  const inp = el.querySelector("#mlInput");
  const add = el.querySelector("#mlAdd");
  if(!inp || !add) return;
  const voegToe = async () => {
    const text = inp.value.trim();
    if(!text) return;
    if(S.missionLib.some(o => o.text.toLowerCase() === text.toLowerCase())){ toast("Staat al in de lijst"); return; }
    inp.value = "";
    await DB.add("missionLib", {text, at: now()});
    haptic(8);
  };
  add.onclick = voegToe;
  inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); voegToe(); } };
  el.querySelectorAll("[data-ml-del]").forEach(b => b.onclick = async () => {
    await DB.del("missionLib/" + b.dataset.mlDel);
    haptic(6);
  });
}

  `, m => {

function askTakeoverModal(reqId){
  const r = S.roleRequests.find(x => x.id === reqId);
  if(!r) return;
  const p = S.players.find(x => x.id === r.pid);
  const rol = p && p.role ? ROLES[p.role] : null;
  const anderen = S.players.filter(x => !x.isLeader && x.id !== r.pid && x.status !== "uit");
  modal(`
    <h3>🔄 Wie wil deze rol overnemen?</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">De geselecteerde spelers krijgen de vraag of ze de rol ${rol ? `<b style="color:var(--text)">${rol.emoji} ${rol.naam}</b>` : "van deze speler"} willen overnemen. Wie als eerste ja zegt, ruilt van rol met <b style="color:var(--text)">${esc(r.pn)}</b> en het verzoek wordt automatisch goedgekeurd.<br><span style="color:var(--gold)">De naam van ${esc(r.pn)} wordt niet getoond.</span></p>
    <div class="check-list">
      ${anderen.map(x => `<label><input type="checkbox" value="${x.id}"> ${esc(x.name)} <span style="color:var(--muted);font-size:12px;margin-left:auto">${x.role ? ROLES[x.role].naam : "geen rol"}</span></label>`).join("")}
    </div>
    <button class="btn btn-green btn-block" id="atSend">Vraag versturen</button>
  `, m => {
    m.querySelector("#atSend").onclick = async () => {
      const ids = [...m.querySelectorAll(".check-list input:checked")].map(cb => cb.value);
      if(!ids.length){ toast("Kies minimaal één speler"); return; }
      if(!p || !p.role){ toast("Deze speler heeft nog geen rol"); return; }
      for(const id of ids){
        const t = S.players.find(x => x.id === id);
        await DB.add("takeovers", {reqId, fromPid:r.pid, fromPn:r.pn, role:p.role, targetPid:id, targetPn:t.name, status:"open", at: now()});
        await DB.set("chats/dm_" + id, {type:"dm", dmFor:id, at: now()});
        await sendSystem("dm_" + id, `🔄 De spelleider vraagt of je een andere rol wilt overnemen — bekijk het verzoek via het tabblad 'Mijn rol'.`);
      }
      haptic(12); toast(`Vraag verstuurd naar ${ids.length} speler${ids.length === 1 ? "" : "s"}`);
      closeModal();
    };
  });
}

async function closeRequest(reqId, status){
  await DB.set("roleRequests/" + reqId, {status, closedAt: now()});
  for(const t of S.takeovers.filter(x => x.reqId === reqId && x.status === "open")){
    await DB.set("takeovers/" + t.id, {status:"gesloten"});
  }
}

async function acceptTakeover(takeoverId){
  const t = S.takeovers.find(x => x.id === takeoverId);
  if(!t) return;
  const fresh = await DB.getDoc("takeovers/" + takeoverId);
  if(!fresh || fresh.status !== "open"){ toast("Dit verzoek is niet meer geldig"); return; }
  const req = S.roleRequests.find(x => x.id === t.reqId);
  if(req && req.status !== "open"){ toast("Iemand anders was je voor"); await DB.set("takeovers/" + takeoverId, {status:"gesloten"}); return; }
  const mijnRol = S.me.role || null;
  // rollen ruilen
  await DB.set("players/" + S.me.id, {role: t.role});
  await DB.set("players/" + t.fromPid, {role: mijnRol});
  await DB.set("takeovers/" + takeoverId, {status:"geaccepteerd", acceptedAt: now()});
  await closeRequest(t.reqId, "goedgekeurd");
  await sendSystem("dm_" + t.fromPid, `🔄 Goed nieuws! Je rolverzoek is goedgekeurd — een medespeler heeft je rol overgenomen. Bekijk je nieuwe rol via 'Mijn rol'.`);
  await sendSystem("dm_" + S.me.id, `🔄 Je hebt de rol overgenomen! Bekijk je nieuwe rol via het tabblad 'Mijn rol'.`);
  haptic(15);
  toast("Je hebt de nieuwe rol! 🎭");
  setTimeout(syncAutoChats, 500);
}

const normAnswer = s => {
  const words = String(s || "")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, "")
    .split(/\s+/)
    .filter(Boolean);
  const zonderLidwoorden = words.filter(w => !["de", "het", "een", "t"].includes(w));
  return (zonderLidwoorden.length ? zonderLidwoorden : words).join("");
};

    ${myAttempts.length ? `<div class="section-label">Jouw eerdere pogingen</div>` + myAttempts.slice(0,5).map(a => `
      <div class="attempt-row"><div class="aa">"${esc(a.answer)}" ✗<div class="who">${fmtTime(a.at)}</div></div></div>`).join("") : ""}
  `, m => {
    const inp = m.querySelector("#riAnswer");
    const submit = async () => {
      const val = inp.value.trim();
      if(!val) return;
      const mine = S.riddleAttempts.filter(a => a.rid === rid && a.pid === S.me.id).sort((a,b) => (b.at||0)-(a.at||0));
      if(mine.length && now() - mine[0].at < 5*60*1000){
        toast(`⏳ Nog ${Math.ceil((5*60*1000 - (now() - mine[0].at))/60000)} min. wachten tot je volgende poging`);
        return;
      }
      m.querySelector("#riSubmit").disabled = true;
      const fresh = await DB.getDoc("riddles/" + rid);
      if(!fresh){ closeModal(); return; }
      if(fresh.status === "gewonnen"){
        closeModal(); riddleModal(rid); return;
      }
      const correct = normAnswer(val) === normAnswer(fresh.answer);
      await DB.add("riddleAttempts", {rid, pid:S.me.id, pn:S.me.name, answer:val, correct, at: now()});
      if(correct){
        const wonIt = await awardShield(rid, S.me.id, S.me.name);
        haptic(20);
        closeModal();
        if(wonIt){
          modal(`
            <div class="shield-win">
              <div class="sh">🛡️</div>
              <h2>JE HEBT HET SCHILD GEWONNEN!</h2>
              <p style="font-size:14px;color:var(--muted);line-height:1.55">Je was de eerste met het goede antwoord. Je bent veilig tijdens het eerstvolgende infiltrantenoverleg (niet tijdens de algemene stemronde daarvóór). 🤫</p>
            </div>`);
          spawnConfetti("gelovige");
        } else {
          riddleModal(rid); // iemand was je nét voor
        }
      } else {
        haptic(6);
        toast("Helaas, dat is niet het goede antwoord. Over 5 minuten mag je het opnieuw proberen.");
        closeModal();
      }
    };
    m.querySelector("#riSubmit").onclick = submit;
    inp.onkeydown = e => { if(e.key === "Enter") submit(); };
  });
}

async function approveHuntEntry(hid, entryId, pid, pn){
  const fresh = await DB.getDoc("hunts/" + hid);
  if(!fresh || fresh.status !== "open"){ toast("Deze opdracht is al gesloten"); return; }
  await DB.set("huntEntries/" + entryId, {status:"goedgekeurd"});
  await DB.set("hunts/" + hid, {status:"gewonnen", winnerId:pid, winnerName:pn, wonAt: now()});
  // speler keert terug als gewone gelovige
  await DB.set("players/" + pid, {role:"gelovige", status:"actief", statusAt: now()});
  await DB.add(`chats/${fresh.chatId}/messages`, {type:"sys", t:`🔓 ${pn} heeft het geheime voorwerp gevonden en is ontsnapt! ${pn} keert terug als gewone gelovige. De zoekopdracht is gesloten.`, at: now()});
  await DB.set("chats/" + fresh.chatId, {lastAt: now(), lastSid:"sys", lastText:`🔓 ${pn} is ontsnapt!`});
  await DB.set("chats/dm_" + pid, {type:"dm", dmFor:pid, at: now()});
  await sendSystem("dm_" + pid, `🔓 Je selfie is goedgekeurd — je bent ontsnapt en keert terug als gewone gelovige! Bekijk je rol via 'Mijn rol'.`);
  await sendSystem("all", `🔓 ${pn} heeft het geheime voorwerp gevonden en is ontsnapt uit de handen van de infiltranten!`);
  haptic(18);
  toast(`${pn} is ontsnapt! 🔓`);
  setTimeout(syncAutoChats, 500);
}

let publishingRiddles = false;
async function publishDueRiddles(){
  if(!S.me || publishingRiddles) return;
  const due = S.riddles.filter(r => !r.published && r.publishAt && r.publishAt <= now());
  if(!due.length) return;
  publishingRiddles = true;
  try{
    for(const r of due){
      await new Promise(res => setTimeout(res, 300 + Math.random()*1700));
      const fresh = await DB.getDoc("riddles/" + r.id);
      if(!fresh || fresh.published) continue;
      await DB.set("riddles/" + r.id, {published:true, publishedAt: now()});
      await postRiddleMessage(r.id);
    }
  } finally { publishingRiddles = false; }
}

/* =====================================================================
   VIEW: open chat
   ===================================================================== */
function openChat(chatId){
  S.openChat = chatId;
  S.replyTo = null;
  S.chatJustOpened = true;
  S.closingChat = false;
  markeerGelezen(chatId);
  if(S.unsubMsgs) S.unsubMsgs();
  // eerder opgehaalde berichten meteen tonen, zodat je je geschiedenis direct ziet
  S.msgs = S.msgCache[chatId] || [];
  S.msgsLoaded = Object.prototype.hasOwnProperty.call(S.msgCache, chatId);
  S.unsubMsgs = DB.listen(`chats/${chatId}/messages`, docs => {
    const gesorteerd = docs.sort((a,b) => (a.at||0)-(b.at||0));
    S.msgCache[chatId] = gesorteerd;
    S.msgs = gesorteerd;
    S.msgsLoaded = true;
    if(S.openChat === chatId){ markeerGelezen(chatId); renderChat(); }
  });
  renderChat();
}
function closeChat(skipAnim){
  const done = () => {
    if(S.unsubMsgs){ S.unsubMsgs(); S.unsubMsgs = null; }
    S.openChat = null; S.closingChat = false; S.replyTo = null;
    render();
  };
  const scr = document.querySelector(".chat-screen");
  if(scr && !skipAnim){
    S.closingChat = true;
    scr.classList.add("closing");
    setTimeout(done, 210);
  } else done();
}

function renderChat(){
  if(S.closingChat) return;
  const c = S.chats.find(x => x.id === S.openChat);
  if(!c){ closeChat(true); return; }
  const root = $("#root");
  const isL = S.me.isLeader;
  const firstRender = S.chatJustOpened;

  // toestand bewaren vóór re-render
  const draft = $("#composerText") ? $("#composerText").value : "";
  const hadFocus = document.activeElement && document.activeElement.id === "composerText";
  const oldMsgs = $("#msgs");
  const wasNearBottom = !oldMsgs || (oldMsgs.scrollHeight - oldMsgs.scrollTop - oldMsgs.clientHeight < 160);
  const oldScrollTop = oldMsgs ? oldMsgs.scrollTop : 0;
  const prevCount = S.msgCounts[c.id] ?? -1;

  const msgHtml = S.msgs.map((m, i) => {
    const prev = S.msgs[i-1];
    const gap = !prev || (m.at - (prev.at||0)) > 5*60*1000 || prev.sid !== m.sid;
    if(m.type === "sys") return `<div class="msg sys">${esc(m.t)}</div>`;
    if(m.type === "veld") return veldwerkKaartHtml(m.opts);
    if(m.type === "verleid"){
      const v = S.verleidingen.find(x => x.id === m.vid);
      return v ? verleidKaartHtml(v) : "";
    }
    if(m.type === "mission"){
      const mi = S.missions.find(x => x.id === m.mid);
      return mi ? missionCardHtml(mi) : "";
    }
    if(m.type === "poll"){
      const p = S.polls.find(x => x.id === m.pollId);
      return p ? pollCardHtml(p, c) : "";
    }
    if(m.type === "report"){
      const r = S.reports.find(x => x.id === m.reportId);
      return r ? reportCardHtml(r) : "";
    }
    if(m.type === "riddle"){
      const r = S.riddles.find(x => x.id === m.rid);
      return r ? riddleCardHtml(r) : "";
    }
    if(m.type === "hunt"){
      const h = S.hunts.find(x => x.id === m.hid);
      return h ? huntCardHtml(h) : "";
    }
    const mine = m.sid === S.me.id;
    const showSender = c.type !== "dm" && !mine;
    return `
      <div class="msg ${mine ? "mine" : ""} ${gap ? "gap" : ""}" data-mid="${m.id}">
        <span class="reply-hint">↩︎</span>
        ${showSender && gap ? `<div class="sender">${esc(m.sn)}</div>` : ""}
        ${m.re ? `<div class="msg-quote" data-goto="${esc(m.re.id)}">
          <div class="mq-name">${esc(m.re.sn)}</div>
          <div class="mq-text">${esc(m.re.t)}</div>
        </div>` : ""}
        ${m.type === "img" ? `<img data-img="${m.imgId}" alt="foto">` : ""}
        ${m.t ? `<div>${esc(m.t)}</div>` : ""}
        <div class="mtime">${fmtTime(m.at)}${mine ? leesBadge(m, c) : ""}</div>

  }).join("");

  root.innerHTML = `
    <div class="chat-screen ${firstRender ? "animate-in" : ""}">
      <div class="chat-head">
        <button class="back" id="chatBack">‹</button>
        <div class="info ${c.type === "dm" ? "" : "tikbaar"}" ${c.type === "dm" ? "" : 'id="chatInfo"'}>

        </div>

        ${S.msgs.length === 0
          ? (S.msgsLoaded

              : `<div class="empty"><div class="big">💬</div>Berichten laden…</div>`)
          : msgHtml}
      </div>
      ${!isL && isMuted(S.me) ? `
      <div class="muted-note">👁️ Je bent ${S.me.status === "ontmaskerd" ? "ontmaskerd" : "verbannen"} — je kunt meelezen, maar niet meer chatten of stemmen.</div>` : `
      ${S.replyTo ? `
      <div class="reply-bar">
        <div class="rb-line"></div>
        <div class="rb-body">
          <div class="rb-name">↩︎ ${esc(S.replyTo.sn)}</div>

        </div>

      </div>` : ""}
      <div class="composer">
        ${isL && (c.type !== "dm" || isVeldwerkerChat(c)) ? `<button class="icon-btn" id="btnPlus" title="Meer acties">＋</button>` : ""}

        <button class="icon-btn send" id="btnSend">➤</button>
      </div>`}
    </div>`;
  S.chatJustOpened = false;

  const scr = root.querySelector(".chat-screen");
  // swipe-terug niet starten op een bericht: daar betekent naar rechts vegen "reageren"
  enableSwipeBack(scr, () => closeChat(true), ".msg[data-mid]");

  // nieuw-bericht-animatie (alleen het laatste bericht, niet bij eerste render)

  if(grew && !firstRender){

    if(list.length) list[list.length-1].classList.add("new");
  }

  // slim scrollen: blijf onderaan plakken, maar trek de gebruiker niet omlaag als hij terugscrollt
  const lastMine = S.msgs.length && S.msgs[S.msgs.length-1].sid === S.me.id;
  if(firstRender){
    msgsEl.scrollTop = msgsEl.scrollHeight;
  } else if(wasNearBottom || lastMine){
    msgsEl.scrollTo({top: msgsEl.scrollHeight, behavior: grew ? "smooth" : "auto"});
  } else {

  }

  msgsEl.querySelectorAll("img[data-img]").forEach(img => {

  // reageren: naar rechts vegen (mobiel) of dubbelklikken (desktop)
  msgsEl.querySelectorAll(".msg[data-mid]").forEach(el => {

  msgsEl.querySelectorAll("[data-goto]").forEach(q => q.onclick = e => {

    ${c.id === "infiltranten" ? `<button class="btn btn-ghost btn-block" data-actie="verleid" style="margin-bottom:10px;justify-content:flex-start">🙈 &nbsp;Verleiden of gevangennemen?</button>` : ""}
    ${c.id === "gevangenen" ? `<button class="btn btn-ghost btn-block" data-actie="hunt" style="margin-bottom:10px;justify-content:flex-start">🔎 &nbsp;Zoekopdracht geheim voorwerp</button>` : ""}
  `, m => {

      if(a === "poll") newPollModal(c.id);

  const ge = $("#grpEdit"); if(ge) ge.onclick = () => editGroupModal(c);
}

/* =====================================================================
   MISSIESTEMMING (infiltranten kiezen de missie van de dag)
   ===================================================================== */
function chatVoters(c){
  const mag = p => p && !p.isLeader && p.status !== "uit" && p.status !== "ontmaskerd";
  if(c.type === "all") return S.players.filter(mag).map(p => p.id);
  return (c.members || []).filter(id => mag(S.players.find(x => x.id === id)));
}
function pollVotes(p){
  const v = {};
  Object.keys(p).forEach(k => { if(k.startsWith("v_")) v[k.slice(2)] = p[k]; });
  return v;
}
function pollCardHtml(p, chat){
  const closed = p.status === "besloten";
  const votes = pollVotes(p);
  const voters = chatVoters(chat);
  const votedCount = voters.filter(id => votes[id] != null).length;
  const counts = p.options.map((_, i) => Object.entries(votes).filter(([pid, v]) => v === i && voters.includes(pid)).length);
  const my = votes[S.me.id];
  const canVote = !closed && !S.me.isLeader && voters.includes(S.me.id);
  const allVoted = voters.length > 0 && votedCount >= voters.length;
  const max = Math.max(...counts, 0);
  const tie = allVoted && counts.filter(n => n === max).length > 1;
  return `
    <div class="mission-card pollcard ${closed ? "done" : ""}">
      <div class="mc-top"><h4>🗳️ ${esc(p.title)}</h4><span class="pill ${closed ? "pill-green" : "pill-gold"}">${closed ? "Gekozen" : "Stemmen"}</span></div>
      ${p.options.map((opt, i) => `
        <div class="poll-row">
          <button class="poll-opt ${my === i && !closed ? "sel" : ""} ${closed && p.winner === i ? "win" : ""}"
                  data-vote="${p.id}:${i}" ${canVote ? "" : "disabled"}>
            <span>${closed && p.winner === i ? "🏆 " : ""}${esc(opt)}</span><span class="cnt">${counts[i]}</span>
          </button>
          ${S.me.isLeader && !closed ? `<button class="icon-btn poll-pick" data-choose="${p.id}:${i}" title="Kies deze missie">👑</button>` : ""}
        </div>`).join("")}
      <div class="poll-foot">
        ${closed
          ? `✔ De missie van vandaag is gekozen.`
          : `${votedCount}/${voters.length} gestemd${tie ? " · 🤝 Gelijkspel — de spelleider hakt de knoop door (👑)" : ""}${canVote && my == null ? " · Tik op een missie om te stemmen" : ""}${canVote && my != null ? " · Je kunt je stem nog wijzigen" : ""}`}
      </div>
    </div>`;
}

/* ---------- verleiden of gevangennemen (infiltranten) ---------- */
const VERLEID_KEUZES = {
  verleiden: {emoji:"🙈", naam:"Verleiden",     uitleg:"Iemand overhalen om over te lopen"},
  gevangen:  {emoji:"⛓️", naam:"Gevangennemen", uitleg:"Een gelovige vannacht gevangenzetten"},
};
function verleidStemmers(c){
  // alleen infiltranten die nog echt meedoen
  return chatVoters(c).filter(id => {
    const p = S.players.find(x => x.id === id);
    return p && isInfiltrant(p) && (p.status || "actief") === "actief";
  });
}
function verleidKaartHtml(v){
  const c = S.chats.find(x => x.id === v.chatId);
  if(!c) return "";
  const stemmers = verleidStemmers(c);
  const stemmen = pollVotes(v);
  const mijn = stemmen[S.me.id];
  const magStemmen = !S.me.isLeader && stemmers.includes(S.me.id) && v.status === "open" && !S.settings.gameOver;
  const gesloten = v.status === "besloten";
  const tel = k => stemmers.filter(id => stemmen[id] === k).length;
  const gestemd = stemmers.filter(id => stemmen[id] != null).length;
  const isL = S.me.isLeader;
  const gelijk = !gesloten && stemmers.length > 0 && gestemd === stemmers.length
    && tel("verleiden") === tel("gevangen");
  return `
    <div class="mission-card verleidcard ${gesloten ? "done" : ""}">
      <div class="mc-top">
        <h4>🙈 Verleiden of gevangennemen?</h4>
        <span class="pill ${gesloten ? "pill-green" : "pill-gold"}">${gesloten ? "Besloten" : "Stemmen"}</span>
      </div>
      <p class="mc-desc">Wat doen jullie vannacht? Iedere infiltrant die nog meedoet brengt één stem uit.</p>
      ${Object.entries(VERLEID_KEUZES).map(([k, o]) => `
        <button class="verleid-optie ${mijn === k ? "mijn" : ""} ${gesloten && v.uitkomst === k ? "gewonnen" : ""}"
                data-verleid="${v.id}:${k}" ${magStemmen ? "" : "disabled"}>
          <span class="vo-emoji">${o.emoji}</span>
          <span class="vo-main"><b>${o.naam}</b><span>${o.uitleg}</span></span>
          <span class="vo-tel">${tel(k)}</span>
        </button>
        ${isL && gelijk ? `<button class="btn btn-sm btn-ghost" data-verleid-kies="${v.id}:${k}" style="margin:-4px 0 8px">👑 Kies "${o.naam}"</button>` : ""}`).join("")}
      <div class="mc-meta">${gesloten
        ? `${VERLEID_KEUZES[v.uitkomst] ? VERLEID_KEUZES[v.uitkomst].emoji : "🙈"} Besloten: vannacht wordt er <b>${v.uitkomst === "verleiden" ? "verleid" : "gevangengenomen"}</b>`
        : `${gestemd}/${stemmers.length} gestemd${gelijk ? " · 🤝 Gelijkspel — de spelleider hakt de knoop door (👑)" : ""}${magStemmen && mijn == null ? " · Tik op een keuze" : ""}${magStemmen && mijn != null ? " · Je kunt je stem nog wijzigen" : ""}`}</div>
    </div>`;
}
async function stemVerleid(vid, keuze){
  haptic(6);
  await DB.set("verleidingen/" + vid, {["v_" + S.me.id]: keuze});
  const v = await DB.getDoc("verleidingen/" + vid);
  if(!v || v.status !== "open") return;
  const c = S.chats.find(x => x.id === v.chatId);
  if(!c) return;
  const stemmers = verleidStemmers(c);
  const stemmen = pollVotes(v);
  if(!stemmers.length || !stemmers.every(id => stemmen[id] != null)) return;
  const a = stemmers.filter(id => stemmen[id] === "verleiden").length;
  const b = stemmers.filter(id => stemmen[id] === "gevangen").length;
  if(a === b) return;                       // gelijkspel: de spelleider beslist
  await sluitVerleiding(vid, a > b ? "verleiden" : "gevangen");
}
async function sluitVerleiding(vid, uitkomst){
  const v = await DB.getDoc("verleidingen/" + vid);
  if(!v || v.status !== "open") return;
  await DB.set("verleidingen/" + vid, {status:"besloten", uitkomst, closedAt: now()});
  const o = VERLEID_KEUZES[uitkomst];
  await DB.add(`chats/${v.chatId}/messages`, {
    type:"sys", at: now(),
    t:`${o.emoji} Besloten: vannacht gaan de infiltranten ${uitkomst === "verleiden" ? "verleiden" : "iemand gevangennemen"}.`,
  });
  await DB.set("chats/" + v.chatId, {lastAt: now(), lastSid:"sys", lastText:`${o.emoji} ${o.naam}`});
}

// de missie die vandaag uit de stemming kwam, als voorzet voor "de echte"
function missieVanVandaag(){
  const poll = S.polls
    .filter(p => p.status === "besloten" && p.day === todayKey() && p.winner != null)
    .sort((a,b) => (b.closedAt||0)-(a.closedAt||0))[0];
  if(poll) return poll.options[poll.winner] || "";
  const mi = S.missions.filter(m => (m.at||0) > 0).sort((a,b) => (b.at||0)-(a.at||0))[0];
  return mi ? mi.title : "";
}

async function castVote(pollId, idx){
  haptic(6);
  await DB.set("missionPolls/" + pollId, {["v_" + S.me.id]: idx});
  await maybeAutoClosePoll(pollId);
}
async function maybeAutoClosePoll(pollId){
  const p = await DB.getDoc("missionPolls/" + pollId);
  if(!p || p.status !== "open") return;
  const chat = S.chats.find(c => c.id === p.chatId);
  if(!chat) return;
  const voters = chatVoters(chat);
  const votes = pollVotes(p);
  if(!voters.length || !voters.every(id => votes[id] != null)) return;
  const counts = p.options.map((_, i) => voters.filter(id => votes[id] === i).length);
  const max = Math.max(...counts);
  if(counts.filter(n => n === max).length > 1) return; // gelijkspel -> spelleider beslist
  await closePoll(pollId, counts.indexOf(max));
}
async function closePoll(pollId, winnerIdx){
  const p = await DB.getDoc("missionPolls/" + pollId);
  if(!p || p.status !== "open") return;
  await DB.set("missionPolls/" + pollId, {status:"besloten", winner: winnerIdx, closedAt: now()});
  const title = p.options[winnerIdx];
  const mid = await DB.add("missions", {
    chatId: p.chatId, title,
    desc:"Gekozen via de missiestemming. Voer de missie ongezien uit en lever foto's in als bewijs.",
    deadline:null, status:"open", photoCount:0, at: now()
  });
  await DB.add(`chats/${p.chatId}/messages`, {type:"sys", t:`🗳️ De stemming is afgerond! Missie van vandaag: "${title}"`, at: now()});
  await DB.add(`chats/${p.chatId}/messages`, {type:"mission", mid, at: now() + 1});
  await DB.set("chats/" + p.chatId, {lastAt: now(), lastSid:"sys", lastText:"🗳️ Missie gekozen: " + title});
}

   EINDKAART: statistieken, poster om te bewaren en tekst voor WhatsApp
   ===================================================================== */
async function verzamelStats(){
  const spelers = S.players.filter(p => !p.isLeader);
  const inf = spelers.filter(p => isInfiltrant(p));
  const missies = S.missions || [];
  const gehaald = missies.filter(m => m.status === "goedgekeurd");
  const raadsels = (S.riddles || []).filter(r => r.published);
  const schilden = raadsels.filter(r => r.status === "gewonnen");
  const vragen = S.hackerQs || [];
  const hunts = S.hunts || [];
  const ontsnapt = hunts.filter(h => h.status === "gewonnen");
  const gevangen = spelers.filter(p => p.status === "gevangen").length + ontsnapt.length;

  // berichten tellen over alle chats waar de app van weet
  let berichten = 0, fotos = 0;
  const perSpeler = {};
  for(const c of S.chats){
    let msgs = [];
    try{ msgs = await DB.getAll(`chats/${c.id}/messages`); }catch(e){ msgs = []; }
    for(const m of msgs){
      if(m.type === "sys" || m.type === "poll" || m.type === "mission" || m.type === "veld" || m.type === "verleid") continue;
      berichten++;
      if(m.type === "img") fotos++;
      if(m.sid) perSpeler[m.sid] = (perSpeler[m.sid] || 0) + 1;
    }
  }
  const drukste = Object.entries(perSpeler)
    .map(([id, n]) => ({p: S.players.find(x => x.id === id), n}))
    .filter(x => x.p && !x.p.isLeader)
    .sort((a,b) => b.n - a.n)[0];

  // wie lag er als eerste uit, en wie hield het tot het eind vol
  const eruit = spelers.filter(p => p.status === "uit" || p.status === "ontmaskerd")
    .sort((a,b) => (a.statusAt||0) - (b.statusAt||0));
  const overlevers = spelers.filter(p => p.status === "actief" || p.status === "gevangen");

  return {
    winnaar: S.settings.winner === "infiltrant" ? "infiltrant" : "gelovige",
    dagen: spelDag(),
    spelers, nSpelers: spelers.length, nInf: inf.length,
    missiesTotaal: missies.length, missiesGehaald: gehaald.length,
    nRaadsels: raadsels.length, schilden,
    nVragen: vragen.length, nBeantwoord: vragen.filter(q => q.answer).length,
    gevangen, nOntsnapt: ontsnapt.length,
    berichten, fotos, drukste,
    eersteEruit: eruit[0] || null, overlevers,
    hoogtepunt: (S.settings.hoogtepunt || "").trim(),
  };
}

function statsTekst(s){
  const rol = p => {
    const r = p.role ? ROLES[p.role] : null;
    return r ? `${r.emoji} ${p.name} — ${r.naam}` : `❔ ${p.name} — geen rol`;
  };
  const infs = s.spelers.filter(p => isInfiltrant(p));
  const rest = s.spelers.filter(p => !isInfiltrant(p));
  const regels = [
    `🕵️ *GEHEIME DIENST* — de uitslag`,
    `🏆 *${s.winnaar === "infiltrant" ? "De infiltranten winnen!" : "De gelovigen winnen!"}*`,
    ``,
    `📅 ${s.dagen} ${s.dagen === 1 ? "dag" : "dagen"} · 👥 ${s.nSpelers} spelers · 🕵️ ${s.nInf} infiltrant${s.nInf === 1 ? "" : "en"}`,
    `✅ ${s.missiesGehaald} van de ${s.missiesTotaal} opdrachten gehaald`,
    `🛡️ ${s.nRaadsels} raadsels${s.schilden.length ? ` · schild voor ${s.schilden.map(r => r.winnerName).join(", ")}` : ""}`,
    `💻 ${s.nVragen} hackervragen gesteld`,
    `⛓️ ${s.gevangen} gevangen · ${s.nOntsnapt} ontsnapt`,
    `💬 ${s.berichten} berichten en ${s.fotos} ${s.fotos === 1 ? "foto" : "foto's"}`,
  ];
  if(s.drukste) regels.push(`🗣️ Meeste berichten: ${s.drukste.p.name} (${s.drukste.n})`);
  if(s.eersteEruit) regels.push(`💀 Als eerste eruit: ${s.eersteEruit.name}`);
  if(s.hoogtepunt) regels.push(``, `⭐ *Hoogtepunt:* ${s.hoogtepunt}`);
  regels.push(``, `🎭 *De rollen:*`);
  infs.forEach(p => regels.push(rol(p)));
  rest.forEach(p => regels.push(rol(p)));
  return regels.join("\n");
}

/* Poster tekenen op canvas — geen externe bibliotheek nodig, en het resultaat
   is een echte afbeelding die je kunt bewaren of delen. */
async function tekenEindkaart(s){
  const B = 1080, PAD = 70;
  const inf = s.winnaar === "infiltrant";
  const ACC = inf ? "#ff5b4d" : "#62c554";
  const cv = document.createElement("canvas");
  cv.width = B; cv.height = 4200;
  const x = cv.getContext("2d");
  try{ await document.fonts.ready; }catch(e){}
  // altijd een lijst meegeven: canvas valt anders terug op een serif
  const kop = '"Lilita One", "Poppins", Arial, sans-serif';
  const tekst = '"Poppins", -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

  x.fillStyle = "#141417"; x.fillRect(0, 0, B, cv.height);
  const gl = x.createRadialGradient(B/2, 300, 60, B/2, 300, 900);
  gl.addColorStop(0, inf ? "rgba(255,59,48,.22)" : "rgba(98,197,84,.22)");
  gl.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = gl; x.fillRect(0, 0, B, 1300);

  const rond = (px, py, w, h, r) => {
    x.beginPath(); x.moveTo(px+r, py);
    x.arcTo(px+w, py, px+w, py+h, r); x.arcTo(px+w, py+h, px, py+h, r);
    x.arcTo(px, py+h, px, py, r); x.arcTo(px, py, px+w, py, r); x.closePath();
  };
  const mid = (t, f, kl, py) => { x.font = f; x.fillStyle = kl; x.textAlign = "center"; x.fillText(t, B/2, py); };

  let y = 110;
  const logo = await new Promise(res => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "kaarten/logo.png";
  });
  if(logo && logo.naturalWidth){
    const w = 440, h = w * logo.naturalHeight / logo.naturalWidth;
    x.drawImage(logo, (B-w)/2, y, w, h); y += h + 26;
  } else { mid("GEHEIME DIENST", `700 74px ${kop}`, "#f4f4f5", y + 60); y += 100; }
  mid((CFG.spelSubtitel || "Real life edition").toUpperCase(), `600 26px ${tekst}`, "#9b9ba3", y);
  y += 90;

  mid("🏆", `100px ${tekst}`, "#fff", y + 84); y += 176;
  x.textAlign = "center";
  const titel = inf ? ["DE INFILTRANTEN", "WINNEN"] : ["DE GELOVIGEN", "WINNEN"];
  x.font = `700 78px ${kop}`; x.fillStyle = ACC;
  titel.forEach(r => { x.fillText(r, B/2, y); y += 86; });
  y += 40;

  // tegels met de cijfers
  const tegels = [
    [s.dagen, s.dagen === 1 ? "DAG GESPEELD" : "DAGEN GESPEELD"],
    [s.nSpelers, "SPELERS"],
    [s.nInf, s.nInf === 1 ? "INFILTRANT" : "INFILTRANTEN"],
    [`${s.missiesGehaald}/${s.missiesTotaal}`, "OPDRACHTEN GEHAALD"],
    [s.nRaadsels, s.nRaadsels === 1 ? "RAADSEL" : "RAADSELS"],
    [s.nVragen, "HACKERVRAGEN"],
    [s.gevangen, "GEVANGEN"],
    [s.berichten, "BERICHTEN"],
  ];
  const tw = (B - PAD*2 - 24) / 2, th = 150;
  tegels.forEach((t, i) => {
    const px = PAD + (i % 2) * (tw + 24), py = y + Math.floor(i/2) * (th + 20);
    x.fillStyle = "#1e1e23"; rond(px, py, tw, th, 26); x.fill();
    x.strokeStyle = "rgba(255,255,255,.07)"; x.lineWidth = 2; x.stroke();
    x.textAlign = "center";
    x.font = `700 58px ${kop}`; x.fillStyle = "#f4f4f5"; x.fillText(String(t[0]), px + tw/2, py + 76);
    x.font = `600 22px ${tekst}`; x.fillStyle = "#9b9ba3"; x.fillText(t[1], px + tw/2, py + 112);
  });
  y += Math.ceil(tegels.length/2) * (th + 20) + 26;

  const regel = (t, py) => { x.textAlign = "center"; x.font = `500 27px ${tekst}`; x.fillStyle = "#c9c9d1"; x.fillText(t, B/2, py); };
  if(s.fotos) { regel(`📷 ${s.fotos} ${s.fotos === 1 ? "foto" : "foto's"} gedeeld`, y); y += 44; }
  if(s.drukste) { regel(`🗣️ Meeste berichten: ${s.drukste.p.name} (${s.drukste.n})`, y); y += 44; }
  if(s.schilden.length) { regel(`🛡️ Schild: ${s.schilden.map(r => r.winnerName).join(", ")}`, y); y += 44; }
  if(s.eersteEruit) { regel(`💀 Als eerste eruit: ${s.eersteEruit.name}`, y); y += 44; }
  y += 20;

  if(s.hoogtepunt){
    x.textAlign = "left";
    x.font = `500 30px ${tekst}`;
    const woorden = s.hoogtepunt.split(/\s+/); const lijnen = []; let r = "";
    for(const wo of woorden){
      if(x.measureText(r ? r + " " + wo : wo).width > B - PAD*2 - 80){ lijnen.push(r); r = wo; }
      else r = r ? r + " " + wo : wo;
    }
    if(r) lijnen.push(r);
    const hh = 84 + lijnen.length * 42;
    x.fillStyle = "rgba(214,175,84,.10)"; rond(PAD, y, B - PAD*2, hh, 26); x.fill();
    x.strokeStyle = "rgba(214,175,84,.45)"; x.lineWidth = 2; x.stroke();
    x.textAlign = "center";
    x.font = `600 24px ${tekst}`; x.fillStyle = "#d6af54"; x.fillText("⭐ HOOGTEPUNT", B/2, y + 44);
    x.font = `500 30px ${tekst}`; x.fillStyle = "#f0eadb";
    lijnen.forEach((l, i) => x.fillText(l, B/2, y + 88 + i*42));
    y += hh + 34;
  }

  mid("DE ROLLEN ONTHULD", `700 40px ${kop}`, "#f4f4f5", y + 20); y += 74;
  const gesorteerd = [...s.spelers].sort((a,b) => {
    const ta = isInfiltrant(a) ? 0 : 1, tb = isInfiltrant(b) ? 0 : 1;
    return ta - tb || (a.name||"").localeCompare(b.name||"");
  });
  for(const p of gesorteerd){
    const r = p.role ? ROLES[p.role] : null;
    const isInf = isInfiltrant(p);
    const kl = isInf ? "#ff5b4d" : "#62c554";
    x.fillStyle = "#1e1e23"; rond(PAD, y, B - PAD*2, 76, 22); x.fill();
    x.fillStyle = kl; rond(PAD, y, 8, 76, 4); x.fill();
    x.textAlign = "left";
    x.font = `40px ${tekst}`; x.fillText(r ? r.emoji : "❔", PAD + 30, y + 52);
    x.font = `600 32px ${tekst}`; x.fillStyle = "#f4f4f5"; x.fillText(p.name, PAD + 92, y + 50);
    x.textAlign = "right";
    x.font = `500 27px ${tekst}`; x.fillStyle = kl;
    x.fillText(r ? r.naam : "geen rol", B - PAD - 26, y + 50);
    y += 88;
  }

  y += 26;
  const d = new Date(S.settings.endedAt || Date.now());
  mid(`${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()} · Camping Vell Emporda`, `500 24px ${tekst}`, "#6f6f78", y);
  y += 70;

  // bijsnijden op de werkelijke hoogte
  const uit = document.createElement("canvas");
  uit.width = B; uit.height = y;
  uit.getContext("2d").drawImage(cv, 0, 0);
  return await new Promise(res => uit.toBlob(res, "image/png"));
}

async function eindkaartModal(){
  modal(`<h3>🏁 Eindkaart</h3><div class="ek-laden">Statistieken verzamelen…</div>`);
  const s = await verzamelStats();
  const blob = await tekenEindkaart(s);
  const url = URL.createObjectURL(blob);
  const isL = S.me.isLeader;
  modal(`
    <h3>🏁 Eindkaart</h3>
    <img class="ek-preview" src="${url}" alt="Eindkaart">
    <button class="btn btn-green btn-block" id="ekSave" style="margin-bottom:9px">💾 Bewaar als afbeelding</button>
    <button class="btn btn-ghost btn-block" id="ekText" style="margin-bottom:9px">📝 Deel als tekst (WhatsApp)</button>
    ${isL ? `<button class="btn btn-ghost btn-block" id="ekChat" style="margin-bottom:9px">💬 In de groepschat plaatsen</button>
    <button class="btn btn-ghost btn-block" id="ekTop">⭐ Hoogtepunt ${s.hoogtepunt ? "aanpassen" : "toevoegen"}</button>` : ""}
  `, m => {
    m.querySelector("#ekSave").onclick = () => bewaarAfbeelding(blob, "geheime-dienst-uitslag.png");
    m.querySelector("#ekText").onclick = async () => {
      const t = statsTekst(s);
      if(navigator.share){
        try{ await navigator.share({text: t}); return; }
        catch(err){ if(err && err.name === "AbortError") return; }
      }
      try{ await navigator.clipboard.writeText(t); toast("Tekst gekopieerd — plak hem in WhatsApp 📝"); }
      catch(e){ toast("Kopiëren lukte niet"); }
    };
    const ekChat = m.querySelector("#ekChat");
    if(ekChat) ekChat.onclick = async () => {
      ekChat.disabled = true;
      toast("Eindkaart plaatsen…");
      try{
        const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
        const imgId = await DB.add("images", {data, at: now()});
        await sendMessage("all", {type:"img", imgId});
        toast("Eindkaart staat in de groepschat 💬");
        closeModal();
      }catch(e){ console.error(e); toast("Plaatsen mislukt"); ekChat.disabled = false; }
    };
    const ekTop = m.querySelector("#ekTop");
    if(ekTop) ekTop.onclick = () => modal(`
      <h3>⭐ Hoogtepunt van het spel</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Eén zin die op de eindkaart komt — de leukste actie, de gekste missie of het moment dat iedereen erin trapte.</p>
      <div class="field"><textarea id="ekTopText" rows="3" maxlength="160" placeholder="Bijv. Tim werd ontmaskerd omdat hij zijn eigen handdoek verstopte">${esc(s.hoogtepunt)}</textarea></div>
      <button class="btn btn-green btn-block" id="ekTopSave">Opslaan</button>
    `, m2 => {
      m2.querySelector("#ekTopSave").onclick = async () => {
        await DB.set("settings/main", {hoogtepunt: m2.querySelector("#ekTopText").value.trim()});
        closeModal(true);
        eindkaartModal();
      };
    });
  }, () => URL.revokeObjectURL(url));
}

/* ---------- uitslag na einde spel ---------- */
function spawnConfetti(team){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(document.querySelector(".confetti-wrap")) return;
  const wrap = document.createElement("div");
  wrap.className = "confetti-wrap";
  const colors = team === "infiltrant"
    ? ["#ff5b4d", "#ffd166", "#ffffff", "#c22a22", "#e8b23a"]
    : ["#6fd35f", "#ffd166", "#ffffff", "#3f8f35", "#e8b23a"];
  for(let i = 0; i < 60; i++){
    const c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.width = (6 + Math.random()*7) + "px";
    c.style.height = (9 + Math.random()*9) + "px";
    c.style.animationDuration = (2.6 + Math.random()*2.6) + "s";
    c.style.animationDelay = (Math.random()*1.6) + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 7000);
}

}
function wireHackerSection(el){
  const btn = el.querySelector("#hqSend");
  const inp = el.querySelector("#hqInput");
  if(!btn || !inp) return;
  const send = async () => {
    const q = inp.value.trim();
    if(!q) return;
    if(!hackerVensterOpen()){
      toast(`Vragen kan alleen tussen ${HACKER_VAN}:00 en ${HACKER_TOT}:00 🔒`);
      render();
      return;
    }
    const todays = S.hackerQs.filter(x => x.pid === S.me.id && x.day === todayKey());
    if(todays.length >= 2){ toast("Je hebt je 2 vragen voor vandaag al gesteld"); return; }
    btn.disabled = true;
    await DB.add("hackerQuestions", {pid:S.me.id, pn:S.me.name, q, answer:null, day: todayKey(), at: now()});
    await DB.set("chats/dm_" + S.me.id, {type:"dm", dmFor:S.me.id, at: now()});
    await sendSystem("dm_" + S.me.id, `💻 Hackervraag: "${q}"`);
    haptic(10);
    toast("Vraag verstuurd naar de spelleider 🤫");
  };
  btn.onclick = send;
  inp.onkeydown = e => { if(e.key === "Enter") send(); };
}

/* =====================================================================
   VIEW: Deadlines
   ===================================================================== */
function countdown(ms){
  const diff = ms - now();
  if(diff <= 0) return "Verlopen";
  const m = Math.floor(diff/60000);
  if(m < 60) return m + " min";
  const h = Math.floor(m/60);
  if(h < 24) return h + "u " + (m%60) + "m";
  return Math.floor(h/24) + "d " + (h%24) + "u";
}
// chats waarin de spelleider een deadline kwijt kan: eerst iedereen, dan de groepen
function deadlineChats(){
  const all = S.chats.filter(c => c.type === "all");
  const groepen = S.chats.filter(c => c.type === "group").sort((a,b) => (a.at||0)-(b.at||0));
  return [...all, ...groepen];
}
// een deadline hoort bij een chat; wie daar niet in zit, ziet hem ook niet staan
function magDeadlineZien(d){
  const chat = S.chats.find(c => c.id === (d.chatId || "all"));
  // groep verwijderd? dan houdt alleen de spelleider hem in beeld
  return chat ? canSeeChat(chat) : !!S.me.isLeader;
}

function renderDeadlines(el){
  const isL = S.me.isLeader;
  const items = S.deadlines.filter(magDeadlineZien).sort((a,b) => (a.dueAt||0)-(b.dueAt||0));
  const upcoming = items.filter(d => d.dueAt >= now());
  const past = items.filter(d => d.dueAt < now());

  const card = d => {
    const soon = d.dueAt - now() < 60*60*1000 && d.dueAt > now();
    const isPast = d.dueAt < now();
    const chat = S.chats.find(c => c.id === (d.chatId || "all"));
    // bij "iedereen" is het label overbodig, bij een groep juist niet
    const voor = chat && chat.type !== "all" ? chatTitle(chat) : "";
    return `
    <div class="deadline-card ${soon ? "soon" : ""} ${isPast ? "past" : ""}">
      <div class="cd">${countdown(d.dueAt)}</div>
      <div class="row-main">
        <div class="row-title">${esc(d.title)}</div>
        <div class="row-sub">${fmtDT(d.dueAt)}${voor ? " · " + esc(voor) : ""}${d.desc ? " · " + esc(d.desc) : ""}</div>
      </div>
      ${isL ? `<button class="icon-btn" data-del="${d.id}">🗑️</button>` : ""}
    </div>`;
  };

  el.innerHTML = `
    ${isL ? `<button class="btn btn-green btn-block" id="newDeadline" style="margin-bottom:14px">➕ Nieuwe deadline</button>` : ""}
    ${items.length === 0 ? `<div class="empty"><div class="big">⏰</div>Nog geen deadlines ingesteld.</div>` : ""}
    ${upcoming.map(card).join("")}
    ${past.length ? `<div class="section-label">Verlopen</div>` + past.map(card).join("") : ""}`;

  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () =>
    confirmModal("Deadline verwijderen?", async () => { await DB.del("deadlines/" + b.dataset.del); }));
  const nb = $("#newDeadline");
  if(nb) nb.onclick = () => {
    const dstr = (h,mn) => { const d = new Date(); d.setHours(h,mn,0,0); if(d < new Date()) d.setDate(d.getDate()+1);
      return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16); };
    modal(`
      <h3>Nieuwe deadline</h3>
      <div class="quick-row">
        <button class="btn btn-sm btn-ghost" data-preset="missie">🕚 Missie doorgeven 11:00</button>
        <button class="btn btn-sm btn-ghost" data-preset="avond">🌙 Avondbijeenkomst 22:30</button>
      </div>
      <div class="field"><label>Titel</label><input id="dlTitle" placeholder="Bijv. Missie doorgeven aan spelleider" maxlength="60"></div>
      <div class="field"><label>Omschrijving (optioneel)</label><input id="dlDesc" placeholder="Bijv. via de infiltranten-chat" maxlength="80"></div>
      <div class="field"><label>Datum & tijd</label><input id="dlWhen" type="datetime-local"></div>
      <div class="field">
        <label>Voor wie?</label>
        <select id="dlChat">${deadlineChats().map(c =>
          `<option value="${c.id}">${esc(chatTitle(c))}</option>`).join("")}</select>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">De melding komt in deze chat en alleen die spelers zien de deadline staan.</div>
      </div>
      <button class="btn btn-green btn-block" id="dlCreate">Deadline instellen</button>
    `, m => {
      const kiesChat = id => { const s = m.querySelector("#dlChat"); if([...s.options].some(o => o.value === id)) s.value = id; };
      m.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
        if(b.dataset.preset === "missie"){
          m.querySelector("#dlTitle").value = "Geheime missie doorgeven aan spelleider";
          m.querySelector("#dlWhen").value = dstr(11,0);
          kiesChat("infiltranten");   // die deadline is alleen voor de infiltranten
        } else {
          m.querySelector("#dlTitle").value = "Avondbijeenkomst op de tennisbaan";
          m.querySelector("#dlWhen").value = dstr(22,30);
          kiesChat("all");
        }
      });
      m.querySelector("#dlCreate").onclick = async () => {
        const title = m.querySelector("#dlTitle").value.trim();
        const when = m.querySelector("#dlWhen").value;
        if(!title || !when){ toast("Vul titel en tijd in"); return; }
        const chatId = m.querySelector("#dlChat").value || "all";
        await DB.add("deadlines", {title, desc: m.querySelector("#dlDesc").value.trim(),
          dueAt: new Date(when).getTime(), chatId, at: now()});
        await sendSystem(chatId, `⏰ Nieuwe deadline: ${title} — ${fmtDT(new Date(when).getTime())}`);
        haptic(12);
        closeModal();
      };
    });
  };
}

/* =====================================================================
   MODALS
   ===================================================================== */
let modalCloseCb = null;
function modal(html, setup, onClose){
  closeModal(true);
  const w = document.createElement("div");
  w.className = "modal-wrap"; w.id = "modalWrap";
  w.innerHTML = `<div class="modal"><button class="modal-x" aria-label="Sluiten">✕</button><div class="grabber"></div>${html}</div>`;
  w.querySelector(".modal-x").onclick = () => closeModal();
  w.onclick = e => { if(e.target === w) closeModal(); };
  document.body.appendChild(w);
  modalCloseCb = onClose || null;
  const m = w.querySelector(".modal");
  enableSheetDrag(w, m);
  if(setup) setup(m);
}
function closeModal(instant){
  const w = $("#modalWrap");
  if(w){
    if(instant){ w.remove(); }
    else { w.classList.add("closing"); setTimeout(() => w.remove(), 210); }
  }
  if(modalCloseCb){ const cb = modalCloseCb; modalCloseCb = null; cb(); }
}
function confirmModal(html, onYes){
  modal(`
    <h3>Weet je het zeker?</h3>
    <p style="font-size:14px;color:#d6d6dc;margin-bottom:16px">${html}</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" id="cNo">Annuleren</button>
      <button class="btn btn-red" style="flex:1" id="cYes">Ja</button>
    </div>
  `, m => {
    m.querySelector("#cNo").onclick = () => closeModal();
    m.querySelector("#cYes").onclick = async () => { closeModal(); await onYes(); };
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  applyTheme();
  if(DEMO){
    $("#demoBanner").classList.remove("hidden");
    DB = makeDemoDB();
  } else {
    let poging = 0;
    while(!DB){
      try{ DB = await makeFirebaseDB(); }
      catch(e){
        console.error(e);
        poging++;
        const wacht = Math.min(15, poging * 3);
        $("#root").innerHTML = `<div class="join"><div>
          <h1 style="font-size:28px">📡 Geen verbinding</h1>
          <p style="color:var(--muted);margin-top:14px;line-height:1.6">De app kan de server niet bereiken. Meestal is dit een slechte internetverbinding — loop even naar een plek met beter bereik.</p>
          <p style="color:var(--muted);margin-top:10px;font-size:13px">Nieuwe poging over <b id="retryIn">${wacht}</b> seconden…</p>
          <button class="btn btn-green btn-block" id="retryNow" style="margin-top:20px">🔄 Nu opnieuw proberen</button>
        </div></div>`;
        await new Promise(res => {
          let left = wacht;
          const el = $("#retryIn");
          const tick = setInterval(() => {
            left--;
            if(el) el.textContent = Math.max(0, left);
            if(left <= 0){ clearInterval(tick); res(); }
          }, 1000);
          const btn = $("#retryNow");
          if(btn) btn.onclick = () => { clearInterval(tick); res(); };
        });
      }
    }
  }

  let attempted = false;
  async function maybeAutoLogin(){
    if(attempted) return;
    attempted = true;
    const saved = localStorage.getItem("gd_player_id");
    const speler = saved && S.players.find(p => p.id === saved);
    if(!speler){
      localStorage.removeItem("gd_player_id");
      renderJoin();
      return;
    }
    // iedereen ontgrendelt met zijn eigen pincode, spelleider incluis
    if(speler.pinHash){
      if(!(await ontgrendel(speler))) return;
    } else {
      const h = await kiesPin(speler.name, {titel:"Stel je pincode in", terugLabel:"Uitloggen"});
      if(h === null){ localStorage.removeItem("gd_player_id"); renderJoin(); return; }
      await DB.set("players/" + speler.id, {pinHash: h});
    }
    enterApp(saved);
  }

  // live data
  DB.listen("players", docs => { S.players = docs; if(S.syncMe) S.syncMe(); else maybeAutoLogin(); });
  DB.listen("chats", docs => { S.chats = docs; if(S.me && !S.openChat) render(); });
  DB.listen("deadlines", docs => { S.deadlines = docs; if(S.me && !S.openChat && S.tab === "deadlines") render(); });
  DB.listen("missions", docs => { S.missions = docs; if(S.me && S.openChat) renderChat(); });
  DB.listen("missionPolls", docs => { S.polls = docs; if(S.me && S.openChat) renderChat(); });
  DB.listen("verleidingen", docs => { S.verleidingen = docs; if(S.me && S.openChat) renderChat(); });
  DB.listen("missionLib", docs => {
    S.missionLib = docs.sort((a,b) => (a.at||0)-(b.at||0));
    if(S.me && S.me.isLeader && !S.openChat && S.tab === "spelers") render();
  });
  DB.listen("hackerQuestions", docs => { S.hackerQs = docs; if(S.me && !S.openChat && (S.tab === "rol" || S.tab === "spelers")) render(); });
  DB.listen("reports", docs => {
    S.reports = docs;
    if(S.me){ if(S.openChat) renderChat(); else if(S.tab === "spelers") render(); }
    publishDueReports();
  });
  DB.listen("riddles", docs => {
    S.riddles = docs;
    if(S.me){ if(S.openChat) renderChat(); else if(S.tab === "spelers") render(); }
    publishDueRiddles();
  });
  DB.listen("riddleAttempts", docs => { S.riddleAttempts = docs; });
  DB.listen("roleRequests", docs => {
    S.roleRequests = docs;
    if(S.me && !S.openChat && (S.tab === "spelers" || S.tab === "rol")) render();
  });
  DB.listen("takeovers", docs => {
    S.takeovers = docs;
    if(S.me && !S.openChat && (S.tab === "spelers" || S.tab === "rol")) render();
  });
  DB.listen("pinResets", docs => {
    S.pinResets = docs;
    // het wachtscherm hangt buiten de gewone weergave, dus die roept zichzelf aan
    if(S.onPinResets) S.onPinResets();
    else if(S.me && !S.openChat && S.tab === "spelers") render();
  });
  DB.listen("hunts", docs => { S.hunts = docs; if(S.me && S.openChat) renderChat(); });
  DB.listen("huntEntries", docs => { S.huntEntries = docs; if(S.onHuntEntries) S.onHuntEntries(); });
  // controleer elke halve minuut of een ingepland dagrapport of raadsel gepusht moet worden
  setInterval(() => { publishDueReports(); publishDueRiddles(); }, 30000);
  DB.listenDoc("settings/main", doc => { S.settings = doc || {rolesRevealed:false}; if(S.me && !S.openChat) render(); });

  // als players-collectie leeg blijft, toch join tonen
  setTimeout(() => { if(!S.me && !attempted) maybeAutoLogin(); }, 1500);
}
boot();
</script>
